<script>/* src/creator.js */
// ===== Character creator: the first thing in a new game (boy or girl, then skin, hair and clothes) =====
// Up/down picks a row, left/right changes it (the preview updates live), A on ✓ starts the game.
// The dice button picks a random look. On a touch screen every option, the dice and ✓ are tapped directly.
'use strict';
(function () {
  const L = () => G.data.looks;
  const ROWS = ['gender', 'skin', 'style', 'hair', 'outfit', 'done'];
  const LABEL = { gender: '', skin: 'Piel', style: 'Pelo', hair: 'Color', outfit: 'Ropa' };
  const LIST = { gender: 'genders', skin: 'skins', style: 'styles', hair: 'hairs', outfit: 'outfits' };
  const KEY = { gender: 'gender', skin: 'skin', style: 'style', hair: 'hair', outfit: 'outfit' };

  const X0 = 132, STEP = 20; // option panel left edge; option spacing (a 20 px touch target each)
  class Creator {
    constructor(w) {
      this.w = w; this.t = 0; this.row = 0; this.btn = 1; // done row: 0 = dice, 1 = ✓
      this.look = G.data.defaultLook('nino');
      this.spin = 0;
    }
    options(row) { return L()[LIST[row]]; }
    index(row) { return this.options(row).indexOf(this.look[KEY[row]]); }
    set(row, k) {
      const opts = this.options(row), v = opts[(k + opts.length) % opts.length];
      if (row === 'gender') {
        if (v === this.look.gender) return;
        // switching boy/girl swaps in that default hairstyle and outfit, keeping skin and hair color
        const d = G.data.defaultLook(v);
        this.look = Object.assign({}, this.look, { gender: v, style: d.style, outfit: d.outfit });
      } else this.look[KEY[row]] = v;
      this.spin = 0; G.audio.sfx('cursor');
    }
    random() {
      const pick = a => a[G.r(a.length)];
      this.look = { gender: pick(L().genders), skin: pick(L().skins), style: pick(L().styles), hair: pick(L().hairs), outfit: pick(L().outfits) };
      G.audio.sfx('select'); this.spin = 0;
    }
    // tap areas (shared with draw): the whole row, each option in it (done row: 0 = dice, 1 = ✓), the back button
    rowRect(r) { return { x: X0 + 5, y: 16 + r * 32, w: G.W - X0 - 20, h: 30 }; }
    optRects(r) {
      const row = ROWS[r], y = 20 + r * 32;
      if (row === 'done') return [0, 1].map(k => ({ x: X0 + 40 + k * 60, y: y - 2, w: 40, h: 26 }));
      if (row === 'gender') return this.options(row).map((g, k) => ({ x: X0 + 22 + k * 82, y: y - 3, w: 74, h: 28 }));
      return this.options(row).map((v, k) => ({ x: X0 + 50 + k * STEP, y: y - 4, w: STEP, h: 30 }));
    }
    backXY() { return [14, 14]; }
    pick(r, k) { // a tapped option: same as moving there with the arrows and pressing A on dice / ✓
      this.row = r; const row = ROWS[r];
      if (row !== 'done') { this.set(row, k); return; }
      this.btn = k;
      if (k === 0) this.random(); else { G.audio.sfx('ok'); this.naming = G.nameEntry(this.look, this.name); }
    }
    update() {
      this.t++; this.spin++;
      if (this.naming && this.naming.done()) { // back from the name screen: a name starts the game, null returns here
        const r = this.naming.result; this.naming = null;
        if (r != null) { this.name = r; G.pop(); this.w.resolve({ look: this.look, name: r }); }
        return;
      }
      if (G.input.tap()) {
        if (G.btnHit(...this.backXY())) { G.audio.sfx('cancel'); G.pop(); this.w.resolve(null); return; }
        for (let r = 0; r < ROWS.length; r++) {
          const k = this.optRects(r).findIndex(o => G.tapIn(o));
          if (k >= 0) { this.pick(r, k); return; }
          if (G.tapIn(this.rowRect(r)) && r !== this.row) { this.row = r; G.audio.sfx('cursor'); }
        }
      }
      const d = G.input.repDir(14, 6), row = ROWS[this.row];
      if (d === 'up' || d === 'down') { this.row = (this.row + (d === 'up' ? -1 : 1) + ROWS.length) % ROWS.length; G.audio.sfx('cursor'); }
      if (d === 'left' || d === 'right') {
        const dx = d === 'left' ? -1 : 1;
        if (row === 'done') { this.btn = 1 - this.btn; G.audio.sfx('cursor'); }
        else this.set(row, this.index(row) + dx);
      }
      if (G.input.p('A')) {
        if (row !== 'done') { this.row = ROWS.length - 1; this.btn = 1; G.audio.sfx('cursor'); }
        else if (this.btn === 0) this.random();
        else { G.audio.sfx('ok'); this.naming = G.nameEntry(this.look, this.name); }
      }
      if (G.input.p('B')) { G.audio.sfx('cancel'); G.pop(); this.w.resolve(null); }
    }
    draw(ctx) {
      // sunny backdrop
      G.drawBattleBG(ctx, 'town', this.t);
      ctx.fillStyle = 'rgba(255,200,120,0.18)'; ctx.fillRect(0, 0, G.W, G.H);
      const spec = G.data.playerSpec(this.look);
      // preview: big walking sprite turning around, and the dialogue portrait
      G.win(ctx, 10, 10, 112, 204);
      const dirs = ['down', 'left', 'up', 'right'], dir = dirs[Math.floor(this.spin / 50) % 4];
      const img = G.unitSprite(spec.map, dir, (this.t >> 4) & 1);
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(66, 112, 26, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.imageSmoothingEnabled = false; ctx.drawImage(img, 30, 30, 72, 72);
      G.win(ctx, 36, 128, 60, 60, { alpha: 1 });
      G.drawPortrait(ctx, spec.portrait, 40, 132, this.t);
      G.textC(ctx, this.name || '?', 66, 196, '#f8e060');
      G.iconBtn(ctx, 'back', ...this.backXY());

      // option rows
      const x0 = X0, w = G.W - x0 - 10;
      G.win(ctx, x0, 10, w, 204);
      ROWS.forEach((row, r) => {
        const y = 20 + r * 32, sel = r === this.row;
        if (sel) { ctx.fillStyle = 'rgba(248,224,96,0.18)'; ctx.fillRect(x0 + 5, y - 4, w - 10, 30); }
        if (sel && (this.t >> 3) % 4 !== 3) G.text(ctx, '\u0002', x0 + 8, y + 8, '#f8e060');
        const R = this.optRects(r);
        if (row === 'done') {
          [['dado', 0], ['si', 1]].forEach(([ic, k]) => {
            const on = sel && this.btn === k, o = R[k];
            G.win(ctx, o.x, o.y, o.w, o.h, on ? { fill1: '#3a56c8', fill2: '#1c2c8c' } : {});
            G.drawIcon16(ctx, ic === 'dado' ? { icon: 'dado', n: 5 } : 'si', o.x + 12, o.y + 5);
          });
          return;
        }
        if (LABEL[row]) G.text(ctx, LABEL[row], x0 + 18, y + 8, sel ? '#f8e060' : '#c8d0f0');
        const opts = this.options(row), cur = this.index(row);
        if (row === 'gender') {
          opts.forEach((g, k) => {
            const xx = R[k].x, on = k === cur;
            G.win(ctx, xx, y - 3, 74, 28, on ? { fill1: '#3a56c8', fill2: '#1c2c8c' } : { alpha: 0.7 });
            const sp = G.data.playerSpec(Object.assign({}, G.data.defaultLook(g), { skin: this.look.skin, hair: this.look.hair }));
            ctx.drawImage(G.unitSprite(sp.map, 'down', 0), xx + 4, y - 1);
            G.text(ctx, g === 'nino' ? 'niño' : 'niña', xx + 32, y + 8, on ? '#f8e060' : '#ffffff');
          });
          return;
        }
        opts.forEach((v, k) => {
          const xx = R[k].x + 2, on = k === cur;
          if (row === 'style') {
            const sp = G.data.playerSpec(Object.assign({}, this.look, { style: v }));
            if (on) { ctx.fillStyle = '#f8e060'; ctx.fillRect(xx - 2, y - 3, 19, 26); ctx.fillStyle = '#1c2c8c'; ctx.fillRect(xx - 1, y - 2, 17, 24); }
            ctx.drawImage(G.unitSprite(sp.map, 'down', 0), xx - 4, y - 3);
          } else {
            if (on) { ctx.fillStyle = '#f8e060'; ctx.fillRect(xx - 2, y - 1, 19, 19); }
            ctx.fillStyle = '#000010'; ctx.fillRect(xx - 1, y, 17, 17);
            ctx.fillStyle = v; ctx.fillRect(xx, y + 1, 15, 15);
            ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(xx + 1, y + 2, 13, 2);
          }
        });
      });
    }
  }
  // ---------- Name entry: type on a keyboard, or pick letters from the grid (touch / arrow keys) ----------
  const GRID = [
    'ABCDEFGHIJ'.split(''), 'KLMNÑOPQRS'.split(''), 'TUVWXYZÁÉÍ'.split(''),
    ['Ó', 'Ú', '-', '\'', 'SP', 'DEL', 'OK'],
  ];
  const MAX = 10;
  class NameEntry {
    constructor(look, name, w) {
      this.transparent = true; this.look = look; this.w = w; this.t = 0; this.r = 0; this.c = 0; this.grid = GRID;
      this.name = name || '';
      G.textInput = key => this.key(key);
    }
    done(v) { G.textInput = null; G.pop(); this.w.resolve(v); }
    add(ch) {
      if (this.name.length >= MAX) { G.audio.sfx('error'); return; }
      // first letter (and the first after a space or dash) is a capital, the rest lowercase
      const cap = !this.name || /[ -]$/.test(this.name);
      this.name += cap ? ch.toUpperCase() : ch.toLowerCase();
      G.audio.sfx('cursor');
    }
    back() { if (this.name) { this.name = this.name.slice(0, -1); G.audio.sfx('cancel'); } }
    ok() { const n = this.name.trim(); G.audio.sfx('ok'); this.done(n || G.data.player.name); }
    key(k) { // physical keyboard
      if (k === 'Enter') this.ok();
      else if (k === 'Backspace') this.back();
      else if (k === ' ') { if (this.name && !/ $/.test(this.name)) this.add(' '); }
      else if (/^[\p{L}'-]$/u.test(k)) this.add(k);
    }
    press(cell) {
      if (cell === 'OK') this.ok();
      else if (cell === 'DEL') this.back();
      else if (cell === 'SP') { if (this.name && !/ $/.test(this.name)) this.add(' '); }
      else this.add(cell);
    }
    // tap areas (shared with draw): a letter cell, the close button (back to the creator)
    cellRect(r, c) {
      const cell = GRID[r][c], x = (G.W - 268) / 2, y = 14;
      return { x: x + 14 + (r === 3 ? [0, 24, 48, 72, 96, 140, 196][c] : c * 24), y: y + 80 + r * 26, w: cell.length > 1 ? (cell === 'SP' ? 40 : 52) : 20, h: 22 };
    }
    backXY() { return [(G.W + 268) / 2 - 26, 20]; }
    update() {
      this.t++;
      if (G.input.tap() && this.t > 5) { // tap a letter; the close button returns to the creator
        if (G.btnHit(...this.backXY())) { G.audio.sfx('cancel'); this.done(null); return; }
        GRID.forEach((row, r) => row.forEach((cell, c) => { const o = this.cellRect(r, c); if (G.tapIn(o.x - 2, o.y - 2, o.w + 4, o.h + 4)) { this.r = r; this.c = c; this.press(cell); } }));
        if (this.w.done()) return;
      }
      const d = G.input.repDir(14, 5);
      if (d === 'up' || d === 'down') { this.r = (this.r + (d === 'up' ? -1 : 1) + GRID.length) % GRID.length; this.c = Math.min(this.c, GRID[this.r].length - 1); G.audio.sfx('cursor'); }
      if (d === 'left' || d === 'right') { const n = GRID[this.r].length; this.c = (this.c + (d === 'left' ? -1 : 1) + n) % n; G.audio.sfx('cursor'); }
      if (G.input.p('A') && this.t > 5) this.press(GRID[this.r][this.c]);
      if (G.input.p('B')) { if (this.name) this.back(); else { G.audio.sfx('cancel'); this.done(null); } }
    }
    draw(ctx) {
      const W = 268, H = 196, x = (G.W - W) / 2, y = 14;
      G.win(ctx, x, y, W, H);
      const spec = G.data.playerSpec(this.look);
      G.win(ctx, x + 10, y + 8, 60, 60, { alpha: 1 });
      G.drawPortrait(ctx, spec.portrait, x + 14, y + 12, this.t);
      G.text(ctx, '¿Cómo te llamas?', x + 82, y + 14, '#f8e060');
      if (G.enVisible()) G.text(ctx, 'What\'s your name?', x + 82, y + 26, '#f8e8b0');
      // the name field
      ctx.fillStyle = '#000830'; ctx.fillRect(x + 82, y + 38, 170, 22);
      ctx.fillStyle = '#8898e0'; ctx.fillRect(x + 82, y + 59, 170, 1);
      G.bigText(ctx, this.name, x + 84 + G.textWidth(this.name), y + 49, 2, '#ffffff');
      if ((this.t >> 4) % 2 === 0 && this.name.length < MAX) { ctx.fillStyle = '#f8e060'; ctx.fillRect(x + 86 + G.textWidth(this.name) * 2, y + 42, 2, 15); }
      G.closeBtn(ctx, ...this.backXY());
      // letter grid
      GRID.forEach((row, r) => row.forEach((cell, c) => {
        const o = this.cellRect(r, c), cx = o.x, cy = o.y, cw = o.w, sel = r === this.r && c === this.c;
        G.win(ctx, cx, cy, cw, 22, sel ? { fill1: '#3a56c8', fill2: '#1c2c8c' } : { alpha: 0.75 });
        const col = sel ? '#f8e060' : '#ffffff';
        if (cell === 'SP') { ctx.fillStyle = col; ctx.fillRect(cx + 10, cy + 13, 20, 2); ctx.fillRect(cx + 10, cy + 10, 1, 4); ctx.fillRect(cx + 29, cy + 10, 1, 4); }
        else if (cell === 'DEL') { G.textC(ctx, '<', cx + 14, cy + 7, col); ctx.fillStyle = col; ctx.fillRect(cx + 18, cy + 10, 16, 2); }
        else if (cell === 'OK') G.drawIcon16(ctx, 'si', cx + 18, cy + 3);
        else G.textC(ctx, cell, cx + 10, cy + 7, col);
      }));
    }
  }
  G.nameEntry = function (look, name) { const w = new G.Wait(); G.push(new NameEntry(look, name, w)); return w; };

  G.creator = function () { const w = new G.Wait(); G.push(new Creator(w)); return w; };
})();

</script>
<script>/* src/menus.js */
// ===== Field menu (Cuaderno, Misiones, and the grown-ups' gear), the grown-ups menu, press-and-hold buttons =====
'use strict';
(function () {
  const D = () => G.data, S = () => G.st;
  const STAR = '\u0005';

  // ---------- Press-and-hold buttons for grown-ups (the gear, the slot screen's trash can) ----------
  // A finger held on the button, or A held while it has the keyboard focus, fills a ring; a full ring fires once,
  // and the finger or key has to be let go before it can fire again. A quick tap only makes it wiggle.
  G.Hold = class {
    constructor(frames) { this.frames = frames; this.p = 0; this.armed = true; this.poke = 0; }
    update(r, focused) { // r: the hit rect -> true on the frame the ring fills
      if (this.poke > 0) this.poke--;
      if (G.tapIn(r)) { this.poke = 40; G.audio.sfx('cursor'); }
      const f = Math.max(G.input.holding(r.x, r.y, r.w, r.h), focused ? G.input.keyHeld('A') : 0);
      if (!f) this.armed = true;
      this.p = this.armed ? Math.min(1, f / this.frames) : 0;
      if (this.p < 1) return false;
      this.armed = false; this.p = 0; return true;
    }
    wiggle() { return this.poke ? Math.round(Math.sin(this.poke * 0.8) * 2 * this.poke / 40) : 0; }
  };
  // the ring around a held button (filled clockwise from the top), or a faint one after a quick tap
  G.drawHold = function (ctx, h, cx, cy, r, col = '#f8e060') {
    if (!h.p && h.poke < 20) return;
    const n = Math.round(r * 1.4);
    for (let k = 0; k < n; k++) {
      const a = -Math.PI / 2 + (k + 0.5) / n * Math.PI * 2, x = Math.round(cx + Math.cos(a) * r) - 1, y = Math.round(cy + Math.sin(a) * r) - 1;
      ctx.fillStyle = '#10102a'; ctx.fillRect(x - 1, y - 1, 4, 4);
      ctx.fillStyle = (k + 1) / n <= h.p ? col : '#6070b0'; ctx.fillRect(x, y, 2, 2);
    }
  };

  // ---------- The kid's menu (B, or the notebook button on the map) ----------
  G.fieldMenu = function* (field) {
    while (true) {
      const r = yield G.kidMenu();
      if (r.result === 'book') yield G.notebook();
      else if (r.result === 'quest') yield G.questLog();
      else if (r.result === 'album') yield G.album();
      else return;
    }
  };
  // Three big picture buttons, Cuaderno, Misiones and the animal album (a paw, Round B), plus a small gear that opens
  // the grown-ups menu only after a 2 s press-and-hold (keyboard: move onto it and hold Z). Resolves 'book', 'quest',
  // 'album' or null.
  const KIDS = ['book', 'quest', 'album', 'gear'], TILES = ['book', 'quest', 'album'];
  const KID_LABEL = { book: 'Cuaderno', quest: 'Misiones', album: 'Animales' };
  class FieldMenu {
    constructor(w) { this.transparent = true; this.w = w; this.t = 0; this.sel = 'book'; this.gear = new G.Hold(120); }
    // tap areas (shared with draw): the 'book', 'quest' and 'album' tiles, the 'gear' (and its padded hold area), close
    box() { return { x: 22, y: 46, w: 276, h: 132 }; }
    rect(k) {
      const b = this.box();
      if (k === 'gear') return { x: b.x + b.w - 32, y: b.y + b.h - 28, w: 24, h: 20 };
      return { x: b.x + 14 + TILES.indexOf(k) * 86, y: b.y + 14, w: 76, h: 82 };
    }
    gearHit() { const r = this.rect('gear'); return { x: r.x - 4, y: r.y - 4, w: r.w + 8, h: r.h + 8 }; }
    closeXY() { return [G.W - 26, 6]; } // where the map's menu button was
    pick(k) { G.audio.sfx('ok'); G.pop(); this.w.resolve(k); }
    close() { G.audio.sfx('cancel'); G.pop(); this.w.resolve(null); }
    update() {
      this.t++;
      if (this.gear.update(this.gearHit(), this.sel === 'gear')) { G.audio.sfx('ok'); G.grownUps(); return; }
      if (G.input.tap()) {
        if (G.closeHit(...this.closeXY())) { this.close(); return; }
        for (const k of TILES) if (G.tapIn(this.rect(k))) { this.sel = k; this.pick(k); return; }
      }
      const d = G.input.repDir(14, 6);
      if (d) {
        const i = KIDS.indexOf(this.sel), n = d === 'down' ? 3 : d === 'up' ? (i === 3 ? 2 : i) : (i + (d === 'left' ? 3 : 1)) % 4;
        if (n !== i) { this.sel = KIDS[n]; G.audio.sfx('cursor'); }
      }
      if (G.input.p('A') && this.sel !== 'gear') this.pick(this.sel);
      else if (G.input.p('B')) this.close();
    }
    draw(ctx) {
      const b = this.box();
      G.win(ctx, b.x, b.y, b.w, b.h);
      TILES.forEach(k => {
        const r = this.rect(k), sel = this.sel === k, bob = sel ? Math.round(Math.sin(this.t / 6) * 1.5) : 0;
        G.win(ctx, r.x, r.y - bob, r.w, r.h, sel ? { fill1: '#3a56c8', fill2: '#1c2c8c' } : { alpha: 0.55 });
        const big = G.cached('kidbtn_' + k + (sel ? 1 : 0), 24, 20, c => G.drawIcon(c, k, 0, 0, sel));
        ctx.drawImage(big, r.x + (r.w - 48) / 2, r.y + 10 - bob, 48, 40);
        G.textC(ctx, KID_LABEL[k], r.x + r.w / 2, r.y + 62 - bob, sel ? '#f8e060' : '#ffffff');
        if (k === 'album' && G.state && G.animals) { const n = G.animals.list().filter(G.animals.met).length; G.textC(ctx, n + '/' + G.animals.list().length, r.x + r.w / 2, r.y + 72 - bob, '#a8d8ff'); }
        if (sel && (this.t >> 3) % 4 !== 3) G.textC(ctx, '\u0001', r.x + r.w / 2, r.y - 9 - bob, '#f8e060');
      });
      const g = this.rect('gear');
      G.drawIcon(ctx, 'gear', g.x + this.gear.wiggle(), g.y, this.sel === 'gear');
      G.drawHold(ctx, this.gear, g.x + 12, g.y + 10, 15);
      G.closeBtn(ctx, ...this.closeXY());
    }
  }
  G.kidMenu = function () { const w = new G.Wait(); G.push(new FieldMenu(w)); return w; };

  // ---------- Cuaderno: one page per topic; a word is written in the moment it is met ----------
  // Only topics with a met word have a page (G.pages.visible, intro.js). On a page: each met word's picture and word
  // (blue, or gold once remembered), its stars (known 1, remembered 2, solid 3) and a little mic if it was said; the
  // words still to meet are empty dotted frames. Tap a word to hear it; < > (or left / right) turns the page.
  class Notebook {
    constructor(w, start) {
      G.toastT = 0; this.transparent = true; this.w = w; this.t = 0; this.list = G.pages.visible();
      this.pi = Math.max(0, this.list.indexOf(start)); this.wi = 0; this.flip = 0;
    }
    page() { return this.list[this.pi]; }
    words() { return this.page() ? D().pages[this.page()].words : []; }
    // tap areas (shared with draw): word k on the page, the < > page buttons around the page dots, close
    cols() { return this.words().length > 9 ? 4 : 3; } // (a page of 10, the numbers: four narrower columns)
    cellRect(k) { const c = this.cols(); return c === 4 ? { x: 18 + (k % 4) * 72, y: 36 + Math.floor(k / 4) * 58, w: 70, h: 56 } : { x: 22 + (k % 3) * 94, y: 36 + Math.floor(k / 3) * 58, w: 90, h: 56 }; }
    prevXY() { return [G.W / 2 - 82, 4]; }
    nextXY() { return [G.W / 2 + 62, 4]; }
    closeXY() { return [G.W - 30, 8]; }
    turn(dx) { if (this.list.length < 2) return; this.pi = (this.pi + dx + this.list.length) % this.list.length; this.wi = 0; this.flip = 8 * dx; G.audio.sfx('note'); }
    say(k) { const id = this.words()[k]; if (id && S().seen(id)) { G.speak(G.baseForm(id)); return true; } G.audio.sfx('boop'); return false; }
    update() {
      this.t++; if (this.flip) this.flip -= Math.sign(this.flip);
      const d = G.input.repDir(14, 5), n = this.words().length;
      if (G.input.p('B') || G.closeHit(...this.closeXY())) { G.audio.sfx('cancel'); G.pop(); this.w.resolve(); return; }
      if (G.btnHit(...this.prevXY())) { this.turn(-1); return; }
      if (G.btnHit(...this.nextXY())) { this.turn(1); return; }
      for (let k = 0; k < n; k++) if (G.tapIn(this.cellRect(k))) { if (this.wi !== k) G.audio.sfx('cursor'); this.wi = k; this.say(k); } // tap a word: hear it
      // left/right moves within the page's grid (3 columns, or 4), and past its edge turns the page
      const nc = this.cols();
      if (d === 'left' || d === 'right') {
        const col = this.wi % nc, dx = d === 'left' ? -1 : 1;
        if (col + dx >= 0 && col + dx < nc && this.wi + dx < n) { this.wi += dx; G.audio.sfx('cursor'); }
        else { this.turn(dx); return; }
      }
      if (d === 'up' || d === 'down') { const k = this.wi + (d === 'up' ? -nc : nc); if (k >= 0 && k < n) { this.wi = k; G.audio.sfx('cursor'); } }
      if (G.input.p('A') || G.input.p('C')) this.say(this.wi);
    }
    draw(ctx) {
      G.win(ctx, 6, 6, G.W - 12, G.H - 12, { fill1: '#f4ecd8', fill2: '#e0d4b8', alpha: 1 });
      for (let y = 30; y < G.H - 12; y += 12) { ctx.fillStyle = '#e8dcc0'; ctx.fillRect(18, y, G.W - 30, 1); } // ruled lines
      for (let y = 22; y < G.H - 16; y += 22) { ctx.fillStyle = '#7a4a20'; ctx.fillRect(9, y, 6, 4); ctx.fillStyle = '#c8b090'; ctx.fillRect(10, y + 1, 4, 2); } // the rings
      G.closeBtn(ctx, ...this.closeXY());
      const pid = this.page();
      if (!pid) { // nothing met yet: the notebook waits for its first word
        ctx.globalAlpha = 0.4; G.drawIcon16(ctx, 'pagina', G.W / 2 - 24, 64, 3); ctx.globalAlpha = 1;
        G.bigText(ctx, '?', G.W / 2, 140, 3, '#a08060', null);
        return;
      }
      if (this.list.length > 1) { G.iconBtn(ctx, 'back', ...this.prevXY()); G.iconBtn(ctx, 'next', ...this.nextXY()); }
      // page dots (one per page you have)
      const n = this.list.length, step = Math.min(14, Math.floor(118 / Math.max(1, n))), dw = Math.max(5, step - 3);
      this.list.forEach((p, k) => {
        const x = Math.round(G.W / 2 - (n * step - (step - dw)) / 2 + k * step);
        ctx.fillStyle = k === this.pi ? '#a05020' : '#c8a070'; ctx.fillRect(x, 11, dw, 6); ctx.fillStyle = '#7a4a20'; ctx.fillRect(x, 17, dw, 1);
      });
      const ws = this.words(), got = ws.filter(id => S().seen(id)).length, tp = D().topics[D().pages[pid].topic];
      G.textC(ctx, tp.name, G.W / 2, 25, '#a05020', null);
      G.textR(ctx, got + '/' + ws.length, G.W - 40, 25, '#a08060', null);
      if (G.enVisible()) G.text(ctx, tp.en, 22, 25, '#a09070', null);
      const dx = this.flip * 3;
      ws.forEach((id, k) => {
        const R = this.cellRect(k), cx = R.x + dx + (R.w - 90) / 2, cy = R.y + 2, sel = k === this.wi, st = S().stage(id);
        if (st < 1) { // still to meet: an empty dotted frame
          ctx.fillStyle = '#d0c0a0'; for (let i = 0; i < 32; i += 4) { ctx.fillRect(cx + 29 + i, cy + 2, 2, 1); ctx.fillRect(cx + 29 + i, cy + 33, 2, 1); ctx.fillRect(cx + 29, cy + 2 + i, 1, 2); ctx.fillRect(cx + 60, cy + 2 + i, 1, 2); }
          return;
        }
        const wd = D().words[id], r = G.words.rec(id), fresh = r && r.met != null && G.words.now() - r.met < 120;
        if (sel) { ctx.fillStyle = '#f8e0a0'; ctx.fillRect(R.x + dx - 2, cy - 2, R.w, R.h); }
        const hop = sel ? Math.round(Math.abs(Math.sin(this.t / 8)) * -2) : 0;
        ctx.fillStyle = st >= 3 ? '#e8b830' : '#c8b8e8'; ctx.fillRect(cx + 27, cy + hop, 36, 36);
        ctx.fillStyle = '#fffaf0'; ctx.fillRect(cx + 28, cy + 1 + hop, 34, 34);
        G.drawIcon16(ctx, wd, cx + 29, cy + 2 + hop, 2);
        G.textC(ctx, wd.es.split(' / ')[0], cx + 45, cy + 38, st >= 3 ? '#a06008' : '#2860a8', null);
        if (G.enVisible()) G.textC(ctx, wd.en, cx + 45, cy + 47, '#a09070', null);
        else { const ns = S().wordStars(id); for (let s2 = 0; s2 < 3; s2++) G.text(ctx, STAR, cx + 33 + s2 * 8, cy + 47, s2 < ns ? '#e0a010' : '#d8ccb0', null); }
        if (S().saidCount(id)) { // said out loud (the mic): a little mic with a sound wave
          G.mic.glyph(ctx, cx + 68, cy + 2, '#2a8a9a');
          ctx.fillStyle = '#2a8a9a'; ctx.fillRect(cx + 77, cy + 2, 1, 1); ctx.fillRect(cx + 78, cy + 3, 1, 3); ctx.fillRect(cx + 77, cy + 6, 1, 1);
        }
        if (fresh && (this.t + k * 7) % 40 < 20) { ctx.fillStyle = '#ffffff'; ctx.fillRect(cx + 24, cy + 2, 5, 1); ctx.fillRect(cx + 26, cy, 1, 5); ctx.fillStyle = '#f8c020'; ctx.fillRect(cx + 26, cy + 2, 1, 1); } // just met: it twinkles
      });
    }
  }
  G.notebook = function (start) { const w = new G.Wait(); G.push(new Notebook(w, start)); return w; };

  // ---------- Misiones: who asked, and what they want (pictures only) ----------
  // Up to four rows: the story's chapter going on (its steps ticked off, chapters.js parts()) or the next one (its
  // giver with a "!", or a sun coming up when it opens tomorrow), then the older errands going on (errands.js parts())
  // and new ones waiting; then what's in the bag, today's side jobs (ticked when done) and a badge for every chapter
  // and errand.
  class QuestLog {
    constructor(w) { G.toastT = 0; this.transparent = true; this.w = w; this.t = 0; }
    update() { this.t++; if (G.input.p('A') || G.input.p('B') || G.input.tap()) { G.audio.sfx('cancel'); G.pop(); this.w.resolve(); } } // a tap anywhere closes
    rows() {
      const E = G.errands, CH = G.chapters, out = [];
      const cur = CH && CH.current();
      if (cur) out.push({ id: cur, st: 'on', ch: true });
      else if (CH) { const nx = CH.next(); if (nx && CH.written(nx)) out.push({ id: nx, st: CH.gate(nx) && CH.gate(nx) !== 'soon' ? 'wait' : 'new', ch: true }); }
      const act = D().questOrder.filter(id => S().active(id) && !(CH && CH.def(id)));
      const fresh = E ? D().questOrder.filter(id => !(CH && CH.def(id)) && E.offer && E.offer(id)) : [];
      return out.concat(act.map(id => ({ id, st: 'on' })), fresh.map(id => ({ id, st: 'new' }))).slice(0, 4);
    }
    draw(ctx) {
      G.win(ctx, 6, 6, G.W - 12, G.H - 12);
      G.closeBtn(ctx, G.W - 30, 8);
      G.drawIcon(ctx, 'quest', G.W / 2 - 12, 8);
      const rows = this.rows(), E = G.errands;
      if (!rows.length) G.bigText(ctx, '?', G.W / 2, 70, 3, '#404878');
      rows.forEach((r, k) => {
        const q = D().quests[r.id], y = 32 + k * 26;
        ctx.fillStyle = r.st === 'new' ? '#1a2a60' : '#0a1040'; ctx.fillRect(14, y - 2, G.W - 28, 24);
        ctx.drawImage(G.unitSprite(D().npcs[q.giver].map, 'down', (this.t >> 5) & 1), 18, y - 2);
        if (r.st === 'new') { G.win(ctx, 36, y - 4, 11, 13, { fill1: '#f8f0c0', fill2: '#f8d860', alpha: 1 }); G.text(ctx, '!', 40, y - 1, '#c02020', null); }
        if (r.st === 'wait') G.drawIcon16(ctx, 'manana', 34, y - 4); // it opens tomorrow
        if (r.ch) { G.drawBadge(ctx, r.id, G.W - 40, y + 2, this.t); } // the chapter's own badge, waiting to be won
        G.drawIcon16(ctx, 'flecha', 48, y + 3);
        const parts = r.st === 'on' ? (r.ch ? G.chapters.parts(r.id) : E && E.parts ? E.parts(r.id) : null) : null;
        if (parts) parts.forEach((p, i) => {
          const px = 70 + i * 20;
          ctx.globalAlpha = p.done ? 0.55 : 1; G.drawIcon16(ctx, p.icon, px, y + 3); ctx.globalAlpha = 1;

<script>/* src/mictest.js */
// ===== Mic test (for grown-ups): does speech recognition work on this device, and is the voice heard after it? =====
// G.micTest() opens it over whatever is on screen (the grown-ups menu calls it) and returns a G.Wait that resolves when
// it closes; it also works with yield* G.micTest() in a generator. Tap a word: the game says it. Tap the big mic and
// say the word: every guess the recognizer made is shown with its confidence and match score, then PASS / CLOSE / MISS
// (G.speech.match). Then the game speaks again and asks whether that was heard (on some iPhones the voice goes quiet
// after the mic). Every try is kept in localStorage 'spanishclub_mictest' (the last 200): Copy (Share where there's a
// share sheet) and Clear are at the bottom. Grown-ups only, so the labels are English. Keys: arrows pick a word, C says it, Z listens, X closes.
'use strict';
(function () {
  const LOG_KEY = 'spanishclub_mictest', LOG_MAX = 200;
  const WORDS = ['manzana', 'platano', 'hola', 'adios', 'gracias', 'porfavor', 'buenosdias', 'tres', 'dos', 'rojo', 'azul', 'si'];
  const COL = { PASS: '#70e070', CLOSE: '#f8c040', MISS: '#ff7860', ERROR: '#ff7860', dim: '#a8b0d8', yel: '#f8e060' };
  const AFTER = { PASS: '¡Muy bien!', CLOSE: '¡Casi!', MISS: 'Otra vez.', ERROR: 'Otra vez.' }; // said after the mic
  const OPTS = { lang: 'es-MX', alts: 5, timeout: 8000 };
  const HELP = {
    'not-allowed': 'The mic is blocked for this page. Safari: aA > Website Settings > Microphone > Allow. Chrome: the icon left of the address > Microphone.',
    'service-not-allowed': 'Dictation is off. iPad: Settings > General > Keyboard > Enable Dictation. Screen Time can also block Siri & Dictation.',
    'no-speech': 'Nothing was heard. Tap the mic, then say the word right away, close to the device.',
    'no-match': 'Something was heard, but no words came back. Try again, a little louder.',
    'network': 'Network error. Chrome sends the sound to Google to understand it, so it needs the internet.',
    'audio-capture': 'No microphone found, or another app is using it.',
    'aborted': 'Stopped before anything was heard.',
    'timeout': 'Nothing came back in time. Try again, a little louder.',
    'language-not-supported': 'This device can\'t listen in Spanish (es-MX). On iPad, add Spanish (Mexico) as a dictation language.',
    'busy': 'The mic was still busy. Wait a second and try again.',
    'start-failed': 'The mic could not start. Tap the mic button itself.',
  };
  const NO_API = ['Speech recognition is not available here.', 'iPad / iPhone: use Safari, iOS 14.5+.', 'Settings > General > Keyboard >', '   Enable Dictation: on.', 'Screen Time: allow Siri & Dictation.', 'Computer: Chrome, Edge or Safari.'];
  // the mic opened (so it's worth asking whether the voice still works afterwards)

  const p2 = n => String(n).padStart(2, '0');

    all() { const a = G.store.get(LOG_KEY); return Array.isArray(a) ? a : []; },
    add(e) { const a = log.all(); a.push(e); a.splice(0, Math.max(0, a.length - LOG_MAX)); save(a); return e; },
    update(id, patch) { const a = log.all(), e = a.find(e => e.id === id); if (e) { Object.assign(e, patch); save(a); } },

    },
    text() { // plain text for pasting into a message
      const a = log.all(), info = G.speech.info(), v = G.currentVoice && G.currentVoice(), st = log.stats();

        'Device: ' + info.device + ' | API: ' + (info.api || 'none') + ' | voice: ' + (v ? v.name + ' (' + v.lang + ')' : 'none') + ', mode ' + (G.voiceMode || 0),
        'Browser: ' + navigator.userAgent,
        'Summary: ' + st.pass + ' pass, ' + st.close + ' close, ' + st.miss + ' miss, ' + st.err + ' errors; voice heard after the mic ' + st.heard + ' of ' + st.asked, ''];

  // a small button like G.iconBtn, with a text label

  class MicTest {
    constructor(w) {
      this.w = w; this.t = 0; this.wi = 0; this.mode = 'ready'; // ready | listening | after | ask

      G.toastT = 0;

      if (G.input.tap()) {
        const k = WORDS.findIndex((id, k) => G.tapIn(this.cellRect(k)));
        if (k >= 0) pick(k);

          if (this.clearT > 0) { log.clear(); this.lastV = {}; this.clearT = 0; this.notice('Log cleared'); G.audio.sfx('ok'); }

    updListen() {

      const v = r.ok ? G.speech.grade(m.score) : 'ERROR';

      this.entry = log.add({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), at: Date.now(), word, verdict: v, score: +m.score.toFixed(2),
        error: r.error, ms: r.ms, start: r.during, alts: r.alternatives.slice(0, 5).map(a => [a.transcript, +a.confidence.toFixed(2)]),
        heard: null, tts: null, replays: 0, device: this.info.device,

    watchVoice() { // did speech synthesis report that the line after the mic started? (heard or not is the grown-up's answer)

      else if (G.tapIn(this.noRect())) this.answer(false);

    // ---------- Copy (inside the tap when possible: Safari only lets a tap copy or share) ----------

    copy() {

      const n = log.all().length; if (!n) { this.notice('Nothing to copy yet'); G.audio.sfx('error'); return; }

      } catch (e) { }

    }

      b.style.cssText = 'align-self:flex-end;font:bold 16px monospace;padding:10px 28px;border-radius:8px;border:2px solid #f0f0ff;background:#304cc0;color:#fff';

      this.drawMic(ctx);
      this.drawPanel(ctx);

      if (G.textWidth(label) <= R.w - 30) G.text(ctx, label, R.x + 23, R.y + 9, col);

      const v = this.lastV[id];
      if (v) { ctx.fillStyle = '#000010'; ctx.fillRect(R.x + R.w - 8, R.y + 3, 5, 5); ctx.fillStyle = COL[v]; ctx.fillRect(R.x + R.w - 7, R.y + 4, 3, 3); }

    }
    drawPanel(ctx) {

      G.speakerBtn(ctx, ...this.sayXY());
      const line = (s, y, c) => G.text(ctx, s, x, y, c || '#ffffff');

        line('Tap the mic to stop.', 166, COL.dim);

      }
      if (!R) {
        (G.touch ? ['1  Tap a word to hear it.', '2  Tap the mic and say it.', '3  See what the device heard.']

    drawAsk(ctx) {
      ctx.fillStyle = 'rgba(0,0,16,0.55)'; ctx.fillRect(0, 0, G.W, G.H);

      G.win(ctx, b.x, b.y, b.w, b.h, { alpha: 1 });

<script>/* src/field.js */
// ===== Field exploration: town & interiors; NPCs, talking, searching, doors, events =====
'use strict';
(function () {
  const D = () => G.data;
  const key = (x, y) => x + ',' + y;
  const HUD = [G.W - 26, 6];          // the field menu button (= B), top-right
  const COUNTER = 'etaY';             // people are talked to across these (see interact)
  const THING = 'rlkgPLYZteaujJO';      // objects a tap walks up to and searches (fences, walls, trees, water: just walk)
  const DIR4 = ['up', 'down', 'left', 'right'];

  class Field {
    constructor(mapId, x, y, dir) {
      this.mapId = mapId; this.def = G.maps[mapId];

      this.player = { x, y, dir: dir || 'down', ox: 0, oy: 0, moving: false, spec: G.st.playerSpec().map };
      this.npcs = [];
      (this.def.npcs || []).forEach(n => { if (!n.cond || n.cond()) this.addNpc(n); });
      this.t = 0; this.tasks = new G.Tasks(); this.cam = { x: 0, y: 0 };

      G.field = this;
      this.snapCam();
    }
    addNpc(n) {
      const spec = n.spec || (n.npc && D().npcs[n.npc] ? D().npcs[n.npc].map : null);
      const o = Object.assign({ ox: 0, oy: 0, dir: 'down', home: [n.x, n.y], wt: G.r(120) }, n, { spec });
      this.npcs.push(o); return o;
    }
    npc(id) { return this.npcs.find(n => n.id === id); }
    removeNpc(id) { this.npcs = this.npcs.filter(n => n.id !== id); }
    onEnter() {
      G.audio.play(this.def.music || 'town');
      if (this.def.name && !this.noBanner) { // the map's name: a place whose word isn't met yet shows only its picture
        const ic = this.def.icon, word = ic && G.data.words[ic];
        this.banner = { text: word && !G.st.seen(ic) ? '' : this.def.name, icon: ic, t: 150 };
        if (word) { if (G.vocabLog) G.vlog('shown', ic, { via: 'banner' }); G.st.see(ic); }
      }
      if (this.def.onEnter) this.tasks.add(this.def.onEnter(this));
    }
    // ---------- walkability ----------
    blocked(x, y, self) {
      if (x < 0 || y < 0 || x >= this.map.w || y >= this.map.h) return true;
      const ex = this.exitAt(x, y); if (ex) return false;
      const t = G.TERRAIN[this.map.get(x, y)] || G.TERRAIN['.'];
      if (t.block || t.wall) return true;
      if (this.npcs.some(n => n !== self && !n.ghost && n.x === x && n.y === y)) return true;
      if (self !== this.player && this.player.x === x && this.player.y === y) return true;
      return false;
    }
    exitAt(x, y) { return (this.def.exits || []).find(e => e.x === x && e.y === y && (!e.cond || e.cond())); }
    // ---------- camera ----------
    camTarget() {
      const T = G.TILE, p = this.player;
      let cx = p.x * T + p.ox + T / 2 - G.W / 2, cy = p.y * T + p.oy + T / 2 - G.H / 2;

      cy = mh <= G.H ? (mh - G.H) / 2 : G.clamp(cy, 0, mh - G.H);
      if (this.camShift) cy += this.camShift; // a menu over the bottom of the map (pet.js) lifts the view a little

      o.ox = 0; o.oy = 0; o.moving = false;

    }
    // scripted walks: dirs string like "uurrd"
    *walkNpc(o, dirs, speed = 2) {
      const m = { u: 'up', d: 'down', l: 'left', r: 'right' };
      for (const c of dirs) { if (m[c]) { const dir = m[c]; const [dx, dy] = G.DIRS[dir]; o.dir = dir; o.x += dx; o.y += dy; const n = Math.ceil(G.TILE / speed); for (let i = 1; i <= n; i++) { o.ox = -dx * (G.TILE - Math.min(G.TILE, i * speed)); o.oy = -dy * (G.TILE - Math.min(G.TILE, i * speed)); yield 1; } o.ox = 0; o.oy = 0; } else if (c === '.') yield 16; else if (c === 'U') o.dir = 'up'; else if (c === 'D') o.dir = 'down'; else if (c === 'L') o.dir = 'left'; else if (c === 'R') o.dir = 'right'; }
    }
    // The player walks with the keys, or along a tap route (this.route, see tapTarget/plan). Both use the
    // same steps below, so doors, events and talking behave the same; a key press cancels a tap route.
    *playerWalk() {
      const p = this.player;
      while (true) {
        yield 1;
        if (this.locked || G.top() !== this) { this.route = null; continue; } // a cutscene or a screen on top ends a tap walk
        let d = G.input.dir();
        if (d || G.input.p('A') || G.input.p('B')) this.route = null;
        if (!d && this.route) {
          const pl = this.plan(this.route);
          if (pl && pl.dir) d = pl.dir;
          else { // arrived (or can't get any closer): face the target, then talk / search like A
            const r = this.route; this.route = null;
            if (pl && pl.face) p.dir = pl.face;
            if (pl && pl.act) { this.locked = true; yield* this.interact(); this.locked = false; continue; }
            if (pl && r.name && G.world) G.world.arrive(this, r); // a thing with a word: it names itself (world.js)
          }

            this.stepCount++;

      if (G.hearts) G.hearts.update(this); // friends call you by name as you pass (hearts.js)
      if (G.animals) G.animals.update(this); // ducks, hens, the fish, the frog, the rabbit, the horse, the goat (animals.js)
      if (G.errands) G.errands.update(this); // Round B errands: who stands where, Canelo lost, Nico tagging along (errands.js)

})();

<script>/* src/ambient.js */
// ===== Living town: birds, butterflies and a cat; people who look at you; Tomás's mail round; Canelo tags along =====
// Hooks in field.js: G.ambient.update(field) every frame the map is on top (after its tasks); G.ambient.draw(field, ctx,
// 'ground' | 'air') before / after the people; G.ambient.poke(field, x, y) when A searches a tile (petting the cat).
// Critters are pure decoration: never in field.npcs, never block, and they animate from G.frame, so they keep moving
// under a dialogue box. A tap on one is read, never eaten (tap-to-walk still walks there).
// Map def:  ambient: { birds: n, butterflies: n, cat: [x, y] }   (the cat sits on a fence post)
// NPC defs (maps.js):
//   follow: () => bool               while true, walks after the player loosely, as a ghost (Canelo, once you've met him)
//   route: [[x, y, dir, wait], ...]  walks this loop of stops along the roads, pausing `wait` frames facing `dir` (Tomás)
//   noLook: true                     never turns to look at the player (everyone else does when you come close)
// A talk (the field locked) stops a walker; someone you walk up to waits for you (~4 s, or as long as a tap-walk is on its
// way to them; never on a doorstep). G.ambient.happy(npc, say) makes someone hop with a heart (Canelo when you pet him).
// Uses Math.random, not G.rand, so the game's seedable dice stay untouched.
'use strict';
(function () {
  const T = G.TILE, A = G.ambient = {};

  const key = (x, y) => x + ',' + y;
  const man = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
  const DIR4 = ['up', 'down', 'left', 'right'];
  const GROUND = '.o,=p', ROAD = ',=p', PLAZA = '=p'; // birds hop on grass, flowers, paths and the plaza; walkers prefer roads
  const NEAR = 2, WAIT = 240;                         // people notice you within 2 tiles, and wait ~4 s for you to talk

  // ---------- tiny pixel pictures (rows of letters -> palette), cached, with a dark outline ----------

  // ---------- setting up a map ----------

  function add(z, kind, x, y, extra) {
