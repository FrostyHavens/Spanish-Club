  S.SLOTS = 3;
  S.slotKey = n => 'spanishclub_slot' + n;

  // A fresh game, not saved anywhere yet (see S.begin). English help and the chosen voice are grown-up choices
  // kept per device (G.prefs), copied into opts so G.enVisible / G.currentVoice keep reading G.state.opts.
  function fresh() {
    return {
      flags: {}, searched: {}, playTime: 0,
      loc: { map: 'casa', x: 4, y: 4, dir: 'down' },
      // words: id -> the word model's record (words.js: stage, Leitner box, due, counts). Older saves held
      // {learned, right, wrong, said} (present = seen); words.js migrates those when it first reads them.
      words: {},
      wm: { clock: 0, sess: 0, day: 0, date: '' }, // words.js: play-time clock, session and day counters
      finds: {},          // intro.js: find-it puzzles going on: word id -> {who, map, at, wrong, found}
      pages: {},          // notebook page puzzles solved (intro.js): id -> {d: the day it was solved} (older saves: true)
      quests: {},         // id -> 'active' | 'done'
      stars: 0,
      opts: { english: false },
      look: null,         // the player's avatar, from the character creator
      name: null,         // the player's name, typed after the creator
      album: {},          // Round B (animals.js): animal id -> {first: ms, map, n: times tapped, said: name said out loud}
      sayback: {},        // Round B (world.js): word id -> 'YYYY-M-D' it last earned a say-it-back star (one a day)
      pet: { tricks: {}, learning: null, sleep: false }, // Round B (pet.js): Canelo's tricks (good tries 0..3), the one he's learning
      hearts: {},         // Round B (hearts.js): npc -> 0..5
      heartlog: {},       // Round B (hearts.js): today's hearts {d: 'YYYY-M-D', n, all, why}
      friends: {},        // Round B (hearts.js): npc -> {m3: secret + sticker given, m5: best-friend photo}
      bag: { items: [] }, // Round B (errands.js): what you carry: [{id: word id, col: colour word id (flowers), q: errand it belongs to, to: where (letters)}]
      jobs: {},           // Round B (errands.js): side job id -> 'YYYY-M-D' it was last done (once a day each)
      ch: {},             // the story's chapters (chapters.js): the beat each one is on, their own data, when they began
    };
  }
  function devicePrefs(s) {
    const p = G.prefs || {};
    if (p.english != null) s.opts.english = !!p.english;
    if (p.voiceName) s.opts.voiceName = p.voiceName;
    return s;
  }
  S.newGame = function () { S.slot = null; bound = null; G.state = devicePrefs(fresh()); };

  S.playerSpec = () => D().playerSpec(G.state && G.state.look);
  S.playerName = () => (G.state && G.state.name) || D().player.name;
  S.isGirl = () => !!(G.state && G.state.look && G.state.look.gender === 'nina');

  // ---------- Words: the older helpers, now thin wrappers over the word model (words.js) ----------
  // seen = met (stage 1+), knows = gold (stage 3+, "remembered"), learned count = known (stage 2+). Appearing in a
  // sentence, on a card or in the bag no longer makes a word seen: see() only counts a meeting of a word already met.
  const WM = () => G.words;
  S.see = id => WM().encounter(id, 'seen');
  S.seen = id => WM().met(id);
  S.knows = id => WM().stage(id) >= 3;
  S.stage = id => WM().stage(id);
  // (tests and tools) make a word gold at once; true if it wasn't
  S.learn = function (id) { const r = WM().rec(id, true); if (!r || r.st >= 3) return false; if (r.st < 1) WM().meet(id, 'learn'); r.st = 3; r.learned = true; r.s3 = WM().day(); S.autosave(); if (G.vocabLog) G.vlog('learned', id); return true; };
  S.practiced = (id, firstTry) => (firstTry ? WM().answerRight(id, { firstTry: true }) : WM().answerWrong(id));
  // said out loud with the mic (mic.js): a bonus star, counted in stars; S.micStars() is the speaking stars so far
  S.said = function (id) { const w = WM().rec(id, true); if (!w) return; w.said = (w.said | 0) + 1; WM().encounter(id); G.state.stars++; S.autosave(); if (G.vocabLog) G.vlog('said', id, { via: G.top() && G.top().constructor.name }); };
  S.saidCount = id => (G.state.words[id] && G.state.words[id].said) | 0;
  S.micStars = (s = G.state) => Object.keys(s.words).reduce((n, id) => n + ((s.words[id] && s.words[id].said) | 0), 0);
  // 0..3 stars per word: its stage (known 1, remembered 2, solid 3)
  S.wordStars = id => WM().stars(id);
  S.learnedCount = () => WM().count(2);

  // ---------- Notebook page puzzles (intro.js) ----------
  S.solvePage = id => { G.state.pages[id] = { d: WM().day() }; S.autosave(); };
  S.hasPage = id => !!G.state.pages[id]; // its puzzle was solved (a page is no longer handed out)
  S.findPage = S.solvePage; // (the old name)

  // ---------- Errands ----------
  S.quest = id => G.state.quests[id];
  S.startQuest = id => { if (!G.state.quests[id]) { G.state.quests[id] = 'active'; S.autosave(); if (G.vocabLog) G.vlog.ev({ ty: 'quest', q: id, st: 'start' }); } };
  S.finishQuest = id => { G.state.quests[id] = 'done'; S.autosave(); if (G.vocabLog) G.vlog.ev({ ty: 'quest', q: id, st: 'done' }); };
  S.done = id => G.state.quests[id] === 'done';
  S.active = id => G.state.quests[id] === 'active';

  // ---------- Save slots ----------
  // Three slots (localStorage spanishclub_slot1..3), each holding one whole game as a single JSON value, so a
  // write either lands completely or not at all. Only the state object that belongs to the slot being played
  // (`bound`: loaded from it, or a new game once its character and name are chosen) is ever written, so the
  // title screen's throwaway state, or a test's G.st.newGame(), can never overwrite a save. Nothing here throws.
  S.slot = null;   // the slot being played (1..3), null on the title screen
  let bound = null, timer = 0;
  const has = k => { try { return localStorage.getItem(k) != null; } catch (e) { return false; } };
  const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
  const valid = s => isObj(s) && (isObj(s.words) || isObj(s.flags) || isObj(s.loc));
  // a stored game, read over a fresh one (older saves get any newer fields), or null when empty / unreadable
  S.read = function (n) {
    try {
      const s = G.store.get(S.slotKey(n)); if (!valid(s)) return null;
      const f = fresh();
      for (const k in f) if (f[k] !== null && (s[k] == null || typeof s[k] !== typeof f[k] || Array.isArray(s[k]))) s[k] = f[k];
      if (!isObj(s.look)) s.look = null;
      if (typeof s.name !== 'string' || !s.name) s.name = null;
      s.opts = Object.assign(f.opts, s.opts);
      const l = s.loc, m = G.maps && G.maps[l.map];
      if (!m || !Number.isInteger(l.x) || !Number.isInteger(l.y) || l.y < 0 || l.x < 0 || l.y >= m.rows.length || l.x >= m.rows[l.y].length) s.loc = f.loc;
      if (!G.DIRS[s.loc.dir]) s.loc.dir = 'down';
      return s;
    } catch (e) { return null; }
  };
  // what the slot screen shows: null for an empty slot
  S.summary = function (n) {
    const s = S.read(n); if (!s) return null;
    return { slot: n, name: s.name || D().player.name, look: s.look, stars: s.stars | 0, savedAt: s.savedAt || 0,
      words: Object.keys(s.words).filter(id => { const r = s.words[id]; return r && (r.st == null || r.st >= 1); }).length }; // words in the notebook (met; an older save's seen words count)
  };
  S.anySave = () => [1, 2, 3].some(n => S.read(n));
  S.hasSave = S.anySave; S.save = () => S.saveNow(); // the old names (there is no manual saving any more)
  // continue the game in slot n (sets G.state); false if it's empty
  S.loadSlot = function (n) {
    const s = S.read(n); if (!s) return false;
    clearTimeout(timer); timer = 0;
    G.state = devicePrefs(s); S.slot = n; bound = s;
    if (G.chapters) G.chapters.migrate(); // a game from before the chapters: its errands map onto them (chapters.js)
    if (G.words) G.words.newSession('load'); // a new session (and a new day on a new date)
    return true;
  };
  // a new game (G.state, after the creator) takes slot n from now on, saved right away
  S.begin = function (n) { S.slot = n; bound = G.state; if (G.words && !G.state.wm.sess) G.words.newSession('new'); return S.saveNow(); };
  // leaving the game (back to the title): save, then stop saving
  S.close = function () { S.saveNow(); S.slot = null; bound = null; };
  S.erase = function (n) { G.store.del(S.slotKey(n)); if (S.slot === n) { S.slot = null; bound = null; } };
  // Once per device: the save from before slots existed is copied into slot 1 if that's empty. The legacy key
  // stays; a marker stops it coming back after slot 1 is deleted.
  S.migrate = function () {
    try {
      if (has(MIGRATED_KEY)) return;
      const old = G.store.get(LEGACY_KEY);
      if (valid(old) && !has(S.slotKey(1)) && !G.store.set(S.slotKey(1), old)) return; // try again next time
      G.store.set(MIGRATED_KEY, 1);
    } catch (e) { }
  };

  // ---------- Autosave ----------
  // Where to continue: the player's spot right now when they're free to walk there (not mid-step, in a door,
  // on an event or where someone stands at first); otherwise where they last were, or came in.
  function snapLoc() {
    const f = G.field; if (!f || !f.player || G.top() !== f || f.locked) return;
    const p = f.player;
    if (p.moving || f.exitAt(p.x, p.y) || (f.def.events || []).some(e => e.x === p.x && e.y === p.y) || f.npcs.some(n => n.home && n.home[0] === p.x && n.home[1] === p.y)) return;
    G.state.loc = { map: f.mapId, x: p.x, y: p.y, dir: p.dir };
  }
  // Save the game being played now. Returns true when it was written.
  S.saveNow = function () {
    clearTimeout(timer); timer = 0;
    try {
      if (!S.slot || !G.state || G.state !== bound) return false;
      snapLoc();
      G.state.savedAt = Date.now();
      return G.store.set(S.slotKey(S.slot), G.state);
    } catch (e) { return false; }
  };
  // Save soon (within ~0.6 s; many calls in a row make one write). Call it after changing G.state.
  S.autosave = function () { if (!timer && S.slot && G.state === bound) timer = setTimeout(S.saveNow, 600); };
  // The field calls this every frame: save on entering a map, whenever it unlocks again (an interaction,
  // event or menu just ended) and every ~15 s of walking around.
  let lastField = null, wasLocked = false, fieldT = 0;
  S.fieldTick = function (f) {
    try {
      if (G.vocabLog) G.vlog.tick(f);
      if (f !== lastField) { lastField = f; wasLocked = f.locked; fieldT = 0; S.autosave(); return; }
      if (wasLocked && !f.locked) S.autosave();
      wasLocked = f.locked;
      if (++fieldT >= 900) { fieldT = 0; S.autosave(); }
    } catch (e) { }
  };
  // the tab is hidden or closed (an iPad going to sleep, the home button): save at once
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') S.saveNow(); });
  window.addEventListener('pagehide', () => S.saveNow());
})();

</script>
<script>/* src/words.js */
// ===== The word model: how strong each word is, when it comes back, and how many new words arrive at once =====
// docs/LEARNING_DESIGN.md. Each word has a stage the child can see and a Leitner box behind it:
//   stage 0 unmet       never introduced: in speech it is only its picture (ui.js), it is never "seen" by appearing
//   stage 1 met         its introduction puzzle (G.intro, learn.js / intro.js): picture + blue word, in the notebook
//   stage 2 known       picked right without a cue: blue word (no picture in speech), 1 star in the notebook
//   stage 3 remembered  recalled from a picture or sound with word-only cards, matched on a page puzzle, or said: gold, 2 stars
//   stage 4 solid       remembered again on a later day (3 uncued first-try answers over 2+ days, after reaching 3): 3 stars
// Box 1-5 (0 = not met): right uncued first try -> up a box, due later: box 1 the same session (minutes), 2 the next day,
// 3 +2 days, 4 +4, 5 +8 days; a miss -> down a box (not below 1), due again in ~1.5 minutes. A just-met word gets two
// follow-ups first (fu 1 -> due at +1.5 min, fu 2 -> +6 min), and the review engine asks those before anything else.
// Clocks: G.words.now() is play time in seconds (G.state.wm.clock, saved; day.js ticks it while a game is on, the dev
// log's pace adds to it). A session is a page load / continue, a new game, or a new morning (day.js); a day is a new
// calendar date or a new morning, whichever comes first (G.state.wm: {clock, sess, day, date}). G.today() and
// G.debug.dayShift (whole days added to the real date) let tests and the audit play on later days.
// Saved per word (G.state.words[id]): {st, box, due (play s; and ds, the session: due anyway in a later one) | dd (day) +
// dc (calendar day number), fu, met (play s),
// ms (session met), md (day met), mdate (the calendar date it was met: the chapters' daily budget), how, last, n (encounters), right, wrong, said, cue (cued right answers), ret (active
// retrievals), ft {date: uncued first-try rights}, star (date of the last star), s3 (day it reached stage 3), gold
// (its "¡Palabra de oro!" was shown), learned (= st >= 3, for older readers)}.
//
// API (G.words, short W below):
//   W.stage(id) 0..4   W.met(id)   W.rec(id) the record (made and migrated on demand; null for a word not in D.words)
//   W.meet(id, how, o) stage 0 -> 1 (how: 'show' 'find' 'watch' 'listen' 'answer' 'co' 'tap' ...; o.who), schedules the
//                      follow-ups; true if it was new. (G.intro.* call it and add the small celebration.)
//   W.answerRight(id, {cued, said, firstTry = true, mode: 'both'|'text'|'pic'|'match'|'say', review}) -> {stage, up,
//                      star, gold}: an active retrieval. Uncued first tries move the box and the stage; a star at most
//                      once per word per day (first tries only)
//   W.answerWrong(id)  a miss: down a box, due again soon
//   W.encounter(id, how) a passive meeting of a met word (heard, named, in the bag...): only `last` and `n`
//   W.due(id)  W.overdue(id) (how late, for sorting)  W.strength(id) 0..1  W.stars(id) 0..3 (the notebook's)
//   W.isOld(id) met in an earlier session or 5+ minutes ago (a prompt for it is a review)
//   W.list(minStage) ids at that stage or more   W.count(minStage)
//   W.newSession(reason) ('load', 'new', 'night')   W.step() every frame (the clock, a new calendar date)
// G.review: due(n, {topic, filter, exclude, minStage, maxStage}) the words due now, just-met follow-ups first, then
//   missed ones, then by box and lateness; next(o) the first of them; ask(id, o) a question for that word fit for its
//   stage (yieldable; see intro.js). G.budget: recent(sec) words met in the last sec play-seconds (300), session() words
//   met this session, pending() words waiting for their follow-ups, canIntro(n, {hard}) (<= 5 per 5 min, <= 6 per
//   session, 8 with hard), left(o).
'use strict';
(function () {
  const D = () => G.data;
  const W = G.words = {};
  W.STAGES = ['unmet', 'met', 'known', 'remembered', 'solid'];
  W.FOLLOW = [90, 360];               // just met: asked again after 1.5 min, then 6 min (play seconds)
  W.MISS = 90;                        // a miss: due again after 1.5 min
  W.BOX_DAYS = [0, 0, 1, 2, 4, 8];    // box -> days until due (box 1: the same session)

  // ---------- calendar ----------
  G.debug = G.debug || {};
  G.now = () => Date.now() + (G.debug.dayShift || 0) * 864e5;
  G.today = () => { const d = new Date(G.now()); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
  const dayNum = () => { const d = new Date(G.now()); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); };
  W.dayNum = dayNum;

  // ---------- session, day and clock (G.state.wm) ----------
  const wm = () => {
    const s = G.state; if (!s) return { clock: 0, sess: 0, day: 0, date: '' };
    if (!s.wm || typeof s.wm !== 'object') s.wm = { clock: 0, sess: 0, day: 0, date: '' };
    return s.wm;
  };
  W.wm = wm;
  W.now = () => wm().clock;
  W.sess = () => wm().sess;
  W.day = () => wm().day;
  W.newSession = function (reason) {
    const m = wm();
    m.sess = (m.sess | 0) + 1;
    if (reason === 'night' || !m.day || m.date !== G.today()) m.day = (m.day | 0) + 1;
    m.date = G.today(); m.sessAt = m.clock;
    if (G.vocabLog) G.vlog.ev({ ty: 'session', sess: m.sess, day: m.day, date: m.date, why: reason || '' });
  };
  let dateT = 0;
  W.step = function () { // day.js, every frame a game is on
    if (!G.state) return;
    const m = wm(); m.clock += 1 / 60;
    if (++dateT >= 600) { dateT = 0; if (m.date && m.date !== G.today()) { m.day++; m.date = G.today(); } } // played past midnight
  };
  W.addTime = sec => { if (G.state && sec > 0) wm().clock += sec; };

  // ---------- records ----------
  const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
  // an old record (before stages: {learned, right, wrong, said}; present = seen) becomes: learned -> stage 2, or 3 when
  // it was answered right twice or said; seen -> met. Either way it's due now.
  function migrate(r) {
    const st = r.learned ? ((r.right | 0) >= 2 || (r.said | 0) >= 1 ? 3 : 2) : 1;
    Object.assign(r, { st, box: st >= 3 ? 2 : 1, due: null, dd: wm().day, dc: null, fu: 0, met: 0, ms: 0, md: 0, how: 'old', last: 0, n: 1,
      right: r.right | 0, wrong: r.wrong | 0, said: r.said | 0, cue: 0, ret: (r.right | 0) + (r.said | 0), ft: {}, star: '', s3: st >= 3 ? 0 : null, gold: st >= 3, learned: st >= 3 });
    return r;
  }
  W.migrate = migrate;
  W.rec = function (id, make) {
    if (!G.state || !D().words[id]) return null;
    const ws = G.state.words; let r = ws[id];
    if (r && (!isObj(r) || r.st == null)) r = ws[id] = migrate(isObj(r) ? r : {});
    if (!r && make) r = ws[id] = { st: 0, box: 0, due: null, dd: null, dc: null, fu: 0, met: null, ms: 0, md: 0, how: null, last: null, n: 0, right: 0, wrong: 0, said: 0, cue: 0, ret: 0, ft: {}, star: '', s3: null, gold: false, learned: false };
    return r || null;
  };
  const save = () => { if (G.st && G.st.autosave) G.st.autosave(); };
  const log = (ty, id, o) => { if (G.vocabLog) G.vlog(ty, id, o); };
  W.stage = id => { const r = W.rec(id); return r ? r.st | 0 : 0; };
  W.met = id => W.stage(id) >= 1;
  W.list = (min = 1) => Object.keys(D().words).filter(id => W.stage(id) >= min);
  W.count = (min = 1) => W.list(min).length;
  W.stars = id => Math.max(0, Math.min(3, W.stage(id) - 1));
  function setStage(r, id, st) {
    if (st <= r.st) return false;
    r.st = st; r.learned = st >= 3;
    if (st === 3 && r.s3 == null) r.s3 = wm().day;
    log('stage', id, { st });
    return true;
  }
  // when it's due next: in play seconds (sec) or in days (box 2+)
  function schedule(r, sec, days) {
    if (sec != null) { r.due = W.now() + sec; r.ds = wm().sess; r.dd = null; r.dc = null; } // (and due anyway next session)
    else { r.due = null; r.dd = wm().day + days; r.dc = dayNum() + days; }
  }

  W.meet = function (id, how, o = {}) {
    const r = W.rec(id, true); if (!r) return false;
    r.last = W.now(); r.n++;
    if (r.st >= 1) return false;
    r.st = 1; r.box = 1; r.fu = 1; r.met = W.now(); r.ms = wm().sess; r.md = wm().day; r.mdate = G.today(); r.how = how || 'meet';
    schedule(r, W.FOLLOW[0]);
    log('meet', id, { how: r.how, who: o.who || null });
    save();
    return true;
  };
  W.encounter = function (id, how) {
    const r = W.rec(id); if (!r || r.st < 1) return false;
    r.last = W.now(); r.n++;
    return true;
  };

  // an active retrieval: o {cued, said, firstTry (default true), mode, review}
  W.answerRight = function (id, o = {}) {
    const r = W.rec(id, true); if (!r) return { stage: 0, up: false, star: false, gold: false };
    const first = o.firstTry !== false, mode = o.mode || 'both', day = G.today(), st0 = r.st, cued = !!o.cued || st0 < 1; // (meeting a word by answering is its puzzle, not a retrieval)
    if (st0 < 1) W.meet(id, o.how || 'answer');
    r.last = W.now(); r.ru = r.last; r.n++; r.ret++; // (ru: the last retrieval, chapters.js nudge)
    if (first) r.right++; // (a miss was counted by answerWrong)
    if (cued) r.cue++;
    let star = false;
    if (first && !o.noStar && r.star !== day) { r.star = day; star = true; G.state.stars = (G.state.stars | 0) + 1; }
    if (first && !cued) {
      r.ft[day] = (r.ft[day] | 0) + 1;
      const keys = Object.keys(r.ft); if (keys.length > 12) delete r.ft[keys[0]]; // (only the recent days matter)
      // the stage: 1 -> 2 by any uncued answer; 2 -> 3 by recall (word-only cards, a page match, saying it outside
      // picture+word cards); 3 -> 4 on a later day once 3 uncued first tries over 2+ days have come since
      const recall = mode === 'text' || mode === 'match' || mode === 'say' || (o.said && mode !== 'both');
      if (r.st === 1) setStage(r, id, 2);
      else if (r.st === 2 && recall) setStage(r, id, 3);
      else if (r.st === 3 && r.s3 != null && wm().day > r.s3) {
        const days = Object.keys(r.ft).filter(k => r.ft[k] > 0), n = days.reduce((a, k) => a + r.ft[k], 0);
        if (n >= 3 && days.length >= 2) setStage(r, id, 4);
      }
      // the box, only when it was due (asked again too soon, it stays where it is): a just-met word's follow-ups
      // first, then up a box
      const ready = r.due != null ? W.now() >= r.due - 30 || W.due(id) : W.due(id);
      if (!ready) { /* massed: no change */ }
      else if (r.fu === 1) { r.fu = 2; schedule(r, W.FOLLOW[1]); }
      else if (r.fu === 2) { r.fu = 0; r.box = 2; schedule(r, null, W.BOX_DAYS[2]); }
      else { r.box = Math.min(5, Math.max(1, r.box) + 1); schedule(r, null, W.BOX_DAYS[r.box]); }
    }
    log('retrieval', id, { said: !!o.said || null, cued: cued || null, mode, first: first || null, st0, st: r.st, review: o.review || null, star: star || null });
    save();
    return { stage: r.st, up: r.st > st0, star, gold: r.st >= 3 && st0 < 3 };
  };
  W.answerWrong = function (id) {
    const r = W.rec(id, true); if (!r) return;
    if (r.st < 1) return; // an unmet word can't be missed (it's still a puzzle)
    r.wrong++; r.last = W.now();
    r.box = Math.max(1, (r.box | 0) - 1); if (r.fu === 2) r.fu = 1;
    schedule(r, W.MISS);
    save();
  };

  // ---------- due ----------
  W.due = function (id) {
    const r = W.rec(id); if (!r || r.st < 1) return false;
    if (r.due != null) return W.now() >= r.due || (r.ds != null && wm().sess > r.ds);
    if (r.dd != null) return wm().day >= r.dd || (r.dc != null && dayNum() >= r.dc);
    return true;
  };
  // how late it is (bigger = later), to sort the due words: seconds for box 1, days * 1e5 for the rest
  W.overdue = function (id) {
    const r = W.rec(id); if (!r) return 0;
    if (r.due != null) return W.now() - r.due;
    if (r.dd != null) return Math.max(wm().day - r.dd, r.dc != null ? dayNum() - r.dc : 0) * 1e5;
    return 1e6;
  };
  W.strength = id => { const r = W.rec(id); return !r || r.st < 1 ? 0 : Math.min(1, (r.st - 1) / 3 * 0.7 + (Math.max(1, r.box) - 1) / 4 * 0.3); };
  W.isOld = id => { const r = W.rec(id); return !!r && r.st >= 1 && (r.ms < wm().sess || W.now() - (r.met || 0) >= 300); };
  W.starToday = id => { const r = W.rec(id); return !!r && r.star === G.today(); };

  // ---------- the review engine ----------
  const R = G.review = {};
  const asList = v => (v == null ? null : Array.isArray(v) ? v : [v]);
  R.due = function (n = 1, o = {}) {
    const topics = asList(o.topic), ex = asList(o.exclude) || [];
    const ids = Object.keys(D().words).filter(id => {
      const st = W.stage(id);
      if (st < Math.max(1, o.minStage || 1) || (o.maxStage != null && st > o.maxStage) || ex.includes(id) || !W.due(id)) return false;
      if (topics && !topics.includes(D().words[id].topic)) return false;
      return !o.filter || o.filter(id);
    });
    const grp = id => { const r = W.rec(id); return r.fu ? 0 : r.due != null ? 1 : 2; };
    ids.sort((a, b) => {
      const ga = grp(a), gb = grp(b); if (ga !== gb) return ga - gb;
      const ra = W.rec(a), rb = W.rec(b);
      if (ga === 2 && ra.box !== rb.box) return ra.box - rb.box;
      return W.overdue(b) - W.overdue(a) || (ra.last || 0) - (rb.last || 0);
    });
    return ids.slice(0, n);
  };
  R.next = o => R.due(1, o)[0] || null;
  R.count = o => R.due(1e9, o).length;

  // ---------- the new-word budget ----------
  const B = G.budget = {};
  B.LIMITS = { win: 300, per5: 5, session: 6, hard: 8 };
  const metList = () => Object.keys(G.state ? G.state.words : {}).map(W.rec).filter(r => r && r.st >= 1 && r.how !== 'old');
  B.recent = (sec = B.LIMITS.win) => metList().filter(r => r.met != null && W.now() - r.met < sec).length;
  B.session = () => metList().filter(r => r.ms === wm().sess).length;
  B.pending = () => metList().filter(r => r.fu > 0).length;
  B.left = (o = {}) => Math.max(0, Math.min(B.LIMITS.per5 - B.recent(), (o.hard ? B.LIMITS.hard : B.LIMITS.session) - B.session()));
  B.canIntro = (n = 1, o = {}) => B.left(o) >= n;
})();

</script>
<script>/* src/vocablog.js */
// ===== Dev only: the vocabulary-flow log, for tools/vocab-audit.js =====
// Off unless a test sets G.vocabLog = [] in the page. Every hook in the game is guarded by `if (G.vocabLog)`, so with
// it off nothing is computed, nothing is stored and nothing is saved (the log lives on G, never in G.state).
// With it on, every time a vocabulary word reaches the child it pushes one event onto G.vocabLog:
//   { t: game seconds since the log started (frames / 60, plus any pacing a test adds with G.vlog.pace),
//     ty: 'shown'        in a dialogue line or a question prompt (via: dialogue / question / picture / bag / banner / pet-teach)
//         'heard'        spoken by the voice (G.speak: [id] tokens, or a line that is just a word: "el gato. ¡Miau!")
//         'seen-first'   G.st.see marks it seen for the first time
//         'page'         on a notebook page just found
//         'tapped-object' named by tap-anything, an animal (or its sound), or the animal count (via: tap / walk-on / animal / animal-sound / count)
//         'choice-shown' one of the cards or rows of a question (pic: drawn with its picture)
//         'recognized'   picked as the right answer by tap (receptive retrieval; cue flags below)
//         'wrong'        picked wrongly (ans: the right word)
//         'picked'       picked in a free choice with no right answer (a shop, Canelo's menu)
//         'said'         said out loud and matched (productive; via: the scene it was said in)
//         'learned'      G.st.learn made it gold at once (tests, older content)
//   the word model (words.js, learn.js, intro.js):
//         'meet'         met: stage 0 -> 1 (how: show / find / watch / listen / answer / co / tap / old)
//         'prompt'       a question whose answer is this word (kind: intro / new / review, st: its stage then, mode:
//                        both / text / pic / match, cued: it could be found by matching the prompt; via: page)
//         'retrieval'    an active use credited to the model (said, cued, mode, first, st0 -> st, review, star)
//         'stage'        its stage went up (st)
//         'find-start' / 'find-wrong'  a find-it puzzle began / a wrong thing was tapped
//   'choice-shown' carries ans (it was the right answer) and 'recognized' carries cued.
//     w: word id, map, who (who is talking or asking, when known), ep (the episode: see below), g (a greeting) }
// Cue flags on 'recognized': pic (the answer card showed its picture), show (the question's picture IS the answer),
// prompt (the answer word is in the prompt text).
// Other entries (no w): { ty: 'quest', q, st: 'start' | 'done' }, { ty: 'mark', label } (G.vlog.mark, from tests),
// { ty: 'session', sess, day, date, why } (words.js: a new session or day), { ty: 'puzzle', page } (a page puzzle), and
// { ty: 'ep', ep, ch } when an episode ends: an episode runs until the child is free to walk again (state.js
// fieldTick); ch is what changed in G.state meanwhile ({q: {id: status}, f: [flag keys], s: new searched spots,
// pg: [pages], pet, jobs, bag, h}), which tells the audit which errand the episode belonged to.
'use strict';
(function () {
  const V = G.vlog = function (ty, ids, o) {
    const L = G.vocabLog; if (!L) return;
    sync(L);
    const words = G.data && G.data.words;
    const base = { t: now(), ty, map: G.field ? G.field.mapId : null, ep: V.ep, who: (o && o.who) || whoNow() };
    if (V.greet) base.g = V.greet;
    if (o) for (const k in o) if (k !== 'who' && o[k] != null) base[k] = o[k];
    for (const w of Array.isArray(ids) ? ids : [ids]) if (w && words && words[w]) { L.push(Object.assign({ w }, base)); V.dirty = true; }
  };
  V.greet = null;
  let f0 = 0, extra = 0;
  const now = () => Math.round(((G.frame - f0) / 60 + extra) * 100) / 100;
  function sync(L) {
    if (V.L === L) return;
    V.L = L; f0 = G.frame; extra = 0; V.ep = 1; V.dirty = false; V.st = G.state; V.snap = snap();
  }
  function whoNow() {
    const s = G.top && G.top(); if (!s) return null;
    return (s.opts && s.opts.who) || (s.o && s.o.who) || null;
  }
  // an entry that isn't about one word
  V.ev = function (o) { const L = G.vocabLog; if (!L) return; sync(L); L.push(Object.assign({ t: now(), ep: V.ep, map: G.field ? G.field.mapId : null }, o)); };
  V.mark = (label, o) => V.ev(Object.assign({ ty: 'mark', label }, o || {}));
  // a test's model of a child's pace: sec more seconds pass (reading, listening, thinking); the day's clock moves too
  V.pace = function (sec) { const L = G.vocabLog; if (!L || !(sec > 0)) return; sync(L); extra += sec; G.sessionTime += sec; if (G.words) G.words.addTime(sec); };
  V.time = () => (G.vocabLog ? (sync(G.vocabLog), now()) : 0);

  // ---------- what the voice said: [id] tokens, else a line that is only words ("el gato. ¡Miau!") ----------
  let forms = null;
  const norm = s => String(s).toLowerCase().replace(/[¡!¿?.,:;…«»"]/g, ' ').replace(/\s+/g, ' ').trim();
  function formMap() {
    if (forms) return forms;
    forms = {};
    const W = G.data.words;
    for (const id in W) {
      const w = W[id], all = [w.es, w.alt, w.pl].filter(Boolean).join(' / ').split(' / ');
      for (const f of all) { const n = norm(f); forms[n] = forms[n] || id; forms[n.replace(/^(el|la|los|las) /, '')] = forms[n.replace(/^(el|la|los|las) /, '')] || id; }
    }
    return forms;
  }
  V.heard = function (text) {
    if (!G.vocabLog || text == null) return;
    const s = G.fill(String(text)), ids = G.richIds(s);
    if (!ids.length) {
      const fm = formMap();
      for (const seg of G.plain(s).split(/[.!?¡¿,]+/)) {
        const n = norm(seg); if (!n) continue;
        if (fm[n]) ids.push(fm[n]);
        else { const r = n.split(' ').map(x => fm[x]); if (r.every(Boolean) && n.split(' ').length <= 3) r.forEach(id => { if (ids.indexOf(id) < 0) ids.push(id); }); } // "guau guau"
      }
    }
    if (ids.length) V('heard', ids);
  };

  // ---------- episodes: everything until the child can walk again ----------
  const J = v => JSON.stringify(v === undefined ? null : v);
  function snap() {
    const s = G.state; if (!s) return null;
    const f = {}; for (const k in s.flags || {}) f[k] = J(s.flags[k]);
    return { f, q: Object.assign({}, s.quests), pg: Object.keys(s.pages || {}), s: Object.keys(s.searched || {}).length,
      pet: J(s.pet && s.pet.tricks), jobs: J(s.jobs), bag: J(s.bag), h: J(s.hearts) };
  }
  function diff(a, b) {
    if (!a || !b) return null;
    const ch = {}; let any = false;
    const fk = Object.keys(b.f).filter(k => a.f[k] !== b.f[k]); if (fk.length) { ch.f = fk; any = true; }
    const q = {}; for (const k in b.q) if (a.q[k] !== b.q[k]) q[k] = b.q[k];
    if (Object.keys(q).length) { ch.q = q; any = true; }
    const pg = b.pg.filter(p => a.pg.indexOf(p) < 0); if (pg.length) { ch.pg = pg; any = true; }
    if (b.s > a.s) { ch.s = b.s - a.s; any = true; }
    for (const k of ['pet', 'jobs', 'bag', 'h']) if (a[k] !== b[k]) { ch[k] = 1; any = true; }
    return any ? ch : null;
  }
  // state.js S.fieldTick, every frame the map runs
  V.tick = function (f) {
    const L = G.vocabLog; if (!L) return;
    sync(L);
    if (V.st !== G.state) { V.st = G.state; V.snap = snap(); return; } // a new game, a loaded slot
    if (f.locked || G.top() !== f) return;
    const s = snap(), ch = diff(V.snap, s);
    if (V.dirty || ch) { L.push({ t: now(), ty: 'ep', ep: V.ep, map: f.mapId, ch: ch || {} }); V.ep++; V.dirty = false; }
    V.snap = s;
  };
})();

</script>
<script>/* src/learn.js */
// ===== Learning UI: picture questions that adapt to how well a word is known, the gold-word card, badges =====
// Words are never translated. A word starts as a picture in speech; it is met in a little puzzle (intro.js), grows
// by being used (words.js: met -> known -> remembered -> solid), and turns gold once it is remembered.
'use strict';
(function () {
  const D = () => G.data, S = () => G.st;
  const STAR = '\u0005';

  // ---------- "¡Palabra de oro!" card: a word just remembered (stage 3, gold) ----------
  // A big moment: the room dims, rays turn, the card springs open (overshooting a little), confetti pops from its
  // corners, the picture bounces and sparkles, and the word is spoken. With the mic on (mic.js), a mic beside the
  // picture lets the child say the word for a speaking star; a tap anywhere else still goes on. (A word just MET gets
  // the small notebook celebration instead: G.intro.note, intro.js.)
  class WordCard {
    constructor(ids, w, o) {
      G.toastT = 0; this.transparent = true; this.ids = ids; this.i = 0; this.w = w; this.t = 0;
      this.mic = !(o && o.noMic) && G.mic && G.mic.on() ? new G.MicBtn(this, { rect: () => this.micRect(), ready: () => this.t >= 20, heard: a => this.heard(a), again: () => G.speak(G.baseForm(this.ids[this.i])) }) : null;
      this.open();
    }
    onEnter() { if (this.mic) this.mic.arm(); }
    onExit() { if (this.mic) this.mic.off(); }
    open() { this.t = 0; if (this.mic) this.mic.reset(); G.speak(G.baseForm(this.ids[this.i])); }
    micRect() { const b = this.box(); return { x: b.x + 14, y: b.y + 36, w: 36, h: 36 }; } // left of the picture
    heard(alts) {
      if (!G.speech.match(this.word().es, alts).pass) { this.mic.miss(); return; }
      const r = this.micRect(); this.mic.win();
      G.mic.award(this.ids[this.i], r.x + r.w / 2, r.y + r.h / 2);
      G.fx.say('¡Bien dicho!', G.W / 2, this.box().y + 126, '#a8f0ff', true); // under the word
    }
    word() { return D().words[this.ids[this.i]]; }
    box() { return { x: (G.W - 200) / 2, y: 24, w: 200, h: 140 }; }
    spk() { return [(G.W + 200) / 2 - 26, 30]; }
    update() {
      this.t++;
      const b = this.box();
      if (this.t === 1) { G.audio.sfx('pop'); G.fx.confetti(b.x + 8, b.y + b.h - 8, -1, 20); G.fx.confetti(b.x + b.w - 8, b.y + b.h - 8, 1, 20); }
      if (this.t > 16 && this.t % 11 === 0) G.fx.twinkle(G.W / 2 + (Math.random() < 0.5 ? -1 : 1) * (24 + Math.random() * 14), b.y + 24 + Math.random() * 50);
      if (this.t < 20) return;
      if (this.mic && this.mic.update()) return;
      if (G.input.p('C') || G.speakerHit(...this.spk())) { G.speak(G.baseForm(this.ids[this.i])); return; }
      if (G.input.p('A') || G.input.p('B') || G.input.tap()) {
        G.audio.sfx('ok');
        if (++this.i >= this.ids.length) { G.pop(); this.w.resolve(); return; }
        this.open();
      }
    }
    draw(ctx) {
      const wd = this.word(), b = this.box(), x = b.x, y = b.y, cx = G.W / 2, cy = y + b.h / 2;
      const u = Math.min(1, this.t / 16), s = 0.3 + 0.7 * G.fx.easeBack(u), first = this.i === 0;
      // the room dims and soft rays turn behind the card (kept up between words)
      const a = first ? Math.min(1, this.t / 8) : 1;
      ctx.globalAlpha = 0.45 * a; ctx.fillStyle = '#080c28'; ctx.fillRect(0, 0, G.W, G.H); ctx.globalAlpha = 1;
      ctx.save(); ctx.globalAlpha = 0.12 * a; ctx.fillStyle = '#f8c838'; ctx.translate(cx, cy); ctx.rotate(G.frame / 300);
      ctx.beginPath();
      for (let k = 0; k < 12; k++) { const a0 = k / 12 * Math.PI * 2, a1 = a0 + Math.PI / 14; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a0) * 300, Math.sin(a0) * 300); ctx.lineTo(Math.cos(a1) * 300, Math.sin(a1) * 300); ctx.closePath(); }
      ctx.fill(); ctx.restore();
      ctx.save();
      ctx.globalAlpha = Math.min(1, this.t / 4);
      if (s !== 1) { ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); }
      G.win(ctx, x, y, b.w, b.h);
      G.textC(ctx, '¡' + STAR + ' Palabra de oro ' + STAR + '!', cx, y + 9, '#f8e060');
      // the picture hops, squashing a little as it lands, over a shadow that shrinks as it rises
      const ph = this.t > 16 ? ((this.t - 16) % 34) / 34 : 0, hop = Math.round(Math.sin(ph * Math.PI) * 7), sq = this.t > 16 && hop === 0 ? 1 : 0;
      const pw = 48 + sq * 4, pht = 48 - sq * 3, px = cx - pw / 2, py = y + 26 + (48 - pht) - hop;
      ctx.fillStyle = 'rgba(0,0,16,0.35)'; ctx.fillRect(cx - 22 + hop, y + 79, 44 - hop * 2, 2);
      ctx.fillStyle = '#000010'; ctx.fillRect(px - 3, py - 3, pw + 6, pht + 6);
      ctx.fillStyle = '#8898e0'; ctx.fillRect(px - 2, py - 2, pw + 4, pht + 4);
      ctx.fillStyle = '#f4ecd8'; ctx.fillRect(px - 1, py - 1, pw + 2, pht + 2);
      ctx.imageSmoothingEnabled = false; ctx.drawImage(G.icon(wd), px, py, pw, pht);
      G.bigText(ctx, wd.es, cx, y + 92, 2, '#f8d860');
      if (G.enVisible()) G.textC(ctx, wd.en, cx, y + 112, '#a8b0d8');
      ctx.restore();
      if (this.t >= 20) G.moreArrow(ctx, x + b.w - 17, y + b.h - 12, this.t);
      if (u >= 1) G.speakerBtn(ctx, ...this.spk());
      if (this.mic && this.t >= 20) this.mic.draw(ctx);
    }
  }
  // The gold card for words that have reached stage 3 and haven't had theirs yet (words.js). Yieldable. o.noMic: the card
  // has no mic (the word was just said out loud); o.force: make the words gold first (older content, tests).
  G.learnWords = function (ids, o = {}) {
    ids = (Array.isArray(ids) ? ids : [ids]).filter(id => {
      if (!D().words[id]) return false;
      if (o.force) S().learn(id);
      const r = G.words.rec(id); if (!r || r.st < 3 || r.gold) return false;
      r.gold = true; return true;
    });
    const w = new G.Wait();
    if (!ids.length) { w.resolve(); return w; }
    G.audio.jingle('item');
    G.push(new WordCard(ids, w, o)); return w;
  };
  G.goldCard = G.learnWords;

  // ---------- Choice screen ----------
  // opts: {prompt (rich text), en, show: picture above, choices, layout: 'cards'|'list', display, mask}
  // A choice is {word: id} or a free {label, icon}. How a word choice looks (opts.display, chosen by G.ask from the
  // answer's stage): 'both' picture + word, 'text' the word only, 'pic' the picture only; an unmet word is never
  // written on a card unless it is the answer (its picture only). Without a display (a free choice, a shop): unmet =
  // picture, met = picture + blue word, gold = the gold word alone. A choice's own pic: true / text: true (or
  // look: 'both' | 'text' | 'pic') always wins. opts.mask: word ids heard but not shown in the prompt (a speaker).
  // With opts.answer, the right pick pops (a star burst and a chime); the Wait resolves at once and the screen
  // closes itself a moment later. With opts.onWrong too (G.ask), a wrong pick wobbles and greys out in place
  // and the question stays up; opts.onRight(rect, x, y, spoken) hears about the right pick (x, y: just above it).
  // Speaking (mic.js): in a G.ask question whose answer is a word, a mic button sits at the bottom right (unless
  // opts.noMic). What the child says is matched against EVERY choice's spoken form: the right one counts as picking it
  // plus a speaking star; a wrong one is just like tapping it; nothing heard or no match: "¡Otra vez!", no penalty.
  const GOLD = '#f8d860', BLUE = '#a8d8ff';
  function view(c, disp, isAns) {
    const W = D().words[c.word] && c.img ? c.img : D().words[c.word]; // (c.img: a picture of its own, e.g. the red ball for rojo)
    if (!W) return { label: c.label, icon: c.icon, col: '#ffffff' };
    const st = S().stage(c.word), label = c.label || G.baseForm(c.word), col = st >= 3 ? GOLD : BLUE;
    const d = c.pic ? 'pic' : c.text ? 'text' : c.look || disp;
    if (d === 'pic') return { label: null, icon: W, col };
    if (d === 'text') return { label, icon: null, col };
    if (st < 1 && !isAns) return { label: null, icon: W, col }; // an unmet word: its picture only
    if (d === 'both') return { label, icon: W, col };
    return { label, icon: st >= 3 ? null : W, col };
  }
  G.choiceView = view;
  class Choice {
    constructor(opts, w) {
      opts = Object.assign({}, opts, { prompt: G.fill(opts.prompt), en: G.fill(opts.en), choices: opts.choices.map(c => c.label ? Object.assign(c, { label: G.fill(c.label) }) : c) });
      this.transparent = true; this.o = opts; this.w = w; this.t = 0; this.i = 0; this.won = null; this.miss = null;
      this.ch = opts.choices; this.cards = opts.layout === 'cards'; this.disp = opts.display || null;
      // (opts.mic: a free choice, no right answer, like the shops in errands.js: saying any choice picks it, with a star)
      const word = (opts.answer != null && opts.onWrong && !opts.noMic && this.ch[opts.answer] && this.ch[opts.answer].word) || (opts.mic && opts.answer == null && this.ch.some(c => c.word));
      this.mic = word && G.mic && G.mic.on() ? new G.MicBtn(this, { rect: () => this.micRect(), ready: () => !this.won && this.t > 8 && (!this.miss || this.miss.t > 8), heard: a => this.heard(a) }) : null;
      while (this.ch[this.i] && this.ch[this.i].off) this.i++;
      if (G.vocabLog) this.vlog(); // (the dev-only log, vocablog.js)
      G.richIds(opts.prompt || '').forEach(id => S().see(id)); // (met words met again; unmet ones stay unmet)
      this.ch.forEach(c => c.word && S().see(c.word));
      this.lines = G.richLayout(opts.prompt || '', G.W - 96, { mask: opts.mask }); // room for the speaker (and back) buttons
      if (!opts.noVoice) G.speak(opts.prompt || ''); // (G.speak reads the [id] words as plain text)
    }
    showId() { const sh = this.o.show; return !sh ? null : typeof sh === 'string' ? (D().words[sh] ? sh : null) : Object.keys(D().words).find(id => D().words[id] === sh) || null; } // (a word's picture above the prompt)
    vlog() {
      const o = this.o, who = o.who || null, show = this.showId();
      G.vlog('shown', G.richIds(o.prompt || ''), { via: 'question', who });
      if (show) G.vlog('shown', show, { via: 'picture', who });
      this.ch.forEach((c, k) => c.word && G.vlog('choice-shown', c.word, { who, pic: !!this.view(k).icon, ans: k === o.answer || null }));
    }
    // the dev-only log: what was picked (spoken right answers are logged as 'said' by G.st.said)
    vlogPick(k, spoken) {
      const o = this.o, c = this.ch[k], who = o.who || null; if (!c.word) return;
      if (o.answer == null || (k !== o.answer && !o.onWrong)) { if (!spoken) G.vlog('picked', c.word, { who }); return; }

  };
})();

</script>
<script>/* src/intro.js */
// ===== Meeting new words (one-unknown puzzles), review questions, and the notebook's page puzzles =====
// docs/LEARNING_DESIGN.md. A new word arrives as a little puzzle with one unknown, among things the child already knows,
// and is confirmed right away: it glows, its name is said again and it flies into the notebook (G.intro.note, the small
// celebration; the big gold card is for remembering, learn.js). Every meeting schedules its first real use (words.js:
// due again at +1.5 min, then +6 min; G.review asks those first).
//
// G.intro (generators unless noted; o.who is who's talking: their portrait and name):
//   show(id, {who, prompt, en, ask, known: [2 ids], how})   "show and name": the thing is held up and named
//        ("¡Mira! ¡[id]!", its picture over the box), then "¿Qué es?" with the new word (written, no picture) among
//        known ones (their pictures): pick the one you don't know yet. Without known words it is just named.
//   watch(id, {who, prompt, en, act: function* () {...}, ask, known})   "watch and do" (actions, commands): it is said,
//        act() shows it happen; then "¡Ahora tú!" (the mic is on): pick or say it, and act() happens again for you.
//   listen(id, {who, prompt, en, sound: () => {...}, answer: id of the right picture (default id), known})   "listen and
//        point": the word is heard (and sound() plays), the prompt shows a speaker; pick its picture among known ones.
//   find(id, {who, prompt, en, map, at: [x, y], wrong: [[x, y], ...]})   "find it": someone needs a thing ("¿Y mi
//        [id]?"); it returns at once, and the child walks to the right thing on the map and taps it (field.js asks
//        spotAt / runFind; hint.js and the bot see targets(f)). A wrong thing names itself and gets a gentle "¿...?".
//        found(id) once it was found; seeking(who) the word someone is waiting for (for their thought bubble).
//   meet(id, how, o)  meet a word from a puzzle of your own (not a generator): the model and the small celebration
//   note(ids) -> Wait  the small celebration for words just met (a paper card with the picture and the blue word
//        pops up, says the word and flies into the notebook button); yield it to let the word be heard (~0.6 s)
//   known(id, n) n met words to go with id in a one-unknown puzzle (another topic, stronger first)
// Content checks G.budget.canIntro(n) before introducing (words.js) and defers when it's false ("¡Mañana!").
// G.review.ask(id, {who, prompt, en, pool, layout}) one question for a met word, fit for its stage: met -> hear it
//   (a speaker in the prompt) and pick among picture + word cards; known -> its picture, pick its word; remembered+
//   -> its picture, say it or pick its word (the mic is on), or hear it and pick its picture. Counted as review.
// Page puzzles (G.pages): a notebook page's sparkle on the map (maps.js `pages`) is a puzzle: 4 pictures of words from
//   that page you've met, and their 4 words, shuffled; tap a picture and then its word (or drag the word onto it).
//   Right: they join and the word is said; wrong: a wobble and "¡Casi!". All four: a star. ready(page) (4+ met words,
//   not solved, or solved on an earlier day with 2+ of them due again), words(page), run(page) (yieldable), visible()
//   (the notebook's pages: those with a met word).
'use strict';
(function () {
  const D = () => G.data, S = () => G.st, Wd = () => G.words;
  const I = G.intro = {};
  const TT = (t, en) => ({ t, en });
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = G.r(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sayAs = (who, pages, o) => G.say(pages, Object.assign({ portrait: G.portraitOf(who), name: G.nameOf(who), who }, o || {}));

  // ---------- the small celebration: into the notebook ----------
  const notes = [];   // {id, t, delay}
  const LIFE = 84, FLY = 22;
  I.note = function (ids) {
    ids = (Array.isArray(ids) ? ids : [ids]).filter(id => D().words[id]);
    const w = new G.Wait();
    ids.forEach((id, k) => notes.push({ id, t: -k * 36 }));
    if (!ids.length) { w.resolve(); return w; }
    const until = G.frame + 36 + (ids.length - 1) * 36;
    w.done = () => G.frame >= until || w.fin; // yieldable: a short pause so the word is heard
    return w;
  };
  I.step = function () {
    for (let i = notes.length - 1; i >= 0; i--) {
      const nt = notes[i]; nt.t++;
      if (nt.t === 1) { G.audio.sfx('note'); G.speak(G.baseForm(nt.id)); for (let k = 0; k < 4; k++) G.fx.twinkle(G.W / 2 + (Math.random() - 0.5) * 70, 40 + Math.random() * 30); }
      if (nt.t === LIFE) G.audio.sfx('select');
      if (nt.t > LIFE + 4) notes.splice(i, 1);
    }
  };
  I.busy = () => notes.length > 0;
  I.draw = function (ctx) {
    for (const nt of notes) {
      if (nt.t <= 0) continue;
      const wd = D().words[nt.id], t = nt.t, w = 30 + Math.max(40, G.textWidth(wd.es.split(' / ')[0])), h = 40;
      const pop = Math.min(1, t / 10), s0 = 0.3 + 0.7 * G.fx.easeBack(pop);
      const fly = t > LIFE - FLY ? (t - (LIFE - FLY)) / FLY : 0; // 0..1 into the notebook button (top right)
      const cx0 = G.W / 2, cy0 = 54, cx1 = G.W - 16, cy1 = 16, e = fly * fly;
      const cx = cx0 + (cx1 - cx0) * e, cy = cy0 + (cy1 - cy0) * e - Math.sin(fly * Math.PI) * 18, sc = s0 * (1 - 0.8 * fly);
      ctx.save(); ctx.globalAlpha = fly > 0.85 ? (1 - fly) / 0.15 : 1;
      ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.rotate(Math.sin(t / 7) * 0.03 + fly * 0.5);
      ctx.fillStyle = '#5a3810'; ctx.fillRect(-w / 2 - 1, -h / 2 - 1, w + 2, h + 2);
      ctx.fillStyle = '#f8f0dc'; ctx.fillRect(-w / 2, -h / 2, w, h);
      ctx.fillStyle = '#e0d0b0'; for (let y = -h / 2 + 9; y < h / 2; y += 8) ctx.fillRect(-w / 2 + 3, y, w - 6, 1); // notebook lines
      ctx.fillStyle = '#e88080'; ctx.fillRect(-w / 2 + 26, -h / 2, 1, h);                                        // the margin
      const hop = t < 30 ? Math.round(Math.abs(Math.sin(t / 30 * Math.PI * 2)) * -2) : 0;
      G.drawIcon16(ctx, wd, -w / 2 + 5, -8 + hop);
      G.text(ctx, wd.es.split(' / ')[0], -w / 2 + 31, -4, '#2860a8', null);
      G.text(ctx, '+', w / 2 - 9, -h / 2 + 2, '#40a848', null);
      ctx.restore();
      if (t > 12 && t < LIFE - FLY && t % 9 === 0) G.fx.twinkle(cx + (Math.random() - 0.5) * w, cy + (Math.random() - 0.5) * h);
    }
  };
  I.meet = function (id, how, o = {}) { const fresh = Wd().meet(id, how || 'meet', o); if (fresh) I.note([id]); return fresh; };

  // ---------- picking the known words for a one-unknown puzzle ----------
  I.known = function (id, n = 2, o = {}) {
    const top = D().words[id] && D().words[id].topic, ex = o.exclude || [];
    const c = Wd().list(1).filter(k => k !== id && ex.indexOf(k) < 0 && G.iconDrawn(k) && G.baseForm(k) !== G.baseForm(id));
    const score = k => (D().words[k].topic === top ? 2 : 0) + (Wd().stage(k) >= 2 ? 0 : 1) + G.rand();
    return c.sort((a, b) => score(a) - score(b)).slice(0, n);
  };
  const ask = (id, o, choices, extra) => {
    const ch = shuffle(choices.slice());
    return Object.assign({ prompt: o.ask || '¿Qué es?', en: o.askEn || 'Which one is it?', choices: ch, answer: ch.findIndex(c => c.word === (o.answer || id)), layout: 'cards', who: o.who || null, intro: id, how: o.how }, extra || {});
  };

  // ---------- show and name ----------
  I.show = function* (id, o = {}) {
    if (!D().words[id]) return false;
    yield sayAs(o.who, [TT(o.prompt || '¡Mira! ¡[' + id + ']!', o.en || 'Look!')], { show: id });
    if (Wd().met(id)) return true;
    const known = o.known || I.known(id, 2);
    if (!known.length) { I.meet(id, o.how || 'show', { who: o.who }); yield 40; return true; }
    // the new word written, the known ones as pictures: which word is this thing? (the one you don't know yet)
    yield* G.ask(ask(id, Object.assign({ how: 'show' }, o), [{ word: id, look: 'text' }].concat(known.map(k => ({ word: k, look: 'both' }))), { show: id }));
    return true;
  };

  // ---------- watch and do ----------
  I.watch = function* (id, o = {}) {
    if (!D().words[id]) return false;
    yield sayAs(o.who, [TT(o.prompt || '¡Mira! ¡[' + id + ']!', o.en || 'Watch!')]);
    if (o.act) yield* o.act();
    const known = o.known || I.known(id, 2);
    if (known.length && !Wd().met(id)) {
      yield* G.ask(ask(id, Object.assign({ how: 'watch', ask: o.ask || '¡Ahora tú!', askEn: o.askEn || 'Now you! (say it, or tap it)' }, o), [{ word: id, look: 'both' }].concat(known.map(k => ({ word: k, look: 'both' })))));
    } else I.meet(id, o.how || 'watch', { who: o.who });
    if (o.act) yield* o.act();
    return true;
  };

  // ---------- listen and point ----------
  I.listen = function* (id, o = {}) {
    if (!D().words[id]) return false;
    const right = o.answer || id;
    const known = o.known || I.known(right, 2, { exclude: [id] });
    if (o.sound) o.sound();
    const prompt = o.prompt || '¡[' + id + ']!';
    if (!known.length) { yield sayAs(o.who, [TT(prompt, o.en || 'Listen!')]); I.meet(id, o.how || 'listen', { who: o.who }); yield 40; return true; }
    const q = ask(id, Object.assign({ how: 'listen', answer: right, ask: prompt, askEn: o.en || 'Listen! Which one?' }, o), [{ word: right, look: 'pic' }].concat(known.map(k => ({ word: k, look: 'pic' }))), { mask: [id] });
    yield* G.ask(q); // (when the sound is the new word, its animal, the right picture, is what's credited)
    if (right !== id && !Wd().met(id)) { I.meet(id, o.how || 'listen', { who: o.who }); yield 40; }
    return true;
  };

  // ---------- find it (on the map) ----------
  const finds = () => { const s = G.state; if (!s.finds || typeof s.finds !== 'object') s.finds = {}; return s.finds; };
  const key = (x, y) => x + ',' + y;
  I.find = function* (id, o = {}) {
    if (!D().words[id] || !o.map || !o.at) return false;
    finds()[id] = { who: o.who || null, map: o.map, at: key(...o.at), wrong: (o.wrong || []).map(p => key(...p)), found: false, how: o.how || 'find', pics: o.pics || null };
    S().autosave();
    if (G.vocabLog) G.vlog('find-start', id, { who: o.who || null });
    if (!o.silent) yield sayAs(o.who, [TT(o.prompt || '¿Y mi [' + id + ']?', o.en || 'Where is my...? (find it and tap it)')]);
    return true;
  };
  // o.pics: [[x, y, icon], ...] picture bubbles over the places to choose from (places: the right one shows its own
  // picture, the others theirs, no words), drawn until it's found
  I.drawUnder = function (f, ctx) {
    if (!G.state || !f || G.top() !== f) return;
    const F = finds();
    for (const id in F) {
      const s = F[id]; if (s.found || s.map !== f.mapId || !s.pics) continue;
      for (const [x, y, ic] of s.pics) G.drawAlert(ctx, ic, x * G.TILE - Math.round(f.cam.x), y * G.TILE - Math.round(f.cam.y) + 4, f.t + x * 7);
    }
  };
  I.clearFind = id => { if (G.state && finds()[id]) delete finds()[id]; };
  I.found = id => !!(G.state && finds()[id] && finds()[id].found);
  I.seeking = who => { if (!G.state) return null; const F = finds(); for (const id in F) if (F[id].who === who && !F[id].found) return id; return null; };
  I.spotAt = function (f, x, y) {
    if (!G.state || !f) return null;
    const F = finds(), k = key(x, y);
    for (const id in F) { const s = F[id]; if (s.found || s.map !== f.mapId) continue; if (s.at === k) return { id, right: true }; if (s.wrong.indexOf(k) >= 0) return { id, right: false }; }
    return null;
  };
  I.runFind = function* (f, m, x, y) {
    const s = finds()[m.id];
    if (!m.right) { // not that one: it says what it is (if it has a word), and a gentle "¿...?"
      if (G.vocabLog) G.vlog('find-wrong', m.id);
      if (!(G.world && G.world.nameTile(f, x, y, { noMic: true, noIntro: true }))) G.audio.sfx('boop');
      const [sx, sy] = [x * G.TILE + 12 - Math.round(f.cam.x), y * G.TILE - Math.round(f.cam.y)];
      G.fx.say('¿...?', sx, sy - 14, '#ffd8a8'); yield 30; return;
    }
    s.found = true; f.wig = { x, y, t: 18 };
    const [sx, sy] = [x * G.TILE + 12 - Math.round(f.cam.x), y * G.TILE + 8 - Math.round(f.cam.y)];
    G.audio.sfx('chime'); G.fx.burst(sx, sy);
    if (Wd().meet(m.id, s.how || 'find', { who: s.who })) yield I.note([m.id]); // (a word already met: found again, no new card)
    yield 20;
    S().autosave();
  };
  I.targets = function (f) {
    if (!G.state || !f) return [];
    const F = finds(), T = G.TILE, out = [];
    for (const id in F) { const s = F[id]; if (!s.found && s.map === f.mapId) { const [x, y] = s.at.split(',').map(Number); out.push({ x: x * T + 12, y: y * T + 12, find: id }); } }
    return out;
  };

  // ---------- a review question for a word, fit for its stage ----------
  G.review.ask = function* (id, o = {}) {
    const st = Wd().stage(id); if (st < 1) return false;
    const top = D().words[id].topic, met = Wd().list(1).filter(k => k !== id && G.baseForm(k) !== G.baseForm(id));
    let pool = o.pool || met.filter(k => D().words[k].topic === top);
    if (pool.length < 2) pool = pool.concat(shuffle(met.filter(k => pool.indexOf(k) < 0)).slice(0, 2 - pool.length));
    const c = G.wordChoices(id, [id].concat(pool), Math.min(3, pool.length + 1));
    const r = Wd().rec(id), hear = st === 1 || (st >= 3 && (r.n % 2 === 1 || !(G.mic && G.mic.on())));
    const q = hear ? { prompt: o.prompt || '¿[' + id + ']?', en: o.en || 'Which one? (listen)' } : { prompt: o.prompt || '¿Qué es?', en: o.en || 'What is it?', show: id };
    return yield* G.ask(Object.assign(q, { choices: c.choices, answer: c.answer, layout: o.layout || 'cards', who: o.who || null, review: true }));
  };

  // ---------- page puzzles ----------
  const P = G.pages = {};
  const pageWords = id => (D().pages[id] ? D().pages[id].words : []);
  P.visible = () => D().pageOrder.filter(p => pageWords(p).some(w => Wd().met(w)));
  P.solvedDay = id => { const v = G.state && G.state.pages[id]; return !v ? null : typeof v === 'object' ? v.d | 0 : 0; };
  // a page's sparkle waits for 4 of its words KNOWN (stage 2+: picked once without a cue), known before this session
  // (CURRICULUM.md 5: at the earliest in the next session after the 4th), and comes back on a later day with 2+ due
  const ripe = w => { const r = Wd().rec(w); return !!r && r.st >= 2 && (r.ms < Wd().sess() || r.how === 'old' || r.how === 'learn'); };
  P.ready = function (id) {
    if (!G.state || !D().pages[id]) return false;
    const met = pageWords(id).filter(ripe); if (met.length < 4) return false;
    const d = P.solvedDay(id); if (d == null) return true;
    return d < Wd().day() && met.filter(w => Wd().due(w)).length >= 2;
  };
  // the 4 words to match (never one only met): due ones first, then the weakest, then the least recently met
  P.words = function (id) {
    const met = pageWords(id).filter(w => Wd().stage(w) >= 2);
    const sc = w => (Wd().due(w) ? 0 : 10) + Wd().stage(w) * 2 + G.rand();
    return shuffle(met.sort((a, b) => sc(a) - sc(b)).slice(0, 4));
  };
  P.run = function* (id) {
    const ids = P.words(id); if (ids.length < 4) return false;
    if (G.vocabLog) { ids.forEach(w => G.vlog('prompt', w, { kind: 'review', st: Wd().stage(w), mode: 'match', via: 'page' })); G.vlog.ev({ ty: 'puzzle', page: id }); }
    const r = yield P.open(id, ids);
    if (!r.result) return false; // closed before the end
    S().solvePage(id);
    yield 10;
    return true;
  };
  class PagePuzzle {
    constructor(w, id, ids) {
      G.toastT = 0; this.transparent = true; this.w = w; this.page = id; this.t = 0;
      this.pics = ids.slice(); this.words = shuffle(ids.slice()); // word card j says words[j]
      this.match = {};        // picture k -> matched (true)
      this.tried = {};        // word id -> a wrong attempt was made with its picture
      this.sel = null;        // {kind: 'pic' | 'word', k}
      this.miss = null;       // {pk, wk, t}
      this.drag = null;       // word card j being dragged
      this.done = 0; this.ki = 0;
    }
    onEnter() { G.audio.sfx('note'); }
    picRect(k) { return { x: 22 + k * 72, y: 42, w: 60, h: 58 }; }
    wordRect(j) {
      const k = this.pics.indexOf(this.words[j]);
      if (this.match[k]) { const p = this.picRect(k); return { x: p.x - 2, y: p.y + 64, w: 64, h: 24, joined: true }; }
      return { x: 20 + j * 72, y: 150, w: 64, h: 26 };
    }
    closeXY() { return [G.W - 30, 8]; }
    hintXY() { return null; } // never point at an answer
    tryPair(k, j) {
      const pid = this.pics[k], wid = this.words[j];
      if (this.match[k]) return;
      if (pid === wid) {
        this.match[k] = true; this.sel = null;
        const r = this.picRect(k); G.audio.sfx('chime'); G.fx.burst(r.x + r.w / 2, r.y + r.h / 2); G.speak(G.baseForm(pid));
        const first = !this.tried[pid];
        Wd().answerRight(pid, { mode: 'match', firstTry: first, review: true, noStar: true });
        if (Object.keys(this.match).length === this.pics.length) { this.done = 1; G.audio.jingle('item'); G.fx.confetti(40, 200, 1, 20); G.fx.confetti(G.W - 40, 200, -1, 20); }
        return;
      }
      if (!this.tried[pid]) { this.tried[pid] = true; Wd().answerWrong(pid); }
      if (G.vocabLog) G.vlog('wrong', wid, { ans: pid, via: 'page' });
      this.miss = { pk: k, wj: j, t: 0 }; this.sel = null;
      G.audio.sfx('boop'); const r = this.picRect(k); G.fx.say('¡Casi!', r.x + r.w / 2, r.y - 6, '#ffd8a8');
    }
    tapPic(k) {
      if (this.match[k]) return;
      if (this.sel && this.sel.kind === 'word') { this.tryPair(k, this.sel.k); return; }
      this.sel = { kind: 'pic', k }; G.audio.sfx('cursor');
    }
    tapWord(j) {
      const k = this.pics.indexOf(this.words[j]); if (this.match[k]) { G.speak(G.baseForm(this.words[j])); return; }
      G.speak(G.baseForm(this.words[j])); // hearing a word never gives its picture away
      if (this.sel && this.sel.kind === 'pic') { this.tryPair(this.sel.k, j); return; }
      this.sel = { kind: 'word', k: j }; G.audio.sfx('cursor');
    }
    update() {
      this.t++; if (this.miss && ++this.miss.t > 18) this.miss = null;
      if (this.done) {
        if (++this.done === 30) { G.state.stars++; G.fx.flyStar(G.W / 2, 110, 0); S().autosave(); }
        if (this.done > 70 && (G.input.tap() || G.input.p('A') || G.input.p('B') || this.done > 150)) { G.pop(); this.w.resolve(true); }
        return;
      }
      if (G.input.p('B') || G.closeHit(...this.closeXY())) { G.audio.sfx('cancel'); G.pop(); this.w.resolve(false); return; }
      const ptr = G.input.ptr;
      // dragging a word card onto a picture
      if (ptr.down && this.drag == null && ptr.held > 6) {
        const j = this.words.findIndex((w, j) => { const r = this.wordRect(j); return !r.joined && ptr.sx >= r.x && ptr.sx < r.x + r.w && ptr.sy >= r.y && ptr.sy < r.y + r.h; });
        if (j >= 0 && Math.abs(ptr.x - ptr.sx) + Math.abs(ptr.y - ptr.sy) > 6) { this.drag = j; this.sel = null; }
      }
      if (this.drag != null && !ptr.down) {
        const j = this.drag; this.drag = null;
        const k = this.pics.findIndex((p, k) => { const r = this.picRect(k); return ptr.x >= r.x - 4 && ptr.x < r.x + r.w + 4 && ptr.y >= r.y - 4 && ptr.y < r.y + r.h + 24; });
        if (k >= 0) this.tryPair(k, j);
        return;
      }
      if (this.drag != null) return;
      const tap = G.input.tap();
      if (tap && this.t > 8) {
        const k = this.pics.findIndex((p, k) => G.tapIn(this.picRect(k)));
        if (k >= 0) { this.tapPic(k); return; }
        const j = this.words.findIndex((w, j) => G.tapIn(this.wordRect(j)));
        if (j >= 0) { this.tapWord(j); return; }
      }
      // keys: left / right moves along the pictures (or, once one is chosen, the words); A takes it
      const words = this.sel && this.sel.kind === 'pic', d = G.input.repDir(14, 6);
      const free = [0, 1, 2, 3].filter(i => !this.match[words ? this.pics.indexOf(this.words[i]) : i]);
      if (!free.length) return;
      if (free.indexOf(this.ki) < 0) this.ki = free[0];
      if (d === 'left' || d === 'right') { const i = free.indexOf(this.ki); this.ki = free[(i + (d === 'left' ? -1 : 1) + free.length) % free.length]; G.audio.sfx('cursor'); }
      if (G.input.p('A') && this.t > 8) { if (words) this.tapWord(this.ki); else this.tapPic(this.ki); this.ki = -1; }
    }
    draw(ctx) {
      const u = Math.min(1, this.t / 10);
      G.win(ctx, 6, 6, G.W - 12, G.H - 12, { fill1: '#f4ecd8', fill2: '#e0d4b8', alpha: 1 });
      ctx.globalAlpha = u;
      const tp = D().topics[D().pages[this.page].topic];
      G.drawIcon16(ctx, 'pagina', 18, 12);
      G.textC(ctx, tp.name, G.W / 2, 18, '#a05020', null);
      if (G.enVisible()) G.textC(ctx, 'Match each picture with its word', G.W / 2, 28, '#a09070', null);
      G.closeBtn(ctx, ...this.closeXY());
      const keys = G.hint && G.hint.keyboard && G.hint.keyboard(), keyPic = keys && !(this.sel && this.sel.kind === 'pic'), wob = (m, on) => (m && on ? Math.round(Math.sin(m.t * 1.7) * 3 * (1 - m.t / 18)) : 0);
      this.pics.forEach((id, k) => {
        const r = this.picRect(k), sel = this.sel && this.sel.kind === 'pic' && this.sel.k === k, ok = this.match[k], dx = wob(this.miss, this.miss && this.miss.pk === k);
        const bob = sel ? Math.round(Math.sin(this.t / 6) * 1.5) : 0;
        ctx.fillStyle = ok ? '#e8b830' : sel ? '#3a56c8' : '#8a6a40'; ctx.fillRect(r.x - 2 + dx, r.y - 2 - bob, r.w + 4, r.h + 4);
        ctx.fillStyle = ok ? '#fff4c8' : '#fffaf0'; ctx.fillRect(r.x + dx, r.y - bob, r.w, r.h);
        G.drawIcon16(ctx, id, r.x + 6 + dx, r.y + 5 - bob, 3);
        if (keyPic && k === this.ki && !ok && (this.t >> 3) % 4 !== 3) G.textC(ctx, '\u0001', r.x + r.w / 2, r.y - 11, '#a05020', null);
      });
      this.words.forEach((id, j) => {
        let r = this.wordRect(j); const pk = this.pics.indexOf(id), ok = this.match[pk], sel = this.sel && this.sel.kind === 'word' && this.sel.k === j;
        if (this.drag === j) { const p = G.input.ptr; r = { x: p.x - r.w / 2, y: p.y - r.h / 2, w: r.w, h: r.h }; }
        const dx = wob(this.miss, this.miss && this.miss.wj === j), bob = sel ? Math.round(Math.sin(this.t / 6) * 1.5) : 0;
        ctx.fillStyle = ok ? '#e8b830' : sel ? '#3a56c8' : '#5a3810'; ctx.fillRect(r.x - 1 + dx, r.y - 1 - bob, r.w + 2, r.h + 2);
        ctx.fillStyle = ok ? '#fff4c8' : sel ? '#dce4ff' : '#ffffff'; ctx.fillRect(r.x + dx, r.y - bob, r.w, r.h);
        const st = Wd().stage(id);
        G.textC(ctx, G.baseForm(id), r.x + r.w / 2 + dx, r.y + r.h / 2 - 4 - bob, st >= 3 ? '#a06008' : '#2860a8', null);
        if (keys && !keyPic && !ok && j === this.ki && (this.t >> 3) % 4 !== 3) G.textC(ctx, '\u0001', r.x + r.w / 2, r.y - 11, '#a05020', null);
        if (ok) { ctx.fillStyle = '#c89020'; ctx.fillRect(r.x + r.w / 2, r.y - 6, 1, 6); } // joined to its picture
      });
      ctx.globalAlpha = 1;
      if (this.done) { G.bigText(ctx, '¡Muy bien!', G.W / 2, 186, 2, '#f8d040', '#5a2c04'); }
    }
  }
  P.open = function (id, ids) { const w = new G.Wait(); G.push(new PagePuzzle(w, id, ids)); return w; };
})();

<script>/* src/mic.js */
// ===== Speaking for bonus stars: the kids' mic button on questions and on the "¡Palabra nueva!" card =====
// Speaking out loud is only ever a bonus: tapping always works, a miss costs nothing, and nothing is grammar-checked.
//   G.mic.on()                  mic buttons show: speech recognition here, the grown-ups' "Speaking (mic)" switch on
//                               (G.prefs.mic, per device, on unless turned off) and not blocked this session
//   G.mic.target(choice)        what a choice sounds like: its label plus every form of its word ('rojo / roja', ...)
//                               and the word's `alt` forms (data.js, Round B: 'patito' for el pato)
//   G.mic.best(targets, alts, prefer)  the index of the best PASSING target (G.speech.match), or -1; a tie goes to prefer
//   G.mic.award(id, x, y)       a speaking star: words[id].said++, the speaking-star total and a star that flies from x, y
//   new G.MicBtn(scene, o)      the button. o: {rect() (its tap area, game px), ready() (may listen now),
//                               heard(alternatives) (the scene decides: right, wrong or G.MicBtn#miss())}.
//                               Scene calls: onEnter -> arm(), onExit -> off(), update -> if (mic.update()) return,
//                               draw -> mic.draw(ctx). The V key (and a tap on it) listens; a tap on it again stops.
// Listening starts INSIDE the tap or key press (G.speech.gestureTap: iOS Safari only lets a gesture start the mic),
// with the update() fallback for the on-screen pad, like src/mictest.js. G.speech.listen stops the voice first and
// brings the audio back after. A tap anywhere else while listening stops listening and is a normal tap.
// No speech, an error or no match: the button shows a listening ear and "¡Otra vez!", and the child can try again.
// A blocked mic ('not-allowed' and the like) hides every mic button until the grown-ups' switch is turned on again,
// but only after two refusals in a row from a real tap or key: iPad Safari also refuses now and then (a start outside
// the gesture, the audio still busy with the voice), and one of those used to hide the mic for the whole session.
'use strict';
(function () {
  const M = G.mic = {};
  const OPTS = { lang: 'es-MX', alts: 5, timeout: 7000 };
  const BLOCK = ['not-allowed', 'service-not-allowed', 'language-not-supported', 'unsupported'];
  M.blocked = false; M.strikes = 0;
  M.on = () => !!G.speech && G.speech.supported() && G.prefs.mic !== false && !M.blocked;
  M.target = c => { const w = c && c.word && G.data.words[c.word]; return [c && c.label, w && w.es, w && w.alt].filter(Boolean).join(' / ') || null; };
  M.best = function (targets, alts, prefer) {
    let k = -1, sc = 0;
    targets.forEach((t, i) => {
      if (!t) return;
      const m = G.speech.match(t, alts);
      if (m.pass && (m.score > sc || (m.score === sc && i === prefer))) { k = i; sc = m.score; }
    });
    return k;
  };
  M.award = function (id, x, y) {
    G.st.said(id);
    G.audio.sfx('micstar');
    G.fx.ring(x, y, 26, '#70e0ff', 22);
    for (let i = 0; i < 3; i++) G.fx.twinkle(x + (Math.random() - 0.5) * 30, y + (Math.random() - 0.5) * 20);
    G.fx.flyStar(x, y, 10, true);
  };

  // ---------- pictures: the mic, the ear, sound waves ----------
  const MIC = ['..wwww..', '.wgwwww.', '.wgwwww.', '.wgwwww.', '.wgwwww.', '.wwwwww.', '..wwww..', 'w......w', 'w......w', '.w....w.', '..wwww..', '...ww...', '...ww...', '.wwwwww.'];
  const EAR = ['..oooo...', '.oSSSSo..', 'oSSssSSo.', 'oSsoooSSo', 'oSo...oSo', 'oSSo..oSo', '.oSSooSSo', '..oSSSSo.', '...oSSo..', '..oSSo...', '.oSSo....', '.oSo.....', '..o......'];
  const sprites = () => ({
    mic: G.sprite('mic_glyph', MIC, { w: '#f8f8ff', g: '#c8d8ff' }),
    micD: G.tinted(G.sprite('mic_glyph', MIC, { w: '#f8f8ff', g: '#c8d8ff' }), '#401020', 'mic_glyph'),
    ear: G.sprite('mic_ear', EAR, { o: '#5a2810', S: '#f8c8a0', s: '#e09878' }),
  });
  function star(ctx, x, y, r) { // a gold star centred on x, y (like the Hoy card's)
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
    ctx.closePath(); ctx.lineJoin = 'round'; ctx.lineWidth = 2.5; ctx.strokeStyle = '#5a2c04'; ctx.stroke();
    ctx.fillStyle = '#fff070'; ctx.fill();
    ctx.save(); ctx.clip(); ctx.fillStyle = '#f8c020'; ctx.fillRect(x - r, y + r * 0.05, r * 2, r); ctx.restore();
  }
  const disc = (ctx, x, y, r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };
  // sound waves: n arcs on each side of x, y (a = 0..1 how far out they've gone)
  M.waves = function (ctx, x, y, r, col, n = 2, t = 0) {
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const rr = r + i * 4 + (t % 12) / 4;
      ctx.strokeStyle = col; ctx.globalAlpha = (1 - i / n) * 0.9;
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x, y, rr, s < 0 ? Math.PI * 0.75 : -Math.PI * 0.25, s < 0 ? Math.PI * 1.25 : Math.PI * 0.25); ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
  };
  // a small mic (the Cuaderno's mark for a word said out loud, the Diploma)
  M.glyph = function (ctx, x, y, col = '#2a8a9a') {
    ctx.fillStyle = col;
    ctx.fillRect(x + 2, y, 3, 5); ctx.fillRect(x + 1, y + 1, 5, 3);
    ctx.fillRect(x, y + 3, 1, 2); ctx.fillRect(x + 6, y + 3, 1, 2); ctx.fillRect(x + 1, y + 5, 5, 1); ctx.fillRect(x + 3, y + 6, 1, 1); ctx.fillRect(x + 1, y + 7, 5, 1);
  };

  // Space talks while the screen on top has a mic that can listen (core.js maps it to 'V' then, else to A)
  G.spaceTalks = () => { const s = G.top(), m = s && s.mic; return !!(m && m.shown() && (m.can() || m.l || m.started)); };

  // ---------- the button ----------
  G.MicBtn = class {
    constructor(scene, o) { this.s = scene; this.o = o; this.t = 0; this.l = null; this.started = null; this.sad = 0; this.done = false; this.pop = 0; }
    shown() { return M.on() || !!this.l; }
    can() { return M.on() && !this.l && !this.done && G.top() === this.s && this.o.ready(); }
    arm() { if (!this.z) this.z = G.speech.gestureTap(() => this.can() ? this.o.rect() : null, e => { this.started = this.go(); this.ptt = !!e && e.code === 'Space'; }, { key: () => this.can(), codes: ['KeyV', 'Space'] }); }
    off() { if (this.z) { this.z.off(); this.z = null; } if (this.l) { this.l.abort(); this.l = null; } }
    reset() { if (this.l) this.l.abort(); this.l = null; this.started = null; this.ptt = false; this.sad = 0; this.done = false; }
    go() { this.sad = 0; return G.speech.listen(OPTS); } // inside the gesture when possible
    begin(l) { this.l = l; this.lt = 0; }
    stop() { if (this.l) { this.l.abort(); this.l = null; } }
    listening() { return !!this.l; }
    miss() { this.sad = 70; G.audio.sfx('huh'); const r = this.o.rect(); G.fx.say('¡Otra vez!', r.x + r.w / 2, r.y - 8, '#a8e8ff'); }
    win() { this.done = true; this.pop = 12; }
    // -> true when it used this frame's input (the scene does nothing else this frame)
    update() {
      this.t++; if (this.sad > 0) this.sad--; if (this.pop > 0) this.pop--;
      if (this.started) { const l = this.started; this.started = null; this.begin(l); return true; }
      const r = this.o.rect();
      if (this.l) {
        this.lt++;
        const l = this.l;
        if (l.done()) {
          this.l = null; const res = l.result;
          if (res.ok) M.strikes = 0;
          if (res.ok && res.alternatives.length) this.o.heard(res.alternatives);
          else if (BLOCK.includes(res.error) && res.during !== 'frame' && ++M.strikes >= 2) M.blocked = true;
          else if (res.error !== 'aborted') this.miss();
          return true;
        }
        // push-to-talk: letting go of Space finishes with what was heard (a quick press just starts it, like a tap)
        if (this.ptt && !G.input.h('V')) { this.ptt = false; if (this.lt > 15) { l.stop(); return true; } }
        if (G.tapIn(r) || G.input.p('V')) { l.stop(); return true; } // done talking: finish with what was heard
        if (G.input.tap() || G.input.p('A') || G.input.p('B')) this.stop(); // a tap anywhere else is a normal tap
        return false;
      }
      if (!this.shown()) return false;
      if (G.tapIn(r) || G.input.p('V')) { // the gesture didn't start it (say, the on-screen pad): try from here
        if (this.can()) this.begin(this.go());
        else if (this.done && this.o.again) this.o.again();
        return true;
      }
      return false;
    }
    draw(ctx) {
      if (!this.shown()) return;
      const r = this.o.rect(), cx = r.x + r.w / 2, cy = r.y + r.h / 2, L = !!this.l, ph = L ? this.l.phase : '', S = sprites();
      const idle = !L && !this.done && this.can();
      let rad = Math.min(r.w, r.h) / 2 - 2;
      if (L) for (let i = 0; i < 3; i++) { // rings going out while it listens (green once it hears a voice)
        const p = ((this.t + i * 20) % 60) / 60;
        ctx.globalAlpha = (1 - p) * 0.8; ctx.strokeStyle = ph === 'speech' ? '#70e070' : '#f8e060'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx, cy, rad + 2 + p * 12, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      const wig = this.sad > 40 ? Math.round(Math.sin(this.sad * 0.9) * 2) : 0;
      const breathe = idle && (this.t % 150) < 24 ? Math.round(Math.sin((this.t % 150) / 24 * Math.PI) * 2) : 0; // "tap me", now and then
      rad += (L ? Math.round(Math.sin(this.t / 5)) : 0) + breathe + (this.pop ? Math.round(this.pop / 4) : 0);
      const x = cx + wig, held = !L && G.input.holding(r.x, r.y, r.w, r.h) > 0;
      const rim = this.done ? '#d8f8ff' : L ? '#ffffff' : held ? '#f8e060' : '#ffb0c8', body = this.done ? '#2890c0' : L ? (ph === 'speech' ? '#30a850' : '#20a0c8') : held ? '#c02850' : '#e85078'; // pink; listening: blue, green when it hears you
      disc(ctx, x, cy + 2, rad + 1, 'rgba(0,0,16,0.45)');
      disc(ctx, x, cy, rad + 1, '#200818');
      disc(ctx, x, cy, rad, rim);
      disc(ctx, x, cy, rad - 2, body);
      ctx.globalAlpha = 0.3; disc(ctx, x - rad * 0.3, cy - rad * 0.38, rad * 0.45, '#ffffff'); ctx.globalAlpha = 1;
      if (this.done) { // said it: a gold star with sound waves
        star(ctx, x, cy + 1, rad - 4);
        M.waves(ctx, x, cy, rad + 4, '#70e0ff', 2, this.t >> 1);
      } else if (this.sad && !L) { // didn't catch it: a listening ear
        ctx.drawImage(S.ear, x - 9, cy - 13, 18, 26);
        M.waves(ctx, x - 12, cy, 4, '#ffffff', 1, 0);
      } else {
        ctx.drawImage(S.micD, x - 7, cy - 13, 16, 28); ctx.drawImage(S.mic, x - 8, cy - 14, 16, 28);
        if (idle) M.waves(ctx, x, cy, rad + 4, '#ffd0e0', 1, 0);
      }
    }
  };
})();
