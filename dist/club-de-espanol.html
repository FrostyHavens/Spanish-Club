<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club de Español</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas#screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<!--SCRIPTS-->
<script>/* src/core.js */
// ===== Core: canvas, loop, input, RNG, scenes =====
'use strict';
const G = window.G = {};
G.W = 320; G.H = 224;
G.TILE = 24;

// ---------- RNG (seedable, deterministic for tests) ----------
G.rngState = (Date.now() ^ 0x5bd1e995) >>> 0;
G.rand = function () { // xorshift32 -> [0,1)
  let x = G.rngState; x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
  G.rngState = x; return x / 4294967296;
};
G.r = n => (n <= 0 ? 0 : Math.floor(G.rand() * n)); // 0..n-1
G.chance = n => G.r(n) === 0; // 1 in n
G.clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- Canvas ----------
G.canvas = document.getElementById('screen');
G.ctx = G.canvas.getContext('2d');
G.canvas.width = G.W; G.canvas.height = G.H;
G.ctx.imageSmoothingEnabled = false;
G.makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return c; };
function resize() {
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth / G.W, window.innerHeight / G.H) * 4) / 4);
  G.canvas.style.width = (G.W * s) + 'px'; G.canvas.style.height = (G.H * s) + 'px';
}
window.addEventListener('resize', resize); resize();

// ---------- Input ----------
// A = confirm/talk, B = cancel, C = menu / English help, plus directions.
G.keys = {}; G.pressed = {}; G.repeatT = {};
const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
  KeyZ: 'A', Space: 'A', Enter: 'A', KeyJ: 'A',
  KeyX: 'B', Escape: 'B', Backspace: 'B', KeyK: 'B',
  KeyC: 'C', ShiftLeft: 'C', ShiftRight: 'C', KeyL: 'C',
  KeyM: 'M', KeyV: 'V'
};
// Space is push-to-talk (the mic, 'V') while the screen on top has a mic ready, else it's A
const keyOf = e => e.code === 'Space' && G.spaceTalks && G.spaceTalks() ? 'V' : KEYMAP[e.code];
window.addEventListener('keydown', e => {
  // while typing a name, printable keys, Backspace and Enter go to the text field instead of the buttons
  if (G.textInput && !e.ctrlKey && !e.metaKey && !e.altKey && (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Enter')) {
    e.preventDefault(); G.audio && G.audio.unlock(); G.textInput(e.key); return;
  }
  const k = keyOf(e); if (!k) return;
  e.preventDefault();
  if (!G.keys[k]) { G.pressed[k] = true; G.repeatT[k] = 0; }
  G.keys[k] = true;
  G.audio && G.audio.unlock(); G.primeSpeech && G.primeSpeech();
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { G.keys[k] = false; } if (e.code === 'Space') G.keys.V = false; });
window.addEventListener('blur', () => { G.keys = {}; G.input.ptr.down = false; });

// ---------- Pointer (touch / mouse / pen), in game pixels ----------
// Input API, shared by every scene (keyboard and taps run side by side; a scene checks both):
//   G.input.p(k) h(k) rep(k) dir() repDir()  keys / D-pad: 'up' 'down' 'left' 'right' 'A' 'B' 'C' 'M', 'V' (the mic)
//   G.input.keyHeld(k)    frames key k has been held down (0 = up), for press-and-hold on the keyboard
//   G.input.tap()         {x, y} of a tap released this frame (short press, little movement), else null.
//                         Only presses on the game picture count (not the black margins), the newest finger wins,
//                         and a finger that went down less than 0.4 s after the top scene changed is ignored, so a
//                         double tap can't answer a question (or walk, or close a menu) the child hasn't seen yet
//   G.input.ready()       a tap starting now would count (the top scene has been up for that grace period)
//   G.input.eat()         takes this frame's tap (returns it) so nothing after sees it (e.g. the map's menu button).
//                         Only the top scene updates each frame. The field reads a map tap without eating it, so its
//                         tasks (run inside its update, after the tap-to-walk check) still see it
//   G.input.ptr           live pointer {down, x, y, sx, sy, held}: sx,sy = where it went down, held = frames down
//   G.input.holding(x,y,w,h)  frames the pointer has been held inside the rect (pressed there on this scene,
//                         still there), else 0: for press-and-hold buttons (a long press is never a tap)
//   G.tapIn(x, y, w, h)   this frame's tap is inside the rect (or G.tapIn({x, y, w, h}))
//   G.touch               true on touch screens; G.setDpad(on) shows/hides the HTML D-pad + A/B/C buttons
//                         (hidden by default; the choice is G.prefs.dpad, saved per device)
// On-canvas buttons (ui.js), 20x20 game px, tap area padded to 28x28; pressed look while held:
//   G.iconBtn(ctx, kind, x, y) + G.btnHit(x, y)   kind: 'close' 'back' 'next' 'speaker' 'menu'
//   G.closeBtn(ctx, x, y) + G.closeHit(x, y)      close / back (default spot: top-right of the screen)
//   G.speakerBtn(ctx, x, y) + G.speakerHit(x, y)  "hear it again" (same as C)
// Taps and key presses are both edge-triggered and cleared at the end of every frame. Scenes keep their tap
// areas in small methods (rects(), rowRect(i), closeXY()...) shared by update and draw; tools/smoke.js uses them too.
G.touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches);
const ptr = { down: false, x: 0, y: 0, sx: 0, sy: 0, held: 0 };
let tapNow = null, ptrId = null, ptrT0 = 0, ptrF = 0, sceneF = 0;
const TAP_MOVE = 12, TAP_MS = 800; // a tap: moved at most 12 game px, released within 0.8 s
const TAP_GRACE = 24;              // frames after the top scene changes before a new finger counts (a double tap)
function gameXY(e) {
  const r = G.canvas.getBoundingClientRect();
  return [G.clamp((e.clientX - r.left) * G.W / r.width, 0, G.W - 0.01), G.clamp((e.clientY - r.top) * G.H / r.height, 0, G.H - 0.01)];
}
// Speech may only start inside a user activation: a key, a mouse press, or a finger (or pen) lifting.
const wake = prime => { G.audio && G.audio.unlock(); if (prime && G.primeSpeech) G.primeSpeech(); };
window.addEventListener('pointerdown', e => {
  wake(e.pointerType === 'mouse');
  if (e.target !== G.canvas || (e.pointerType === 'mouse' && e.button !== 0)) return; // the margins and the D-pad aren't taps
  const [x, y] = gameXY(e); // a new finger takes over from one already down (say, a thumb resting on the edge)
  Object.assign(ptr, { down: true, x, y, sx: x, sy: y, held: 0 }); ptrId = e.pointerId; ptrT0 = performance.now(); ptrF = G.frame;
});
window.addEventListener('pointermove', e => { if (ptr.down && e.pointerId === ptrId) [ptr.x, ptr.y] = gameXY(e); });
window.addEventListener('pointerup', e => {
  wake(e.pointerType !== 'mouse');
  if (!ptr.down || e.pointerId !== ptrId) return;
  [ptr.x, ptr.y] = gameXY(e); ptr.down = false; ptr.held = 0;
  if (Math.hypot(ptr.x - ptr.sx, ptr.y - ptr.sy) <= TAP_MOVE && performance.now() - ptrT0 <= TAP_MS) tapNow = { x: ptr.x, y: ptr.y, f: ptrF };
});
window.addEventListener('pointercancel', e => { if (e.pointerId === ptrId) { ptr.down = false; ptr.held = 0; } });
window.addEventListener('touchend', () => wake(true));
G.canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault()); // no pinch-zoom on iOS
const inRect = (px, py, x, y, w, h) => px >= x && px < x + w && py >= y && py < y + h;
G.tapIn = (x, y, w, h) => { if (typeof x === 'object') ({ x, y, w, h } = x); const t = G.input.tap(); return !!t && inRect(t.x, t.y, x, y, w, h); };

G.input = {
  // edge-triggered
  p(k) { return !!G.pressed[k]; },
  // held
  h(k) { return !!G.keys[k]; },
  keyHeld(k) { return G.keys[k] ? (G.repeatT[k] || 0) + 1 : 0; },
  // edge + auto-repeat (for cursors/menus)
  rep(k, delay = 14, rate = 5) {
    if (G.pressed[k]) return true;
    if (!G.keys[k]) return false;
    const t = G.repeatT[k] || 0;
    return t >= delay && (t - delay) % rate === 0;
  },
  dir() { // held direction (for walking)
    if (G.keys.up) return 'up'; if (G.keys.down) return 'down';
    if (G.keys.left) return 'left'; if (G.keys.right) return 'right'; return null;
  },
  repDir(delay, rate) {
    for (const d of ['up', 'down', 'left', 'right']) if (this.rep(d, delay, rate)) return d;
    return null;
  },
  ptr,
  tap() { return tapNow && tapNow.f >= sceneF + TAP_GRACE ? tapNow : null; },
  ready() { return G.frame >= sceneF + TAP_GRACE; },
  eat() { const t = this.tap(); tapNow = null; return t; },
  holding(x, y, w, h) { return ptr.down && ptrF >= sceneF && inRect(ptr.sx, ptr.sy, x, y, w, h) && inRect(ptr.x, ptr.y, x, y, w, h) ? ptr.held + 1 : 0; },
  sceneChanged() { sceneF = G.frame; },
  endFrame() { G.pressed = {}; tapNow = null; if (ptr.down) ptr.held++; },
  clear() { G.pressed = {}; tapNow = null; }
};
G.DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

// ---------- Scene stack ----------
// A scene: {update(), draw(ctx), onEnter?, onExit?, transparent?}
G.scenes = [];
G.push = s => { G.scenes.push(s); G.input.sceneChanged(); s.onEnter && s.onEnter(); return s; };
G.pop = () => { const s = G.scenes.pop(); G.input.sceneChanged(); s && s.onExit && s.onExit(); return s; };
G.replace = s => { while (G.scenes.length) G.pop(); return G.push(s); };
G.top = () => G.scenes[G.scenes.length - 1];

// ---------- Coroutine-ish task runner (for cutscenes & battle flow) ----------
// Generators yield: number (wait frames), a Promise-like {done()} object, or nothing (1 frame)
G.Tasks = class {
  constructor() { this.list = []; }
  add(gen) { this.list.push({ gen, wait: 0, obj: null }); }
  get busy() { return this.list.length > 0; }
  update() {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const t = this.list[i];
      if (t.wait > 0) { t.wait--; continue; }
      if (t.obj && !t.obj.done()) continue;
      const back = t.obj; t.obj = null;
      let r;
      try { r = t.gen.next(back); } catch (e) { console.error(e); this.list.splice(i, 1); continue; }
      if (r.done) { this.list.splice(i, 1); continue; }
      const v = r.value;
      if (typeof v === 'number') t.wait = v - 1;
      else if (v && typeof v.done === 'function') { t.obj = v; if (v.done()) { /* resolves next frame */ } }
    }
  }
};

// Fade overlay
G.fade = { a: 0, target: 0, speed: 0.08, color: '#000' };
G.fadeTo = (a, speed = 0.08, color = '#000') => { G.fade.target = a; G.fade.speed = speed; G.fade.color = color; return { done: () => G.fade.a === G.fade.target }; };

// Screen flash / shake
G.fx = { shake: 0, flash: 0, flashColor: '#fff' };

G.frame = 0;
function step() {
  G.frame++;
  const s = G.top();
  if (G.fx.step) G.fx.step(); // the particle layer (fx.js): sees this frame's tap before a scene can eat it
  if (G.intro && G.intro.step) G.intro.step(); // a word just met flying into the notebook (intro.js)
  if (s) s.update();
  // fade
  const f = G.fade;
  if (f.a < f.target) f.a = Math.min(f.target, f.a + f.speed);
  else if (f.a > f.target) f.a = Math.max(f.target, f.a - f.speed);
  if (G.fx.shake > 0) G.fx.shake--;
  if (G.fx.flash > 0) G.fx.flash--;
  for (const k in G.keys) if (G.keys[k]) G.repeatT[k] = (G.repeatT[k] || 0) + 1;
  if (G.toastT > 0) G.toastT--;
  if (G.day) G.day.step(); if (G.hint) G.hint.step(); // the day's clock (day.js), tap hints (hint.js): before input clears
  G.input.endFrame();
  G.audio && G.audio.tick();
}
function draw() {
  const ctx = G.ctx;
  ctx.save();
  if (G.fx.shake > 0) ctx.translate(G.r(5) - 2, G.r(3) - 1);
  ctx.fillStyle = '#000'; ctx.fillRect(-4, -4, G.W + 8, G.H + 8);
  // draw from lowest non-transparent scene upward
  let start = G.scenes.length - 1;
  while (start > 0 && G.scenes[start].transparent) start--;
  for (let i = Math.max(0, start); i < G.scenes.length; i++) G.scenes[i].draw(ctx);
  ctx.restore();
  // above the scenes, bottom to top: flash, toast, the hint hand (hint.js), particles (fx.js); a fade covers it all
  if (G.fx.flash > 0) { ctx.globalAlpha = Math.min(1, G.fx.flash / 6); ctx.fillStyle = G.fx.flashColor; ctx.fillRect(0, 0, G.W, G.H); ctx.globalAlpha = 1; }
  if (G.toastT > 0 && G.win) { const w = G.textWidth(G.toastMsg) + 20; ctx.globalAlpha = Math.min(1, G.toastT / 15); G.win(ctx, (G.W - w) / 2, 40, w, 20); G.textC(ctx, G.toastMsg, G.W / 2, 46, '#f8e060'); ctx.globalAlpha = 1; }
  if (G.hint) G.hint.draw(ctx); // the tapping hand, the keyboard strip
  if (G.intro && G.intro.draw) G.intro.draw(ctx); // a word just met, on its way into the notebook (intro.js)
  if (G.fx.draw) G.fx.draw(ctx); // ripples, bursts, confetti, flying stars (unshaken)
  if (G.fade.a > 0) { ctx.globalAlpha = G.fade.a; ctx.fillStyle = G.fade.color; ctx.fillRect(0, 0, G.W, G.H); ctx.globalAlpha = 1; }
}
G.toast = (msg, t = 90) => { G.toastMsg = msg; G.toastT = t; };
G.step = step; G.drawFrame = draw;

let last = performance.now(), acc = 0;
G.speedMul = 1;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  const dt = 1000 / 60;
  let n = 0;
  while (acc >= dt && n < 5) { for (let k = 0; k < G.speedMul; k++) step(); acc -= dt; n++; }
  draw();
  requestAnimationFrame(loop);
}
G.start = () => { if (location.hash === '#test') return; requestAnimationFrame(t => { last = t; loop(t); }); };

// ---------- Storage (safe) ----------
G.store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};

// ---------- On-screen D-pad + A/B/C (a grown-ups option, per device; hidden by default) ----------
(function () {
  const css = document.createElement('style');
  css.textContent = 'html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}canvas#screen{outline:none}' +
    '.tc{position:fixed;z-index:5;display:flex;gap:10px;touch-action:none;user-select:none;-webkit-user-select:none}' +
    '.tc button{width:54px;height:54px;border-radius:50%;border:2px solid #8898e0;background:rgba(28,44,140,.55);color:#f0f0ff;font:bold 16px monospace}' +
    '.tc button:active,.tc button.on{background:rgba(240,208,96,.7);color:#101030}' +
    '#tcpad{left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:2px}' +
    '#tcpad button{width:48px;height:48px;border-radius:8px}' +
    '#tcbtn{right:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));align-items:flex-end}';
  document.head.appendChild(css);
  G.canvas.tabIndex = 0;
  G.canvas.addEventListener('pointerdown', () => { try { G.canvas.focus(); } catch (e) { } });
  let els = null;
  function build() {
    const pad = document.createElement('div'); pad.id = 'tcpad'; pad.className = 'tc';
    const cells = ['', 'up', '', 'left', '', 'right', '', 'down', ''];
    const lab = { up: '▲', down: '▼', left: '◀', right: '▶' };
    cells.forEach(k => { const b = document.createElement(k ? 'button' : 'span'); if (k) { b.textContent = lab[k]; b.dataset.k = k; } pad.appendChild(b); });
    const btns = document.createElement('div'); btns.id = 'tcbtn'; btns.className = 'tc';
    [['C', 'C'], ['B', 'B'], ['A', 'A']].forEach(([k, t]) => { const b = document.createElement('button'); b.textContent = t; b.dataset.k = k; if (k === 'A') b.style.marginBottom = '30px'; btns.appendChild(b); });
    document.body.appendChild(pad); document.body.appendChild(btns);
    const down = k => { if (!G.keys[k]) { G.pressed[k] = true; G.repeatT[k] = 0; } G.keys[k] = true; }; // audio and speech wake up in the window's handlers
    const up = k => { G.keys[k] = false; };
    [pad, btns].forEach(el => {
      el.addEventListener('pointerdown', e => { const k = e.target.dataset && e.target.dataset.k; if (!k) return; e.preventDefault(); e.target.classList.add('on'); down(k); e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId); });
      const rel = e => { const k = e.target.dataset && e.target.dataset.k; if (!k) return; e.target.classList.remove('on'); up(k); };
      el.addEventListener('pointerup', rel); el.addEventListener('pointercancel', rel); el.addEventListener('pointerleave', rel);
    });
    return [pad, btns];
  }
  // on: show or hide; noSave: don't store the choice (G.prefs lives in audio.js, which loads after this file)
  G.setDpad = function (on, noSave) {
    on = !!on;
    if (G.prefs) { if (!noSave && G.audio && G.audio.setPref) G.audio.setPref('dpad', on); else G.prefs.dpad = on; }
    if (on && !els) els = build();
    if (els) els.forEach(el => { el.style.display = on ? '' : 'none'; });
    if (!on) ['up', 'down', 'left', 'right', 'A', 'B', 'C'].forEach(k => { G.keys[k] = false; });
  };
  const init = () => G.setDpad(G.prefs && G.prefs.dpad, true); // after every script has run
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else setTimeout(init);
})();

</script>
<script>/* src/gfx.js */
// ===== Graphics helpers: bitmap font, windows, sprite compiler =====
'use strict';
(function () {
  // ---- 5x7 (+descender) bitmap font; proportional widths computed from bits ----
  const F = {
    'A': [14, 17, 17, 17, 31, 17, 17], 'B': [30, 17, 17, 30, 17, 17, 30], 'C': [14, 17, 16, 16, 16, 17, 14], 'D': [28, 18, 17, 17, 17, 18, 28],
    'E': [31, 16, 16, 30, 16, 16, 31], 'F': [31, 16, 16, 30, 16, 16, 16], 'G': [14, 17, 16, 23, 17, 17, 15], 'H': [17, 17, 17, 31, 17, 17, 17],
    'I': [14, 4, 4, 4, 4, 4, 14], 'J': [7, 2, 2, 2, 2, 18, 12], 'K': [17, 18, 20, 24, 20, 18, 17], 'L': [16, 16, 16, 16, 16, 16, 31],
    'M': [17, 27, 21, 21, 17, 17, 17], 'N': [17, 17, 25, 21, 19, 17, 17], 'O': [14, 17, 17, 17, 17, 17, 14], 'P': [30, 17, 17, 30, 16, 16, 16],
    'Q': [14, 17, 17, 17, 21, 18, 13], 'R': [30, 17, 17, 30, 20, 18, 17], 'S': [15, 16, 16, 14, 1, 1, 30], 'T': [31, 4, 4, 4, 4, 4, 4],
    'U': [17, 17, 17, 17, 17, 17, 14], 'V': [17, 17, 17, 17, 17, 10, 4], 'W': [17, 17, 17, 21, 21, 21, 10], 'X': [17, 17, 10, 4, 10, 17, 17],
    'Y': [17, 17, 17, 10, 4, 4, 4], 'Z': [31, 1, 2, 4, 8, 16, 31],
    'a': [0, 0, 14, 1, 15, 17, 15], 'b': [16, 16, 22, 25, 17, 17, 30], 'c': [0, 0, 14, 16, 16, 17, 14], 'd': [1, 1, 13, 19, 17, 17, 15],
    'e': [0, 0, 14, 17, 31, 16, 14], 'f': [6, 9, 8, 28, 8, 8, 8], 'g': [0, 0, 15, 17, 17, 15, 1, 14], 'h': [16, 16, 22, 25, 17, 17, 17],
    'i': [4, 0, 12, 4, 4, 4, 14], 'j': [2, 0, 6, 2, 2, 2, 18, 12], 'k': [16, 16, 18, 20, 24, 20, 18], 'l': [12, 4, 4, 4, 4, 4, 14],
    'm': [0, 0, 26, 21, 21, 17, 17], 'n': [0, 0, 22, 25, 17, 17, 17], 'o': [0, 0, 14, 17, 17, 17, 14], 'p': [0, 0, 30, 17, 17, 30, 16, 16],
    'q': [0, 0, 15, 17, 17, 15, 1, 1], 'r': [0, 0, 22, 25, 16, 16, 16], 's': [0, 0, 15, 16, 14, 1, 30], 't': [8, 8, 28, 8, 8, 9, 6],
    'u': [0, 0, 17, 17, 17, 19, 13], 'v': [0, 0, 17, 17, 17, 10, 4], 'w': [0, 0, 17, 17, 21, 21, 10], 'x': [0, 0, 17, 10, 4, 10, 17],
    'y': [0, 0, 17, 17, 17, 15, 1, 14], 'z': [0, 0, 31, 2, 4, 8, 31],
    '0': [14, 17, 19, 21, 25, 17, 14], '1': [4, 12, 4, 4, 4, 4, 14], '2': [14, 17, 1, 2, 4, 8, 31], '3': [31, 2, 4, 2, 1, 17, 14],
    '4': [2, 6, 10, 18, 31, 2, 2], '5': [31, 16, 30, 1, 1, 17, 14], '6': [6, 8, 16, 30, 17, 17, 14], '7': [31, 1, 2, 4, 8, 8, 8],
    '8': [14, 17, 17, 14, 17, 17, 14], '9': [14, 17, 17, 15, 1, 2, 12],

      'o5 e8 f+8 g4 e4 c4 | o5 f+8 g8 a4 f+4 d4 | o5 d4 f+4 b4. a8 | o5 g2 e4 g4 |' +
      'o5 a4. g8 e4 c4 | o5 d4 f+8 e8 d4 o4 b4 | o5 c4 e4 g4 o6 c4 | o5 b4 a8 g8 f+4 d4 |';
    const pad = voices(P, 2, 60);
    S.field = {
      tempo: 120, loop: true, tracks: [
        { inst: 'lead', mml: 'v12 q7 ' + mel },
        { inst: 'strings', mml: 'v8 q8 ' + pad[1] },
        { inst: 'harp', mml: 'v8 ' + pat(P, '0:8 1:8 2:8 3:8 4:8 3:8 2:8 1:8', 55) },
        { inst: 'bass', mml: 'v11 q6 ' + pat(P, 'R:4 2:8 R:8 O:4 2:4', 43) },
        { inst: 'kick', mml: 'v9 [@kick c4 @snare c4 @kick c8 c8 @snare c4 |]16' },
        { inst: 'hat', mml: '[[v6 c8 v3 c8]4 |]16' },
      ],
    };
  }

  // =====================================================================
  // TOWN — F major waltz (3/4). A 8 | B 8 | A' 8
  // =====================================================================
  {
    const pA = prog('F | C | Dm | Bb | F | Gm | C | C7', 3);
    const pB = prog('Bb | C | Am | Dm | Bb | F | Gm | C', 3);
    const pA2 = prog('F | C | Dm | Bb | F | Gm | C | F', 3);
    const P = cat(pA, pB, pA2);
    const a6 = 'o5 c4 a4 f4 | o5 e4. d8 c4 | o5 d4 f4 a4 | o5 g2 f4 | o5 a4. g8 f4 | o5 b-4 g4 d4 |';
    const mel = a6 + 'o5 e4. f8 g4 | o5 b-4 a4 g4 |' +
      'o5 d4. f8 b-4 | o5 a4 g4 e4 | o5 c4 e4 a4 | o5 f4. e8 d4 | o5 d4. e8 f4 | o5 c4 f4 a4 | o5 b-4. a8 g4 | o5 g2 e4 |' +
      a6 + 'o5 g4. d8 e4 | o5 f2. |';
    const pah = voices(P, 2, 62, 'x4 n4 n4');
    const beats = P.reduce((a, s) => a + s.beats, 0);
    const lenA = pA.reduce((a, s) => a + s.beats, 0);
    S.town = {
      tempo: 104, loop: true, bpb: 3, tracks: [
        { inst: 'flute', mml: 'v12 q7 ' + mel },
        { inst: 'epiano', mml: 'v8 q5 ' + pah[1] },
        { inst: 'epiano', mml: 'v7 q5 ' + pah[0] },
        { inst: 'bass', mml: 'v11 q6 ' + pat(P, 'R:4 x:4 2:4', 41) },
        { inst: 'harp', mml: 'v7 ' + rest(lenA) + pat(cat(pB, pA2), '0:8 1:8 2:8 3:8 2:8 1:8', 53) },
      ],
    };
    if (Math.abs(beats - 72) > 1e-6) throw new Error('town length');
  }

  // =====================================================================
  // CHURCH — C major hymn on organ with bells
  // =====================================================================
  {
    const P = prog('C | F | C | G | Am | F | G | C | F | C | Dm | G | Em | Am | F G | C');
    const mel =
      'o5 e2 d4 e4 | o5 f2 a2 | o5 g4. f8 e4 c4 | o5 d1 |' +
      'o5 c2 e2 | o5 a4 g4 f4 a4 | o5 g2 f4 d4 | o5 c1 |' +
      'o5 a2 f4 a4 | o5 g2 e2 | o5 f4 a4 f4 d4 | o5 g2 d2 |' +
      'o5 g4 e4 g4 b4 | o5 a2 e2 | o5 f4 a4 g4 f4 | o5 e1 |';
    const inner = voices(P, 2, 61);
    S.church = {
      tempo: 70, loop: true, tracks: [
        { inst: 'organ', mml: 'v11 q8 ' + mel },
        { inst: 'organ', mml: 'v8 q8 ' + inner[1] },
        { inst: 'organ', mml: 'v7 q8 ' + inner[0] },
        { inst: 'organ', mml: 'v9 q8 ' + pat(P, 'R:1', 43) },
        { inst: 'bell', mml: 'v6 ' + pat(P, '0:2 2:4 1:4', 84) },
      ],
    };
  }

  // =====================================================================
  // HEADQUARTERS — A major, warm & homely (maj7 colours)
  // =====================================================================
  {
    const P = prog('Amaj7 | F#m7 | Dmaj7 | E7 | Amaj7 | C#m7 | Dmaj7 E7 | A A7 | Dmaj7 | C#m7 | Bm7 | E7 | Dmaj7 | C#m7 | Bm7 E7 | A');
    const mel =
      'o5 c+4. e8 e4 c+8 o4 b8 | o4 a2 f+4 a4 | o5 c+4. d8 f+4 e4 | o5 e2 d4 o4 b4 |' +
      'o5 c+4. e8 a4 g+8 e8 | o5 e4 g+8 f+8 e4 c+4 | o5 d4 f+4 e4 o4 b4 | o5 c+2 o4 a4 g4 |' +
      'o4 f+4. a8 o5 c+4 e4 | o5 e4. d8 c+4 o4 b4 | o4 a4. b8 o5 d4 f+4 | o5 e2. d8 c+8 |' +
      'o5 d4 f+4 a4 f+4 | o5 g+4. f+8 e4 c+4 | o5 d4 c+8 o4 b8 o5 e4 d4 | o4 a2. r4 |';
    const ep = voices(P, 2, 59, 'x8 n4 n8 x4 n4');
    S.headquarters = {
      tempo: 88, loop: true, tracks: [
        { inst: 'flute', mml: 'v12 q7 ' + mel },
        { inst: 'epiano', mml: 'v8 q6 ' + ep[1] },
        { inst: 'epiano', mml: 'v7 q6 ' + ep[0] },
        { inst: 'harp', mml: 'v6 ' + pat(P, '0:8 1:8 2:8 3:8 2:8 1:8 2:8 3:8', 54) },
        { inst: 'bass', mml: 'v11 q6 ' + pat(P, 'R:4. 2:8 O:4 2:4', 45) },
      ],
    };
  }

  // =====================================================================
  // STORY — C minor, tense & mysterious (heartbeat pulse, low harp ostinato)
  // =====================================================================
  {
    const P = prog('Cm | Cm | Ab | Ab | Fm | Fm | G | G | Cm | Db | Cm | Db | Ab | Fm | Dm7b5 | G');
    const mel =
      'o4 g2. a-4 | o4 g1 | o5 c2. e-4 | o5 e-2. d4 |' +
      'o5 c1 | o4 a-2 b-4 a-4 | o4 g2 b4 o5 d4 | o5 f2 d2 |' +
      'o5 e-4. d8 c2 | o5 d-2 f2 | o5 e-4. f8 g2 | o5 a-2 f2 |' +
      'o5 e-4. c8 o4 a-2 | o4 a-4 b-4 o5 c4 f4 | o5 a-2 f4 d4 | o5 d2 o4 b2 |';
    const pad = voices(P, 2, 55);
    S.story = {
      tempo: 84, loop: true, tracks: [
        { inst: 'flute', mml: 'v11 q7 ' + mel },
        { inst: 'strings', mml: 'v8 q8 ' + pad[1] },
        { inst: 'strings', mml: 'v7 q8 ' + pad[0] },
        { inst: 'harp', mml: 'v8 ' + pat(P, '0:8 2:8 1:8 2:8 3:8 2:8 1:8 2:8', 48) },
        { inst: 'bass', mml: 'v10 q8 ' + pat(P, 'R:1', 38) },
        { inst: 'kick', mml: 'v8 [c8 c8 r4 r2 |]16' },
      ],
    };
  }

  // =====================================================================
  // SAD — A minor, slow and melancholy
  // =====================================================================
  {
    const P = prog('Am | F | C | E | Am | Dm | Bm7b5 E | Am | F | G | Em | Am | Dm | G | E | E7');
    const mel =
      'o5 e2 a4. g8 | o5 f2. e4 | o5 e4. d8 c4 e4 | o5 d4. c8 o4 b2 |' +
      'o5 c4 e4 a2 | o5 a4. g8 f4 d4 | o5 d4 f4 e4 d4 | o5 c1 |' +
      'o5 c4 f4 a4. g8 | o5 g2 d2 | o5 e4. d8 e4 g4 | o5 a2 e2 |' +
      'o5 f4. e8 d4 a4 | o5 g4. f8 d2 | o5 e4 g+4 b4 o6 d4 | o5 b2 g+2 |';
    const pad = voices(P, 2, 60);
    S.sad = {
      tempo: 66, loop: true, tracks: [
        { inst: 'flute', mml: 'v12 q7 ' + mel },
        { inst: 'epiano', mml: 'v8 ' + pat(P, '0:8 1:8 2:8 3:8 2:8 1:8 2:8 1:8', 52) },
        { inst: 'strings', mml: 'v7 q8 ' + pad[1] },
        { inst: 'strings', mml: 'v6 q8 ' + pad[0] },
        { inst: 'bass', mml: 'v10 q7 ' + pat(P, 'R:2 2:2', 45) },
      ],
    };
  }

  // =====================================================================
  // CASTLE — E-flat major, stately (timpani + snare)
  // =====================================================================
  {
    const P = prog('Eb | Ab | Bb | Eb | Cm | Ab | F | Bb | Ab | Bb | Gm | Cm | Fm | Bb7 | Ab Bb | Eb');
    const mel =
      'o4 b-8. b-16 o5 e-4 g4. e-8 | o5 a-4 o6 c8. o5 b-16 a-4 e-4 | o5 d4. e-8 f4 b-4 | o5 g4. f8 e-2 |' +
      'o5 g8. g16 g4 o6 c4. o5 b-8 | o5 e-4 a-8. b-16 o6 c4 o5 a-4 | o6 c4. o5 a8 f4 a4 | o5 b-2. f4 |' +
      'o5 e-4. f8 e-4 c4 | o5 d4. e-8 f4 d4 | o5 b-4. a-8 g4 d4 | o5 e-2 g4 o6 c4 |' +
      'o6 c4. o5 a-8 f4 a-4 | o5 b-4. a-8 f4 d4 | o5 e-4 c4 d4 f4 | o5 e-2. r4 |';
    const pad = voices(P, 2, 62);
    const N = '@tom o2 e-4 @snare c8. c16 @tom o2 b-4 @snare c8 c8 |';
    const C = '@crash c4 @snare c8. c16 @tom o2 b-4 @snare c8 c8 |';
    const F = '@snare c16 c16 c16 c16 c16 c16 c16 c16 @tom o2 b-4 o2 e-4 |';
    S.castle = {
      tempo: 96, loop: true, tracks: [
        { inst: 'brass', mml: 'v13 q7 ' + mel },
        { inst: 'strings', mml: 'v9 q8 ' + pad[1] },
        { inst: 'strings', mml: 'v8 q8 ' + pad[0] },
        { inst: 'harp', mml: 'v6 ' + pat(P, '0:8 1:8 2:8 3:8', 58) },
        { inst: 'bass', mml: 'v11 q6 ' + pat(P, 'R:4. R:8 2:4 R:4', 41) },
        { inst: 'tom', mml: 'v10 ' + C + `[${N}]6 ` + F + C + `[${N}]6 ` + F },
      ],
    };
  }

  // =====================================================================
  // Jingles (loop: false)
  // =====================================================================
  S.victory = { // C major fanfare, 8 beats @132 ≈ 3.6 s
    tempo: 132, loop: false, tracks: [
      { inst: 'brass', mml: 'v13 o5 g8. g16 o6 c8. c16 e4 d8 c8 | o6 d8 c8 o5 b8 o6 d8 c2 |' },
      { inst: 'brass', mml: 'v10 o5 e8. e16 g8. g16 g4 f8 e8 | o5 f8 e8 d8 f8 e2 |' },
      { inst: 'strings', mml: 'v9 q8 o4 g2 a2 | o4 g2 g2 |' },
      { inst: 'bass', mml: 'v12 o3 c4 o2 g4 o3 c4 o2 g4 | o2 g4 g4 o3 c2 |' },
      { inst: 'snare', mml: 'v11 @crash c4 @snare c8 c8 c4 c16 c16 c16 c16 | @snare c4 c4 @crash c2 |' },
    ],
  };
  S.levelup = { // F major sparkle, 4 beats @160 = 1.5 s
    tempo: 160, loop: false, tracks: [
      { inst: 'lead', mml: 'v13 o5 f16 a16 o6 c16 f16 e8 f8 g8 a4. |' },
      { inst: 'bell', mml: 'v9 r4 o5 c8 c8 e8 f4. |' },
      { inst: 'bass', mml: 'v11 o3 f4 c8 c8 c8 o2 f4. |' },
    ],
  };
  S.promote = { // G major, I-IV-V-I, 6 beats @120 = 3 s
    tempo: 120, loop: false, tracks: [
      { inst: 'brass', mml: 'v13 o5 d8 g8 b8 o6 d8 c8 e8 d4 | o6 g2 |' },
      { inst: 'strings', mml: 'v9 q8 o4 b2 o5 e4 f+4 | o5 b2 |' },
      { inst: 'bell', mml: 'v8 r2 r2 | o6 d8 g8 b4 |' },
      { inst: 'bass', mml: 'v12 o3 g4 d4 c4 d4 | o2 g2 |' },
      { inst: 'snare', mml: 'v10 c16 c16 c16 c16 c4 c4 c4 | @crash c2 |' },
    ],
  };
  S.join = { // A major, cheerful, 6 beats @140 ≈ 2.6 s
    tempo: 140, loop: false, tracks: [
      { inst: 'lead', mml: 'v13 o5 e8 c+8 e8 a8 g+8 a8 b8 o6 c+8 | o6 e8 c+8 o5 a4 |' },
      { inst: 'epiano', mml: 'v9 o4 a4 o5 c+4 o4 b4 g+4 | o4 a2 |' },
      { inst: 'bass', mml: 'v11 o3 a8 r8 e8 r8 o2 e8 r8 b8 r8 | o3 a4 o2 a4 |' },
      { inst: 'kick', mml: 'v10 @kick c8 @hat c8 @snare c8 @hat c8 @kick c8 @hat c8 @snare c8 c8 | @crash c2 |' },
    ],
  };
  S.item = { // C major blip, 3 beats @150 = 1.2 s
    tempo: 150, loop: false, tracks: [
      { inst: 'lead', mml: 'v13 o5 e16 g16 o6 c16 e16 d8 g8 e4 |' },
      { inst: 'bell', mml: 'v9 o5 c16 e16 g16 o6 c16 o5 b8 b8 o6 c4 |' },
      { inst: 'bass', mml: 'v11 o3 c4 o2 g4 o3 c4 |' },
    ],
  };
  S.defeat = { // C minor, falling line, 4 beats @70 ≈ 3.4 s
    tempo: 70, loop: false, tracks: [
      { inst: 'strings', mml: 'v12 q8 o5 e-8 d8 c8 o4 b8 o5 c2 |' },
      { inst: 'strings', mml: 'v9 q8 o4 g4 a-8 f8 g2 |' },
      { inst: 'strings', mml: 'v8 q8 o4 c4 c8 d8 c2 |' },
      { inst: 'bass', mml: 'v11 q8 o3 c4 f8 g8 c2 |' },
    ],
  };
  S.inn = { // F major lullaby, 4 beats @90 ≈ 2.7 s
    tempo: 90, loop: false, tracks: [
      { inst: 'flute', mml: 'v12 q8 o5 c4 f8 a8 g4 f4 |' },
      { inst: 'harp', mml: 'v9 o4 f8 a8 o5 c8 f8 o4 e8 g8 a4 |' },
      { inst: 'bass', mml: 'v10 q8 o3 f2 c4 f4 |' },
      { inst: 'bell', mml: 'v7 r2. o6 f4 |' },
    ],
  };
})();

<script>/* src/ui.js */
// ===== UI: dialogue boxes, list menus, 4-way icon menus, number/confirm prompts =====
'use strict';
(function () {
  // Awaitable handle returned by UI calls; generators can `yield` it.
  class Wait { constructor() { this.fin = false; this.result = undefined; } done() { return this.fin; } resolve(v) { this.result = v; this.fin = true; } }
  G.Wait = Wait;

  // ---------- English (parents' option only) ----------
  // The game teaches like Tunic: no translations by default. Opciones > Inglés turns on an English strip.
  G.enVisible = () => !!(G.state && G.state.opts && G.state.opts.english);
  G.enBox = function (ctx, en, y, top) { // translation strip above (or below) a window
    const lines = G.wrap(en, G.W - 40); const h = lines.length * 11 + 10;
    const yy = top ? y : y - h - 2;
    G.win(ctx, 14, yy, G.W - 28, h, { fill1: '#3a2a10', fill2: '#1c1408' });
    lines.forEach((l, i) => G.text(ctx, l, 22, yy + 6 + i * 11, '#f8e8b0'));
  };

  // ---------- Player name & gendered Spanish ----------
  // {name} becomes the player's name; {boy form/girl form} picks by the chosen character:
  // '¡Bienvenid{o/a}!' -> '¡Bienvenido!' or '¡Bienvenida!'
  G.fill = function (s) {
    if (s == null || !G.st) return s;
    const girl = G.st.isGirl();
    return String(s).replace(/\{name\}/g, G.st.playerName()).replace(/\{([^{}\/]*)\/([^{}]*)\}/g, (m, a, b) => girl ? b : a);
  };

  // ---------- Rich text: words grow from pictures ----------
  // In dialogue, [id] or [id:shown form] marks a vocabulary word, drawn by how well the child knows it (words.js):
  // unmet: only its picture (like Tunic's unreadable text; the voice still says it), met: picture + blue word,
  // known: the blue word, remembered or solid: the gold word. o.mask (ids) draws those as a little speaker instead:
  // heard, not read (a listening question, learn.js).
  const TOK = /\[([a-z0-9]+)(?::([^\]]+))?\]/g;
  const COL = { text: '#ffffff', seen: '#a8d8ff', known: '#f8d860' };
  G.baseForm = id => { const w = G.data.words[id]; return w ? w.es.split(' / ')[0].replace(/^(el|la|los|las) /, '') : id; };
  G.richIds = s => { const out = []; String(s).replace(TOK, (m, id) => { out.push(id); return m; }); return out; };
  G.plain = s => String(s).replace(TOK, (m, id, shown) => shown || G.baseForm(id));
  function items(s) { // -> [{text, id?, gap}]  gap: a space precedes this item (wrapping happens only at gaps)
    const out = []; let gap = false, last = 0, m;
    const text = t => { for (const part of t.split(/(\s+)/)) { if (!part) continue; if (/^\s+$/.test(part)) { gap = true; continue; } out.push({ text: part, gap }); gap = false; } };
    TOK.lastIndex = 0;
    while ((m = TOK.exec(s))) { text(s.slice(last, m.index)); out.push({ text: m[2] || G.baseForm(m[1]), id: m[1], gap }); gap = false; last = TOK.lastIndex; }
    text(s.slice(last));
    return out;
  }
  // how a word token looks now: 'pic' (unmet), 'both' (met), 'text' (known), 'gold' (remembered+), 'mask' (heard only)
  G.wordLook = function (id, mask) {
    if (mask && mask.indexOf(id) >= 0) return 'mask';
    const st = G.st && G.data.words[id] ? G.st.stage(id) : 3;
    return st >= 3 ? 'gold' : st === 2 ? 'text' : st === 1 ? 'both' : 'pic';
  };
  const itemW = it => (!it.id ? G.textWidth(it.text) : it.look === 'pic' ? 16 : it.look === 'mask' ? 14 : G.textWidth(it.text) + (it.look === 'both' ? 18 : 0));
  const itemChars = it => (!it.id ? it.text.length : it.look === 'pic' || it.look === 'mask' ? 1 : it.text.length + (it.look === 'both' ? 1 : 0));
  G.richLayout = function (s, maxW, o = {}) {
    const lines = [{ items: [], w: 0 }];
    for (const p of String(s).split('\n')) {
      if (lines[lines.length - 1].items.length) lines.push({ items: [], w: 0 });
      // chunks: runs of items with no space between them wrap together
      const its = items(p), chunks = [];
      its.forEach(it => { if (it.id) it.look = G.wordLook(it.id, o.mask); if (it.gap || !chunks.length) chunks.push([it]); else chunks[chunks.length - 1].push(it); });
      for (const ch of chunks) {
        const cw = ch.reduce((a, it) => a + itemW(it), 0);
        let L = lines[lines.length - 1];
        const sp = L.items.length ? 4 : 0;
        if (L.items.length && L.w + sp + cw > maxW) { L = { items: [], w: 0 }; lines.push(L); }
        ch.forEach((it, k) => { it.sp = k === 0 && L.items.length ? 4 : 0; L.items.push(it); L.w += it.sp + itemW(it); });
      }
    }
    lines.forEach(L => { L.chars = L.items.reduce((a, it) => a + itemChars(it), 0); });
    return lines;
  };
  // a small speaker (a word to listen to), 12 x 9
  function earGlyph(ctx, x, y) {
    ctx.fillStyle = '#a8e8ff';
    ctx.fillRect(x, y + 3, 3, 4); ctx.fillRect(x + 3, y + 2, 1, 6); ctx.fillRect(x + 4, y + 1, 1, 8); ctx.fillRect(x + 5, y, 1, 10);
    ctx.fillRect(x + 7, y + 3, 1, 4); ctx.fillRect(x + 9, y + 1, 1, 2); ctx.fillRect(x + 10, y + 3, 1, 4); ctx.fillRect(x + 9, y + 7, 1, 2);
  }
  // draw lines[from..from+n) ; chars limits the typewriter reveal; returns nothing
  G.richDraw = function (ctx, lines, x, y, o = {}) {
    const lh = o.lineH || 16, from = o.from || 0, n = o.n || lines.length;
    let chars = o.chars == null ? 1e9 : o.chars;
    for (let i = from; i < Math.min(lines.length, from + n); i++) {
      const L = lines[i]; let cx = o.center ? Math.round(x - L.w / 2) : x; const cy = y + (i - from) * lh;
      for (const it of L.items) {
        if (chars <= 0) return;
        cx += it.sp;
        if (it.id) {
          const lk = it.look || 'gold';
          if (lk === 'mask') { earGlyph(ctx, cx + 1, cy + 3); cx += 14; chars--; continue; }
          if (lk === 'pic' || lk === 'both') { G.drawIcon16(ctx, G.data.words[it.id] || it.id, cx, cy); cx += lk === 'pic' ? 16 : 18; chars--; }
          if (lk === 'pic') continue;
          const t = it.text.slice(0, Math.max(0, chars)); G.text(ctx, t, cx, cy + 5, lk === 'gold' ? COL.known : COL.seen);
        } else G.text(ctx, it.text.slice(0, Math.max(0, chars)), cx, cy + 5, o.color || COL.text);
        chars -= it.text.length; cx += G.textWidth(it.text);
      }
    }
  };

  // ---------- Dialogue ----------
  // G.say(pages, {name, portrait, pos:'bottom'|'top', auto, silent, noVoice, show: word id or picture held up}) -> Wait
  // A page is a string or {t: 'Spanish text with [words]', en: 'English (parents option)'}.
  class TextBox {
    constructor(pages, opts, w) {
      this.transparent = true; this.opts = opts || {}; this.w = w;
      this.pages = (Array.isArray(pages) ? pages : [pages]).map(p => typeof p === 'object' ? { t: G.fill(String(p.t)), en: G.fill(p.en) } : { t: G.fill(String(p)) });
      this.pi = 0; this.setPage();
    }
    setPage() {
      const hasP = !!this.opts.portrait;
      this.boxX = hasP ? 70 : 8; this.boxW = G.W - this.boxX - 8;
      const t = this.pages[this.pi].t;
      if (G.vocabLog) G.vlog('shown', G.richIds(t), { via: 'dialogue', who: this.opts.who || null }); // (the dev-only log, vocablog.js)
      G.richIds(t).forEach(id => G.st && G.st.see(id)); // (a met word met again; an unmet one stays unmet)
      this.lines = G.richLayout(t, this.boxW - 18 - (this.opts.noVoice ? 0 : 24)); // room for the speaker button
      this.shown = 0; this.scroll = 0; this.t = 0;
      this.spoke = !!this.opts.noVoice;
    }
    chars(a, b) { return this.lines.slice(a, b).reduce((s, L) => s + L.chars, 0); }
    boxY() { return this.opts.pos === 'top' ? 6 : G.H - 66; }
    spk() { return [this.boxX + this.boxW - 26, this.boxY() + 6]; } // "hear it again" button

      c.fillStyle = sel ? '#f0d060' : '#8898e0'; c.fillRect(1, 1, 22, 18);
      c.fillStyle = disabled ? '#303858' : (sel ? '#304cc0' : '#1c2c8c'); c.fillRect(2, 2, 20, 16);
    });
    ctx.drawImage(frame, Math.round(x), Math.round(y));
    const art = ICON_ART[name]; if (!art) return;
    const spr = G.sprite('icon_' + name, art, ICON_PAL);
    ctx.globalAlpha = disabled ? 0.45 : 1;
    ctx.drawImage(spr, Math.round(x + 12 - spr.width / 2), Math.round(y + 10 - spr.height / 2));
    ctx.globalAlpha = 1;
  };

  // ---------- Tap buttons: 20x20 on the canvas, tap area padded to 28x28 (see the input notes in core.js) ----------
  const BTN_ART = {
    close: ['ww......ww', 'www....www', '.www..www.', '..wwwwww..', '...wwww...', '...wwww...', '..wwwwww..', '.www..www.', 'www....www', 'ww......ww'],
    back: ['....ww', '...www', '..www.', '.www..', 'www...', 'ww....', 'www...', '.www..', '..www.', '...www', '....ww'],
    speaker: ['....w.......', '...ww.....w.', '..www..w...w', 'wwwww...w..w', 'wwwww...w..w', 'wwwww...w..w', '..www..w...w', '...ww.....w.', '....w.......'],
  };
  G.BTN = 20;
  G.btnHit = (x, y) => G.tapIn(x - 4, y - 4, G.BTN + 8, G.BTN + 8);
  G.iconBtn = function (ctx, kind, x, y) {
    x = Math.round(x); y = Math.round(y);
    const on = G.input.holding(x - 4, y - 4, G.BTN + 8, G.BTN + 8) > 0;
    ctx.fillStyle = '#000010'; ctx.fillRect(x + 1, y, 18, 20); ctx.fillRect(x, y + 1, 20, 18);
    ctx.fillStyle = on ? '#f0d060' : '#8898e0'; ctx.fillRect(x + 1, y + 1, 18, 18);
    ctx.fillStyle = on ? '#304cc0' : '#1c2c8c'; ctx.fillRect(x + 2, y + 2, 16, 16);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(x + 2, y + 2, 16, 3);
    let spr;
    if (kind === 'menu') spr = G.sprite('icon_book', ICON_ART.book, ICON_PAL); // the notebook, like the field menu's Cuaderno
    else {
      const art = BTN_ART[kind === 'next' ? 'back' : kind]; if (!art) return;
      spr = G.sprite('btn_' + kind, art, { w: '#f0f0ff' }, kind === 'next');
      ctx.drawImage(G.tinted(spr, '#000010', 'btn_' + kind), x + 11 - (spr.width >> 1), y + 11 - (spr.height >> 1));
    }
    ctx.drawImage(spr, x + 10 - (spr.width >> 1), y + 10 - (spr.height >> 1));
  };
  G.closeBtn = (ctx, x = G.W - 26, y = 6) => G.iconBtn(ctx, 'close', x, y);
  G.closeHit = (x = G.W - 26, y = 6) => G.btnHit(x, y);
  G.speakerBtn = (ctx, x, y) => G.iconBtn(ctx, 'speaker', x, y);
  G.speakerHit = (x, y) => G.btnHit(x, y);

})();

</script>
<script>/* src/fx.js */
// ===== Juice: a particle layer drawn above every scene (tap ripples, star bursts, confetti, flying stars, dust) =====
// core.js steps it before the top scene's update (so it sees every counted tap, even one the scene then eats) and
// draws it after all the scenes, unshaken. A fixed pool of particles: nothing is allocated frame to frame.
//   G.fx.ripple(x, y)                  a small ring where a tap landed (every counted tap gets one, with a soft click)
//   G.fx.burst(x, y)                   a right answer: a gold ring and little stars shooting out
//   G.fx.flyStar(x, y, delay, mic)     a first-try star: pops out at x, y, flies up to the top right (left of the
//                                      corner buttons) and adds itself to the star counter that shows there for a moment.
//                                      mic: a speaking star (mic.js), with sound waves and its own landing sound
//   G.fx.ring(x, y, r, color, life)    one dotted ring that grows to r and fades
//   G.fx.confetti(x, y, dir, n)        a party popper at x, y shooting up and out (dir -1 left, 1 right, 0 both ways)
//   G.fx.twinkle(x, y)                 one 4-point sparkle
//   G.fx.say(text, x, y, color, big)   words that pop up, rise and fade ("¡Casi!", "¡Muy bien!")
//   G.fx.walk(field, player, dir)      field.js calls it before each player step: a dust puff when starting to walk
//   G.fx.live(kind)                    how many particles are alive (of a kind: 'ring' 'star' 'fly' ...), for tests
//   G.fx.clear()
// Coordinates are game pixels (320x224). Dust is pinned to the map, so it stays put while the camera moves.
// Randomness comes from Math.random, never G.rand, so effects don't change the game's own dice.
'use strict';
(function () {
  const FX = G.fx; // core.js made {shake, flash, flashColor}; the particle layer joins it
  const MAX = 200;
  const KINDS = ['', 'ring', 'star', 'spark', 'confetti', 'twinkle', 'fly', 'dust', 'words'];
  const RING = 1, STAR = 2, SPARK = 3, CONF = 4, TWINK = 5, FLY = 6, DUST = 7, WORDS = 8;
  const LAYER = [0, 1, 1, 1, 0, 1, 2, 0, 2]; // dust and confetti under the bursts; words and the flying star on top
  const CONFETTI = ['#f8e060', '#f06080', '#60c0f0', '#70e070', '#ffffff', '#c080f0'];
  const FLY_POP = 12, FLY_GO = 28;              // a flying star hangs where it was won, then flies (frames)
  const pool = [];
  for (let i = 0; i < MAX; i++) pool.push({ on: false, k: 0, x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 1, t: 0, life: 0, c: '#ffffff', s: 1, ph: 0, x0: 0, y0: 0, img: null, map: null });
  let next = 0, lastWalk = -99;
  const counter = { vis: 0, pop: 0, top: null, n: -1, str: '' }; // the star counter in the top-right corner
  const rnd = Math.random;
  const ease = u => { const c = 1.70158, v = u - 1; return 1 + (c + 1) * v * v * v + c * v * v; }; // overshoots a little
  FX.easeBack = ease;

  function spawn(k, x, y, life) {
    let p = null;
    for (let n = 0; n < MAX && !p; n++) { const q = pool[next]; next = (next + 1) % MAX; if (!q.on) p = q; }
    if (!p) for (let n = 0; n < MAX && !p; n++) { const q = pool[next]; next = (next + 1) % MAX; if (q.k !== FLY) p = q; } // full: recycle one (never a flying star)
    if (!p) p = pool[0];
    p.on = true; p.k = k; p.x = x; p.y = y; p.vx = 0; p.vy = 0; p.g = 0; p.drag = 1; p.t = 0; p.life = life;
    p.c = '#ffffff'; p.s = 1; p.ph = rnd() * 100; p.img = null; p.map = null;
    return p;
  }

  // ---------- pixel art (built once) ----------
  let SPR = null;
  function sprites() {
    if (SPR) return SPR;
    const outlined = (rows, pal, key) => { // 1 px dark outline all around
      const src = G.sprite('fx_' + key, rows, pal), dark = G.tinted(src, '#40200a', 'fx_' + key);
      return G.cached('fx_o_' + key, src.width + 2, src.height + 2, c => { for (const [dx, dy] of [[0, 1], [2, 1], [1, 0], [1, 2]]) c.drawImage(dark, dx, dy); c.drawImage(src, 1, 1); });
    };
    const gold = { y: '#f8d040', w: '#fff8d0', o: '#e89820' };
    SPR = {
      big: outlined(['.....w.....', '....wyy....', '....wyy....', 'wwwwwyyyyyo', '.oyyyyyyyo.', '..oyyyyyo..', '...yyyyy...', '..yyyoyyy..', '..yyo.oyy..', '.yyo...oyy.', '.oo.....oo.'], gold, 'big'),
      small: outlined(['..w..', '.wyy.', 'wyyyo', '.yyo.', '.y.o.'], gold, 'small'),
    };
    return SPR;
  }
  const words = new Map(); // floating words, pre-drawn once each (outlined so they read over anything)
  function wordImg(text, col, big) {
    const key = text + '|' + col + (big ? '|b' : '');
    if (words.has(key)) return words.get(key);
    const w = G.textWidth(text) + 2, sc = big ? 2 : 1;
    const t = G.makeCanvas(w, 10); G.text(t.getContext('2d'), text, 0, 1, col, null);
    const d = G.makeCanvas(w, 10), dx = d.getContext('2d'); dx.drawImage(t, 0, 0); dx.globalCompositeOperation = 'source-in'; dx.fillStyle = '#10102a'; dx.fillRect(0, 0, w, 10);
    const c = G.makeCanvas(w * sc + 2, 10 * sc + 2), x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    for (const [ox, oy] of [[0, 1], [2, 1], [1, 0], [1, 2], [2, 2]]) x.drawImage(d, ox, oy, w * sc, 10 * sc);
    x.drawImage(t, 1, 1, w * sc, 10 * sc);
    words.set(key, c); return c;
  }

  // ---------- making effects ----------
  function ring(x, y, r, col, life) { const p = spawn(RING, x, y, life); p.s = r; p.c = col; return p; }
  FX.ring = ring;
  FX.ripple = (x, y) => ring(x, y, 9, '#ffffff', 15);
  FX.burst = function (x, y) {
    ring(x, y, 22, '#f8e060', 18);
    for (let i = 0; i < 10; i++) {
      const a = (i + rnd() * 0.5) / 10 * Math.PI * 2, v = 2 + rnd() * 1.6, p = spawn(STAR, x, y, 26 + (rnd() * 10 | 0));
      p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v - 0.5; p.drag = 0.89; p.g = 0.05;
    }
    for (let i = 0; i < 10; i++) {
      const a = rnd() * Math.PI * 2, v = 0.8 + rnd() * 2.2, p = spawn(SPARK, x, y, 16 + (rnd() * 10 | 0));
      p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v; p.drag = 0.9; p.c = i & 1 ? '#ffffff' : '#fff0a0'; p.s = 1 + (i % 3 === 0);
    }
  };
  FX.flyStar = function (x, y, delay = 0, mic = false) { const p = spawn(FLY, x, y, FLY_POP + FLY_GO); p.x0 = x; p.y0 = y; p.t = -delay; p.s = mic ? 2 : 1; return p; };
  FX.confetti = function (x, y, dir = 0, n = 24) {
    for (let i = 0; i < n; i++) {
      const d = dir || (i & 1 ? 1 : -1), a = -Math.PI / 2 + d * (0.2 + rnd() * 0.75), v = 2.6 + rnd() * 2.4;
      const p = spawn(CONF, x, y, 100 + (rnd() * 50 | 0));
      p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v; p.drag = 0.95; p.g = 0.07; p.c = CONFETTI[i % CONFETTI.length];
    }
  };
  FX.twinkle = (x, y) => { const p = spawn(TWINK, x, y, 22); p.s = 3; return p; };
  FX.say = function (text, x, y, col = '#ffffff', big = false) { // one at a time: older words fade out quickly
    for (let i = 0; i < MAX; i++) { const q = pool[i]; if (q.on && q.k === WORDS) q.life = Math.min(q.life, Math.max(q.t + 4, Math.ceil((q.t + 1) / 0.7))); }
    const img = wordImg(text, col, big), hw = img.width / 2;
    const p = spawn(WORDS, G.clamp(x, hw + 2, G.W - hw - 2), y, big ? 36 : 44);
    p.img = img; p.vy = -1.1; p.drag = 0.9; return p;
  };
  FX.walk = function (f, pl, dir) {
    const [dx, dy] = G.DIRS[dir];
    if (f.blocked(pl.x + dx, pl.y + dy, pl)) return; // walking into a wall isn't walking
    const start = G.frame - lastWalk > 14; lastWalk = G.frame;
    if (!start) return;
    const T = G.TILE, fx = pl.x * T + T / 2 - dx * 6, fy = pl.y * T + T - 5 - dy * 4;
    for (let i = 0; i < 5; i++) {
      const p = spawn(DUST, fx + (rnd() - 0.5) * 10, fy + (rnd() - 0.5) * 3, 14 + (rnd() * 8 | 0));
      p.map = f; p.vx = -dx * (0.3 + rnd() * 0.4) + (rnd() - 0.5) * 0.7; p.vy = -0.2 - rnd() * 0.3 - dy * 0.3; p.drag = 0.9; p.s = 1 + (rnd() * 2 | 0);
    }
  };
  FX.live = kind => { const k = kind ? KINDS.indexOf(kind) : 0; let n = 0; for (let i = 0; i < MAX; i++) if (pool[i].on && (!k || pool[i].k === k)) n++; return n; };
  FX.counterShown = () => counter.vis > 0;
  FX.clear = function () { for (let i = 0; i < MAX; i++) pool[i].on = false; counter.vis = 0; };

  // ---------- stepping (core.js, before the top scene's update) ----------
  const CR = G.W - 42;              // the counter's right edge: clear of the top-right buttons (the map's menu, a question's speaker)
  const TX = CR - 11, TY = 12;      // where flying stars land: the star in the counter
  function flyPos(p) {
    if (p.t < FLY_POP) { p.x = p.x0; p.y = p.y0 - p.t * 0.6; return; }
    const u = (p.t - FLY_POP) / FLY_GO, e = u * u * (3 - 2 * u), tx = TX, ty = TY;
    const sx = p.x0, sy = p.y0 - FLY_POP * 0.6, cx = sx - 20, cy = ty - 10; // up first, then a swoop into the corner
    p.x = (1 - e) * (1 - e) * sx + 2 * (1 - e) * e * cx + e * e * tx;
    p.y = (1 - e) * (1 - e) * sy + 2 * (1 - e) * e * cy + e * e * ty;
  }
  function land(p) {
    counter.vis = 110; counter.pop = 10; counter.top = G.top();
    G.audio.sfx(p.s === 2 ? 'micland' : 'star');
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, p = spawn(SPARK, TX, TY, 14); p.vx = Math.cos(a) * 1.6; p.vy = Math.sin(a) * 1.6; p.drag = 0.85; p.c = '#fff8c0'; }
  }
  function move(p) {
    p.t++;
    if (p.t >= p.life) { if (p.k === FLY) land(p); p.on = false; return; }
    if (p.t <= 0) return; // still waiting (a delayed star)
    if (p.k === FLY) {
      flyPos(p);
      if (p.t > FLY_POP && p.t % 3 === 0) { const s = spawn(SPARK, p.x + (rnd() - 0.5) * 4, p.y + (rnd() - 0.5) * 4, 12); s.c = '#fff0a0'; s.vy = 0.3; }
      return;
    }
    p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy;
    if (p.k === CONF) p.x += Math.sin(p.t * 0.12 + p.ph) * 0.4;
  }
  FX.step = function () {
    const tp = G.input.tap();
    if (tp) { FX.ripple(tp.x, tp.y); G.audio.sfx('tap'); }
    for (let i = 0; i < MAX; i++) if (pool[i].on) move(pool[i]);
    if (counter.pop > 0) counter.pop--;
    if (counter.vis > 0) { // fades early once the screen moves on, and soon once the map is free to walk
      counter.vis--;
      const top = G.top(), f = G.field;
      if (top !== counter.top) counter.vis = Math.min(counter.vis, 12);
      else if (f && top === f && !f.locked) counter.vis = Math.min(counter.vis, 45);
    }
  };

  // ---------- drawing (core.js, after every scene) ----------
  function dot(ctx, x, y) { ctx.fillRect(x, y, 1, 1); }
  function drawP(ctx, p) {
    const u = p.t / p.life;
    let x = p.x, y = p.y;
    if (p.map) { if (p.map !== G.field) { p.on = false; return; } x -= Math.round(p.map.cam.x); y -= Math.round(p.map.cam.y); }
    switch (p.k) {
      case RING: { // a dotted ring that grows and fades
        const r = 2 + (p.s - 2) * (1 - (1 - u) * (1 - u)), n = Math.max(10, Math.round(r * 3)), a = 1 - u * u;
        for (let pass = 0; pass < 2; pass++) {
          ctx.globalAlpha = pass ? a : a * 0.5; ctx.fillStyle = pass ? p.c : '#10102a';
          for (let i = 0; i < n; i++) { const t = i / n * Math.PI * 2; dot(ctx, Math.round(x + Math.cos(t) * r) + 1 - pass, Math.round(y + Math.sin(t) * r) + 1 - pass); }
        }
        if (p.t < 4) { ctx.globalAlpha = 1; ctx.fillStyle = p.c; ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, 3, 3); }
        break;
      }
      case STAR: {
        if (u > 0.7 && (p.t & 2)) break; // blink out
        const img = sprites().small; ctx.globalAlpha = 1; ctx.drawImage(img, Math.round(x - img.width / 2), Math.round(y - img.height / 2));
        break;
      }
      case SPARK: ctx.globalAlpha = 1 - u * u; ctx.fillStyle = p.c; ctx.fillRect(Math.round(x), Math.round(y), p.s, p.s); break;
      case CONF: {
        const h = 1 + Math.round(Math.abs(Math.sin(p.t * 0.25 + p.ph)) * 2); // it tumbles
        ctx.globalAlpha = u > 0.8 ? (1 - u) * 5 : 1; ctx.fillStyle = p.c; ctx.fillRect(Math.round(x), Math.round(y), 2, h);
        break;
      }
      case TWINK: {
        const a = Math.round(Math.sin(u * Math.PI) * p.s), X = Math.round(x), Y = Math.round(y);
        ctx.globalAlpha = 1; ctx.fillStyle = '#fff0a0';
        if (a > 0) { ctx.fillRect(X - a, Y, a * 2 + 1, 1); ctx.fillRect(X, Y - a, 1, a * 2 + 1); }
        ctx.fillStyle = '#ffffff'; ctx.fillRect(X, Y, 1, 1);
        break;
      }
      case DUST: {
        const s = p.s + Math.round(u * 2);
        ctx.globalAlpha = 0.85 * (1 - u); ctx.fillStyle = '#f4ecd8';
        ctx.fillRect(Math.round(x - s), Math.round(y - s + 1), s * 2, s * 2 - 2); ctx.fillRect(Math.round(x - s + 1), Math.round(y - s), s * 2 - 2, s * 2);
        break;
      }
      case WORDS: {
        const img = p.img, sc = p.t < 8 ? 0.5 + 0.5 * ease(p.t / 8) : 1, w = Math.round(img.width * sc), h = Math.round(img.height * sc);
        ctx.globalAlpha = u > 0.7 ? (1 - u) / 0.3 : 1;
        ctx.drawImage(img, Math.round(x - w / 2), Math.round(y - h / 2), w, h);
        break;
      }
      case FLY: {
        if (p.t <= 0) break;
        const img = sprites().big, sc = p.t < FLY_POP ? ease(Math.min(1, p.t / 8)) * 1.25 : 1.25 - 0.4 * (p.t - FLY_POP) / FLY_GO;
        const w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
        ctx.globalAlpha = 1; ctx.drawImage(img, Math.round(x - w / 2), Math.round(y - h / 2), w, h);
        if (p.s === 2 && G.mic) G.mic.waves(ctx, x, y, w / 2 + 2, '#70e0ff', 2, p.t); // a speaking star: sound waves
        break;
      }
    }
  }
  function drawCounter(ctx) {
    let n = G.state ? G.state.stars : 0;
    for (let i = 0; i < MAX; i++) if (pool[i].on && pool[i].k === FLY) n--; // stars still on their way
    n = Math.max(0, n);
    if (n !== counter.n) { counter.n = n; counter.str = String(n); }
    const img = sprites().big, tw = G.textWidth(counter.str), w = tw + img.width + 12, h = 18, x = CR - w, y = 3;
    ctx.save();
    ctx.globalAlpha = Math.min(1, counter.vis / 12);
    if (counter.pop > 0) { const s = 1 + 0.3 * counter.pop / 10, cx = TX, cy = y + h / 2; ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); }
    ctx.fillStyle = '#000010'; ctx.fillRect(x + 1, y, w - 2, h); ctx.fillRect(x, y + 1, w, h - 2);
    ctx.fillStyle = '#f0d060'; ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
    ctx.fillStyle = '#1c2c8c'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
    G.text(ctx, counter.str, x + 5, y + 6, '#f8e060');
    ctx.drawImage(img, TX - (img.width >> 1), TY - (img.height >> 1));
    ctx.restore();
  }
  FX.draw = function (ctx) {
    for (let L = 0; L < 3; L++) for (let i = 0; i < MAX; i++) { const p = pool[i]; if (p.on && LAYER[p.k] === L) drawP(ctx, p); }
    ctx.globalAlpha = 1;
    if (counter.vis > 0) drawCounter(ctx);
  };
})();

</script>
<script>/* src/speech.js */
// ===== Speech recognition: listen once in Spanish, and check what was heard against a word =====
// G.speech.supported()          the browser has SpeechRecognition / webkitSpeechRecognition
// G.speech.listen(o) -> G.Wait  o: {lang: 'es-MX', alts: 5, timeout: 8000 ms}; single shot, no interim results.
//                               Resolves {ok, alternatives: [{transcript, confidence}], error, ms, during}; never throws.
//                               error: 'unsupported' 'not-allowed' 'service-not-allowed' 'no-speech' 'no-match' 'network'
//                               'aborted' 'audio-capture' 'language-not-supported' 'timeout' 'busy' 'start-failed' ...
//                               during: the input event it was started in ('touchend' 'pointerup' 'keydown'), else 'frame'.
//                               The Wait also has .phase ('starting' 'listening' 'speech' 'done'), .stop() (finish now,
//                               keeping what was heard) and .abort(). G.speech.stop() / .abort() act on the current one.
// G.speech.match(target, alts)  -> {pass, score 0..1, heard (the transcript that scored best), i (its index)}. Pure.
// G.speech.gestureTap(zone, fn, {key, codes})  runs fn(event) INSIDE the input event when a tap lands in zone() (a
//                               game-px rect, or null when not armed), or when an A key (Z / Space / Enter; or the key
//                               codes listed, e.g. ['KeyV']) goes down while key() is true. Returns {off()}. Start
//                               listening from fn, not from a scene's update():
//
// Why gestureTap: on iPad / iPhone Safari (webkitSpeechRecognition, iOS 14.5+, needs Siri & Dictation turned on),
// start() only works inside a user gesture, like speech and audio. The game reads taps in update() on the next
// animation frame, after the touch event is over, so a start() there can fail with 'not-allowed' (or do nothing).
// gestureTap applies the game's tap rule (moved < 12 px, lifted within 0.8 s, began on the picture after the scene's
// grace time) to the raw touchend / mouse pointerup / keydown and calls fn right there. The same tap still reaches the
// scene as a normal G.input.tap() on the next frame, so the scene picks up what fn started (see src/mictest.js).
// Desktop Chrome doesn't need this but doesn't mind; a scene can still call listen() from update() as a fallback.
//
// Sharing the audio with the game's voice and music (iOS has one audio session; the mic switches it to recording):
// before listening, speech synthesis is stopped (G.hush also drops a line still waiting to start or to retry) and
// the music is turned down to 0 so the mic doesn't hear it; afterwards the music comes back, the AudioContext is
// resumed (iOS can leave it 'interrupted'), speech synthesis is resumed, and the next tap or key resumes the audio
// again and re-primes speech with a silent line, inside that gesture. The mic test asks a grown-up whether the voice
// was still heard after the mic, a known iPhone problem.

  // =====================================================================
  //  Battle backdrops (320x224)

  const BW = 320, BH = 224;
  const H = h => U(h);
  function bands(b, y0, y1, cols) {
    const n = cols.length, h = (y1 - y0) / n;

      const i = Math.min(n - 1, Math.floor((y - y0) / h)), r = y - Math.round(y0 + i * h);

  // smooth 1D value noise (fractal)

  // mountain range silhouette with lit/shade flanks, gullies and optional snow
  function mountains(b, R, yBase, yBot, count, hMin, hMax, pal, snow) {
    const pk = [];
    for (let i = 0; i < count; i++) pk.push({ x: -30 + (i + 0.2 + R() * 0.6) * ((BW + 60) / count), h: hMin + R() * (hMax - hMin), s: 0.5 + R() * 0.5 });
    const seed = Math.floor(R() * 1e6);
    for (let x = 0; x < b.w; x++) {
      let H = -1e9, p = null;
      for (const q of pk) { const t = q.h - Math.abs(x - q.x) * q.s; if (t > H) { H = t; p = q; } }
      const rough = (fbm(x / 22, seed, 4) - 0.5) * p.h * 0.45;
      const top = Math.round(yBase - H - rough);
      const peakTop = yBase - p.h;
      const lit = x < p.x;
      for (let y = Math.max(0, top); y < yBot; y++) {
        const depth = y - top;
        let c = lit ? pal.lt : pal.mid;
        // gullies running parallel to the flank
        const u = x + (y - peakTop) * (lit ? 1 : -1) * p.s * 0.9;
        const gv = vnoise(u / 3, seed + 5);
        if (depth > 2 && gv < 0.22) c = lit ? pal.mid : pal.sh;
        else if (!lit && depth > 1 && gv > 0.8) c = pal.lt === c ? c : pal.mid === c ? pal.lt : pal.mid;
        if (!lit && depth < 2) c = pal.sh;
        if (lit && depth < 1) c = pal.snowRim || c;

      }
    }
  }
  // flat-topped desert buttes with horizontal strata
  function mesas(b, R, yBase, count, pal) {
    for (let i = 0; i < count; i++) {

      const seed = Math.floor(R() * 1e5);

  // soft rolling hills

  // ---- house row for the town backdrop ----

  const BG = {};

  // ------------------------------------------------------------------
  // Weapon rendering (battle) — returns tip point

  function drawWeapon(B, spec, P, hand, ang, k, pose, far) {
    const w = spec.weapon, d = dirv(ang), n = [-d[1], d[0]];
    const at = (u, v) => [hand[0] + d[0] * u + n[0] * v, hand[1] + d[1] * u + n[1] * v];
    const steel = ramp(spec.weaponColor || DEF.steel, 'metal'), wood = ramp(DEF.wood), gold = ramp(DEF.gold, 'metal'), leather = ramp(DEF.leather);
    let tip = at(10 * k, 0);

      B.grp('guard'); B.cap(c0[0], c0[1], c1[0], c1[1], 1.2 * k, 1.2 * k, gold);
      void b0; void b1;
    } else if (w === 'mace') {
      const a = at(-4 * k, 0), b = at(15 * k, 0);
      B.cap(a[0], a[1], b[0], b[1], 1.2 * k, 1.3 * k, wood);

  }

  function drawBow(B, spec, hand, ang, k, drawHand, arrow) {
    const d = dirv(ang), n = [-d[1], d[0]];
    const at = (u, v) => [hand[0] + d[0] * u + n[0] * v, hand[1] + d[1] * u + n[1] * v];

    else { B.line(tA[0], tA[1], tB[0], tB[1], str); }

    if (arrow) {
      B.grp('arrow');
      const a0 = arrow[0], a1 = arrow[1];
      B.line(a0[0], a0[1], a1[0], a1[1], 0xc09060);
      const dd = [a1[0] - a0[0], a1[1] - a0[1]], m = Math.hypot(dd[0], dd[1]); const u = [dd[0] / m, dd[1] / m];

  // ------------------------------------------------------------------

  function drawHeadBattle(B, spec, C, hx, hy, R, k, P, pose) {

      B.ell(hx, hy, R * 0.95, R, skinR, { shift: shadowFace });

      else if (body === 'orc') B.poly([[hx - R * 0.35, hy - R * 0.15], [hx - R * 0.05, hy + R * 0.35], [hx - R * 1.0, hy - R * 0.45]], skinR);

      for (let i = 0; i < 3; i++) { const a = rad(-28 + i * 22); B.ell(hx - R * (0.95 + i * 0.12), hy - R * (0.72 - i * 0.42), R * 0.85, R * 0.24, hairR, { rot: a }); }

      if (hs === 'spiky') {

      } else {

  // G.icon(name | word, size?) -> canvas (cached). A word object may carry n / col params.
  const cache = {};
  G.icon = function (w) {
    if (typeof w === 'string') w = G.data.words[w] || { icon: w };
    const key = w.icon + '|' + (w.n || '') + (w.col || '');
    if (cache[key]) return cache[key];
    const p = new P(); const fn = DRAW[w.icon];
    if (fn) fn(p, w); else { p.rect(2, 2, 12, 12, '#a0a8d0'); }
    p.outline();
    return (cache[key] = p.canvas());
  };
  // true when a word (or icon name) has its own picture, not the plain placeholder tile (tools/test-roundb-world.js)
  G.iconDrawn = w => { if (typeof w === 'string') w = G.data.words[w] || { icon: w }; return !!(w && DRAW[w.icon]); };
  // draw an icon scaled (pixel-perfect) inside an optional frame
  G.drawIcon16 = function (ctx, w, x, y, scale = 1, frame) {
    const img = G.icon(w), s = S * scale;
    if (frame) {
      ctx.fillStyle = '#000010'; ctx.fillRect(x - 3, y - 3, s + 6, s + 6);
      ctx.fillStyle = frame === 'sel' ? '#f0d060' : '#8898e0'; ctx.fillRect(x - 2, y - 2, s + 4, s + 4);
      ctx.fillStyle = frame === 'sel' ? '#3a56c8' : '#f4ecd8'; ctx.fillRect(x - 1, y - 1, s + 2, s + 2);
    }
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, Math.round(x), Math.round(y), s, s);
  };
})();
