<script>/* src/maps.js */
// ===== Villa Sol: maps and townsfolk (original content) =====
// Who says what comes from the story's chapters first (src/chapters.js, content/es/story-*.js), then the older errands
// (src/errands.js), then each person's own line. Dialogue is short Spanish with [word] tokens (an unmet word shows
// only its picture, a met one picture + word, a remembered one the gold word).
// T('Spanish', 'English') — the English is only shown with the parents' option on.
'use strict';
(function () {
  const MD = G.MAPDATA, F = () => G.state.flags, S = G.st;
  const P = (m, tag) => MD[m].pos[tag];
  const T = (t, en) => ({ t, en });
  const W = id => G.data.words[id];

  // ---------- helpers ----------
  function* say(who, ...pages) { yield G.say(pages, { portrait: G.portraitOf(who), name: G.nameOf(who), who }); }
  // the first talk of the day starts with their greeting (hearts.js: from chapter 3 on), answered by voice or a tap
  // (+1 heart), and any 3- or 5-heart surprise that's due
  function* hello(who) { if (G.hearts) { yield* G.hearts.greet(who); yield* G.hearts.milestones(who); } }
  // the story (chapters.js) comes first: CA(who) their bubble from it, CT(who, f) their part of a talk (true if it
  // handled it); then the older errands (errands.js): EA / ET; the tail errand mercado is here (Rosa and Don Pepe)
  const CA = who => (G.chapters ? G.chapters.alert(who) : null);
  function* CT(who, f) { return !!G.chapters && (yield* G.chapters.talk(who, f)); }
  const EA = who => (G.errands ? G.errands.alert(who) : false);
  function* ET(who, f) { return !!G.errands && (yield* G.errands.talk(who, f)); }
  const CH = () => G.chapters;
  // a townsperson's whole talk: greeting, story, errands, then their own line
  function talker(who, line) {
    return function* (f) {
      yield* hello(who);
      if (yield* CT(who, f)) return;
      if (yield* ET(who, f)) return;
      yield* (typeof line === 'function' ? line(f) : say(who, line));
    };
  }
  const words = (...ids) => ids.map(id => ({ word: id }));
  function* newQuest(id) { S.startQuest(id); yield G.questCard(id); }
  function* finishQuest(id) {
    S.finishQuest(id); yield G.badge(id);
    const giver = G.data.quests[id] && G.data.quests[id].giver; // finishing someone's errand, +2 hearts
    if (G.hearts && giver && G.hearts.add(giver, 2, 'errand')) { yield 40; yield* G.hearts.milestones(giver); }
  }
  // a plain line that only uses words the child has met (an unmet one would be its picture: fine, but keep it short)
  const met = id => S.seen(id);

  // ================= VILLA SOL =================
  const v = MD.villa;
  const door = (tag, to, tx, ty) => { const [x, y] = P('villa', tag); return { x, y, to, tx, ty, dir: 'up' }; };
  const sign = (tag, icon) => { const [x, y] = P('villa', tag); return { x, y, icon }; };
  const PAGES = m => Object.assign({}, (G.data.pagePlaces || {})[m] || {});
  G.maps.villa = {
    name: 'Villa Sol', icon: 'sol', rows: v.rows, music: 'town',
    exits: [
      door('casaDoor', 'casa', 4, 5),
      door('escuelaDoor', 'escuela', 6, 8),
      door('rosaDoor', 'rosa', 4, 5),
      door('panaderiaDoor', 'panaderia', 5, 6),
      door('bibliotecaDoor', 'biblioteca', 5, 7),
    ],
    signs: [sign('casaDoor', 'casa'), sign('escuelaDoor', 'escuela'), sign('rosaDoor', 'casa'), sign('panaderiaDoor', 'panaderia'), sign('bibliotecaDoor', 'biblioteca'), sign('granjaDoor', 'granja')],
    pages: PAGES('villa'), // the notebook's page puzzles (content/es/words.js pagePlaces)
    ambient: { birds: 8, butterflies: 5, cat: [16, 17] }, // ambient.js: birds, butterflies, a cat on the park fence
    // the animals (animals.js) and where they live (G.MAPDATA.villa.pos areas, made by tools/mapgen.py)
    animals: [
      { kind: 'pato', n: 3, area: 'estanque' },   // a duck and two ducklings on the farm pond
      { kind: 'gallina', n: 2, area: 'gallinero' }, // Abuela Rosa's hens, beside her house
      { kind: 'pez', at: 'fuentePez' },             // the goldfish in the plaza fountain
      { kind: 'rana', area: 'rana' },               // the frog on the park pond's lily pads
      { kind: 'conejo', area: 'conejo' },           // the rabbit on the park lawn
      { kind: 'caballo', area: 'corral' },          // the horse and the goat in the paddock
      { kind: 'cabra', area: 'corral' },
    ],
    // tap anything (world.js): tile words from G.world.TILES (trees, flowers, the fountain, benches, water); a
    // building's roof and walls say the building
    things: { areas: { escuelaArea: 'escuela', rosaArea: 'casa', casaArea: 'casa', panaderiaArea: 'panaderia', bibliotecaArea: 'biblioteca', granja: 'granja' } },
    npcs: [
      { id: 'pepe', npc: 'pepe', x: P('villa', 'pepe')[0], y: P('villa', 'pepe')[1], dir: 'down', fixed: true,
        alert: () => CA('pepe') || (S.active('mercado') && !F().compra ? [['manzana', 3], ['platano', 2]] : EA('pepe')),
        talk: talker('pepe', pepeTalk) },
      { id: 'rosa', npc: 'rosa', x: 7, y: 7, dir: 'down', wander: 1,
        alert: () => CA('rosa') || (S.active('mercado') && F().compra ? true : !S.quest('mercado') && G.errands && G.errands.offer('mercado') ? [['manzana', 3], ['platano', 2]] : EA('rosa')),
        talk: talker('rosa', rosaTalk) },
      { id: 'tomas', npc: 'tomas', x: 20, y: 12, dir: 'down', // his mail round (ambient.js): the plaza, beside the bakery door, Rosa's
        route: [[20, 12, 'down', 150], [28, 7, 'up', 120], [4, 7, 'up', 120]],
        alert: () => CA('tomas') || EA('tomas'),
        talk: talker('tomas', () => say('tomas', met('carta') ? T('¡[hola], {name}! ¡Mis [carta:cartas]!', 'Hi, {name}! My letters!') : T('¡Hola! Soy Tomás.', 'Hi! I\'m Tomás, the mail carrier.'))) },
      { id: 'gomez', npc: 'gomez', x: 8, y: 11, dir: 'right', wander: 1,
        alert: () => CA('gomez') || EA('gomez'), talk: talker('gomez', () => say('gomez', T('¡[hola], {name}!', 'Hi, {name}!'))) },
      { id: 'lucia', npc: 'lucia', x: 27, y: 12, dir: 'left', wander: 2,
        alert: () => CA('lucia') || EA('lucia'), talk: talker('lucia', () => say('lucia', met('comoestas') ? T('¡[hola]! ¿[comoestas]?', 'Hi! How are you?') : T('¡[hola]!', 'Hi!'))) },
      { id: 'nico', npc: 'nico', x: 15, y: 15, dir: 'down', wander: 2, follow: () => !!G.errands && G.errands.nicoFollows(), // (his sound game: he tags along)
        alert: () => CA('nico') || EA('nico'), talk: talker('nico', () => say('nico', met('parque') ? T('¡[hola]! ¡Al [parque]!', 'Hi! To the park!') : T('¡[hola]! Soy Nico.', 'Hi! I\'m Nico.'))) },
      { id: 'sofia', npc: 'sofia', x: P('villa', 'sofia')[0], y: P('villa', 'sofia')[1], dir: 'down',
        alert: () => CA('sofia') || EA('sofia'),
        talk: talker('sofia', () => say('sofia', met('pelota') ? T('¡Mi [pelota]!', 'My ball!') : T('¡[hola]!', 'Hi!'))) },
      { id: 'canelo', npc: 'canelo', x: 19, y: 9, dir: 'left', wander: 3, follow: () => F().canelo, // tags along once you've met
        cond: () => !(G.errands && G.errands.lost()), // (not while he's lost)
        alert: () => CA('canelo'),
        talk: function* (f, n) { yield* caneloTalk(f, n); } },
    ],
  };

  // Canelo: a chapter's beat with him first; once he's yours, the pet menu (pet.js)
  function* caneloTalk(f, n) {
    if (yield* CT('canelo', f)) return;
    if (G.chapters && G.chapters.tapHook && G.chapters.tapHook('canelo', f)) { yield 20; return; }
    if (G.pet && G.pet.mine()) { yield* G.pet.menu(f, n); return; }
    // not yours yet: a hop, a heart, a bark (and his word bubble, world.js: "?" while el perro isn't met)
    if (G.ambient) G.ambient.happy(n);
    if (G.animals) G.animals.tap('perro', n.x * G.TILE + 12, n.y * G.TILE - 6, { silent: true });
    G.audio.sfx('select'); yield 20;
  }

  // ---------- Don Pepe's fruit stall (and the market errand, mercado: after chapter 10) ----------
  function* pepeTalk(f) {
    if (S.active('mercado') && !F().compra) { yield* market(); return; }
    if (met('manzana')) yield* say('pepe', T('¡Fruta! ¡[manzana:Manzanas]!', 'Fruit! Apples!'));
    else yield* say('pepe', T('¡Hola! ¡Fruta!', 'Hello! Fruit!'));
  }
  function* market() {
    yield* say('pepe', T('¿Qué quieres?', 'What would you like?'));
    const fruits = ['manzana', 'platano', 'naranja'];
    for (const [fruit, num, howMany] of [['manzana', 'tres', '¿Cuántas?'], ['platano', 'dos', '¿Cuántos?']]) {
      const c = G.wordChoices(fruit, fruits, 3);
      yield* G.ask({ prompt: '¿Qué quieres?', en: 'What would you like? (Grandma Rosa wants ' + W(fruit).en.replace('the ', '') + 's)', choices: c.choices, answer: c.answer, layout: 'cards', who: 'pepe' });
      const d = G.wordChoices(num, G.data.numberWords, 3);
      yield* G.ask({ prompt: howMany, en: 'How many?', show: fruit, choices: d.choices, answer: d.answer, layout: 'cards', who: 'pepe' });
    }
    yield* G.ask({ prompt: 'Tú: [tres] [manzana:manzanas] y [dos] [platano:plátanos]...', en: 'You: three apples and two bananas...', choices: words('no', 'porfavor', 'adios'), answer: 1, layout: 'cards', who: 'pepe' });
    yield* G.ask({ prompt: '¡Aquí tienes!', en: 'Here you go!', choices: words('gracias', 'hola', 'no'), answer: 0, layout: 'cards', who: 'pepe', show: 'manzana' });
    yield* say('pepe', T('¡De nada, amig{o/a}! ¡[adios]!', 'You\'re welcome, friend! Goodbye!'));
    F().compra = true;
  }
  function* rosaTalk(f) {
    if (!S.quest('mercado') && G.errands && G.errands.offer('mercado')) {
      yield* say('rosa', T('¡[hola], {name}!', 'Hello, {name}!'), T('[tres] [manzana:manzanas] y [dos] [platano:plátanos], ¿[porfavor]?', 'Three apples and two bananas, please?'));
      if (G.chapters) G.chapters.tailStarted();
      yield* newQuest('mercado');
      return;
    }
    if (S.active('mercado')) {
      if (!F().compra) { yield* say('rosa', T('[tres] [manzana:manzanas] y [dos] [platano:plátanos], ¿[porfavor]?', 'Three apples and two bananas, please?'), T('¡Don Pepe!', 'Don Pepe has the fruit!')); return; }
      yield* say('rosa', T('¡La fruta!', 'The fruit!'));
      const c = G.wordChoices('dos', G.data.numberWords, 3);
      yield* G.ask({ prompt: '¿Cuántos [platano:plátanos]?', en: 'How many bananas?', show: 'platano', choices: c.choices, answer: c.answer, layout: 'cards', who: 'rosa' });
      yield* say('rosa', T('¡[si]! [dos]. ¡Qué list{o/a}! ¡[gracias], {name}!', 'Yes! Two. How clever! Thank you, {name}!'));
      yield* finishQuest('mercado');
      return;
    }
    yield* say('rosa', met('casa') ? T('¡[hola], {name}! Mi [casa].', 'Hello, {name}! My house.') : T('¡[hola], {name}!', 'Hello, {name}!'));
  }

  // ================= INTERIORS =================
  const back = (tag) => { const [x, y] = P('villa', tag); return { to: 'villa', tx: x, ty: y + 1, dir: 'down' }; };
  const exitAt = (m, tag) => Object.assign({ x: P(m, 'door')[0], y: P(m, 'door')[1] }, back(tag));

  // ---------- Mi casa ----------
  G.maps.casa = {
    name: 'Mi casa', icon: 'casa', rows: MD.casa.rows, music: 'headquarters',
    things: { at: { '7,5': 'cama' } }, // world.js: the beds say "la cama" (yours, and Canelo's cushion)
    pages: PAGES('casa'),
    onEnter: function* (f) { if (G.day) yield* G.day.evening(f); }, // home after sunset: good night, Hoy, a new morning
    exits: [Object.assign(exitAt('casa', 'casaDoor'), {
      run: function* (f) {
        if (G.chapters && !(yield* G.chapters.door(f))) { f.player.y -= 1; return false; } // a chapter's moment at the door (chapters.js)
        if (F().intro || !G.chapters || G.chapters.done('c1')) return true;
        yield* say('mama', T('¡{name}!', '{name}! (stay a moment)')); const p = G.field.player; p.y -= 1; p.dir = 'up'; return false; // (back off the doorstep)
      } })],
    npcs: [
      { id: 'mama', npc: 'mama', x: P('casa', 'mama')[0], y: P('casa', 'mama')[1], dir: 'down', fixed: true,
        alert: () => CA('mama') || !!(G.day && G.day.over() && !(G.field && G.field.evening)) || EA('mama'), // (not while the evening is going on)
        talk: function* (f) {
          if (G.day && G.day.over()) { yield* G.day.evening(f); return; } // already home when the sun went down
          yield* hello('mama');
          if (yield* CT('mama', f)) return;
          if (yield* ET('mama', f)) return; // the older errands (errands.js)
          if (S.done('fiestab') || S.done('c21')) yield* say('mama', T('¡{name}! ¡Muy bien!', '{name}! Well done!'));
          else if (G.pet && G.pet.mine()) yield* say('mama', T('¡Canelo y {name}! ¡A jugar!', 'Canelo and {name}! Off you go and play!'));
          else yield* say('mama', T('¡{name}!', '{name}!'));
        } },
      // Canelo lives here too once he's yours: he follows you in, and sleeps on his cushion at night (pet.js)
      { id: 'canelo', npc: 'canelo', x: 7, y: 5, dir: 'left', cond: () => !!(G.pet && G.pet.mine()) && !(G.errands && G.errands.lost()),
        alert: () => CA('canelo') || (!!G.errands && G.errands.caneloAlert()),
        follow: () => !!F().canelo && !(G.pet && G.pet.sleeping()), talk: function* (f, n) { yield* caneloTalk(f, n); } },
    ],
  };

  // ---------- La escuela (Profesora Luna) ----------
  G.maps.escuela = {
    name: 'La escuela', icon: 'escuela', rows: MD.escuela.rows, music: 'church',
    things: {}, pages: PAGES('escuela'),
    exits: [exitAt('escuela', 'escuelaDoor')],
    npcs: [
      { id: 'luna', npc: 'luna', x: P('escuela', 'luna')[0], y: P('escuela', 'luna')[1], dir: 'down', fixed: true,
        alert: () => CA('luna') || EA('luna'),
        talk: talker('luna', lunaTalk) },
      { id: 'kid1', npc: 'nico', x: 3, y: 5, dir: 'up', cond: () => S.done('fiesta') || S.done('fiestab'), talk: [T('¡Fiesta!', 'Party!')] },
      { id: 'kid2', npc: 'lucia', x: 9, y: 5, dir: 'up', cond: () => S.done('fiesta') || S.done('fiestab'), talk: [T('¡Muy bien, {name}!', 'Well done, {name}!')] },
      { id: 'kid3', npc: 'sofia', x: 9, y: 7, dir: 'up', cond: () => S.done('fiesta') || S.done('fiestab'), talk: [T('¡Mi [pelota] [rojo:roja]!', 'My red ball!')] },
    ],
  };
  // Luna: once the story has brought you to her school, a replayable review (the words that are due first)
  function* lunaTalk(f) {
    if (!met('escuela')) { yield* say('luna', T('¡[hola]! Soy Luna.', 'Hello! I\'m Profesora Luna.')); return; }
    if (!G.words.count(2)) { yield* say('luna', T('¡[hola], {name}!', 'Hi, {name}!')); return; }
    yield* say('luna', T('¡[hola], {name}!', 'Hi, {name}!'));
    const r = yield G.choose({ prompt: '¿Repaso?', en: 'Review some words?', show: 'pagina', layout: 'cards', choices: [{ word: 'si' }, { word: 'no' }].filter(c => met(c.word)), cancel: true });
    if (r.result !== 0) return;
    yield* G.story.review(5);
    yield* say('luna', T('¡Muy bien!', 'Very good!'));
  }

  // ---------- Casa de la abuela Rosa ----------
  G.maps.rosa = {
    name: 'La casa de Rosa', icon: 'casa', rows: MD.rosa.rows, music: 'inn',
    exits: [exitAt('rosa', 'rosaDoor')],
    pages: PAGES('rosa'), things: {},
    npcs: [],
  };

  // ---------- La panadería (Marta) ----------
  G.maps.panaderia = {
    name: 'La panadería', icon: 'panaderia', rows: MD.panaderia.rows, music: 'inn',
    things: {}, pages: PAGES('panaderia'),
    exits: [exitAt('panaderia', 'panaderiaDoor')],
    npcs: [
      { id: 'marta', npc: 'marta', x: P('panaderia', 'marta')[0], y: P('panaderia', 'marta')[1], dir: 'down', fixed: true,
        alert: () => CA('marta') || EA('marta'),
        talk: talker('marta', () => say('marta', met('pan') ? T('¡[hola]! ¡[pan]!', 'Hello! Bread!') : T('¡[hola]!', 'Hello!'))) },
    ],
  };

  // ---------- La biblioteca (Inés) ----------
  G.maps.biblioteca = {
    name: 'La biblioteca', icon: 'biblioteca', rows: MD.biblioteca.rows, music: 'castle',
    exits: [exitAt('biblioteca', 'bibliotecaDoor')],
    pages: PAGES('biblioteca'), things: {},
    npcs: [
      { id: 'ines', npc: 'ines', x: P('biblioteca', 'ines')[0], y: P('biblioteca', 'ines')[1], dir: 'down', fixed: true,
        alert: () => CA('ines') || EA('ines'),
        talk: talker('ines', () => say('ines', T('Shhh...', 'Shhh... (this is the library)'))) },
    ],
  };
})();

</script>
<script>/* src/story.js */
// ===== Story scenes: Luna's review and the diploma (the story itself is in chapters: src/chapters.js) =====
'use strict';
(function () {
  const F = () => G.state.flags, S = G.st;
  const T = (t, en) => ({ t, en });
  const ST = G.story = {};
  function* say(who, ...pages) { yield G.say(pages, { portrait: G.portraitOf(who), name: G.nameOf(who), who }); }

  // (Mamá's first lesson is chapter 1 now: content/es/story-c01-c10.js. The old name still starts the story, for tools.)
  ST.mamaIntro = function* () { yield 1; };

  // ---------- Review (Luna's "¿Repaso?"): the words due first (words.js), then the weakest met words ----------
  ST.review = function* (n = 5) {
    const due = G.review.due(n), weak = G.words.list(1).filter(id => due.indexOf(id) < 0).sort((a, b) => G.words.stage(a) - G.words.stage(b) || G.rand() - 0.5);
    for (const id of due.concat(weak).slice(0, n)) yield* G.review.ask(id, { who: 'luna' });
  };

  // ---------- Diploma ----------
  // The end of the game (errands.js: after the animal party): everything the child did, on one page. Words learned,
  // stars, speaking stars, animals met (the album), and a badge for every errand (a faint ring for one not done yet).
  class Diploma {
    constructor(w) { G.toastT = 0; this.transparent = true; this.w = w; this.t = 0; }
    update() { this.t++; if (this.t > 60 && (G.input.p('A') || G.input.p('B') || G.input.tap())) { G.pop(); this.w.resolve(); } }
    draw(ctx) {
      const x = 24, y = 10, w = G.W - 48, h = G.H - 20, cx = G.W / 2;
      ctx.fillStyle = '#5a3810'; ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
      ctx.fillStyle = '#f8f0d0'; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#c09040'; ctx.strokeRect(x + 4.5, y + 4.5, w - 9, h - 9);
      G.bigText(ctx, 'DIPLOMA', cx + 20, y + 16, 2, '#a05020', null);
      G.textC(ctx, 'Club de Español', cx + 20, y + 32, '#604020', null);
      G.bigText(ctx, G.st.playerName(), cx + 20, y + 50, 2, '#203080', null);
      ctx.fillStyle = '#5a3810'; ctx.fillRect(x + 11, y + 11, 54, 54); G.drawPortrait(ctx, G.st.playerSpec().portrait, x + 12, y + 12, this.t);
      const S = G.st, animals = G.animals ? G.animals.list().filter(G.animals.met).length : 0, all = G.animals ? G.animals.list().length : 11;
      if (S.done('fiestab') || S.done('c21')) G.textC(ctx, G.fill('¡Amig{o/a} de los animales!'), cx + 20, y + 68, '#c03030', null);
      // words learned, stars, speaking stars, animals met
      const row = y + 84, items = [['book', S.learnedCount()], ['star', G.state.stars], ['mic', S.micStars()], ['pata', animals + '/' + all]];
      items.forEach(([ic, n], k) => {
        const ix = x + 14 + k * 66;
        if (ic === 'book') G.drawIcon(ctx, 'book', ix, row - 6);
        else if (ic === 'star') G.text(ctx, '\u0005', ix + 6, row, '#c08010', null);
        else if (ic === 'mic') G.mic.glyph(ctx, ix + 6, row - 1, '#2a8a9a');
        else G.drawIcon16(ctx, 'pata', ix + 2, row - 5);
        G.text(ctx, String(n), ix + 24, row, ic === 'mic' ? '#2a8a9a' : ic === 'star' ? '#c08010' : '#604020', null);
      });
      // a badge for every errand
      const ids = G.data.badgeOrder.concat((G.data.legacyQuests || []).filter(id => S.done(id))), rows = ids.length > 14 ? 2 : 1, n1 = Math.ceil(ids.length / rows);
      const per = Math.min(22, Math.floor((w - 16) / n1));
      ids.forEach((id, k) => {
        const r = Math.floor(k / n1), inRow = Math.min(n1, ids.length - r * n1), bx = cx - (inRow * per) / 2 + (per - 16) / 2, by = y + (rows === 2 ? 100 : 106) + r * 19;
        if (S.done(id)) G.drawBadge(ctx, id, bx + (k % n1) * per, by, this.t + k * 12);
        else { ctx.strokeStyle = '#d8c8a0'; ctx.beginPath(); ctx.arc(bx + (k % n1) * per + 8, by + 8, 9, 0, Math.PI * 2); ctx.stroke(); }
      });
      // best friends
      const best = G.hearts ? G.hearts.WHO.filter(n => G.hearts.best(n)) : [];
      if (best.length) { G.hearts.heart(ctx, x + 16, y + 146, true, 2); G.text(ctx, 'Amigos', x + 34, y + 148, '#a03060', null); }
      best.slice(0, 8).forEach((n, k) => { ctx.fillStyle = '#5a3810'; ctx.fillRect(x + 81 + k * 26, y + 140, 24, 24); G.hearts.face(ctx, n, x + 82 + k * 26, y + 141, 22, this.t); });
      G.textC(ctx, 'Luna', cx + 70, y + h - 24, '#203080', null);
      ctx.fillStyle = '#806040'; ctx.fillRect(cx + 34, y + h - 14, 72, 1);
      if (G.enVisible()) G.textC(ctx, 'Words, stars, speaking stars, animals; a badge per errand', cx, y + 126, '#a07030', null);
    }
  }
  ST.diploma = function () { const w = new G.Wait(); G.push(new Diploma(w)); return w; };
})();

</script>
<script>/* src/errands.js */
// ===== The older story errands, the bag, gifts, the shops and the side jobs (docs/ROUND_B_PLAN.md section 7) =====
// Chapters 1-10 (src/chapters.js, content/es/story-c01-c10.js) come first; these errands are what comes after them until
// chapters 11-21 are written (docs/CURRICULUM.md). Each is a little story that mixes walking, finding, tapping and
// SPEAKING (every question is a G.ask with {word} picture cards, so the kids' mic comes with it). Who asks:
//   mercado El mercado (maps.js)        Rosa: three apples and two bananas from Don Pepe
//   picnic  El día de campo            Rosa: pan (Marta), queso (Pepe), huevo (the hay by the hens), leche (the goat's pail),
//                                      agua (the fountain); then a picnic on a blanket in the park
//   show    El show de perros          Sofía: Canelo needs siéntate, dame la pata and salta; Nico brings his cat; Luna judges
//   cuenta  ¿Cuántos animales?         Luna: tap every animal to count it (ducks 3, hens 2, horse, goat, rabbit, frog, fish);
//                                      then say how many of each, and the total: ¡diez!
//   sonidos ¿Qué dicen?                Nico tags along and plays a sound; find the animal and say its sound (cuac, croac,
//                                      the goat: who is it?, miau); last, Nico barks and Canelo answers
//   flores  Las flores de Lucía        Lucía is sad: a pink, a white and a yellow flower for her mom (coloured flowers grow
//                                      around town; a butterfly sits on the last one)
//   fiestab La fiesta de los animales  Luna (after the six above): invite 5 friends, hang 4 ribbons
//                                      on the barn, feed the ducks, the horse and the hens, then the show and a group photo
// How they unlock (UNLOCK below): mercado once every written chapter is done; picnic and show after it; flores and
// sonidos after those two; cuenta after flores and sonidos; the party after all six. At most one new one starts a day,
// and only while the day's new words allow it (G.chapters.tailGate). canelo and cansado were replaced by chapters 7 and
// 10: they never start now (an old save that had them going is mapped onto the chapters, chapters.js migrate()).
//
// The bag (G.state.bag.items): what you carry, drawn top-left on the map. Errand things carry `q` (their errand) and
// can't be given away; the rest (bought from Marta and Don Pepe, a flower, an egg, water from the fountain) can be given
// to someone who likes it (G.hearts.LIKES; Lucía only likes pink flowers): they notice it when you talk ("¿Para mí?").
// Side jobs (once a day each, a star and sometimes a heart; G.state.jobs[id] = 'YYYY-M-D'; each opens with the chapter
// that teaches its words: ducks c6, the cat c2, water c9, the horse c10): feed the ducks (bread from
// Marta, tap the pond), the hens' egg (the hay bale by them, after the picnic; give it to Rosa), Canelo's water (his bowl at
// home is empty each day: fill a bottle at the fountain), pet the horse (tap him from close by), the sleepy cat (tap her
// while she naps and say "gato").
//
// Hooks (other files call these): talk(who, f) / alert(who) for every townsperson (maps.js), spotAt / runSpot (field.js:
// the places an errand sends you, which win over tap-anything), update / drawUnder / drawTop / drawHud (field.js),
// targets(f) / waitsIn(map) (hint.js: where the hand points), catTap(f) (ambient.js), lost() (Canelo's map entries),
// bowlEmpty() (pet.js), tomasTired() / nicoFollows() (maps.js), and G.animals.tapped / G.world.nameTile are wrapped here.
// API for tests: G.errands.bag {list, has, add, take}, .jobDone(id), .unlocked(id), .offer(id), .fl(id) (an errand's own
// saved flags, in G.state.flags['e_' + id]), .SPOTS, .FLOWERS, .COUNT.
'use strict';
(function () {
  const E = G.errands = {}, T = G.TILE;
  const F = () => G.state.flags, S = G.st, D = () => G.data;
  const TT = (t, en) => ({ t, en });
  const W = id => G.data.words[id];
  const today = () => G.world.today();
  const words = (...ids) => ids.map(id => ({ word: id }));
  const ORDER = ['canelo', 'picnic', 'show', 'cansado', 'cuenta', 'sonidos', 'flores', 'fiestab'];
  E.B = ORDER.slice(0, 7);
  const A3 = ['mercado', 'pelota', 'carta'];
  const fl = id => { const k = 'e_' + id, f = F(); if (!f[k] || typeof f[k] !== 'object') f[k] = {}; return f[k]; };
  E.fl = fl;

  // ---------- talking ----------
  function* say(who, ...pages) { yield G.say(pages, { portrait: G.portraitOf(who), name: G.nameOf(who), who }); }
  function* tell(...pages) { yield G.say(pages); }
  // a picture-card question: the right word and a few others, shuffled; learned when answered (o.learn: other ids, or null)
  function* q(who, prompt, en, answer, pool, o = {}) {
    const met = pool.filter(w => w === answer || !G.words || G.words.met(w)); // (no unmet word as a choice)
    if (met.length >= 2) pool = met;
    const c = G.wordChoices(answer, pool, Math.min(o.n || 3, pool.length));
    return yield* G.ask(Object.assign({ prompt, en, choices: c.choices, answer: c.answer, layout: 'cards', who, learn: o.learn === undefined ? answer : o.learn }, o.show ? { show: o.show } : {}));
  }
  function* newQuest(id) { S.startQuest(id); yield G.questCard(id); }
  function* finishQuest(id) {
    S.finishQuest(id); yield G.badge(id);
    const giver = D().quests[id].giver;
    if (G.hearts && G.hearts.add(giver, 2, 'errand')) { yield 40; yield* G.hearts.milestones(giver); }
  }
  // a scene started from the map (an animal tapped, the cat): the map is locked while it runs
  function scene(f, gen) {
    f.route = null; f.locked = true;
    f.tasks.add((function* () { try { yield* gen; } finally { f.locked = false; } })());
  }
  const fade = function* (a) { yield G.fadeTo(a, 0.1); };
  const scr = (f, wx, wy) => [wx - Math.round(f.cam.x), wy - Math.round(f.cam.y)];
  const tileScr = (f, x, y) => scr(f, x * T + 12, y * T + 8);

  // ---------- which errands are open ----------
  const aDone = () => A3.filter(S.done).length, bDone = () => E.B.filter(S.done).length;
  // After the chapters written so far (chapters.js), the older errands run as the tail of the story, one new one a day
  // (G.chapters.tailGate: a day with room for new words), in this order: mercado (maps.js: Rosa and Don Pepe), then
  // picnic and show, then flores and sonidos, then cuenta, and the party last. canelo and cansado were replaced by
  // chapters 7 and 10: they only finish in an older game that has them going.
  const CHD = () => !!G.chapters && G.chapters.allWrittenDone();
  const UNLOCK = {
    mercado: () => CHD(),
    picnic: () => CHD() && S.done('mercado'),
    show: () => CHD() && S.done('mercado'),
    flores: () => S.done('picnic') && S.done('show'),
    sonidos: () => S.done('picnic') && S.done('show'),
    cuenta: () => S.done('flores') && S.done('sonidos'),
    fiestab: () => ['mercado', 'picnic', 'show', 'flores', 'sonidos', 'cuenta'].every(S.done),
    canelo: () => false,
    cansado: () => false,
  };
  E.unlocked = id => !!(G.state && UNLOCK[id] && UNLOCK[id]());
  E.offer = id => !!G.state && !S.quest(id) && E.unlocked(id) && !!G.chapters && G.chapters.tailGate();
  E.bDone = bDone;

  // ---------- the bag ----------

      if (!n) { n = f.addNpc({ id, npc: id.replace(/_.*/, ''), x, y, dir, fixed: true, guest: true }); back.push({ n, add: true }); }
      else back.push({ n, x: n.x, y: n.y, dir: n.dir, wander: n.wander, route: n.route, home: n.home, ghost: n.ghost, alert: n.alert });
      n.alert = null; // (no thought bubbles in the crowd)

      if (G.frame >= soundAt) { soundAt = G.frame + 600; playSound(f, so().i | 0); }
    }
    // Canelo barks in the barn
    if (S.active('canelo') && cl().clue >= 3 && !cl().found && G.top() === f && ++barkT % 150 === 0) {
      const d = V('granjaDoor'), p = f.player;
      if (Math.abs(p.x - d[0]) + Math.abs(p.y - d[1]) < 12) { G.pet.sound('bark'); G.fx.say('¡Guau!', ...tileScr(f, d[0], d[1] - 1), '#ffffff'); }
    }
  };

  // =====================================================================
  //  Drawing
  // =====================================================================
  // flowers (bigger than the tile's own), the picnic blanket, the barn ribbons, the milk pail
  E.drawUnder = function (f, ctx) {
    if (!G.state) return;
    const cx = Math.round(f.cam.x), cy = Math.round(f.cam.y);
    if (f.mapId !== 'villa') return;
    for (const sp of E.SPOTS) if ((sp.flower || sp.id === 'gold') && spotIcon(sp)) {
      const x = sp.at[0] * T - cx, y = sp.at[1] * T - cy, gold = sp.id === 'gold', bob = Math.round(Math.sin((f.t + sp.at[0] * 9) / 14));
      ctx.fillStyle = 'rgba(16,28,8,0.3)'; ctx.fillRect(x + 6, y + 19, 12, 2);
      G.drawIcon16(ctx, flowerPic(sp.flower || 'amarillo', gold), x + 4, y + 2 + bob);
      if ((f.t + sp.at[0] * 13) % 70 < 10 || gold) { const k = (f.t % 40) / 40; ctx.fillStyle = gold ? '#fff8b0' : '#ffffff'; ctx.fillRect(x + 16 + Math.round(k * 3), y + 1, 1, 3); ctx.fillRect(x + 15 + Math.round(k * 3), y + 2, 3, 1); }
      // the butterfly on the last flower Lucía wants
      if (S.active('flores') && !fo().bfly && wishLeft().length === 1 && sp.flower === wishLeft()[0]) drawFly(ctx, x + 12, y + 2 + Math.round(Math.sin(f.t / 10)), f.t);
    }
    if (f.bfly) { const b = f.bfly; b.t++; if (b.t > 120) f.bfly = null; else drawFly(ctx, b.x - cx + b.t * 1.2, b.y - cy - b.t * 0.9 + Math.sin(b.t / 5) * 4, f.t); }
    // the pail by the paddock gate (the picnic's milk)
    if (S.active('picnic') && !pc().leche) G.drawIcon16(ctx, 'cubeta', 39 * T - cx + 4, 12 * T - cy - 2);
    // the picnic: a red checked blanket in the park, the food on it
    if (f.picnic) {
      const x = 14 * T - cx, y = 20 * T - cy + 4, w = 3 * T;
      for (let j = 0; j < 4; j++) for (let i = 0; i < 9; i++) { ctx.fillStyle = (i + j) & 1 ? '#f8f0e8' : '#d83838'; ctx.fillRect(x + i * 8, y + j * 4, 8, 4); }
      ctx.fillStyle = '#802020'; ctx.fillRect(x, y + 16, w, 1);
      f.picnic.food.forEach((k, i) => G.drawIcon16(ctx, k, x + 2 + i * 14, y - 2));
    }
    // ribbons on the barn: the party
    const deco = Math.min(RIBBONS.length, S.done('fiestab') || S.active('fiestab') ? (S.done('fiestab') ? RIBBONS.length : fb().deco | 0) : 0);
    if (deco) {
      const d = V('granjaDoor'), x0 = (d[0] - 3) * T - cx, y0 = (d[1] - 1) * T - cy + 4;
      for (let i = 0; i < 6 * T; i += 6) { const yy = y0 + Math.round(Math.sin(i / (6 * T) * Math.PI) * 8); ctx.fillStyle = '#5a3818'; ctx.fillRect(x0 + i, yy, 6, 1); const col = W(RIBBONS[(i / 6) % deco]).col; ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x0 + i, yy + 1); ctx.lineTo(x0 + i + 5, yy + 1); ctx.lineTo(x0 + i + 2.5, yy + 6); ctx.fill(); }
    }
  };
  function drawFly(ctx, x, y, t) {
    const o = (t >> 3) & 1;
    ctx.fillStyle = '#201828'; ctx.fillRect(Math.round(x), Math.round(y) - 2, 1, 5);
    ctx.fillStyle = '#f8a020'; ctx.fillRect(Math.round(x) - 3 + o, Math.round(y) - 3, 3 - o, 3); ctx.fillRect(Math.round(x) + 1, Math.round(y) - 3, 3 - o, 3);
    ctx.fillStyle = '#f8d060'; ctx.fillRect(Math.round(x) - 2 + o, Math.round(y), 2, 2); ctx.fillRect(Math.round(x) + 1, Math.round(y), 2, 2);
  }
  // picture bubbles over the places to go
  E.drawTop = function (f, ctx) {
    if (!G.state) return;
    const cx = Math.round(f.cam.x), cy = Math.round(f.cam.y), seen = {};
    for (const sp of E.spots(f)) {
      if (sp.quiet) continue;
      const k = sp.at.join(); if (seen[k]) continue; seen[k] = 1;
      G.drawAlert(ctx, spotIcon(sp), sp.at[0] * T - cx, sp.at[1] * T - cy + 4, f.t);
    }
  };
  // the bag (top-left), and Luna's clipboard while counting
  E.drawHud = function (f, ctx) {
    if (!G.state || f.locked || G.top() !== f || (G.hint && G.hint.stripShowing())) return;
    const L = bagS();
    let y = 4;
    if (L.length) {
      const w = 26 + L.length * 15;
      G.win(ctx, 4, y, w, 22, { alpha: 0.9 });
      G.drawIcon16(ctx, 'bolsa', 8, y + 3);
      L.forEach((it, i) => {
        const pop = popIn && popIn.it === it ? Math.round(Math.sin(Math.min(1, popIn.t / 20) * Math.PI) * -6) : 0;
        G.drawIcon16(ctx, B.icon(it), 26 + i * 15, y + 3 + pop);
      });
      y += 24;
    }
    if (S.active('cuenta') && f.mapId === 'villa') {
      const n = E.COUNT.length, w = 8 + n * 22;
      G.win(ctx, 4, y, w, 30, { fill1: '#f4ecd8', fill2: '#e0d4b8', alpha: 1 });
      E.COUNT.forEach(([k, tot], i) => {
        const x = 9 + i * 22, c = counted(k);
        ctx.globalAlpha = c >= tot ? 1 : 0.75; G.drawIcon16(ctx, k, x, y + 3); ctx.globalAlpha = 1;
        for (let j = 0; j < tot; j++) { ctx.fillStyle = j < c ? '#e0a010' : '#c8bca0'; ctx.fillRect(x + 1 + j * 5, y + 22, 4, 4); }
        if (c >= tot) G.text(ctx, '\u0005', x + 11, y + 1, '#e0a010', '#5a2c04');
      });
    }
  };

  // ---------- Misiones: an active errand's steps, ticked off ----------
  // -> [{icon, done}] in the order of its goal pictures
  E.parts = function (id) {
    const tick = (list) => list.map(([icon, done]) => ({ icon, done: !!done }));
    switch (id) {
      case 'canelo': { const c = cl(); return tick([['huella', c.paw], ['pelota', c.ball], ['granja', c.found], ['casa', false]]); }
      case 'picnic': return tick(FOODS.map(k => [k, pc()[k]]));
      case 'show': return tick(SHOW.map(([t]) => [t, G.pet.knows(t)]).concat([['gato', fl('show').nico]]));
      case 'cansado': { const c = ca(); return tick([['casa', c.rosa], ['granja', c.granja === 2], ['biblioteca', c.ines]]); }
      case 'cuenta': return tick(E.COUNT.map(([k, n]) => [k, counted(k) >= n]));
      case 'sonidos': return tick(ROUNDS.map(([k, s], i) => [s || k, (so().i | 0) > i]).concat([['guau', (so().i | 0) >= 5]]));
      case 'flores': return tick(WISH.map(c => [flowerPic(c), fo().got && fo().got[c]]));
      case 'fiestab': { const c = fb(); return tick([['hola', invited() >= 5], [{ icon: 'cinta', col: '#e03028' }, decorated()], ['pan', c.fed.patos], ['agua', c.fed.caballo], ['gallina', c.fed.gallinas], ['estrella', false]]); }
    }
    return null;
  };
})();

<script>/* src/chapters.js */
// ===== The story in chapters: one path of 21 chapters (docs/CURRICULUM.md), each opening when the last is done and
// today's new-word budget allows =====
// The chapter table (title, giver, new words, badge) is content/es/words.js (G.data.chapters); each chapter's script is
// registered by a content file (content/es/story-*.js) with G.chapters.script(id, beats, opts). A chapter is also a
// quest (G.state.quests[id] = 'active' | 'done'), so Misiones, badges and S.done(id) work as for the older errands.
//
// A script is a list of BEATS, played in order. A beat waits for its trigger, then its run(f, c) plays as a scene (the
// map locked); when it ends, the chapter moves on to the next beat (saved). A run may return false to stay on that beat.
// Triggers (one per beat):
//   who: 'nico'           talking to that person (their bubble: beat.bubble, default "!"); 'canelo' = tapping Canelo
//   spot: {map, at, icon} a place on a map: a picture bubble over it (unless quiet); walking up to it / tapping it runs it
//   spots: [{map, at, icon, quiet, off(c)}]  several places: run(f, c, i) gets the one chosen and returns false to wait
//   tap: 'cat' | kind     tapping the cat on the fence, or an animal of that kind (G.animals), runs it
//   auto: 'villa' | true  runs by itself as soon as the map (any map: true) is free
//   door: 'casa'          runs when you walk into that map's way out (and the way out waits for it)
//   evening: 'dusk' | 'dawn'  runs in the evening at home (day.js), before the Hoy card / after the night
// beat.when(c): an extra condition (e.g. () => G.intro.found('perro')); beat.hint(f, c): [{x, y}] world px for the hint
// hand; beat.part: an icon for Misiones (the steps with a part are ticked off as they are done).
// opts: { stage(f, c) (puts people where the chapter needs them; called when a map opens and after every beat),
//         draw(f, ctx, c) (under the people), drawTop(f, ctx, c), lost: (c) => Canelo is away (his map entries
//         hide), tap(kind, f, c) (true: a tap on an animal / the cat / Canelo was handled, e.g. a wrong one) }
// c (the chapter's context, also G.chapters.ctx(id)): { id, def, data (its own saved object), step }.
//
// Opening (gate(id) -> null when it may start, else why not):
//   'prev'      the chapter before isn't done          'unwritten'  no script yet (chapters 11-21 for now)
//   'budget'    its new words don't fit today: at most 6 new words a day (G.words.day) and 8 a calendar date
//   'soon'      more than 5 new words would fall inside 5 minutes of play: it opens a few minutes later (no bubble
//               meanwhile; the evening chapter has the sunset for that)
//   'busy'      10 or more words are still only met (stage 1, never picked without a cue): a review day (the
//               reviewer, Luna or Mamá, has a notebook bubble and asks 5 of them: .needsReview(), .review(who))
//   'morning'   a morning chapter opens only as the first chapter of a session (a new day, a night at home)
//   'evening'   an evening chapter opens only in the evening at home (after C8 the sunset comes ~5 minutes later)
// A started chapter can always be finished. While the next chapter waits, its giver shows a "tomorrow" bubble (a sun
// coming up: {icon: 'manana', wait: true}; the hint hand passes it by) and says so.
//
// API: G.chapters.script(id, beats, opts), .ids(), .def(id), .written(id), .done(id), .current() (the active one),
//   .next() (the next to open), .gate(id), .ready(id), .start(id), .ctx(id), .beat(id) (the current beat),
//   .newToday() / .newOnDate() (words met today), .stage1() (words still only met), .parts(id) (Misiones),
//   .alert(who) / .talk(who, f) (maps.js), .spotAt / .runSpot (field.js), .tapped(kind, f) (animals, the cat, Canelo),
//   .nudge() / .nudgeRun(f, n) (Canelo's "?": a word just met comes back), .door(f) (an exit's run), .evening(phase, f) (day.js), .targets(f) (hint.js, tools/playflow.js), .waitsIn(map),
//   .update(f) / .draw(f, ctx, layer) (field.js), .lost() (Canelo away), .tailGate() (the older errands after
//   chapter 10), .migrate() (older saves), .say / .ask / .K (helpers for scripts: content/es/story-*.js).
// Saved: G.state.ch = { v, step: {id: beat}, data: {id: {...}}, began: {id: {day, date}}, doneSess: {id: session},
//   lastDoneSess, tailDay, placeAsk: {word: times} }.
'use strict';
(function () {
  const CH = G.chapters = {};
  const D = () => G.data, S = G.st, F = () => G.state.flags, T = G.TILE;
  const TT = (t, en) => ({ t, en });
  const scripts = {};
  CH.LIMITS = { day: 6, date: 8, busy: 10, win: 300, inWin: 5 }; // (at most inWin new words in win seconds of play)
  CH.VERSION = 2;

  // ---------- the table and the scripts ----------
  CH.ids = () => (D().chapters || []).map(c => c.id);
  CH.def = id => (D().chapters || []).find(c => c.id === id) || null;
  CH.script = function (id, beats, opts) { scripts[id] = { beats, o: opts || {} }; };
  CH.written = id => !!scripts[id];
  CH.writtenIds = () => CH.ids().filter(CH.written);
  // the badge rows (Misiones, the diploma): the chapters written so far, then the older errands still running
  Object.defineProperty(D(), 'badgeOrder', { configurable: true, get: () => CH.writtenIds().concat(D().tailOrder || []) });

  // ---------- saved state ----------
  const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
  function st() {
    const s = G.state; if (!isObj(s.ch)) s.ch = {};
    const c = s.ch;
    for (const k of ['step', 'data', 'began', 'doneSess', 'placeAsk']) if (!isObj(c[k])) c[k] = {};
    if (!c.v) c.v = CH.VERSION;
    return c;
  }
  CH.state = () => (G.state ? st() : null);
  CH.done = id => !!G.state && G.state.quests[id] === 'done';
  CH.active = id => !!G.state && G.state.quests[id] === 'active';
  CH.current = () => (G.state ? CH.ids().find(CH.active) || null : null);
  CH.next = function () {
    if (!G.state || CH.current()) return null;
    return CH.ids().find(id => !CH.done(id)) || null;
  };
  CH.allWrittenDone = () => !!G.state && CH.writtenIds().every(CH.done);
  CH.data = id => { const d = st().data; if (!isObj(d[id])) d[id] = {}; return d[id]; };
  CH.ctx = id => ({ id, def: CH.def(id), data: CH.data(id), step: st().step[id] | 0 });
  CH.beat = id => { id = id || CH.current(); const sc = id && scripts[id]; return sc ? sc.beats[st().step[id] | 0] || null : null; };

  // ---------- the budget ----------
  const recs = () => Object.keys(G.state ? G.state.words : {}).map(G.words.rec).filter(r => r && r.st >= 1 && r.how !== 'old');
  CH.newToday = () => { const d = G.words.day(); return recs().filter(r => r.md === d).length; };
  CH.newOnDate = () => { const t = G.today(); return recs().filter(r => r.mdate === t).length; };
  CH.stage1 = () => recs().filter(r => r.st === 1).length;
  CH.newRecent = sec => { const now = G.words.now(), ss = G.words.sess(); return recs().filter(r => r.met != null && r.ms === ss && now - r.met < sec).length; }; // (this session only)
  CH.newWords = id => { const c = CH.def(id); return c ? c.words.filter(w => !G.words.met(w)) : []; };
  CH.gate = function (id, o = {}) {
    const c = CH.def(id); if (!c || !G.state) return 'none';
    if (CH.done(id)) return 'done';
    if (CH.active(id)) return null;
    if (!scripts[id]) return 'unwritten';
    const k = CH.ids().indexOf(id);
    if (k > 0 && !CH.done(CH.ids()[k - 1])) return 'prev';
    if (c.when === 'evening' && !o.evening) return 'evening';
    if (c.when === 'morning' && st().lastDoneSess === G.words.sess()) return 'morning';
    const n = CH.newWords(id).length;
    if (n && (CH.newToday() + n > CH.LIMITS.day || CH.newOnDate() + n > CH.LIMITS.date)) return 'budget';
    if (n && CH.stage1() >= CH.LIMITS.busy) return 'busy';
    if (n && c.when !== 'evening' && CH.newRecent(CH.LIMITS.win) + n > CH.LIMITS.inWin) return 'soon';
    return null;
  };
  CH.ready = (id, o) => !CH.gate(id, o);
  // the older errands after chapter 10 (errands.js): one a day, on a day with room for new words
  CH.tailGate = () => !!G.state && CH.allWrittenDone() && CH.newToday() <= 3 && CH.newOnDate() <= 4 && CH.stage1() < CH.LIMITS.busy && st().tailDay !== G.words.day();
  CH.tailStarted = () => { st().tailDay = G.words.day(); };

  // ---------- starting, moving on, finishing ----------
  CH.start = function (id) {
    if (!G.state || CH.done(id)) return;
    const s = st();
    if (!CH.active(id)) { s.step[id] = 0; s.began[id] = { day: G.words.day(), date: G.today() }; S.startQuest(id); }
  };
  function advance(id) {
    const s = st(); s.step[id] = (s.step[id] | 0) + 1; S.autosave();
    return s.step[id] >= scripts[id].beats.length;
  }
  function* finish(id, f) {
    const s = st(), c = CH.def(id);
    S.finishQuest(id); s.doneSess[id] = G.words.sess(); s.lastDoneSess = G.words.sess();
    yield G.badge(id);
    if (G.hearts && c.giver && G.hearts.WHO.includes(c.giver) && G.hearts.add(c.giver, 2, 'errand')) { yield 40; yield* G.hearts.milestones(c.giver); }
    const nx = CH.next();
    if (nx && CH.def(nx).when === 'evening' && !CH.gate(nx, { evening: true }) && G.day && G.day.bring) G.day.bring(300); // (C9: the sunset comes sooner)
    restage(f);
    S.autosave();
  }
  // play beat k of chapter id (a scene: the caller has locked the map). Returns true if it ran.
  let running = null;
  CH.running = () => running;
  function* play(id, f, k, i) {
    const sc = scripts[id], b = sc.beats[k];
    if (!b) return false;
    if (!CH.active(id)) CH.start(id);
    running = { id, k };
    let r;
    try { r = yield* b.run(f, CH.ctx(id), i); } finally { running = null; }
    if (r === false) { restage(f); return true; }
    if (advance(id)) yield* finish(id, f);
    restage(f);
    return true;
  }
  // the chapter (and beat) a trigger could run now: the active one, or the next one when it may open
  function live(o = {}) {
    const cur = CH.current();
    if (cur) { const sc = scripts[cur]; return sc ? { id: cur, k: st().step[cur] | 0, b: CH.beat(cur), started: true } : null; }
    const nx = CH.next(); if (!nx || !scripts[nx] || CH.gate(nx, o)) return null;
    return { id: nx, k: 0, b: scripts[nx].beats[0], started: false };
  }
  CH.live = live;
  const when = (L) => { try { return !L.b.when || !!L.b.when(CH.ctx(L.id)); } catch (e) { console.error(e); return false; } };

  // ---------- who says what (maps.js) ----------
  // the bubble over someone: the beat waiting for them, the next chapter's giver (or "tomorrow")
  // a review day (10+ words only met): the teacher (Profesora Luna once her school is met, else Mamá) has a notebook
  // bubble and asks the oldest of them, so the story can go on (nothing waits on a word that never comes back)
  CH.reviewer = () => (G.words.met('escuela') ? 'luna' : 'mama');
  CH.needsReview = () => !!G.state && !CH.current() && CH.stage1() >= CH.LIMITS.busy;
  CH.review = function* (who, n = 5) {
    const say = (...p) => G.say(p, { portrait: G.portraitOf(who), name: G.nameOf(who), who, show: { icon: 'pagina' } });
    yield say(TT('¡[hola], {name}! ¿Y tus palabras?', 'Hi, {name}! Let\'s practise your new words.'));
    const ids = Object.keys(G.state.words).filter(id => G.words.stage(id) === 1).map(id => [id, G.words.rec(id)])
      .sort((a, b) => (a[1].met || 0) - (b[1].met || 0)).slice(0, n).map(a => a[0]);
    for (const id of ids) yield* G.review.ask(id, { who });
    yield say(TT('¡Muy bien, {name}!', 'Very good, {name}!'));
    G.st.autosave();
  };
  // Canelo's "?": a word met this session a minute or more ago and not used since its puzzle comes back through him
  // (tap him: a review question for it), so every new word is used again within a minute or two (at most one every
  // 40 seconds of play)
  // the next nudge: a word that will put the "?" over Canelo within a minute (tools/playflow.js waits for it)
  CH.nudgeSoon = function () {
    if (!G.state || !G.pet || !G.pet.mine()) return false;
    if (G.errands && G.errands.lost()) return false;
    const now = G.words.now(), ss = G.words.sess(), s = st(), cool = s.nudgeAt != null && now >= s.nudgeAt && now - s.nudgeAt < 40;
    return Object.keys(G.state.words).some(id => { const r = G.words.rec(id); return r && r.st >= 1 && r.how !== 'old' && r.ms === ss && r.met != null && (now - r.met < 60 || (cool && now - r.met <= 600)) && (r.ru == null || r.ru - r.met < 20); });
  };
  CH.nudge = function () {
    if (!G.state || !G.pet || !G.pet.mine() || (G.errands && G.errands.lost())) return null;
    const now = G.words.now(), ss = G.words.sess(), s = st();
    if (s.nudgeAt != null && now - s.nudgeAt < 40 && now >= s.nudgeAt) return null;
    let best = null;
    for (const id of Object.keys(G.state.words)) {
      const r = G.words.rec(id);
      if (!r || r.st < 1 || r.how === 'old' || r.ms !== ss || r.met == null) continue;
      const age = now - r.met;
      if (age < 60 || age > 600 || (r.ru != null && r.ru - r.met >= 20)) continue;
      if (!best || r.met < best[1]) best = [id, r.met];
    }
    return best && best[0];
  };
  CH.nudgeRun = function* (f, n) {
    const id = CH.nudge(); if (!id) return false;
    st().nudgeAt = G.words.now();
    if (n && G.ambient) G.ambient.happy(n);
    if (G.pet && G.pet.sound) G.pet.sound('bark');
    yield 16;
    yield* G.review.ask(id, { who: null });
    if (n && G.hearts) G.hearts.add('canelo', 1, 'care');
    return true;
  };
  CH.alert = function (who) {
    if (!G.state) return null;
    const L = live();
    if (L && L.b.who === who && when(L)) { const bb = L.b.bubble; return typeof bb === 'function' ? bb(CH.ctx(L.id)) : bb != null ? bb : true; }
    if (who === 'canelo' && CH.nudge()) return 'pregunta';
    if (CH.needsReview() && who === CH.reviewer()) return 'pagina';
    if (!CH.current()) {
      const nx = CH.next(), c = nx && CH.def(nx), g = nx && CH.gate(nx);
      if (c && g && c.giver === who && scripts[nx] && g !== 'prev' && g !== 'soon') return g === 'evening' ? { icon: 'noche', wait: true } : { icon: 'manana', wait: true };
    }
    return null;
  };
  // their part of a talk: true when it handled it
  CH.talk = function* (who, f) {
    if (!G.state) return false;
    const L = live();
    if (L && L.b.who === who && when(L)) return yield* play(L.id, f || G.field, L.k);
    if (CH.needsReview() && who === CH.reviewer()) { yield* CH.review(who); return true; }
    if (who === 'canelo' && CH.nudge()) return yield* CH.nudgeRun(f || G.field, G.pet && G.pet.npc(f || G.field));
    if (!CH.current()) {
      const nx = CH.next(), c = nx && CH.def(nx), g = nx && CH.gate(nx);
      if (c && g && c.giver === who && scripts[nx] && g !== 'prev' && g !== 'soon') { yield* tomorrow(who, g); return true; }
    }
    return false;
  };
  function* tomorrow(who, why) {
    const say = (...p) => G.say(p, { portrait: G.portraitOf(who), name: G.nameOf(who), who, show: { icon: why === 'evening' ? 'noche' : 'manana' } });
    if (why === 'evening') yield say(TT('¡Esta noche!', 'Tonight! (when the sun goes down, come home)'));
    else if (why === 'busy') yield say(TT('¡Mañana! Hoy... ¡a jugar con Canelo!', 'Tomorrow! Today, play with Canelo and say hello to everyone.'));
    else yield say(TT('¡Mañana!', 'Tomorrow! (a new chapter opens tomorrow)'));
  }

  // ---------- places, taps and doors ----------
  // a beat's places: spot, or spots (several to choose from: run(f, c, i) gets which one, and returns false to wait for
  // another, e.g. a ball of the wrong colour)
  const spotsOf = b => (b.spots || (b.spot ? [b.spot] : []));
  CH.spotAt = function (f, x, y) {
    if (!G.state || !f) return null;
    const L = live(); if (!L || !when(L)) return null;
    const i = spotsOf(L.b).findIndex(sp => sp.map === f.mapId && sp.at[0] === x && sp.at[1] === y && !(sp.off && sp.off(CH.ctx(L.id))));
    return i >= 0 ? Object.assign({ i }, L) : null;
  };
  CH.runSpot = function* (f, L) { return yield* play(L.id, f, L.k, L.i); };
  // an animal (kind), 'cat' or 'canelo' tapped -> true when the chapter took it (it plays as a scene)
  CH.tapped = function (kind, f) {
    if (!G.state || !f || (!f.locked && G.top() !== f) || running) return false;
    const L = live();
    if (L && L.b.tap === kind && when(L)) {
      if (f.locked) f.tasks.add((function* () { while (f.locked) yield 1; scene(f, play(L.id, f, L.k)); })()); // (from a search: once it ends)
      else scene(f, play(L.id, f, L.k));
      return true;
    }
    return CH.tapHook(kind, f);
  };
  // the chapter's own reaction to a tap that isn't its beat (opts.tap: a wrong animal in a listening game)
  CH.tapHook = function (kind, f) {
    const L = live(), sc = L && scripts[L.id];
    if (sc && sc.o.tap) { try { return !!sc.o.tap(kind, f, CH.ctx(L.id)); } catch (e) { console.error(e); } }
    return false;
  };
  // a way out of a map: a beat waiting at the door plays first, then you go out (false: it asked to stay)
  CH.door = function* (f) {
    const L = live();
    if (L && L.b.door === f.mapId && when(L)) { const k = st().step[L.id] | 0; yield* play(L.id, f, L.k); return CH.done(L.id) || (st().step[L.id] | 0) > k; }
    return true;
  };
  function scene(f, gen) {
    f.route = null; f.locked = true;
    f.tasks.add((function* () { try { yield* gen; } finally { f.locked = false; } })());
  }
  CH.scene = scene;

  // ---------- the evening at home (day.js) ----------
  // phase 'dusk' (before the Hoy card) or 'dawn' (after the night): true when a chapter played it
  CH.evening = function* (phase, f) {
    if (!G.state) return false;
    let ran = false;
    for (let guard = 0; guard < 20; guard++) {
      const L = live({ evening: true });
      if (!L || L.b.evening !== phase || !when(L)) break;
      yield* play(L.id, f, L.k); ran = true;
    }
    return ran;
  };

  // ---------- every frame (field.js) ----------
  CH.update = function (f) {
    if (!G.state || !f) return;
    if (f.chStaged !== G.state) { f.chStaged = G.state; restage(f); }
    const L = live();
    // an evening chapter waiting: the sunset comes soon
    if (!L && !CH.current()) { const nx = CH.next(); if (nx && CH.def(nx).when === 'evening' && !CH.gate(nx, { evening: true }) && G.day && G.day.bring && !G.day.brought()) G.day.bring(180); }
    if (f.locked || G.top() !== f || G.fade.a > 0 || f.player.moving || running) return;
    if (L && L.b.auto && (L.b.auto === true || L.b.auto === f.mapId) && when(L)) { scene(f, play(L.id, f, L.k)); return; }
    if (!L || L.b.auto) placeAsk(f);
  };
  function restage(f) {
    f = f || G.field; if (!f || !G.state) return;
    const id = CH.current() || CH.next(); const sc = id && scripts[id];
    if (sc && sc.o.stage) { try { sc.o.stage(f, CH.ctx(id)); } catch (e) { console.error(e); } }
  }
  CH.restage = restage;
  CH.lost = function () { const id = CH.current(), sc = id && scripts[id]; return !!(sc && sc.o.lost && sc.o.lost(CH.ctx(id))); };

  // ---------- the arrival banner: entering a building whose word is met and due asks its name (a few times) ----------
  const PLACES = ['escuela', 'panaderia', 'biblioteca', 'casa'];
  function placeAsk(f) {
    if (f.placeAsked) return;
    f.placeAsked = true;
    const id = f.def && f.def.icon; if (!id || !PLACES.includes(id) || !G.data.words[id] || !G.words.met(id) || !G.words.due(id)) return;
    if (f.mapId === 'casa' && G.day && G.day.over()) return;
    const pa = st().placeAsk; if ((pa[id] | 0) >= 3 || pa[id + '@'] === G.words.sess()) return;
    const others = G.words.list(1).filter(k => k !== id && G.data.words[k].topic === 'pueblo' && k !== 'carta' && !(id === 'casa' && k === 'cama'));
    const more = G.words.list(1).filter(k => k !== id && !others.includes(k) && k !== 'cama');
    const pool = others.concat(more.sort(() => G.rand() - 0.5)).slice(0, 2);
    if (pool.length < 2) return;
    pa[id] = (pa[id] | 0) + 1; pa[id + '@'] = G.words.sess();
    scene(f, (function* () { yield 20; yield* CH.banner(id, pool, { who: null }); })());
  }
  // a place's name, asked on arrival: [place, ...others] (picture + word while it's new)
  CH.banner = function* (id, others, o = {}) {
    return yield* CH.ask(o.who || null, '¿Dónde estás?', 'Where are you? (this place\'s name)', id, others, o);
  };

  // ---------- where the hint hand points (and the test bot goes) ----------
  CH.targets = function (f) {
    if (!G.state || !f) return [];
    const L = live(); if (!L || !when(L)) return [];
    const out = [], b = L.b;
    if (b.hint) { try { for (const t of b.hint(f, CH.ctx(L.id)) || []) out.push(Object.assign({ ch: L.id }, t)); } catch (e) { console.error(e); } return out; }
    spotsOf(b).forEach((sp, i) => { if (sp.map === f.mapId && !(sp.off && sp.off(CH.ctx(L.id)))) out.push({ x: sp.at[0] * T + 12, y: sp.at[1] * T + 12, spot: 'ch:' + L.id + ':' + i, ch: L.id }); });
    if (b.tap && f.mapId) {
      if (b.tap === 'cat' && f.amb && f.amb.cat && !f.amb.cat.away) out.push({ x: f.amb.cat.x * T + 12, y: f.amb.cat.y * T - 2, cat: true, ch: L.id });
      else if (b.tap === 'canelo') { const n = G.pet && G.pet.npc(f); if (n) out.push({ x: n.x * T + 12, y: n.y * T + 12, npc: 'canelo', ch: L.id }); }
      else if (G.animals) { const a = G.animals.find(b.tap, f); if (a) out.push({ x: Math.round(a.x), y: Math.round(a.y - 6), animal: b.tap, ch: L.id }); }
    }
    if (b.door === f.mapId) { const ex = (f.def.exits || [])[0]; if (ex) out.push({ x: ex.x * T + 12, y: ex.y * T + 12, door: true, ch: L.id }); }
    return out;
  };
  // does something wait inside map m (for the hand at a door)?
  CH.waitsIn = function (m) {
    if (CH.needsReview() && m === (CH.reviewer() === 'luna' ? 'escuela' : 'casa')) return true;
    if (m === 'villa' && G.field && G.field.mapId !== 'villa' && !(G.pet && G.pet.npc(G.field)) && CH.nudge()) return true; // (Canelo waits outside with his "?")
    const L = live(); if (!L || !when(L)) return false;
    const b = L.b, def = G.maps[m];
    if (spotsOf(b).some(sp => sp.map === m)) return true;
    if (b.auto === m || b.door === m) return true;
    if (b.who && def && (def.npcs || []).some(n => n.id === b.who && (!n.cond || n.cond()))) return true;
    return false;
  };

  // ---------- drawing (field.js) ----------
  CH.draw = function (f, ctx, layer) {
    if (!G.state) return;
    const id = CH.current() || CH.next(), sc = id && scripts[id];
    if (sc) { const fn = layer === 'top' ? sc.o.drawTop : sc.o.draw; if (fn) { try { fn(f, ctx, CH.ctx(id)); } catch (e) { console.error(e); } } }
    if (layer !== 'top') return;
    const L = live();
    if (L && when(L) && G.top() === f) for (const sp of spotsOf(L.b)) {
      if (sp.map !== f.mapId || sp.quiet || (sp.off && sp.off(CH.ctx(L.id)))) continue;
      const at = sp.at, ic = typeof sp.icon === 'function' ? sp.icon(CH.ctx(L.id)) : sp.icon;
      if (ic) G.drawAlert(ctx, ic, at[0] * T - Math.round(f.cam.x), at[1] * T - Math.round(f.cam.y) + 4, f.t);
    }
    drawPoint(f, ctx);
  };
  // a bouncing arrow over something on the map ("this one"), while a question about it is up
  let pointAt = null;
  CH.point = (x, y) => { pointAt = x == null ? null : { x, y }; }; // world px (the top of the thing), or nothing
  CH.pointNpc = n => { pointAt = n ? { n } : null; };
  function drawPoint(f, ctx) {
    if (!pointAt) return;
    const p = pointAt.n ? { x: pointAt.n.x * T + (pointAt.n.ox || 0) + 12, y: pointAt.n.y * T + (pointAt.n.oy || 0) - 6 } : pointAt;
    const x = Math.round(p.x - f.cam.x), y = Math.round(p.y - f.cam.y) - 6 - Math.round(Math.abs(Math.sin(G.frame / 8)) * 4);
    ctx.fillStyle = '#10102a'; for (let i = 0; i < 6; i++) ctx.fillRect(x - 6 + i, y - 8 + i, 13 - 2 * i, 1);
    ctx.fillStyle = '#10102a'; ctx.fillRect(x - 3, y - 15, 7, 8);
    ctx.fillStyle = '#f8e060'; for (let i = 0; i < 5; i++) ctx.fillRect(x - 5 + i, y - 8 + i, 11 - 2 * i, 1);
    ctx.fillRect(x - 2, y - 14, 5, 7);
  }

  // ---------- Misiones ----------
  CH.parts = function (id) {
    const sc = scripts[id]; if (!sc) return null;
    const k = st().step[id] | 0, out = [];
    sc.beats.forEach((b, i) => { if (b.part) out.push({ icon: b.part, done: CH.done(id) || i < k }); });
    return out.length ? out : null;
  };

  // ---------- older saves ----------
  // A game from before the chapters: its errands map roughly onto the chapters that replaced them (CURRICULUM.md
  // section 7.2), and every chapter before the furthest one counts as done too (one path). Canelo stays yours, with
  // the tricks he knew. An older errand still going is let go (its chapter replaces it). Nothing is ever lost: the
  // words keep their stages. Runs once (G.state.ch.v).
  const MAP = { mercado: 'c4', pelota: 'c5', canelo: 'c7', saludos: 'c8', carta: 'c10', cansado: 'c10', picnic: 'c10', show: 'c10', cuenta: 'c10', sonidos: 'c10', flores: 'c10', fiestab: 'c10', fiesta: 'c10' };
  CH.migrate = function () {
    const s = G.state; if (!s) return;
    if (isObj(s.ch) && s.ch.v) return;
    const q = s.quests || (s.quests = {}), old = Object.keys(q).filter(k => !/^c\d+$/.test(k));
    const c = st(); c.v = CH.VERSION;
    if (!old.length && !(s.flags && s.flags.intro)) return; // a new game
    let far = -1;
    for (const k of old) if (q[k] === 'done' && MAP[k]) far = Math.max(far, CH.ids().indexOf(MAP[k]));
    if (s.flags && s.flags.petStart) far = Math.max(far, 0); // Canelo was already yours: chapter 1 is behind you
    for (let i = 0; i <= far; i++) q[CH.ids()[i]] = 'done';
    // older errands still going: the chapters replace them (the tail errands after chapter 10 go on as they were)
    for (const k of old) if (q[k] === 'active' && !(far >= 9 && (D().tailOrder || []).includes(k))) { delete q[k]; delete s.flags['e_' + k]; }
    if (s.bag && Array.isArray(s.bag.items)) s.bag.items = s.bag.items.filter(it => !it.q || q[it.q] === 'active');
    if (far >= 0) {
      s.flags.intro = true; s.flags.canelo = true; s.flags.petStart = true;
      const p = isObj(s.pet) ? s.pet : (s.pet = {}); if (!isObj(p.tricks)) p.tricks = {};
      p.tricks.ven = 3; if (far >= 2) p.tricks.sientate = 3;
      if (p.learning === 'ven' || p.learning === 'sientate') p.learning = null;
    }
    c.lastDoneSess = null;
  };

  // =====================================================================
  //  Helpers for the scripts (content/es/story-*.js)
  // =====================================================================
  const K = CH.K = {};
  K.T = TT;
  K.say = function* (who, ...pages) { yield G.say(pages, who ? { portrait: G.portraitOf(who), name: G.nameOf(who) || (who === 'canelo' ? 'Canelo' : null), who } : {}); };
  K.sayShow = function* (who, show, ...pages) { yield G.say(pages, Object.assign(who ? { portrait: G.portraitOf(who), name: G.nameOf(who), who } : {}, { show })); };
  K.tell = function* (...pages) { yield G.say(pages); };
  // a picture-card question: [answer, ...others] shuffled; the answer is what it practises. o: show, en, mask, noMic,
  // pic (all picture-only cards, no mic: hear it, pick the picture), look {id: 'text' | 'both' | 'pic'} (how a card
  // looks), img {id: picture} (a card's own picture), wrong(word) (what happens on a wrong pick),
  // point (an npc or {x, y} to point at on the map while it's up), intro / how (it introduces the answer)
  CH.ask = function* (who, prompt, en, answer, others, o = {}) {
    const ids = [answer].concat(others.filter(k => k !== answer && G.data.words[k])).sort(() => G.rand() - 0.5);
    const choices = ids.map(id => Object.assign({ word: id }, o.pic ? { pic: true } : {}, o.look && o.look[id] ? { look: o.look[id] } : {}, o.img && o.img[id] ? { img: o.img[id] } : {}));
    if (o.point) { if (o.point.x != null && o.point.n == null && o.point.id == null) CH.point(o.point.x, o.point.y); else CH.pointNpc(o.point); }
    try {
      return yield* G.ask(Object.assign({ prompt, en, choices, answer: ids.indexOf(answer), layout: 'cards', who }, o.show ? { show: o.show } : {}, o.mask ? { mask: o.mask } : {},
        o.pic || o.noMic ? { noMic: true } : {}, o.intro ? { intro: answer, how: o.how || 'show' } : {}, o.display ? { display: o.display } : {},
        o.wrong ? { wrongAct: (k, w) => { try { o.wrong(w); } catch (e) { console.error(e); } } } : {}));
    } finally { if (o.point) CH.point(null); }
  };
  K.ask = CH.ask;
  K.siNo = function* (who, prompt, en, yes, o = {}) { return yield* CH.ask(who, prompt, en, yes ? 'si' : 'no', [yes ? 'no' : 'si'], o); };
  K.fade = function* (a) { yield G.fadeTo(a, 0.1); };
  // Canelo on this map (added beside you if he isn't here); his state
  K.dog = function (f) {
    f = f || G.field; let n = f.npc('canelo');
    if (!n) {
      const def = (G.maps[f.mapId].npcs || []).find(d => d.id === 'canelo') || { id: 'canelo', npc: 'canelo', dir: 'down', talk: function* (f, n) { yield* G.chapters.caneloTalk(f, n); } };
      n = f.addNpc(Object.assign({}, def, { x: f.player.x, y: f.player.y + 1, cond: null })); n.ghost = true;
      if (G.pet) G.pet.place(f, n);
    }
    n.hidden = false;
    return n;
  };
  // the first steps of a walk for o to tile (x, y) over free ground (people don't block: ghosts), as a dirs string
  K.path = function (f, o, x, y) {
    const key = (a, b) => a + ',' + b, prev = new Map([[key(o.x, o.y), null]]), q = [[o.x, o.y]];
    const free = (a, b) => { if (a < 0 || b < 0 || a >= f.map.w || b >= f.map.h) return false; const t = G.TERRAIN[f.map.get(a, b)] || G.TERRAIN['.']; return !(t.block || t.wall) || (a === x && b === y); };
    for (let i = 0; i < q.length; i++) {
      const [a, b] = q[i]; if (a === x && b === y) break;
      for (const [d, dx, dy] of [['u', 0, -1], ['d', 0, 1], ['l', -1, 0], ['r', 1, 0]]) { const na = a + dx, nb = b + dy, k = key(na, nb); if (!prev.has(k) && free(na, nb)) { prev.set(k, [key(a, b), d]); q.push([na, nb]); } }
    }
    let k = key(x, y), s = ''; if (!prev.has(k)) return '';
    while (prev.get(k)) { s = prev.get(k)[1] + s; k = prev.get(k)[0]; }
    return s;
  };
  K.walk = function* (f, n, x, y, speed = 3) { if (!n) return; const was = n.ghost; n.ghost = true; n.busy = true; yield* f.walkNpc(n, K.path(f, n, x, y), speed); n.busy = false; n.ghost = was; n.home = [n.x, n.y]; };
  K.place = function (f, id, x, y, dir) { const n = f.npc(id); if (!n) return null; Object.assign(n, { x, y, ox: 0, oy: 0, home: [x, y], moving: false, slide: false }); if (dir) n.dir = dir; return n; };
  K.puff = (kind, wx, wy, o) => { if (G.pet && G.pet.puff) G.pet.puff(kind, wx, wy, o); };
  K.bark = (f, n) => { n = n || (f && f.npc('canelo')); if (G.pet) G.pet.sound('bark'); if (n) K.puff('ex', n.x * T + 12, n.y * T - 4, { life: 30 }); };
  K.heart = (f, n) => { n = n || (f && f.npc('canelo')); if (n) K.puff('heart', n.x * T + 12, n.y * T - 2, { life: 50, vy: -0.35 }); };
  K.sparkle = (f, x, y, k = 4) => { for (let i = 0; i < k; i++) G.fx.twinkle(x * T + 12 - Math.round(f.cam.x) + (Math.random() - 0.5) * 20, y * T + 8 - Math.round(f.cam.y) + (Math.random() - 0.5) * 14); };
  K.confetti = () => { G.fx.confetti(G.W / 2 - 70, 140, -1, 18); G.fx.confetti(G.W / 2 + 70, 140, 1, 18); };
  K.npcSay = (f, id, s, life = 80) => { const n = f.npc(id); if (n && f.amb) f.amb.fx.push({ kind: 'say', s, o: n, dx: 0, t: 0, life }); };
  // Canelo becomes yours (chapter 1): he follows you, knows "ven", sleeps at home
  K.adopt = function () { Object.assign(F(), { canelo: true, petStart: true }); const p = G.pet.state(); p.tricks.ven = 3; S.autosave(); };
  CH.caneloTalk = function* (f, n) { if (G.pet && G.pet.mine()) yield* G.pet.menu(f, n); };
})();

</script>
<script>/* content/es/story-c01-c10.js */
// ===== The story, chapters 1-10 (docs/CURRICULUM.md section 4): Canelo arrives, the cat, the morning, Don Pepe's game,
// the red ball, bread for the ducks, Canelo lost, Luna's school, the first evening, tired Tomás =====
// Each chapter is a list of beats for G.chapters (src/chapters.js: who / spot / spots / tap / auto / door / evening
// triggers; run(f, c) plays it). Every new word arrives in a one-unknown puzzle (G.intro.show / watch, or a find-it on
// the map) and is used again within a minute or two; older words come back in the questions people need answered.
// Lines: T('Spanish', 'English for grown-ups'); [id] marks a word (an unmet one is drawn as its picture only); a sound
// someone makes ("¡Miau!") is plain text when the child must pick who makes it. Mexican Spanish, present tense, short.
'use strict';
(function () {
  const CH = G.chapters, K = CH.K, T = K.T, TL = G.TILE, S = G.st;
  const F = () => G.state.flags;
  const say = K.say, sayShow = K.sayShow, tell = K.tell, ask = K.ask, siNo = K.siNo;
  const V = tag => G.MAPDATA.villa.pos[tag];
  const W = id => G.data.words[id];
  const found = id => () => G.intro.found(id);
  const tile = (x, y) => ({ x: x * TL + 12, y: y * TL });               // a point over a tile (for the pointing arrow)
  const ani = (f, kind) => { const a = G.animals && G.animals.find(kind, f); return a ? { x: a.x, y: a.y - 12, a } : null; };
  const pointAni = (f, kind) => { const p = ani(f, kind); return p ? { x: p.x, y: p.y } : null; };
  const catP = f => (f.amb && f.amb.cat ? { x: f.amb.cat.x * TL + 12, y: f.amb.cat.y * TL - 8 } : null);
  const BLUE = '#3068e0', GREEN = '#38b040', RED = '#e03028';
  const ball = col => ({ icon: 'pelota', col });

  // ---------- Canelo ----------
  const dog = f => K.dog(f);
  const dogAt = (f, x, y, dir) => { const n = dog(f); Object.assign(n, { x, y, ox: 0, oy: 0, home: [x, y], slide: false, moving: false }); if (dir) n.dir = dir; return n; };
  function* run(f, x, y, sp = 4) { yield* K.walk(f, dog(f), x, y, sp); }
  const toward = (n, p) => { const dx = p.x - n.x, dy = p.y - n.y; return Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : dy > 0 ? 'down' : 'up'; };
  // he races to you, hops up and a heart pops (understanding "¡ven!")
  function* come(f) {
    const n = dog(f), p = f.player;
    const c = [[p.x - 1, p.y], [p.x + 1, p.y], [p.x, p.y + 1], [p.x, p.y - 1]].find(([x, y]) => !f.blocked(x, y, n) && !f.exitAt(x, y));
    if (c) yield* K.walk(f, n, c[0], c[1], 4);
    n.dir = toward(n, p);
    yield* G.pet.play('wake'); K.heart(f, n);
  }
  const tries = (f, k) => { const n = dog(f); K.puff('txt', n.x * TL + 12, n.y * TL - 6, { s: k + '/3', life: 70 }); G.audio.sfx('select'); };
  const bark = f => K.bark(f, dog(f));
  // what a wrong card does to Canelo: hola -> a paw wave, guau -> a bark, ven -> he jumps up at you, the rest -> "?"
  const dogWrong = f => w => { const n = dog(f); if (w === 'hola') G.pet.anim(n, 'paw'); else if (w === 'guau') bark(f); else if (w === 'ven') { G.pet.anim(n, 'jump'); G.fx.shake = 6; } else G.pet.anim(n, 'huh'); };
  const meow = f => { if (G.ambient && G.ambient.sfx) G.ambient.sfx.meow(); const c = catP(f); if (c) K.puff('heart', c.x + 8, c.y, { life: 50, vy: -0.35 }); };

  // ---------- little pictures drawn on the map by the chapters ----------
  function tail(ctx, f, x, y, col, side = 1) { // a tail wagging out from behind something at tile (x, y)
    const sx = x * TL + 12 + side * 9 - Math.round(f.cam.x), sy = y * TL + 14 - Math.round(f.cam.y), w = Math.round(Math.sin(G.frame / 5) * 3);
    ctx.fillStyle = '#1a1420'; ctx.fillRect(sx - 2 + w, sy - 7, 5, 9); ctx.fillStyle = col; ctx.fillRect(sx - 1 + w, sy - 6, 3, 7); ctx.fillRect(sx, sy - 8, 1, 2);
  }
  function peekBall(ctx, f, x, y, col) { // a ball peeking out of a bush
    const sx = x * TL + 16 - Math.round(f.cam.x), sy = y * TL + 15 - Math.round(f.cam.y) + Math.round(Math.sin(G.frame / 20 + x));
    ctx.fillStyle = '#1a1420'; ctx.fillRect(sx - 4, sy - 3, 9, 7); ctx.fillRect(sx - 3, sy - 4, 7, 9);
    ctx.fillStyle = col; ctx.fillRect(sx - 3, sy - 3, 7, 6); ctx.fillRect(sx - 2, sy - 4, 5, 8); ctx.fillStyle = '#ffffff'; ctx.fillRect(sx - 2, sy - 2, 1, 1);
  }
  function butterfly(ctx, x, y) {
    const o = (G.frame >> 3) & 1; x = Math.round(x); y = Math.round(y);
    ctx.fillStyle = '#201828'; ctx.fillRect(x, y - 2, 1, 5);
    ctx.fillStyle = '#f8a020'; ctx.fillRect(x - 3 + o, y - 3, 3 - o, 3); ctx.fillRect(x + 1, y - 3, 3 - o, 3);
    ctx.fillStyle = '#f8d060'; ctx.fillRect(x - 2 + o, y, 2, 2); ctx.fillRect(x + 1, y, 2, 2);
  }
  function paws(ctx, f, from, to) { // paw prints along a line of tiles
    for (let k = 0; k <= 6; k++) {
      const u = k / 6, x = (from[0] + (to[0] - from[0]) * u) * TL + 12 + (k & 1 ? 4 : -4) - Math.round(f.cam.x), y = (from[1] + (to[1] - from[1]) * u) * TL + 14 - Math.round(f.cam.y);
      ctx.fillStyle = 'rgba(90,56,24,0.75)'; ctx.fillRect(x - 2, y, 4, 3); ctx.fillRect(x - 3, y - 2, 1, 1); ctx.fillRect(x - 1, y - 3, 1, 1); ctx.fillRect(x + 1, y - 3, 1, 1); ctx.fillRect(x + 2, y - 2, 1, 1);
    }
  }
  // someone who isn't on this map, standing in for a scene (Rosa in the bakery, Nico at school), then gone again
  function guest(f, id, x, y, dir) { let n = f.npc(id + '_g'); if (!n) n = f.addNpc({ id: id + '_g', npc: id, x, y, dir: dir || 'down', fixed: true, guest: true }); return n; }
  const unguest = (f, id) => f.removeNpc(id + '_g');
  // put a townsperson somewhere for a chapter (they stay there while it needs them)
  function hold(f, id, x, y, dir) {
    const n = f.npc(id); if (!n) return null;
    if (n.x !== x || n.y !== y) Object.assign(n, { x, y, ox: 0, oy: 0, moving: false });
    Object.assign(n, { home: [x, y], wander: 0, route: null, dir: dir || n.dir });
    if (n.amb) n.amb.follow = false;
    return n;
  }

  CH.script('c2', [
    { auto: 'villa', run: function* (f, c) { // outside: Canelo chases a butterfly; call him back

    } },
    { who: 'nico', run: function* (f, c) { // Nico; the cat on the fence: el gato, miau
