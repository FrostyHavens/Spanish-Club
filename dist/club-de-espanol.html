      yield* ask('mama', '¿Y la [pelota]?', 'Where was his ball?', 'fuente', ['parque', 'granja'], { show: 'pelota' });
      yield* ask('mama', '¿Y el [hueso]?', 'And his bone?', 'banco', ['fuente', 'granja'], { show: 'hueso' });
      yield* ask('mama', '¿Y Canelo?', 'And Canelo himself?', 'granja', ['parque', 'fuente'], { show: 'perro' });
      G.errands.bag.take('hueso', { q: 'c7' }); G.errands.bag.take('pelota', { q: 'c7' });
      yield* ask(null, 'Canelo: ¡...!', 'His ball is back! What do you throw?', 'pelota', ['hueso', 'ven'], { point: n });
      yield* G.pet.play('fetch'); K.heart(f, n);
    } },
  ], {
    lost: c => c.data.lost === 1,
    stage(f, c) {
      if (f.mapId !== 'villa') return;
      const k = c.step;
      if (k >= 3 && k <= 4) hold(f, 'nico', 16, 21, 'up');
      if (k >= 5 && k <= 5) hold(f, 'lucia', 18, 16, 'down');
      if (k >= 7 && k <= 7) hold(f, 'tomas', 20, 12, 'down');
    },
    draw(f, ctx, c) { if (f.mapId === 'villa' && c.data.paws) paws(ctx, f, [17, 17], [20, 19]); },
  });

  // =====================================================================
  //  C8 · La escuela de Luna  (morning; Mamá, then Profesora Luna)  escuela, bien, ¿cómo estás?
  // =====================================================================
  function* asked(f, who, name, en) { // ask a friend ¿cómo estás?, then how they are
    yield* ask(who, 'Tú: ¿...?', 'Ask ' + name + ' how ' + (who === 'rosa' || who === 'sofia' ? 'she is' : 'he is') + '!', 'comoestas', ['hola', 'gracias']);
    yield* sayShow(who, 'bien', T('¡[bien]! ¡Muy [bien]!', 'Fine! Very well! (thumbs up)'));
    yield* ask(who, '¿Cómo está ' + name + '?', 'How is ' + name + '?', 'bien', [who === 'rosa' ? 'hola' : 'si', 'no']);
  }
  CH.script('c8', [
    { who: 'mama', run: function* () { // ¡La escuela!
      const w = PLAZA_WAYS;
      yield* G.intro.find('escuela', { who: 'mama', map: 'villa', at: w.escuela.slice(0, 2), wrong: [w.parque.slice(0, 2), w.granja.slice(0, 2)], pics: [w.escuela, w.parque, w.granja],
        prompt: '¡La [escuela]! ¡Profesora Luna!', en: 'The school! Profesora Luna is waiting for you. (which way? out on the plaza)' });
    } },
    { auto: 'escuela', part: 'escuela', run: function* (f) { // the school; bien, ¿cómo estás?
      if (!G.intro.found('escuela')) { const s = G.state.finds.escuela; if (s) s.found = true; if (G.intro.meet('escuela', 'find', { who: 'mama' })) yield 40; }
      yield* CH.banner('escuela', ['parque', 'granja']);
      if (G.hearts) yield* G.hearts.greet('luna');
      const nico = guest(f, 'nico', 5, 4, 'up');
      yield* say('luna', T('¡Nico! ¿[comoestas]?', 'Nico! How are you?'));
      yield* sayShow('nico', 'bien', T('¡[bien]!', 'Fine! (thumbs up)'));
      yield* say('luna', T('Y {name}... ¿[comoestas]?', 'And you, {name}... how are you?'));
      yield* ask('luna', 'Luna: ¿[comoestas]?', 'How are you? (a thumbs-up face)', 'bien', ['hola', 'no'], { intro: true, how: 'overheard', look: { bien: 'text', hola: 'both', no: 'both' }, show: 'bien' });
      yield* sayShow('luna', 'bien', T('¡[bien]! ¡Qué bueno!', 'Fine! Great!'));
      yield* say('luna', T('¡Ahora tú! ¡Pregúntale a Canelo!', 'Now you! Ask Canelo how he is!'));
      const n = dog(f);
      yield* ask(null, 'Tú: ¿...?', 'Ask Canelo how he is', 'comoestas', ['hola', 'gracias'], { intro: true, how: 'overheard', look: { comoestas: 'text', hola: 'both', gracias: 'both' }, show: { icon: 'pregunta' } });
      bark(f); K.heart(f, n); yield* G.pet.play('dance');
      yield* ask('luna', '¿Cómo está Canelo?', 'How is Canelo?', 'bien', ['no', 'hola'], { point: n });
      yield* say('luna', T('¡Pregunta a tus amigos! Nico, Sofía y Rosa.', 'Ask three friends how they are: Nico, Sofía and Rosa!'));
      yield G.questCard('c8');
      unguest(f, 'nico'); void nico;
    } },
    { who: 'nico', bubble: { icon: 'pregunta' }, part: 'pregunta', run: function* (f) { yield* asked(f, 'nico', 'Nico'); } },
    { who: 'sofia', bubble: { icon: 'pregunta' }, part: 'pregunta', run: function* (f) {
      yield* asked(f, 'sofia', 'Sofía');
      yield* ask('sofia', 'Sofía: ¿[comoestas]?', 'She asks you back: how are you?', 'bien', ['pelota', 'no']);
      const n = dog(f); G.pet.anim(n, 'huh');
      yield* ask(null, '¿Qué quiere?', 'Canelo wants something! What?', 'pelota', ['hueso', 'sientate'], { point: n });
      yield* G.pet.play('fetch');
    } },
    { who: 'rosa', bubble: { icon: 'pregunta' }, part: 'pregunta', run: function* (f) { yield* asked(f, 'rosa', 'Rosa'); yield* say('rosa', T('¡Luna! ¡La [escuela]!', 'Back to Luna at the school!')); } },
    { who: 'luna', run: function* () { // three friends: a gold star
      yield* say('luna', T('¡Tus amigos están [bien]! ¡Muy bien, {name}!', 'Your friends are fine! Very good, {name}!'));
      yield* ask('luna', 'Luna: ¡Para ti!', 'A gold star sticker for you! What do you say?', 'gracias', ['hola', 'no'], { show: { icon: 'estrella' } });
      yield* say('luna', T('¡Hasta pronto!', 'See you soon!'));
    } },
  ], {
    stage(f, c) {
      if (f.mapId !== 'villa') return;
      if (c.step === 2) hold(f, 'nico', 16, 20, 'up');
    },
  });

  // =====================================================================
  //  C9 · ¡Buenas noches, Canelo!  (Mamá, home, the first evening)  agua, cama, buenas noches
  // =====================================================================
  CH.script('c9', [
    { evening: 'dusk', run: function* (f) { // Canelo's empty bowl: agua
      f.petAwake = true; G.pet.state().sleep = false;
      const n = dog(f); dogAt(f, 2, 4, 'left');
      G.pet.sound('pant'); yield 30; G.pet.sound('pant');
      yield* sayShow('mama', 'agua', T('¡[agua]! Para Canelo...', 'Water! For Canelo... (she fills his bowl)'));
      yield* ask('mama', '¿Qué quiere Canelo?', 'What does Canelo want?', 'agua', ['hueso', 'pan'], { intro: true, how: 'show', look: { agua: 'text', hueso: 'both', pan: 'both' }, show: 'agua' });
      yield* G.pet.play('drink');
      G.pet.sound('pant'); G.pet.anim(n, 'huh');
      yield* ask(null, '¿...?', 'He looks at you, still panting. What does he want?', 'agua', ['hueso', 'pelota'], { point: n });
      yield* G.pet.play('drink'); K.heart(f, n);
    } },
    { evening: 'dusk', run: function* (f) { // ¡Buenas noches! (Mamá, as you get ready for bed)
      yield* sayShow('mama', 'buenasnoches', T('¡[buenasnoches], {name}!', 'Good night, {name}! (the moon is out)'));
      yield* ask('mama', 'Mamá: ¡...!', 'Answer Mom!', 'buenasnoches', ['buenosdias', 'ven'], { intro: true, how: 'show', look: { buenasnoches: 'text', buenosdias: 'both', ven: 'both' }, show: { icon: 'noche' } });
    } },
    { evening: 'dusk', run: function* (f, c) { // ¡a la cama! (find your bed), Canelo hops off: tell him
      const n = dog(f);
      yield* say('mama', T('Canelo, ¡a la [cama]!', 'Canelo, to bed!'));
      yield* K.walk(f, n, 7, 5, 3); n.dir = 'left';
      yield* G.intro.find('cama', { who: 'mama', map: 'casa', at: [7, 2], wrong: [[3, 3], [2, 1]], prompt: '¿Y tu [cama], {name}?', en: 'And your bed, {name}? (tap it)' });
      f.locked = false; // (the evening keeps the house locked: tap your bed now, then it locks again)
      while (!(G.intro.found('cama') && !f.locked && G.top() === f && !f.player.moving)) yield 1;
      f.route = null; f.locked = true;
      yield 10;
      f.petAwake = true; G.pet.state().sleep = false;
      dogAt(f, 5, 4, 'up'); G.pet.anim(n, 'wake'); bark(f); yield 20;
      yield* ask(null, '¡Canelo! ¡...!', 'Canelo hopped off his cushion, wide awake! Tell him where to go.', 'cama', ['ven', 'pelota'], { point: tile(7, 5) });
      yield* K.walk(f, n, 7, 5, 3); n.dir = 'left'; G.pet.state().sleep = true; G.pet.sound('snore');
      c.data.bed = 1;
      yield 30;
      yield* ask(null, 'Canelo: ...¡...!', 'Canelo yawns. Say good night to him!', 'buenasnoches', ['buenosdias', 'agua'], { point: dog(f) });
      G.pet.sound('snore');
    } },
    { evening: 'dawn', run: function* (f) { // the next morning
      const n = dog(f);
      yield* ask(null, '¿...?', 'Canelo stretches on his cushion. Where did he sleep?', 'cama', ['hueso', 'pelota'], { point: tile(7, 5) });
      yield* ask(null, 'Canelo: ¡...!', 'Canelo hops up: the sun is up! Say it!', 'buenosdias', ['buenasnoches', 'cama'], { show: { icon: 'sol' }, point: n });
      bark(f); dogAt(f, 2, 4, 'left'); G.pet.sound('pant');
      yield* ask(null, '¿...?', 'His bowl is empty again. What does he want?', 'agua', ['hueso', 'pelota'], { point: tile(1, 4) });
      yield* say('mama', T('¡El [agua]... de la [fuente]!', 'Water from the fountain! Fill his bowl every day.'));
    } },
  ]);

  // =====================================================================
  //  C10 · Tomás está cansado  (Tomás by the plaza bench, Rosa's house, the school, the paddock)
  //        cansado, carta, casa, caballo, adiós
  // =====================================================================
  const TOMAS_BENCH = [21, 12], PADDOCK = [41, 12];
  const bag = () => G.errands.bag;
  CH.script('c10', [
    { who: 'tomas', bubble: 'cansado', run: function* (f) { // ¿cómo estás? cansado
      yield* ask('tomas', 'Tú: ¿...?', 'Ask Tomás how he is!', 'comoestas', ['gracias', 'hola']);
      yield* sayShow('tomas', 'cansado', T('Mmm... [cansado:cansado]...', 'Mmm... tired... (he yawns)'));
      yield* ask('tomas', '¿Cómo está Tomás?', 'How is Tomás?', 'cansado', ['bien', 'no'], { intro: true, how: 'show', look: { cansado: 'text', bien: 'both', no: 'both' }, show: 'cansado' });
      const n = dog(f); G.pet.anim(n, 'sit');
      yield* ask(null, '¿Y Canelo?', 'Canelo flops down and yawns too. How is he?', 'cansado', ['bien', 'no'], { point: n });
      yield* ask(null, '¿Qué quiere Tomás?', 'He fans himself and licks his lips. What does he want?', 'agua', ['hueso', 'pelota']);
      yield* say('tomas', T('¡[agua]... de la [fuente]!', 'Water... from the fountain!'));
    } },
    { spot: { map: 'villa', at: V('fuente'), icon: 'agua' }, run: function* () {
      yield* CH.banner('fuente', ['banco', 'parque']);
      bag().add('agua', { q: 'c10' });
      yield* tell(T('¡[agua]! ¡Para Tomás!', 'Water! Take it to Tomás.'));
    } },
    { who: 'tomas', bubble: 'agua', part: 'agua', run: function* (f) { // una carta; three to deliver; the first: la casa de Rosa
      bag().take('agua', { q: 'c10' }); G.audio.sfx('pop');
      if (G.hearts) G.hearts.add('tomas', 1, 'care');
      yield* say('tomas', T('¡Ahh! ¡[gracias], {name}!', 'Ahh! Thank you, {name}!'));
      yield* G.intro.show('carta', { who: 'tomas', prompt: '¡Mira! Una [carta].', en: 'Look! A letter.', known: ['pan', 'pelota'] });
      yield* siNo('tomas', '¿Me ayudas?', 'Will you help me deliver them?', true);
      for (const to of ['casa', 'escuela', 'granja']) bag().add('carta', { q: 'c10', to });
      yield* G.intro.find('casa', { who: 'tomas', map: 'villa', at: [5, 7], wrong: [[17, 5], [29, 7]], pics: [[5, 7, 'casa'], [17, 5, 'escuela'], [29, 7, 'panaderia']],
        prompt: 'Esta: para la [casa] de Rosa.', en: 'The first one: for Grandma Rosa\'s house! (which one? tap it)' });
    } },
    { auto: 'villa', when: found('casa'), part: 'casa', run: function* (f) { // Rosa's letter; an apple
      yield* CH.banner('casa', ['escuela', 'parque']);
      hold(f, 'rosa', 6, 7, 'left');
      yield* say('rosa', T('¿Para mí?', 'For me?'));
      yield* ask('rosa', '¿Qué es?', 'What is it?', 'carta', ['pan', 'hueso'], { show: { icon: 'sobre' } });
      bag().take('carta', { q: 'c10', to: 'casa' });
      yield* say('rosa', T('¡Mi [carta]! Y para ti...', 'My letter! And for you...'));
      yield* ask('rosa', 'Rosa: ¡Para ti!', 'She gives you an apple. What do you say?', 'gracias', ['hola', 'no'], { show: 'manzana' });
      bag().add('manzana', { q: 'c10' });
      yield* tell(T('Y esta: para la [escuela].', 'The second letter: for the school.'));
    } },
    { auto: 'escuela', part: 'escuela', run: function* () { // Luna's letter
      if (G.hearts) yield* G.hearts.greet('luna');
      yield* say('luna', T('¿Una [carta]? ¿Para mí?', 'A letter? For me?'));
      yield* ask('luna', '¿Qué es?', 'What is it?', 'carta', ['pelota', 'pan'], { show: { icon: 'sobre' } });
      bag().take('carta', { q: 'c10', to: 'escuela' });
      yield* say('luna', T('¡[gracias]!', 'Thank you!'));
      yield* tell(T('Y esta: para la [granja].', 'The third letter: for the farm.'));
    } },
    { spot: { map: 'villa', at: PADDOCK, quiet: true }, part: 'granja', run: function* (f) { // the horse eats the letter!
      const h = G.animals.find('caballo', f);
      if (h) { h.x = 41 * TL + 14; h.y = 13 * TL + 18; h.flip = true; h.st = 'idle'; h.t = 400; G.animals.react(f, h); h.react = 60; G.animals.cry('caballo'); }
      yield* tell(T('¡Iiijii! ...¡Ñam, ñam!', 'Neigh! ...Munch, munch! The horse ate the letter!'));
      bag().take('carta', { q: 'c10', to: 'granja' });
      hold(f, 'nico', 40, 11, 'right');
      yield* G.intro.show('caballo', { who: 'nico', prompt: '¡Ja, ja! ¡El [caballo]!', en: 'Ha ha! The horse!', known: ['cabra', 'pato'] });
      const hp = () => (h ? { x: h.x, y: h.y - 22 } : tile(41, 13));
      yield* ask('nico', '¿Quién come cartas?', 'Who eats letters?', 'caballo', ['cabra', 'perro'], { point: hp() });
      yield* ask('nico', '¿Qué quiere el [caballo]?', 'He sniffs your bag. What does the horse want?', 'manzana', ['hueso', 'pan'], { point: hp() });
      bag().take('manzana', { q: 'c10' }); G.audio.sfx('pop'); G.animals.cry('caballo');
      yield* tell(T('¡Ñam! ...¡La [carta]!', 'Munch! ...He drops the letter!'));
      const goat = G.animals.find('cabra', f);
      if (goat) { goat.x = 42 * TL + 10; goat.y = 13 * TL + 20; goat.react = 30; goat.st = 'idle'; goat.t = 300; G.animals.cry('cabra'); }
      yield* ask('nico', '¿Quién es?', 'Now someone nibbles the letter! Who is it?', 'cabra', ['caballo', 'perro'], { point: goat ? { x: goat.x, y: goat.y - 16 } : tile(42, 13) });
      const n = dog(f);
      yield* ask(null, 'Canelo... ¡...!', 'Call Canelo: he shoos the goat away!', 'ven', ['sientate', 'hola'], { point: n, wrong: dogWrong(f) });
      yield* come(f); bark(f);
      if (goat) { goat.st = 'walk'; goat.tx = 44 * TL; goat.ty = 16 * TL + 18; }
      yield* say('nico', T('¡La [carta]... a la [granja]! ¡Listo!', 'The letter goes in the barn\'s mailbox. Done! Back to Tomás!'));
    } },
    { who: 'tomas', bubble: true, run: function* (f) { // rested: bien; adiós
      yield* ask('tomas', 'Tú: ¿...?', 'Ask Tomás how he is now!', 'comoestas', ['hola', 'gracias']);
      yield* sayShow('tomas', 'bien', T('¡[bien]! ¡Muy [bien]!', 'Fine! Very well!'));
      yield* ask('tomas', '¿Cómo está Tomás?', 'How is Tomás now?', 'bien', ['cansado', 'no']);
      yield* say('tomas', T('¡[gracias], {name}! ¡Eres un{/a} gran carter{o/a}!', 'Thank you, {name}! You\'re a great mail carrier!'));
      yield* sayShow('tomas', 'adios', T('¡[adios]!', 'Goodbye! (he waves as he goes)'));
      const t = f.npc('tomas');
      yield* ask('tomas', 'Tomás: ¡[adios]!', 'He waves goodbye. Wave back!', 'adios', ['hola', 'gracias'], { intro: true, how: 'watch', look: { adios: 'text', hola: 'both', gracias: 'both' }, show: 'adios' });
      const def = G.maps.villa.npcs.find(d => d.id === 'tomas');
      if (t && def) { Object.assign(t, { route: def.route, _tired: false, wander: 0 }); if (t.amb) t.amb.hold = 30; }
      K.npcSay(f, 'tomas', '¡Adiós!', 100);
      const nico = f.npc('nico');
      if (nico) { Object.assign(nico, { x: 19, y: 13, ox: 0, oy: 0, dir: 'left' }); }
      yield 30;
      yield* ask('nico', 'Nico: ¡...!', 'Nico walks off, waving. What does he say?', 'adios', ['hola', 'bien'], { point: nico || undefined });
      if (nico) { Object.assign(nico, { home: [15, 15], wander: 2 }); K.npcSay(f, 'nico', '¡Adiós!', 90); }
    } },
  ], {
    stage(f, c) {
      if (f.mapId !== 'villa') return;
      if (c.step <= 6) { const t = hold(f, 'tomas', ...TOMAS_BENCH, 'down'); if (t) t._tired = true; }
    },
  });
})();

</script>
<script>/* src/day.js */
// ===== The end of the day: a sunset over Villa Sol after a good long play, then home to bed and a new morning =====
// G.sessionTime counts the seconds of play since this game was started or opened (it is never saved). After
// G.day.SUNSET_AT the town warms to a sunset, its windows light up and a moon bubble floats over the home door.
// Going home then plays the evening: Mamá's "¡Buenas noches!", the "Hoy" card (the words met or grown today, as
// pictures, and the stars earned today), the night sky, a sunrise and Mamá's "¡Buenos días!"; the game is saved
// and the clock starts again. Nothing is forced: staying out to play changes nothing.
// "Today" is what changed since the session began (a snapshot of the words' stages and the stars), so the save
// format doesn't change. G.debug.sunsetAt (seconds) brings the sunset sooner, for tests and curious grown-ups.
'use strict';
(function () {
  const DY = G.day = {};
  DY.SUNSET_AT = 18 * 60; // seconds of play before the sun goes down
  G.debug = G.debug || {};
  G.sessionTime = 0;
  const HOME = 'casa', TOWN = 'villa', BED = [6, 3]; // where you wake up: beside your bed at home
  const T = (t, en) => ({ t, en });
  let base = null, today = [], glow = 0, bringAt = null;

  // ---------- the session: since the game was started or opened, or since this morning ----------
  function newDay() {
    const st = {}; for (const id in G.data.words) st[id] = G.st.stage(id); // each word's stage this morning (words.js)
    base = { state: G.state, st, stars: G.state.stars | 0, said: G.st.micStars() };
    today = []; G.sessionTime = 0; glow = 0; bringAt = null;
  }
  // an evening chapter is next (chapters.js: C9): the sun goes down sec seconds from now (or sooner, as it was)
  DY.bring = sec => { const at = G.sessionTime + sec; if (bringAt == null || at < bringAt) bringAt = at; };
  DY.brought = () => bringAt != null;
  DY.sunsetAt = () => Math.min(G.debug && G.debug.sunsetAt != null ? G.debug.sunsetAt : DY.SUNSET_AT, bringAt == null ? 1e9 : bringAt);
  DY.over = () => !!(G.state && G.state.flags.intro) && G.sessionTime >= DY.sunsetAt();
  // words met or grown a stage today (in that order), stars earned today and how many of them were speaking stars
  const sweep = () => { for (const id in G.state.words) if (today.indexOf(id) < 0 && G.st.stage(id) > (base.st[id] | 0)) today.push(id); };
  DY.today = () => base && base.state === G.state && (sweep(), 1) ? { words: today.slice(), stars: Math.max(0, (G.state.stars | 0) - base.stars), said: Math.max(0, (G.st.micStars()) - base.said) } : { words: [], stars: 0, said: 0 };
  // core.js, every frame: the clock runs while a game is on (a map is in the scene stack, maybe under a talk)
  DY.step = function () {
    const f = G.field;
    if (!f || !G.state || G.scenes.indexOf(f) < 0) return;
    if (!base || base.state !== G.state) newDay(); // a new game, or one just opened: a new session
    G.sessionTime += 1 / 60;
    if (G.words) G.words.step(); // the word model's play clock (words.js)
    if (G.frame % 30 === 0) sweep();
    glow = G.clamp(glow + (DY.over() ? 1 / 480 : -1 / 30), 0, 1); // the sun goes down over ~8 s
  };
  DY.glow = () => glow;
  // the home door, while it has its moon bubble (hint.js points there too)
  DY.homeDoor = f => (f && f.mapId === TOWN && DY.over() ? G.MAPDATA.villa.pos.casaDoor : null);

  // ---------- drawing over Villa Sol (field.js, after the people, before their bubbles) ----------
  DY.drawField = function (ctx, f, cx, cy) {
    if (f.mapId !== TOWN || glow <= 0) return;
    const TS = G.TILE;
    ctx.save();
    // a warm wash: orange light from the west at the top, a dusky violet below
    ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = glow;
    const g = ctx.createLinearGradient(0, 0, G.W, G.H);
    g.addColorStop(0, '#ffb070'); g.addColorStop(0.55, '#f09898'); g.addColorStop(1, '#9c84d0');
    ctx.fillStyle = g; ctx.fillRect(0, 0, G.W, G.H);
    ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = glow * 0.3;
    const h = ctx.createRadialGradient(0, 0, 10, 0, 0, 260);
    h.addColorStop(0, '#ff9840'); h.addColorStop(1, 'rgba(255,152,64,0)');
    ctx.fillStyle = h; ctx.fillRect(0, 0, G.W, G.H);
    ctx.restore();
    // windows light up, lamps glow
    const x0 = Math.floor(cx / TS), y0 = Math.floor(cy / TS);
    ctx.save(); ctx.globalAlpha = glow;
    for (let y = y0; y <= y0 + Math.ceil(G.H / TS) + 1; y++) for (let x = x0; x <= x0 + Math.ceil(G.W / TS) + 1; x++) {
      const c = f.map.get(x, y), sx = x * TS - cx, sy = y * TS - cy;
      if (c === 'N') { // the window of a house wall (tiles.js): two lit panes each side of the cross
        ctx.fillStyle = 'rgba(255,200,96,0.35)'; ctx.fillRect(sx + 6, sy + 2, 12, 14);
        for (const [px, py] of [[8, 4], [13, 4], [8, 10], [13, 10]]) { ctx.fillStyle = '#ffd868'; ctx.fillRect(sx + px, sy + py, 3, 4); ctx.fillStyle = '#fff4c0'; ctx.fillRect(sx + px, sy + py, 1, 1); }
      } else if (c === 'L') { // a lamp post
        const r = ctx.createRadialGradient(sx + 12, sy + 2, 1, sx + 12, sy + 2, 16);
        r.addColorStop(0, 'rgba(255,236,150,0.85)'); r.addColorStop(1, 'rgba(255,200,96,0)');
        ctx.fillStyle = r; ctx.fillRect(sx - 6, sy - 14, 36, 34);
      }
    }
    ctx.restore();
    const d = DY.homeDoor(f); if (d) moonBubble(ctx, d[0] * TS - cx + 12, d[1] * TS - cy - 30, f.t);
  };
  // a crescent moon (cached), drawn r px round
  const moon = r => G.cached('day_moon' + r, r * 2 + 2, r * 2 + 2, c => {
    c.fillStyle = '#f8e478'; c.beginPath(); c.arc(r + 1, r + 1, r, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff8c8'; c.beginPath(); c.arc(r - r * 0.25, r + 1 - r * 0.2, r * 0.45, 0, Math.PI * 2); c.fill();
    c.globalCompositeOperation = 'destination-out'; c.beginPath(); c.arc(r + 1 + r * 0.55, r + 1 - r * 0.4, r * 0.85, 0, Math.PI * 2); c.fill();
  });
  // a night-blue thought bubble with the moon in it, trailing down to the door's sign: "time to go home"
  function moonBubble(ctx, x, y, t) {
    const b = Math.round(Math.sin(t / 14) * 2); y += b;
    const puffs = [[-8, 2, 7], [0, -3, 9], [8, 2, 7], [0, 5, 7]], blob = (grow, col) => { ctx.fillStyle = col; for (const [dx, dy, r] of puffs) { ctx.beginPath(); ctx.arc(x + dx, y + dy, r + grow, 0, Math.PI * 2); ctx.fill(); } };
    blob(2, '#101030'); blob(1, '#e8ecff'); blob(0, '#283078');
    for (const [dx, dy, r] of [[7, 15, 2.5], [10, 21, 1.5]]) { ctx.fillStyle = '#e8ecff'; ctx.beginPath(); ctx.arc(x + dx, y + dy - b / 2, r + 1, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#283078'; ctx.beginPath(); ctx.arc(x + dx, y + dy - b / 2, r, 0, Math.PI * 2); ctx.fill(); }
    ctx.drawImage(moon(6), Math.round(x - 9), Math.round(y - 6));
    const tw = (t >> 4) % 3;
    ctx.fillStyle = '#fff8c0';
    [[6, -5], [9, 3], [3, 6]].forEach(([dx, dy], k) => { if (k !== tw) { ctx.fillRect(x + dx, y + dy, 1, 1); } else { ctx.fillRect(x + dx - 1, y + dy, 3, 1); ctx.fillRect(x + dx, y + dy - 1, 1, 3); } });
  }

  // ---------- home at sunset: the evening, the night and a new morning ----------
  // maps.js runs this when you come home (and when you talk to Mamá at home after sunset).
  DY.evening = function* (f) {
    if (!f || f.mapId !== HOME || f.evening || !DY.over()) return;
    f.evening = true; f.locked = true; f.banner = null; // this field's own guard: it can't start twice
    while (G.fade.a > 0) yield 1;
    yield 12;
    f.player.dir = 'up';
    const mama = { portrait: G.portraitOf('mama'), name: G.nameOf('mama'), who: 'mama' }, met = id => G.st.seen(id);
    // the story's evening (chapters.js: C9 teaches agua, cama and buenas noches here), else Mamá's good night
    if (!(G.chapters && (yield* G.chapters.evening('dusk', f)))) {
      if (met('buenasnoches')) yield* G.chapters.ask('mama', '¡...!', 'The moon is out: Mom says good night. Say it back!', 'buenasnoches', met('buenosdias') ? ['buenosdias'].concat(met('cama') ? ['cama'] : met('hola') ? ['hola'] : []) : ['hola'], { show: { icon: 'noche' } });
      else yield G.say(T('¡[buenasnoches], {name}!', 'Good night, {name}!'), mama);
    }
    yield DY.todayCard();
    G.audio.play('inn', true); // a little lullaby
    yield G.fadeTo(1, 0.03, '#080a26');
    Object.assign(f.player, { x: BED[0], y: BED[1], dir: 'left', ox: 0, oy: 0 }); f.snapCam();
    if (G.pet) G.pet.night(f); // Canelo curls up on his cushion (pet.js)
    yield DY.night(); // the night sky, then the sunrise (it fades itself in and out)
    newDay(); if (G.words) G.words.newSession('night'); // a new day for the word model too: yesterday's words come back
    G.audio.play(f.def.music || 'town', true);
    yield G.fadeTo(0, 0.04, '#fff2d0'); // out of the morning light (the night left the fade there)
    if (G.pet) G.pet.morning(f); // and Canelo hops up
    yield 16;
    // the morning: the story's (C9's last beat), else Mamá's good morning under the sun, once buenos días is met
    if (!(G.chapters && (yield* G.chapters.evening('dawn', f)))) {
      if (met('buenosdias')) {
        const plain = G.words.list(2).filter(id => G.data.words[id].topic !== 'saludos' && G.iconDrawn(id)).sort(() => G.rand() - 0.5);
        const others = met('buenasnoches') ? ['buenasnoches'].concat(plain.slice(0, 1)) : plain.slice(0, 2);
        if (others.length) yield* G.chapters.ask('mama', '¡...!', 'The sun is up: Mom says good morning. Say it back!', 'buenosdias', others, { show: { icon: 'sol' } });
      } else yield G.say(T('¡{name}!', '{name}! (a new day)'), mama);
    }
    f.locked = false; f.evening = false;
    if (G.st.autosave) G.st.autosave();
  };

  // ---------- "Hoy": today's words, as pictures, and today's stars ----------
  // Pictures pop in one by one, each said aloud; then the stars. Tap a picture (or left / right) to hear it
  // again; a tap anywhere else, A or B goes on. A tap while they're still coming shows them all at once.
  function star(ctx, x, y, r) { // a gold star centred on x, y
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
    ctx.closePath(); ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = '#2a1404'; ctx.stroke();
    ctx.fillStyle = '#f8c820'; ctx.fill();
    ctx.save(); ctx.clip(); ctx.fillStyle = '#fff090'; ctx.fillRect(x - r, y - r, r * 2, r * 0.9); ctx.restore();
  }
  class TodayCard {
    constructor(w) {
      G.toastT = 0; this.transparent = true; this.w = w; this.t = 0; this.sel = -1; this.shown = 0; this.wait = 0; this.popT = [];
      const d = DY.today(); this.words = d.words; this.stars = d.stars; this.said = Math.min(d.said, d.stars); this.starsShown = 0; this.starT = [];
      const n = this.words.length, big = n <= 10;
      this.L = { big, s: big ? 32 : 16, step: big ? 44 : 24, per: big ? 5 : 10, gap: big ? 12 : 8, rows: Math.ceil(n / (big ? 5 : 10)) };
    }
    onEnter() { G.audio.sfx('buff'); }
    nStars() { return Math.min(this.stars, 10); }
    // the card, sized to what it holds: the title, the pictures (or your face), the word said, the stars
    box() {
      const L = this.L, pics = this.words.length ? L.rows * (L.s + L.gap) : 58, h = 34 + pics + 22 + (this.stars ? 28 : 0) + 6;
      return { x: 44, y: Math.round((G.H - h) / 2), w: G.W - 88, h, pics };
    }
    // tap areas (shared with draw): one per picture
    cells() {
      const L = this.L, n = this.words.length, b = this.box();
      return this.words.map((id, k) => {
        const r = Math.floor(k / L.per), c = k % L.per, inRow = Math.min(L.per, n - r * L.per), x0 = Math.round(G.W / 2 - (inRow * L.step - (L.step - L.s)) / 2);
        return { x: x0 + c * L.step, y: b.y + 38 + r * (L.s + L.gap), w: L.s, h: L.s, s: L.s / 16 };
      });
    }
    revealed() { return this.shown >= this.words.length && this.starsShown >= this.nStars(); }
    say(k) { this.sel = k; G.speak(G.baseForm(this.words[k])); }
    hintXY() { if (!this.revealed() || this.wait < 30) return null; const b = this.box(); return [b.x + b.w - 13, b.y + b.h - 9]; }
    update() {
      this.t++;
      if (this.t < 16) return;
      if (!this.revealed()) { // a picture every 50 frames (said aloud), then the stars quickly
        if (this.shown < this.words.length) { if ((this.t - 16) % 50 === 0) { this.popT[this.shown] = this.t; this.say(this.shown); this.shown++; G.audio.sfx('select'); } }
        else if (this.t % 7 === 0) { this.starT[this.starsShown++] = this.t; G.audio.sfx('coin'); }
        if (G.input.p('A') || G.input.p('B') || G.input.tap()) { // all at once
          while (this.shown < this.words.length) this.popT[this.shown++] = this.t;
          while (this.starsShown < this.nStars()) this.starT[this.starsShown++] = this.t;
          this.wait = 0;
        }
        return;
      }
      this.wait++;
      const n = this.words.length, d = G.input.repDir(14, 6);
      if (n && (d === 'left' || d === 'right')) { this.say(((this.sel < 0 ? (d === 'left' ? 0 : -1) : this.sel) + (d === 'left' ? -1 : 1) + n) % n); G.audio.sfx('cursor'); }
      if (G.input.p('C') && this.sel >= 0) this.say(this.sel);
      if (this.wait < 20) return;
      const tap = G.input.tap(), k = tap ? this.cells().findIndex(r => G.tapIn(r.x - 4, r.y - 4, r.w + 8, r.h + 8)) : -1;
      if (k >= 0) { this.say(k); G.audio.sfx('cursor'); return; }
      if (G.input.p('A') || G.input.p('B') || tap) { G.audio.sfx('ok'); G.pop(); this.w.resolve(); }
    }
    draw(ctx) {
      const b = this.box(), pop = Math.min(1, this.t / 10), dy = Math.round((1 - pop) * 24), y = b.y + dy;
      ctx.fillStyle = 'rgba(4,6,24,' + (0.55 * pop) + ')'; ctx.fillRect(0, 0, G.W, G.H); // the room goes dim
      ctx.globalAlpha = pop;
      G.win(ctx, b.x, y, b.w, b.h, { fill1: '#2c3a9c', fill2: '#141c58', alpha: 1 });
      // the sun and the moon around "¡Hoy!"
      G.drawIcon16(ctx, 'sol', G.W / 2 - 54, y + 8);
      ctx.drawImage(moon(7), G.W / 2 + 38, y + 8);
      G.bigText(ctx, '¡Hoy!', G.W / 2, y + 12, 2, '#f8e060');
      const hh = G.hearts ? G.hearts.today() : 0; // Round B: hearts from friends today (hearts.js)
      if (hh) { G.hearts.heart(ctx, b.x + 10, y + 9, true, 2); G.text(ctx, String(hh), b.x + 27, y + 13, '#f8a8c8'); }
      ctx.globalAlpha = 1;
      if (!this.words.length) { // nothing new today: your smile anyway
        ctx.fillStyle = '#f8e060'; ctx.fillRect(G.W / 2 - 27, y + 37, 54, 54);
        G.drawPortrait(ctx, G.st.playerSpec().portrait, G.W / 2 - 26, y + 38, this.t);
      }
      this.cells().forEach((r, k) => {
        if (k >= this.shown) return;
        const sel = k === this.sel, a = Math.min(1, (this.t - this.popT[k]) / 8), hop = Math.round((1 - a) * 6) + (sel ? Math.round(Math.abs(Math.sin(this.t / 7)) * -2) : 0);
        ctx.globalAlpha = a; G.drawIcon16(ctx, this.words[k], r.x, r.y + dy + hop, r.s, sel ? 'sel' : 'card'); ctx.globalAlpha = 1;
      });
      // the word just said (or picked), big and gold
      const ly = y + 34 + b.pics + 4;
      if (this.sel >= 0) G.bigText(ctx, G.baseForm(this.words[this.sel]), G.W / 2, ly, 2, '#f8d860');
      else if (!this.words.length) G.bigText(ctx, G.fill('¡Muy bien, {name}!'), G.W / 2, ly, 2, '#f8d860');
      // the stars earned today, popping in one by one (past ten: one star and the number)
      const sy = ly + 30, ns = this.nStars();
      // (speaking stars, said out loud with the mic, come last, with sound waves: past ten, a mic and their number)
      if (this.stars > 10 && this.starsShown) {
        star(ctx, G.W / 2 - 22 - (this.said ? 18 : 0), sy, 9); G.bigText(ctx, String(this.stars), G.W / 2 + 12 - (this.said ? 18 : 0), sy - 7, 2, '#f8d030');
        if (this.said) { G.mic.glyph(ctx, G.W / 2 + 26, sy - 4, '#70e0ff'); G.text(ctx, String(this.said), G.W / 2 + 36, sy - 3, '#a8f0ff'); }
      } else for (let i = 0; i < this.starsShown; i++) {
        const a = (this.t - this.starT[i]) / 8, sc = a >= 1 ? 1 : a < 0.6 ? a / 0.6 * 1.3 : 1.3 - (a - 0.6) / 0.4 * 0.3, sx = G.W / 2 - (ns - 1) * 10 + i * 20;
        if (sc > 0.1) star(ctx, sx, sy, 8 * sc);
        if (sc > 0.1 && i >= ns - this.said) G.mic.waves(ctx, sx, sy, 8 * sc + 1, '#70e0ff', 1, 0);
      }
      if (this.revealed() && this.wait >= 20 && (this.t >> 4) % 2 === 0) G.text(ctx, '\u0001', b.x + b.w - 16, y + b.h - 13, '#f8e060');
    }
  }
  DY.todayCard = function () { const w = new G.Wait(); G.push(new TodayCard(w)); return w; };

  // ---------- the night: stars, the moon, lights out, "z z z", then the sun comes up ----------
  const mix = (a, b, t) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), A = p(a), B = p(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };
  class Night {
    constructor(w) { this.w = w; this.t = 0; this.phase = 0; this.pt = 0; }
    onEnter() { G.fadeTo(0, 0.04, '#080a26'); } // out of the evening's dark blue
    update() {
      this.t++; this.pt++;
      const go = G.input.p('A') || G.input.p('B') || !!G.input.tap();
      if (this.phase === 0 && (this.pt > 210 || (go && this.pt > 40))) { this.phase = 1; this.pt = 0; G.audio.sfx('heal'); }
      else if (this.phase === 1 && (this.pt > 150 || (go && this.pt > 30))) { this.phase = 2; this.pt = 0; G.fadeTo(1, 0.05, '#fff2d0'); }
      else if (this.phase === 2 && G.fade.a >= 1) { G.pop(); this.w.resolve(); }
    }
    draw(ctx) {
      const d = this.phase === 0 ? 0 : this.phase === 1 ? Math.min(1, this.pt / 120) : 1; // dawn, 0..1
      const sky = ctx.createLinearGradient(0, 0, 0, 170);
      sky.addColorStop(0, mix('#060820', '#5878d0', d)); sky.addColorStop(0.6, mix('#182058', '#f8b080', d)); sky.addColorStop(1, mix('#2a3270', '#ffe8a8', d));
      ctx.fillStyle = sky; ctx.fillRect(0, 0, G.W, G.H);
      for (let i = 0; i < 46; i++) { // twinkling stars, fading at dawn
        const sx = (i * 89 + 31) % G.W, sy = (i * 47 + 11) % 150, tw = Math.sin(this.t / 12 + i * 1.7);
        ctx.globalAlpha = (1 - d) * (0.55 + 0.45 * tw); ctx.fillStyle = i % 5 ? '#e8ecff' : '#fff4b0';
        ctx.fillRect(sx, sy, 1, 1); if (i % 7 === 0 && tw > 0.6) { ctx.fillRect(sx - 1, sy, 3, 1); ctx.fillRect(sx, sy - 1, 1, 3); }
      }
      ctx.globalAlpha = 1 - d; ctx.drawImage(moon(16), 236, Math.round(26 + d * 50)); ctx.globalAlpha = 1;
      if (d > 0) { // the sun rises behind the hills
        const sx = 76, sy = Math.round(176 - d * 62), r = 16;
        const glow = ctx.createRadialGradient(sx, sy, 4, sx, sy, 60); glow.addColorStop(0, 'rgba(255,240,170,' + 0.7 * d + ')'); glow.addColorStop(1, 'rgba(255,200,120,0)');
        ctx.fillStyle = glow; ctx.fillRect(0, 0, G.W, G.H);
        ctx.fillStyle = '#ffe070'; ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff8c8'; ctx.beginPath(); ctx.arc(sx - 4, sy - 4, 6, 0, Math.PI * 2); ctx.fill();
      }
      // hills, far and near
      const hill = (col, base, amp, k) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, G.H); for (let x = 0; x <= G.W; x += 8) ctx.lineTo(x, base - Math.sin(x / k) * amp - Math.sin(x / (k * 0.37)) * amp * 0.3); ctx.lineTo(G.W, G.H); ctx.fill(); };
      hill(mix('#141a40', '#78a858', d), 170, 10, 46); hill(mix('#0c1030', '#4c8840', d), 190, 6, 30);
      // home, with its window lit until lights out
      const hx = 160, hy = 192, wall = mix('#1e2048', '#f0d8a8', d), roof = mix('#141432', '#c85838', d);
      ctx.fillStyle = wall; ctx.fillRect(hx - 30, hy - 34, 60, 34);
      ctx.fillStyle = roof; ctx.beginPath(); ctx.moveTo(hx - 38, hy - 32); ctx.lineTo(hx, hy - 58); ctx.lineTo(hx + 38, hy - 32); ctx.fill();
      ctx.fillStyle = mix('#0c0c20', '#7a4a28', d); ctx.fillRect(hx - 6, hy - 18, 12, 18); // door
      ctx.fillRect(hx + 18, hy - 56, 7, 14); // chimney
      const lit = this.phase === 0 && this.pt < 80;
      ctx.fillStyle = lit ? '#ffd868' : mix('#283060', '#a8d8f8', d); ctx.fillRect(hx - 24, hy - 26, 12, 10); ctx.fillRect(hx + 12, hy - 26, 12, 10);
      if (lit) { ctx.fillStyle = 'rgba(255,216,104,0.25)'; ctx.fillRect(hx - 28, hy - 30, 20, 18); ctx.fillRect(hx + 8, hy - 30, 20, 18); }
      ctx.fillStyle = mix('#141432', '#7a4a28', d); ctx.fillRect(hx - 19, hy - 26, 2, 10); ctx.fillRect(hx + 17, hy - 26, 2, 10);
      if (this.phase === 0 && this.pt >= 90) for (let k = 0; k < 3; k++) { // z z z, drifting up from the window
        const a = ((this.pt - 90) / 70 + k / 3) % 1, zx = hx + 26 + Math.sin(a * 6 + k) * 4 + a * 18, zy = hy - 36 - a * 54;
        ctx.globalAlpha = Math.min(1, (1 - a) * 2); G.bigText(ctx, 'z', zx, zy, 1 + (k === 1 ? 1 : 0), '#e8ecff'); ctx.globalAlpha = 1;
      }
    }
  }
  DY.night = function () { const w = new G.Wait(); G.push(new Night(w)); return w; };
})();

</script>
<script>/* src/hint.js */
// ===== Tap hints: a hand shows where to tap next when a child is stuck; the keys for keyboard players =====
// When nothing has been pressed or touched for a while, a gloved hand taps gently at the next thing to do:
//   on the map (~6 s): the nearest person with a bubble (Mamá first, at home), the moon over the home door at
//     sunset (day.js), else the door that leads to someone with a bubble (out of the house, into the school...).
//     Someone off screen gets the hand at the screen's edge, pointing the way, with a little "!" bubble;
//   on a line of dialogue that's waiting (~4 s): the box ("tap to go on"), or the Z key for keyboard players;
//     the same below a card that a tap closes (a new word, a badge, a new errand, the diploma);
//   in the notebook (~6 s): its close button; a scene with hintXY() (the "Hoy" card): that spot.
// Never on a question: the hand would give the answer away.
// Any key or touch hides it at once. It only draws (core.js calls step and draw), so it never takes input.
// Keyboard players (no touch screen, or a key pressed last) also get a one-time strip of the keys once Mamá's
// intro is done: Z talk, X menu (the notebook), C hear again; each key lights up while it's held.
'use strict';
(function () {
  const H = G.hint = {};
  H.IDLE_MAP = 360;  // frames of doing nothing on the map before the hand shows (~6 s)
  H.IDLE_TALK = 240; // ... on a line that waits for a tap (~4 s)
  H.STRIP = 720;     // frames the keyboard strip stays up on the map (~12 s)
  H.at = null;       // where the hand points now: {x, y, dir, talk} in game px, or null (tests read it)
  let idle = 0, shownT = 0, last = null, strip = 0, kb = !G.touch;
  // a key pressed last = a keyboard player; a finger or the mouse last = a tapper
  window.addEventListener('keydown', () => { kb = true; }, true);
  window.addEventListener('pointerdown', () => { kb = false; }, true);
  H.keyboard = () => kb;

  // ---------- what to point at ----------
  const alerting = n => { try { const a = n.alert && n.alert(); return !!a && !a.wait; } catch (e) { return false; } }; // (a "tomorrow" bubble: nothing to do there today)
  const waitsInside = id => { const m = G.maps[id]; return !!m && ((m.npcs || []).some(n => (!n.cond || n.cond()) && alerting(n)) || !!(G.errands && G.errands.waitsIn(id))); };
  function mapTarget(f) {
    const p = f.player; if (f.locked || p.moving || f.route) return null;
    const T = G.TILE, cx = Math.round(f.cam.x), cy = Math.round(f.cam.y);
    let best = null;
    const take = (x, y, ox, oy) => { const d = Math.abs(x - p.x) + Math.abs(y - p.y); if (!best || d < best.d) best = { d, x: x * T + ox + T / 2 - cx, y: y * T + oy + T / 2 - cy }; };
    for (const n of f.npcs) if (n.spec && !n.hidden && alerting(n)) take(n.x, n.y, n.ox || 0, n.oy || 0);
    if (G.errands) for (const g of G.errands.targets(f)) if (!g.secret) take(Math.floor(g.x / T), Math.floor(g.y / T), g.x % T - T / 2, g.y % T - T / 2); // errand places, animals to find (never a puzzle's answer: secret)
    if (G.intro) for (const g of G.intro.targets(f)) take(Math.floor(g.x / T), Math.floor(g.y / T), 0, 0); // a find-it puzzle's thing (intro.js)
    const home = G.day && G.day.homeDoor && G.day.homeDoor(f); if (home) take(home[0], home[1], 0, 0);
    if (!best) for (const ex of f.def.exits || []) if (ex.to && (!ex.cond || ex.cond()) && waitsInside(ex.to)) take(ex.x, ex.y, 0, 0);
    if (!best || (best.x >= 10 && best.x <= G.W - 10 && best.y >= 10 && best.y <= G.H - 10)) return best && place(best.x, best.y);
    // off screen: at the screen's edge, on the line from the player towards it, pointing that way
    const x0 = 14, x1 = G.W - 14, y0 = 38, y1 = G.H - 14; // (clear of the menu button)
    const px = G.clamp(p.x * T + T / 2 - cx, x0, x1), py = G.clamp(p.y * T + T / 2 - cy, y0, y1), dx = best.x - px, dy = best.y - py;
    const tx = dx > 0 ? (x1 - px) / dx : dx < 0 ? (x0 - px) / dx : Infinity, ty = dy > 0 ? (y1 - py) / dy : dy < 0 ? (y0 - py) / dy : Infinity, k = Math.min(tx, ty);
    return { x: Math.round(px + dx * k), y: Math.round(py + dy * k), dir: tx < ty ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'), edge: true };
  }
  // the hand sits below its target pointing up, or above it pointing down near the bottom of the screen
  const place = (x, y, talk) => ({ x, y, dir: y + 24 > G.H ? 'down' : 'up', talk });
  function target(s) {
    if (!s || G.fade.a > 0) return null;
    if (s === G.field) return mapTarget(s);
    if (s.hintXY) { const p = s.hintXY(); return p && place(p[0], p[1], true); }
    const name = s.constructor && s.constructor.name;
    if (name === 'TextBox' && !(s.opts && s.opts.auto) && s.lines && s.shown >= s.chars(0, s.scroll + 3)) return place(s.boxX + s.boxW - 11, s.boxY() + 51, true);
    if (name === 'Notebook' && s.closeXY) { const [x, y] = s.closeXY(); return place(x + 10, y + 12); }
    if (name === 'PagePuzzle' && s.closeXY) return null; // a page puzzle: never point at an answer

  const busy = () => G.input.ptr.down || !!G.input.tap() || Object.keys(G.pressed).length > 0 || Object.keys(G.keys).some(k => G.keys[k]);

  // ---------- every frame (core.js step, before input is cleared) ----------
  H.step = function () {
    const s = G.top();
    if (s !== last || busy()) { last = s; idle = 0; }
    let t = null;
    try { t = target(s); } catch (e) { if (!H.err) { H.err = true; console.error(e); } } // (never stop the game loop)
    if (!t) { idle = 0; H.at = null; shownT = 0; }
    else { idle++; H.at = idle >= (t.talk ? H.IDLE_TALK : H.IDLE_MAP) ? t : null; shownT = H.at ? shownT + 1 : 0; }

  };
  // the keyboard strip: once, after Mamá's intro, while walking around (not over a map's name banner)
  H.stripShowing = () => strip > 0 && stripUp();
  H.stripDone = () => strip < 0;
  const stripUp = () => { const f = G.field; return kb && !!f && G.top() === f && !f.locked && !(f.banner && f.banner.t > 0) && !!G.state && !!G.state.flags.intro && G.fade.a === 0; };

  // ---------- drawing (core.js draw, above every scene) ----------
  const HAND = [
    '....oo......',
    '...owwo.....',
    '...owwo.....',
    '...owwooo...',
    '...owwowwoo.',
    '...owwowwowo',
    '.ooowwwwwowo',
    'owwowwwwwwwo',
    'owwwwwwwwwwo',
    '.owwwwwwwwso',
    '..owwwwwwwso',
    '..owwwwwwsso',
    '...owwwwsso.',
    '...occcccco.',
    '...oCCCCCCo.',
    '...oooooooo.',
  ];
  const HAND_PAL = { o: '#201828', w: '#ffffff', s: '#c8c8e0', c: '#78b8f8', C: '#3870c0' };
  const ANG = { up: 0, right: Math.PI / 2, down: Math.PI, left: -Math.PI / 2 };
  // a keyboard key: top-left x, y; down = pressed in, lit = glowing
  H.keyCap = function (ctx, k, x, y, down, lit) {
    x = Math.round(x); y = Math.round(y);
    ctx.fillStyle = '#101028'; ctx.fillRect(x + 1, y + 2, 13, 14);
    const d = down ? 1 : 0;
    G.win(ctx, x, y + d, 15, 15, { fill1: lit ? '#fff8c0' : '#f4f4fc', fill2: lit ? '#f0c040' : '#b8b8cc', alpha: 1 });
    G.textC(ctx, k, x + 8, y + 4 + d, '#202040', null);
  };
  function hand(ctx, a, push) {
    const spr = G.sprite('hint_hand', HAND, HAND_PAL), gap = 2 + Math.round((1 - push) * 5), al = ctx.globalAlpha;
    ctx.save(); ctx.translate(Math.round(a.x), Math.round(a.y)); ctx.rotate(ANG[a.dir] || 0);
    ctx.globalAlpha = al * 0.45; ctx.drawImage(G.tinted(spr, '#000010', 'hint_hand'), -4, gap + 1); // a soft shadow, for light pages
    ctx.globalAlpha = al; ctx.drawImage(spr, -5, gap);
    ctx.restore();
    if (a.edge) { // someone is waiting that way: a little "!" bubble beside the hand
      const [bx, by] = { up: [7, 4], down: [7, -17], left: [4, 7], right: [-15, 7] }[a.dir];
      G.win(ctx, a.x + bx, a.y + by, 11, 13, { fill1: '#f8f0c0', fill2: '#f8d860', alpha: 1 });
      G.text(ctx, '!', a.x + bx + 4, a.y + by + 3, '#c02020', null);
    }
  }
  H.draw = function (ctx) {
    if (strip > 0) drawStrip(ctx);
    const a = H.at; if (!a || G.fade.a > 0) return;
    const ph = G.frame % 50, push = ph < 12 ? ph / 12 : ph < 22 ? 1 : Math.max(0, 1 - (ph - 22) / 20);
    ctx.save(); ctx.globalAlpha = Math.min(1, shownT / 12);
    if (ph >= 12 && ph < 34) { // the tap ring
      const r = 3 + (ph - 12) * 0.7; ctx.lineWidth = 1;
      ctx.globalAlpha *= 1 - (ph - 12) / 22;
      ctx.strokeStyle = '#201828'; ctx.beginPath(); ctx.arc(a.x, a.y, r + 1, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#fff8a0'; ctx.beginPath(); ctx.arc(a.x, a.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = Math.min(1, shownT / 12);
    }
    if (a.talk && kb) { // keyboard players: the key that goes on
      const k = G.prefs && G.prefs.dpad ? 'A' : 'Z';
      H.keyCap(ctx, k, a.x - 7, a.dir === 'down' ? a.y - 22 : a.y + 4, push >= 1, true);
    } else hand(ctx, a, push);
    ctx.restore();
  };
  function drawStrip(ctx) {
    const al = Math.min(1, strip / 15, (H.STRIP + 30 - strip) / 30); if (al <= 0) return;
    if (!stripUp()) return;
    const x = 6, y = 6, w = 146, h = 28;
    ctx.save(); ctx.globalAlpha = al;
    G.win(ctx, x, y, w, h);
    [['Z', 'A', 'talk'], ['X', 'B', 'book'], ['C', 'C', 'speaker']].forEach(([k, b, ic], i) => {
      const gx = x + 6 + i * 47, on = G.input.h(b);
      H.keyCap(ctx, k, gx, y + 6, on, on);
      if (ic === 'speaker') G.iconBtn(ctx, 'speaker', gx + 19, y + 4); else G.drawIcon(ctx, ic, gx + 18, y + 4, on);
    });
    ctx.restore();
  }
})();

<script>/* src/main.js */
// ===== Boot, title screen, save slots =====
'use strict';
(function () {
  class Blank { constructor() { this.tasks = new G.Tasks(); } update() { this.tasks.update(); } draw(ctx) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, G.W, G.H); } }
  const STAR = '\u0005';

  // ---------- Starting and continuing a game ----------
  // A new game in a slot: creator -> name -> home (the slot is filled once the name is chosen; backing out of
  // the creator leaves it empty).
  function newGame(slot) {
    G.st.newGame();
    const sc = new Blank(); G.replace(sc);
    sc.tasks.add((function* () {
      G.fade.a = 0;
      const r = yield G.creator();
      if (!r.result) { G.toTitle(); return; }
      G.state.look = r.result.look; G.state.name = r.result.name;
      G.st.begin(slot); // this game owns the slot from now on: saved right away, then all the time
      const f = G.goto('casa', 4, 4, 'up');
      f.locked = true; // a moment to look around; then chapter 1 starts by itself (chapters.js: its first beat is automatic)
      f.tasks.add((function* () { yield 40; f.locked = false; })());
    })());
  }
  // Continue the game in a slot, where the player was
  function cont(slot) {
    if (!G.st.loadSlot(slot)) { G.audio.sfx('error'); return false; }
    try { const l = G.state.loc; G.goto(l.map, l.x, l.y, l.dir); return true; }
    catch (e) { console.warn(e); G.st.newGame(); G.toTitle(); G.audio.sfx('error'); return false; } // a save that won't open
  }
  G.newGame = newGame; G.continueGame = cont;

  // ---------- Title: tap anywhere (or Z / Enter) to play; the gear, held 2 s, is for grown-ups ----------
  // With no saves yet a child goes straight into the character creator (slot 1); otherwise to the slot screen.
  class Title {
    constructor() { this.t = 0; this.focus = 0; this.confetti = []; this.gear = new G.Hold(120); this.logo = this.makeLogo(); }
    onEnter() { G.audio.play('title'); G.fade.a = 1; G.fadeTo(0, 0.03); }
    makeLogo() {
      // Big pixel title from the bitmap font, scaled x4 with a sunny gradient and outline
      const s1 = 'ESPANOL', s2 = 'CLUB DE';
      const w1 = G.textWidth(s1), w2 = G.textWidth(s2);
      const c = G.makeCanvas(260, 64), x = c.getContext('2d');
      x.imageSmoothingEnabled = false;
      const tmp2 = G.makeCanvas(w2 + 2, 9); G.text(tmp2.getContext('2d'), s2, 0, 0, '#ffffff', '#702010');
      x.drawImage(tmp2, Math.floor((260 - w2 * 2) / 2), 0, tmp2.width * 2, tmp2.height * 2);
      // the 7-row font has no room above capitals, so draw ESPANOL and add the tilde by hand
      const tmp = G.makeCanvas(w1 + 2, 11), tc = tmp.getContext('2d'); G.text(tc, 'ESPANOL', 0, 3, '#ffffff', null);
      const nx = G.textWidth('ESPA') + 1; tc.fillStyle = '#ffffff';
      [[1, 0], [2, 0], [0, 1], [3, 1], [4, 0]].forEach(([dx, dy]) => tc.fillRect(nx + dx, dy, 1, 1));
      const sc = 4, ox = Math.floor((260 - w1 * sc) / 2), oy = 20;
      const outl = G.tinted(tmp, '#5a1408', 'logo1');
      for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1], [2, 2], [1, 2], [2, 1]]) x.drawImage(outl, ox + dx * 2, oy + dy * 2, tmp.width * sc, tmp.height * sc);
      const fill = G.makeCanvas(tmp.width * sc, tmp.height * sc), fx = fill.getContext('2d');
      fx.imageSmoothingEnabled = false; fx.drawImage(tmp, 0, 0, fill.width, fill.height);
      fx.globalCompositeOperation = 'source-in';
      const gr = fx.createLinearGradient(0, 0, 0, fill.height);
      [['#fff8c0', 0], ['#ffd840', 0.35], ['#ff9a20', 0.65], ['#e03818', 1]].forEach(([col, p]) => gr.addColorStop(p, col));
      fx.fillStyle = gr; fx.fillRect(0, 0, fill.width, fill.height);
      fx.globalCompositeOperation = 'source-atop'; fx.fillStyle = 'rgba(255,255,255,0.45)'; fx.fillRect(0, 4, fill.width, 3);
      x.drawImage(fill, ox, oy);
      return c;
    }
    // tap areas (shared with draw): the play button (a tap anywhere else but the gear plays too), the gear
    playRect() { return { x: G.W / 2 - 52, y: 124, w: 104, h: 30 }; }
    gearXY() { return [G.W - 34, 12]; }
    gearHit() { const [x, y] = this.gearXY(); return { x: x - 4, y: y - 4, w: 32, h: 28 }; }
    update() {
      this.t++;
      if (G.r(4) === 0) this.confetti.push({ x: G.r(G.W), y: -4, vx: (G.rand() - 0.5) * 0.5, vy: 0.4 + G.rand() * 0.6, c: ['#f8e060', '#f06080', '#60c0f0', '#70e070', '#ffffff'][G.r(5)], life: 500 });
      this.confetti.forEach(e => { e.x += e.vx + Math.sin((this.t + e.life) / 25) * 0.3; e.y += e.vy; e.life--; });
      this.confetti = this.confetti.filter(e => e.life > 0 && e.y < G.H + 5);
      if (this.t < 30) return;
      if (G.input.p('M')) G.audio.toggleMute();
      if (this.gear.update(this.gearHit(), this.focus === 1)) { G.audio.sfx('ok'); G.grownUps({ title: true }); return; }
      const d = G.input.repDir(14, 6); // keyboard: up / right moves onto the gear, down / left back to play
      if (d) { const f = d === 'up' || d === 'right' ? 1 : 0; if (f !== this.focus) { this.focus = f; G.audio.sfx('cursor'); } }
      if ((G.input.tap() && !G.tapIn(this.gearHit())) || (G.input.p('A') && this.focus === 0)) this.play();
    }
    play() { G.audio.sfx('ok'); if (G.st.anySave()) G.push(new Slots()); else newGame(1); }
    draw(ctx) {
      G.drawBattleBG(ctx, 'town', this.t);
      ctx.fillStyle = 'rgba(255,200,120,0.18)'; ctx.fillRect(0, 0, G.W, G.H);
      this.confetti.forEach(e => { ctx.fillStyle = e.c; ctx.fillRect(Math.round(e.x), Math.round(e.y), 2, (this.t + e.life) % 20 < 10 ? 2 : 1); });
      const bob = Math.round(Math.sin(this.t / 40) * 2);
      ctx.drawImage(this.logo, Math.floor((G.W - 260) / 2), 24 + bob);
      if (this.t > 30) {
        const P = this.playRect(), on = this.focus === 0, s = on ? Math.round(Math.sin(this.t / 9) + 1) : 0;
        G.win(ctx, P.x - s, P.y - s, P.w + s * 2, P.h + s * 2, on ? { fill1: '#f8a838', fill2: '#d85818', alpha: 1 } : { fill1: '#907060', fill2: '#584840', alpha: 1 });
        G.bigText(ctx, '¡A jugar!', G.W / 2, P.y + 11, 2, on ? '#ffffff' : '#d8d0c8', '#6a1808');
        if (on) tapHint(ctx, P.x + P.w + 16, P.y + 15, this.t);
        const [gx, gy] = this.gearXY();
        G.drawIcon(ctx, 'gear', gx + this.gear.wiggle(), gy, this.focus === 1);
        G.drawHold(ctx, this.gear, gx + 12, gy + 10, 15);
      }
      G.textC(ctx, 'Un juego para aprender español', G.W / 2, G.H - 22, '#fff8e0');
      if (!G.touch) G.textC(ctx, 'Z: OK   X: menú   C: escuchar   M: sonido', G.W / 2, G.H - 11, '#f8e8c0');
    }
  }
  // "tap here" on a touch screen (a fingertip in a pulsing ring), else the Z key
  function tapHint(ctx, x, y, t) {
    if (G.touch && !(G.prefs && G.prefs.dpad)) {
      ctx.strokeStyle = '#fff8c0'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, 5 + ((t >> 3) % 3) * 2, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#f0c8a0'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
    } else { G.win(ctx, x - 10, y - 10, 21, 20, { fill1: '#e8e8f0', fill2: '#b8b8c8', alpha: 1 }); G.textC(ctx, 'Z', x + 1, y - 4, '#202040', null); }
  }

  // ---------- Who's playing? Three save slots ----------
  // A filled card (face, name, words learned, stars) continues that game; "+ Nuevo" starts one there.
  // Deleting is for grown-ups: hold the little trash can for 3 s (keyboard: down onto it, hold Z), then sí / no.
  const TRASH = ['...bbbb...', '.bbbbbbbb.', 'bwwwwwwwwb', '.bbbbbbbb.', '.bwgwgwgb.', '.bwgwgwgb.', '.bwgwgwgb.', '.bwgwgwgb.', '.bwgwgwgb.', '..bbbbbb..'];
  const TRASH_PAL = { b: '#202848', w: '#e0e4f4', g: '#8890b8' };
  class Slots {
    constructor() {
      this.t = 0; this.trash = false; this.holds = [0, 1, 2].map(() => new G.Hold(180)); this.refresh();
      let best = -1; this.i = 0; // start on the game played last
      this.cards.forEach((c, k) => { if (c && c.savedAt > best) { best = c.savedAt; this.i = k; } });
    }
    onEnter() { G.speak('¿Quién juega?'); }
    refresh() { this.cards = [1, 2, 3].map(n => G.st.summary(n)); }
    // tap areas (shared with draw): card k, its trash can (hold area), the back button
    cardRect(k) { return { x: 14 + k * 100, y: 40, w: 92, h: 154 }; }
    trashRect(k) { const r = this.cardRect(k); return { x: r.x + r.w - 27, y: r.y + r.h - 27, w: 24, h: 24 }; }
    backXY() { return [8, 8]; }
    update() {
      this.t++;
      if (this.asking) { // back from "¿Borrar?"
        const yes = this.asking.result === true, k = this.askK; this.asking = null;
        if (yes) { G.st.erase(k + 1); this.refresh(); this.trash = false; G.audio.sfx('door'); this.poof = { k, t: 30 }; }
        return;
      }
      if (this.poof && --this.poof.t <= 0) this.poof = null;
      for (let k = 0; k < 3; k++) if (this.cards[k] && this.holds[k].update(this.trashRect(k), this.trash && this.i === k)) {
        G.audio.sfx('error'); this.askK = k; this.asking = G.confirmErase(this.cards[k]); return;
      }
      if (G.input.tap()) {
        if (G.btnHit(...this.backXY())) { this.back(); return; }
        for (let k = 0; k < 3; k++) {
          if (this.cards[k] && G.tapIn(this.trashRect(k))) break; // the trash can only answers to a long hold
          if (G.tapIn(this.cardRect(k))) { this.i = k; this.trash = false; this.open(k); return; }
        }
      }
      const d = G.input.repDir(14, 6);
      if (d === 'left' || d === 'right') { this.i = (this.i + (d === 'left' ? 2 : 1)) % 3; if (!this.cards[this.i]) this.trash = false; G.audio.sfx('cursor'); }
      if (d === 'down' && this.cards[this.i] && !this.trash) { this.trash = true; G.audio.sfx('cursor'); }
      if (d === 'up' && this.trash) { this.trash = false; G.audio.sfx('cursor'); }
      if (G.input.p('A') && !this.trash) this.open(this.i);
      else if (G.input.p('B')) this.back();
      if (G.input.p('M')) G.audio.toggleMute();
    }
    back() { G.audio.sfx('cancel'); G.pop(); }
    open(k) { G.audio.sfx('ok'); if (this.cards[k]) cont(k + 1); else newGame(k + 1); }
    draw(ctx) {
      G.drawBattleBG(ctx, 'town', this.t);
      ctx.fillStyle = 'rgba(20,24,72,0.35)'; ctx.fillRect(0, 0, G.W, G.H);
      G.bigText(ctx, '¿Quién juega?', G.W / 2, 18, 2, '#fff8e0', '#5a1408');
      G.iconBtn(ctx, 'back', ...this.backXY());
      for (let k = 0; k < 3; k++) this.card(ctx, k);
    }
    card(ctx, k) {
      const c = this.cards[k], R = this.cardRect(k), sel = k === this.i, bob = sel && !this.trash ? Math.round(Math.sin(this.t / 8) * 1.5) : 0;
      const x = R.x, y = R.y - bob, cx = x + R.w / 2;
      if (sel) { ctx.fillStyle = '#f8e060'; ctx.fillRect(x - 2, y - 2, R.w + 4, R.h + 4); }
      if (!c) {
        G.win(ctx, x, y, R.w, R.h, sel ? { fill1: '#3a56c8', fill2: '#1c2c8c', alpha: 1 } : { fill1: '#2a3478', fill2: '#141c50', alpha: 0.85 });
        ctx.fillStyle = sel ? '#f8e060' : '#8898e0'; ctx.fillRect(cx - 14, y + 58, 28, 6); ctx.fillRect(cx - 3, y + 47, 6, 28); // +
        G.bigText(ctx, 'Nuevo', cx, y + 100, 2, sel ? '#f8e060' : '#c8d0f0');
        if (this.poof && this.poof.k === k) for (let i = 0; i < 10; i++) { // a puff where the game was
          const a = i * 0.63, r = (30 - this.poof.t) * 1.6; ctx.fillStyle = 'rgba(232,236,248,' + (this.poof.t / 30) + ')'; ctx.fillRect(Math.round(cx + Math.cos(a) * r) - 2, Math.round(y + 60 + Math.sin(a) * r) - 2, 5, 5);
        }
        return;
      }
      G.win(ctx, x, y, R.w, R.h, sel ? { fill1: '#3a56c8', fill2: '#1c2c8c', alpha: 1 } : { alpha: 1 });
      const spec = G.data.playerSpec(c.look);
      ctx.fillStyle = '#000010'; ctx.fillRect(cx - 27, y + 9, 54, 54);
      G.drawPortrait(ctx, spec.portrait, cx - 26, y + 10, this.t + k * 50);
      G.textC(ctx, c.name, cx, y + 69, sel ? '#f8e060' : '#ffffff');
      // words learned (the notebook) and stars
      G.drawIcon(ctx, 'book', x + 10, y + 82); G.bigText(ctx, String(c.words), x + 56, y + 89, 2, '#ffffff');
      G.bigText(ctx, STAR, x + 22, y + 113, 2, '#f8d030'); G.bigText(ctx, String(c.stars), x + 56, y + 113, 2, '#ffffff');
      // the trash can (grown-ups: hold it)
      const T = this.trashRect(k), tx = T.x + 4 + this.holds[k].wiggle(), ty = T.y + 4 - bob, on = this.trash && sel;
      ctx.fillStyle = on ? '#f8e060' : '#000010'; ctx.fillRect(tx - 1, ty - 1, 18, 18);
      ctx.fillStyle = on ? '#304cc0' : '#1c2c8c'; ctx.fillRect(tx, ty, 16, 16);
      ctx.drawImage(G.sprite('trash', TRASH, TRASH_PAL), tx + 3, ty + 3);
      G.drawHold(ctx, this.holds[k], tx + 8, ty + 8, 13, '#f86040');
    }
  }

  // ---------- "¿Borrar?": the slot's face and name, then two picture cards (sí deletes; no is picked first) ----------
  class ConfirmErase {
    constructor(c, w) { this.transparent = true; this.c = c; this.w = w; this.t = 0; this.i = 1; }
    onEnter() { G.speak('¿Borrar?'); }
    rects() { return [0, 1].map(k => ({ x: G.W / 2 - 64 + k * 70, y: 138, w: 58, h: 54 })); } // tap areas: sí, no
    update() {
      this.t++;
      if (this.t < 10) return;
      const d = G.input.repDir(14, 6);
      if (d === 'left' || d === 'right') { this.i = 1 - this.i; G.audio.sfx('cursor'); }
      let k = -1;
      if (G.input.tap()) k = this.rects().findIndex(r => G.tapIn(r));
      if (G.input.p('A')) k = this.i;
      if (G.input.p('B')) k = 1;
      if (k >= 0) { G.audio.sfx(k === 0 ? 'ok' : 'cancel'); G.pop(); this.w.resolve(k === 0); }
    }
    draw(ctx) {
      ctx.fillStyle = 'rgba(0,0,16,0.55)'; ctx.fillRect(0, 0, G.W, G.H);
      G.win(ctx, 64, 18, 192, 186);
      const cx = G.W / 2, spec = G.data.playerSpec(this.c.look);
      ctx.fillStyle = '#000010'; ctx.fillRect(cx - 27, 27, 54, 54); G.drawPortrait(ctx, spec.portrait, cx - 26, 28, this.t);
      G.textC(ctx, this.c.name, cx, 88, '#f8e060');
      const tw = (G.textWidth('¿Borrar?') + 2) * 2, x0 = Math.round(cx - (tw + 26) / 2); // the trash can, then the question
      ctx.drawImage(G.sprite('trash', TRASH, TRASH_PAL), x0, 106, 20, 20);
      G.bigText(ctx, '¿Borrar?', x0 + 26 + tw / 2, 112, 2, '#ffffff');
      this.rects().forEach((r, k) => {
        const sel = k === this.i, bob = sel ? Math.round(Math.sin(this.t / 6) * 1.5) : 0;
        G.win(ctx, r.x, r.y - bob, r.w, r.h, sel ? { fill1: '#3a56c8', fill2: '#1c2c8c' } : {});
        G.drawIcon16(ctx, k === 0 ? 'si' : 'no', r.x + r.w / 2 - 16, r.y + 11 - bob, 2, sel ? 'sel' : 'card');
        if (sel && (this.t >> 3) % 4 !== 3) G.textC(ctx, '\u0001', r.x + r.w / 2, r.y - 9 - bob, '#f8e060');
      });
    }
  }
  G.confirmErase = function (c) { const w = new G.Wait(); G.push(new ConfirmErase(c, w)); return w; };

  // ---------- Controls and tips (from the grown-ups menu) ----------
  class Controls {
    constructor(w) { this.transparent = true; this.w = w; }
    update() { if (G.input.p('A') || G.input.p('B') || G.input.tap()) { G.audio.sfx('cancel'); G.pop(); this.w && this.w.resolve(); } } // a tap anywhere closes
    draw(ctx) {
      G.win(ctx, 6, 6, G.W - 12, G.H - 12);
      G.closeBtn(ctx, G.W - 30, 8);
      const L = [['CONTROLES  /  CONTROLS', ''], ['', ''],
        ['Flechas / WASD', 'caminar, elegir - walk, choose'], ['Z / Enter', 'hablar, OK - talk, OK'],
        ['X / Esc', 'menú, volver - menu, back'], ['C', 'escuchar otra vez - hear it again'], ['M', 'sonido - sound on/off'], ['V / Espacio', 'el micrófono - say it (hold Space)'], ['', ''],
        ['Words start as pictures. Use a word right', ''], ['and it turns gold: you learned it!', ''],
        ['Find the notebook pages hidden in town.', ''], ['Progress saves itself. Grown-ups: hold the gear.', '']];
      L.forEach(([a, b], i) => {
        G.text(ctx, a, 20, 16 + i * 14, b || i === 0 ? '#f8e060' : (i % 2 ? '#c8d0f0' : '#ffffff'));
        if (b) G.text(ctx, b, 104, 16 + i * 14, '#ffffff');
      });
    }
  }
  G.controlsHelp = function () { const w = new G.Wait(); G.push(new Controls(w)); return w; };
  G.Title = Title;
  // back to the title: the game is saved, and nothing is saved again until a slot is picked
  G.toTitle = function () { G.st.close(); G.st.newGame(); G.audio.stop(); G.replace(new Title()); };

  // ---------- Boot ----------
  G.boot = function () {
    G.st.migrate();
    G.st.newGame();
    G.replace(new Title());
    G.start();
  };
  if (!window.NO_BOOT) G.boot();
})();

</script>
