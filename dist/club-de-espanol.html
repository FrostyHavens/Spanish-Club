<script>/* src/world.js */
// ===== Round B: tap anything. Things in town say their Spanish word; say it back for a speaking star =====
// A tap on a thing that has a word (a tree, a flower, the fountain, a bench, the barn, the pond...) shows a word bubble
// over it with its picture and its Spanish word ("el árbol"), says the word and gives the thing a little wiggle and a
// sparkle. A word not met yet (words.js) is never met this way: its bubble shows the picture and "?" (and an animal's
// cry) and says nothing; it waits for its own puzzle in the story (WD.introOnTap = true would let a tap meet it).
// With the mic on, a small pink mic bubble sits beside a met word for ~5 s: tap it (or press V, or hold Space while you talk) and say the word -> a speaking star (G.mic.award; a cued
// retrieval for the word model: it was just heard), and that word gives no more say-it-back stars today (one per
// word per calendar day, kept in G.state.sayback[id] = 'YYYY-M-D', so it can't be farmed). A miss: "¡Otra vez!", the
// bubble stays a little longer, no penalty. Animals (animals.js, ambient.js, Canelo) use the same bubble, with their
// sound under the word ("el gato" / "¡Miau!").
//
// How a tap on the map is read (field.js tapTarget), in this order:
//   1. a person, a door (or its sign or wall), a notebook page sparkle, a search spot: exactly as before
//   2. an animal (animals.js): it reacts and says its name at once; you walk toward it (nothing else on arrival)
//   3. an object you can't walk onto (the fountain, a bench, a tree, the water, a roof): you walk up to it and it names
//      itself when you get there (right away if you're already beside it). If you can't get beside it (the middle of
//      the pond, a roof), you walk as close as you can and then it names itself
//   4. something you can walk onto (a flower, a little tree in the corner): you walk there and it names itself when
//      you arrive (the same word only once every 20 s this way, so walking over flowers isn't noisy)
//   5. anything else: walk there, as before
// With the keys, A facing a thing names it (where it used to say "...").
//
// Which things have words: G.world.TILES (tile code -> word id) for every map that has `things` in its definition,
// plus the map's own `things` (maps.js):
//   things: { tiles: { k: 'banco' } (more or different tile words; a code: null takes one away),
//             areas: { escuelaArea: 'escuela' } (G.MAPDATA[map].pos tag holding [x, y, w, h] -> word, for the tiles
//                     of that rectangle that have no tile word: a building's roof and walls),
//             at: { '41,4': 'puerta' } (one tile -> word; wins over everything) }
// A map without `things` names nothing (and A there still says "...").
//
// API: G.world.wordAt(f, x, y)        the word id of tile x, y on field f, or null
//      G.world.name(id, wx, wy, o)    name a word at world px wx, wy (the top of the thing): the bubble, the voice, met,
//                                     sparkles; then the say-it-back mic. o: {cry: '¡Miau!' (a second line, also spoken),
//                                     animal: id (for the album's `said`), tile: [x, y] (wiggles it), delay: frames
//                                     before speaking, noMic, walkOn (the 20 s rule), noIntro (never meets an unmet
//                                     word)}. Returns the bubble or null.
//      G.world.nameTile(f, x, y)      name tile x, y if it has a word (true if it did)
//      G.world.bubble                 the word bubble showing now {id, x, y, t, cry} or null
//      G.world.sayBack                the say-it-back now {id, t, life, mic (a G.MicBtn), done} or null
//      G.world.offerSayBack(id, b)    show the mic for word id beside bubble b (name() calls it)
//      G.world.canSayBack(id)         the mic is on and this word hasn't earned its say-it-back star today
//      G.world.today()                today's key, 'YYYY-M-D'
'use strict';
(function () {
  const T = G.TILE, WD = G.world = {};
  const key = (x, y) => x + ',' + y;
  WD.TILES = { T: 'arbol', f: 'arbol', o: 'flor', l: 'fuente', w: 'agua', J: 'banco', N: null, D: null, j: 'cama' }; // (windows and doors have no word)
  // A tap on an unmet thing never meets its word: unmet things stay mysterious (a "?" bubble with its picture and its
  // cry, no word and no voice) until the story introduces them (docs/CURRICULUM.md 7.3). A find-it puzzle's thing (intro.js)
  // wins over this, and set this to true to let taps meet words again (budget permitting).
  WD.introOnTap = false;
  const LIFE = 170, SAY_LIFE = 330, WALK_AGAIN = 20 * 60;
  WD.bubble = null; WD.sayBack = null;
  let speakAt = null, walked = {}; // a line waiting to be spoken {f, text, at}; word -> G.frame it was named by walking onto it

  WD.today = () => G.today(); // (words.js: the date, which tests and the audit can move on)
  const sbook = () => (G.state.sayback || (G.state.sayback = {}));

  // ---------- which word a tile has ----------
  WD.wordAt = function (f, x, y) {
    const th = f && f.def && f.def.things; if (!th) return null;
    if (th.at && th.at[key(x, y)]) return th.at[key(x, y)];
    const c = f.map.get(x, y), tiles = Object.assign({}, WD.TILES, th.tiles || {});
    if (tiles[c]) return tiles[c];
    const pos = G.MAPDATA[f.mapId] && G.MAPDATA[f.mapId].pos;
    for (const tag in th.areas || {}) {
      const r = pos && pos[tag];
      if (r && r.length === 4 && x >= r[0] && y >= r[1] && x < r[0] + r[2] && y < r[1] + r[3]) return th.areas[tag];
    }
    return null;
  };

  // ---------- naming ----------
  WD.name = function (id, wx, wy, o = {}) {
    const f = G.field, w = G.data.words[id]; if (!f || !w) return null;
    if (o.walkOn && walked[id] != null && G.frame - walked[id] < WALK_AGAIN) return null;
    if (o.walkOn) walked[id] = G.frame;
    if (G.vocabLog) G.vlog('tapped-object', id, { via: o.animal ? 'animal' : o.walkOn ? 'walk-on' : 'tap' }); // (the dev-only log, vocablog.js)
    let fresh = false;
    if (!G.st.seen(id) && WD.introOnTap && !o.walkOn && !o.noIntro && G.budget.canIntro(1)) fresh = G.words.meet(id, 'tap'); // asked "what's this?": met
    else G.st.see(id);
    const unk = !G.st.seen(id); // not met yet: its picture and "?", and no voice
    const b = WD.bubble = { id, x: wx, y: wy, t: 0, cry: o.cry || null, f, unk };
    if (o.tile) f.wig = { x: o.tile[0], y: o.tile[1], t: 18 };
    const text = unk ? '' : w.es.split(' / ')[0] + (o.cry ? '. ' + o.cry : ''); // (an unmet thing says nothing: its cry is only a sound)
    if (!text) speakAt = null; else if (o.delay) speakAt = { f, text, at: G.frame + o.delay }; else { speakAt = null; G.speak(text); }
    if (fresh) G.intro.note([id]);
    G.audio.sfx('cursor');
    const [sx, sy] = [wx - Math.round(f.cam.x), wy - Math.round(f.cam.y)];
    for (let i = 0; i < 3; i++) G.fx.twinkle(sx + (Math.random() - 0.5) * 22, sy + (Math.random() - 0.5) * 12);
    WD.lastNamed = { id, frame: G.frame, x: wx, y: wy };
    if (WD.sayBack) { WD.sayBack.off(); WD.sayBack = null; }
    if (!o.noMic && !unk && WD.canSayBack(id)) WD.offerSayBack(id, b, o.animal);
    return b;
  };
  WD.nameTile = function (f, x, y, o = {}) {
    const id = WD.wordAt(f, x, y); if (!id) return false;
    WD.name(id, x * T + 12, y * T + 2, Object.assign({ tile: [x, y] }, o));
    if (id === 'fuente' && G.animals) { const fish = G.animals.find('pez', f); if (fish) G.animals.jump(fish, f); } // the fish says hello
    return true;
  };
  // field.js: a tap walk that had a word on it ended (walked onto it, or as close as it could get)
  WD.arrive = function (f, r) {
    if (!r || !r.name) return;
    const walkOn = !f.blocked(r.x, r.y, f.player) || (f.player.x === r.x && f.player.y === r.y);
    WD.nameTile(f, r.x, r.y, { walkOn });
  };

  // ---------- say it back ----------
  WD.canSayBack = id => !!(G.mic && G.mic.on() && G.speech && G.state && sbook()[id] !== WD.today());
  // the mic bubble: a small round button (pink; blue while listening, green once it hears you; a star when said)
  class BubbleMic extends G.MicBtn {
    draw(ctx) {
      if (!this.shown()) return;
      const r = this.o.rect(), cx = r.x + r.w / 2, cy = r.y + r.h / 2, L = !!this.l, ph = L ? this.l.phase : '';
      const idle = !L && !this.done && this.can();
      let rad = 11 + (idle && (this.t % 90) < 16 ? Math.round(Math.sin((this.t % 90) / 16 * Math.PI) * 2) : 0) + (this.pop ? Math.round(this.pop / 4) : 0);
      if (L) for (let i = 0; i < 2; i++) {
        const p = ((this.t + i * 20) % 40) / 40;
        ctx.globalAlpha = (1 - p) * 0.8; ctx.strokeStyle = ph === 'speech' ? '#70e070' : '#f8e060'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx, cy, rad + 2 + p * 9, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      const x = cx + (this.sad > 40 ? Math.round(Math.sin(this.sad * 0.9) * 2) : 0);
      const held = !L && G.input.holding(r.x, r.y, r.w, r.h) > 0;
      const body = this.done ? '#2890c0' : L ? (ph === 'speech' ? '#30a850' : '#20a0c8') : held ? '#c02850' : this.sad ? '#a86080' : '#e85078';
      const disc = (rr, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, cy, rr, 0, Math.PI * 2); ctx.fill(); };
      disc(rad + 2, '#200818'); disc(rad + 1, this.done ? '#d8f8ff' : L ? '#ffffff' : '#ffb0c8'); disc(rad - 1, body);
      ctx.globalAlpha = 0.3; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x - rad * 0.3, cy - rad * 0.4, rad * 0.4, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      if (this.done) { G.text(ctx, '\u0005', x - 2, cy - 4, '#fff070', '#5a2c04'); G.mic.waves(ctx, x, cy, rad + 3, '#70e0ff', 2, this.t >> 1); return; }
      const mx = Math.round(x), my = Math.round(cy); // a little white microphone: the head, its holder, the stand
      ctx.fillStyle = '#ffffff'; ctx.fillRect(mx - 3, my - 8, 6, 9); ctx.fillRect(mx - 2, my - 9, 4, 1); ctx.fillRect(mx - 2, my + 1, 4, 1);
      ctx.fillStyle = '#c8d8ff'; ctx.fillRect(mx - 3, my - 7, 1, 7);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(mx - 5, my - 2, 1, 3); ctx.fillRect(mx + 4, my - 2, 1, 3); ctx.fillRect(mx - 4, my + 1, 1, 2); ctx.fillRect(mx + 3, my + 1, 1, 2); ctx.fillRect(mx - 3, my + 3, 6, 1);
      ctx.fillRect(mx - 1, my + 4, 2, 2); ctx.fillRect(mx - 3, my + 6, 6, 1);
      if (idle) G.mic.waves(ctx, x, cy, rad + 4, '#ffd0e0', 1, 0);
    }
  }
  class SayBack {
    constructor(f, id, b, animal) {
      this.f = f; this.id = id; this.b = b; this.animal = animal || null; this.t = 0; this.life = SAY_LIFE; this.done = 0;
      this.mic = new BubbleMic(f, { rect: () => WD.micRect(f, this.b), ready: () => this.t > 6 && !f.locked && G.top() === f && !this.done,
        heard: a => this.heard(a), again: () => G.speak(G.data.words[id].es.split(' / ')[0]) });
      this.mic.arm(); f.mic = this.mic;
    }
    target() { const w = G.data.words[this.id]; return [w.es, w.alt].filter(Boolean).join(' / '); }
    heard(alts) {
      if (!G.speech.match(this.target(), alts).pass) { this.mic.miss(); this.t = Math.min(this.t, this.life - 200); return; } // a little longer to try again
      const r = WD.micRect(this.f, this.b), cx = r.x + r.w / 2, cy = r.y + r.h / 2, id = this.id, f = this.f;
      this.mic.win(); this.done = 1;
      G.mic.award(id, cx, cy);
      G.fx.say('¡Bien dicho!', cx, cy - 18, '#a8f0ff', true);
      sbook()[id] = WD.today();
      if (this.animal && G.state.album && G.state.album[this.animal]) G.state.album[this.animal].said = true;
      G.words.answerRight(id, { said: true, cued: true, mode: 'say', noStar: true }); // (said after hearing it: a cued use)
      G.st.autosave();
    }
    // -> true when it used this frame's input
    update() {
      if (G.top() === this.f && !this.f.locked) this.t++;
      if (this.done) this.done++;
      const used = this.mic.update();
      if (!this.mic.listening() && !this.mic.started && (this.t > this.life || this.done > 70)) return { used, end: true };
      return { used, end: false };
    }
    off() { this.mic.off(); if (this.f.mic === this.mic) this.f.mic = null; }
  }
  WD.offerSayBack = function (id, b, animal) {
    const f = G.field; if (!f) return null;
    if (WD.sayBack) WD.sayBack.off();
    WD.sayBack = new SayBack(f, id, b, animal);
    return WD.sayBack;
  };

  // ---------- where things go on screen ----------
  function lines(b) { const w = G.data.words[b.id]; return [b.unk ? '?' : w.es.split(' / ')[0]].concat(b.cry ? [b.cry] : []); }
  WD.bubbleRect = function (f, b) {
    const ls = lines(b), tw = Math.max(...ls.map(s => G.textWidth(s))), w = 30 + tw, h = ls.length > 1 ? 26 : 22;
    let x = Math.round(b.x - f.cam.x - w / 2), y = Math.round(b.y - f.cam.y) - h - 6;
    const below = y < 4; if (below) y = Math.round(b.y - f.cam.y) + 30;
    const room = WD.sayBack && WD.sayBack.b === b ? 30 : 0; // keep the mic on screen too
    x = G.clamp(x, 4, G.W - 4 - w - room);
    return { x, y: G.clamp(y, 4, G.H - h - 4), w, h, below };
  };
  WD.micRect = function (f, b) { const r = WD.bubbleRect(f, b); return { x: r.x + r.w + 2, y: r.y + r.h / 2 - 14, w: 28, h: 28 }; };

  // ---------- hooks (field.js) ----------
  // every frame the map is on top, before it reads taps: -> true when the say-it-back mic used this frame's input
  WD.update = function (f) {
    if (speakAt && speakAt.f === f && G.frame >= speakAt.at) { G.speak(speakAt.text); speakAt = null; }
    const b = WD.bubble;
    if (b && b.f !== f) WD.bubble = null; else if (b) b.t++;
    if (f.wig && --f.wig.t <= 0) f.wig = null;
    const sb = WD.sayBack;
    if (!sb) { if (b && b.t > LIFE) WD.bubble = null; return false; }
    if (sb.f !== f) { sb.off(); WD.sayBack = null; return false; }
    const r = sb.update();
    if (r.end) { sb.off(); WD.sayBack = null; if (WD.bubble === sb.b) WD.bubble.t = Math.max(WD.bubble.t, LIFE - 20); }
    else if (WD.bubble === sb.b) WD.bubble.t = Math.min(WD.bubble.t, 40); // the word stays while you can say it
    return r.used;
  };
  // leaving a map: nothing of it stays armed
  WD.leave = function (f) {
    if (WD.sayBack && WD.sayBack.f === f) { WD.sayBack.off(); WD.sayBack = null; }
    if (WD.bubble && WD.bubble.f === f) WD.bubble = null;
    if (speakAt && speakAt.f === f) speakAt = null;
  };
  // the wiggle: the named tile drawn again, nudged side to side (after the tiles, before the people)
  WD.drawUnder = function (f, ctx) {
    const wg = f.wig; if (!wg) return;
    const dx = Math.round(Math.sin(wg.t * 1.2) * 1.6); if (!dx) return;
    ctx.drawImage(G.tileCanvas(f.map, wg.x, wg.y), wg.x * T - Math.round(f.cam.x) + dx, wg.y * T - Math.round(f.cam.y));
  };
  // the word bubble and the mic, over everything on the map
  WD.draw = function (f, ctx) {
    const b = WD.bubble; if (!b || b.f !== f) return;
    const r = WD.bubbleRect(f, b), ls = lines(b), w = G.data.words[b.id];
    const k = Math.min(1, b.t / 8), rise = Math.round((1 - FXease(k)) * 6), fade = b.t > LIFE - 20 ? Math.max(0, (LIFE - b.t) / 20) : 1;
    ctx.globalAlpha = fade;
    const y = r.y + rise;
    G.win(ctx, r.x, y, r.w, r.h, { fill1: '#ffffff', fill2: '#ece8f4', alpha: 1 });
    const tx = G.clamp(Math.round(b.x - f.cam.x), r.x + 6, r.x + r.w - 7); // the tail points at the thing
    ctx.fillStyle = '#ffffff';
    if (r.below) { ctx.fillRect(tx - 1, y - 2, 3, 2); ctx.fillRect(tx, y - 3, 1, 1); }
    else { ctx.fillRect(tx - 1, y + r.h - 1, 3, 2); ctx.fillRect(tx, y + r.h + 1, 1, 1); }
    const hop = b.t < 30 ? Math.round(Math.abs(Math.sin(b.t / 30 * Math.PI * 2)) * -2) : 0;
    G.drawIcon16(ctx, w, r.x + 5, y + (r.h - 16) / 2 + hop);
    G.text(ctx, ls[0], r.x + 25, y + (ls.length > 1 ? 4 : 7), b.unk ? '#a08060' : G.st.knows(b.id) ? '#a06008' : '#2860a8', null);
    if (ls[1]) G.text(ctx, ls[1], r.x + 25, y + 14, '#e06010', null);
    ctx.globalAlpha = 1;
    if (WD.sayBack && WD.sayBack.b === b && WD.sayBack.f === f) WD.sayBack.mic.draw(ctx);
  };
  const FXease = u => (G.fx.easeBack ? G.fx.easeBack(u) : u);
})();

</script>
<script>/* src/hearts.js */
// ===== Round B: hearts (friendship) with the townsfolk and Canelo; voice greetings; best-friend stickers and photos =====
// Everyone in town (and Canelo) has 0-5 hearts, saved in G.state.hearts[npc]. Hearts go up:
//   - a greeting answered (by voice or by tap): once a day per person, +1. From chapter 3 on, the first talk of the
//     day with someone starts with their greeting as a G.ask question (a sun, a moon or a wave: buenos días, buenas
//     noches or hola), so the kids' mic is there, then one due word from their pool (H.POOLS);
//   - a gift they like (G.hearts.gift(npc, word), once a day per person): +1 (LIKES below; Canelo likes el hueso);
//   - finishing their errand (maps.js finishQuest -> giver): +2, not counted in the daily cap;
//   - Canelo: care (food, water, the ball, petting, a trick shown) +1 each, and +1 for every trick learned (not capped).
// At most DAY_CAP (2) a day per person from greetings, gifts and care, so friendships grow over several days.
// Unlocks: 1 heart -> they call you by name and hop when you pass (a "¡Hola, Luz!" bubble, at most once a minute);
// 3 -> a secret (where a notebook page you haven't found is, by a picture word) and a sticker of their face for the album;
// 5 -> best friends: a photo of you together for the album, and their greeting changes to "¡Mi amig{o/a} {name}!".
// Hearts show as a row over a person on the map for a moment when they rise (the new one pops), and as a row of five
// above the portrait whenever they talk (G.say with opts.who). The album's Amigos page lists everyone's hearts.
//
// API (for errands, the album and tests):
//   G.hearts.WHO               the 12 friends: mama luna rosa pepe sofia tomas marta ines gomez lucia nico canelo
//   G.hearts.get(npc)          0..5
//   G.hearts.add(npc, n, why)  -> hearts actually added (0 when capped / full / a once-a-day reason already used today).
//                              why: 'greet' | 'gift' (once a day each) | 'care' | 'errand' | 'trick' (these two skip the cap)
//   G.hearts.canAddToday(npc, why)  would add() give anything now
//   G.hearts.did(npc, why)     that reason was used today (e.g. did('rosa', 'greet'))
//   G.hearts.today(npc?)       hearts earned today by npc (or by everyone)
//   G.hearts.gift(npc, word)   +1 if it's the thing they like (once a day); -> hearts added
//   G.hearts.greet(npc)        generator: their voice greeting, once a day (yield* it at the start of a talk)
//   G.hearts.milestones(npc)   generator: the 3-heart secret + sticker and the 5-heart photo, when due (once each)
//   G.hearts.secrets[npc]      optional generator to replace someone's 3-heart secret (errands can hide things)
//   G.hearts.greeting(npc)     the line they greet you with now
//   G.hearts.row(ctx, npc, x, y, s)  draw their five hearts (s = scale)
// Saved: G.state.hearts {npc: n}, G.state.heartlog {d: 'YYYY-M-D', n: {npc: capped today}, all: {npc: today}, why: {npc: {why: 1}}},
// G.state.friends {npc: {m3: 1 (secret + sticker given), m5: 1 (photo)}}.
'use strict';
(function () {
  const H = G.hearts = {}, T = G.TILE;
  H.MAX = 5; H.DAY_CAP = 2;
  H.WHO = ['mama', 'luna', 'rosa', 'pepe', 'sofia', 'tomas', 'marta', 'ines', 'gomez', 'lucia', 'nico', 'canelo'];
  // what each friend likes as a gift (word ids; Lucía: a pink flower)
  H.LIKES = { mama: 'flor', luna: 'manzana', rosa: 'flor', pepe: 'queso', sofia: 'galleta', tomas: 'agua', marta: 'leche', ines: 'pan', gomez: 'manzana', lucia: 'flor', nico: 'pelota', canelo: 'hueso' };
  const ONCE = ['greet', 'gift'], FREE = ['errand', 'trick'];
  H.secrets = {};
  const today = () => (G.world ? G.world.today() : new Date().toDateString());
  const obj = (s, k) => { if (!s[k] || typeof s[k] !== 'object' || Array.isArray(s[k])) s[k] = {}; return s[k]; };
  function log() {
    const s = G.state; let l = s.heartlog;
    if (!l || typeof l !== 'object' || l.d !== today()) l = s.heartlog = { d: today(), n: {}, all: {}, why: {} };
    obj(l, 'n'); obj(l, 'all'); obj(l, 'why');
    return l;
  }
  const friends = npc => obj(obj(G.state, 'friends'), npc);
  H.get = npc => (G.state && G.state.hearts ? Math.max(0, Math.min(H.MAX, G.state.hearts[npc] | 0)) : 0);
  H.did = (npc, why) => !!(G.state && log().why[npc] && log().why[npc][why]);
  H.mark = (npc, why) => { obj(log().why, npc)[why] = 1; };
  H.today = npc => { if (!G.state) return 0; const a = log().all; return npc ? a[npc] | 0 : Object.keys(a).reduce((s, k) => s + (a[k] | 0), 0); };
  H.canAddToday = function (npc, why = 'care') {
    if (!G.state || H.WHO.indexOf(npc) < 0 || H.get(npc) >= H.MAX) return false;
    if (ONCE.includes(why) && H.did(npc, why)) return false;
    if (!FREE.includes(why) && (log().n[npc] | 0) >= H.DAY_CAP) return false;
    return true;
  };
  H.add = function (npc, n = 1, why = 'care') {
    if (!G.state) return 0;
    const ok = H.canAddToday(npc, why), l = log();
    if (ONCE.includes(why)) H.mark(npc, why);
    if (!ok) return 0;
    const cur = H.get(npc);
    let k = Math.min(n, H.MAX - cur);
    if (!FREE.includes(why)) k = Math.min(k, H.DAY_CAP - (l.n[npc] | 0));
    if (k <= 0) return 0;
    obj(G.state, 'hearts')[npc] = cur + k;
    if (!FREE.includes(why)) l.n[npc] = (l.n[npc] | 0) + k;
    l.all[npc] = (l.all[npc] | 0) + k;
    obj(l.why, npc)[why] = 1;
    H.show(npc, cur, cur + k);
    G.st.autosave();
    return k;
  };
  H.gift = (npc, word) => (H.LIKES[npc] === word ? H.add(npc, 1, 'gift') : 0);
  H.best = npc => H.get(npc) >= H.MAX;
  H.greeting = npc => H.best(npc) ? '¡Mi amig{o/a} {name}!' : H.get(npc) >= 1 ? '¡Hola, {name}!' : '¡Hola!';

  // ---------- the sound of a heart, made here ----------
  function chime() {
    const au = G.audio; if (!au || !au.ctx || !au.sfxGain) return;
    const ac = au.ctx;
    [[880, 0], [1175, 0.09], [1568, 0.18]].forEach(([f, at]) => {
      const t = ac.currentTime + 0.01 + at, o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      o.connect(g); g.connect(au.sfxGain); o.start(t); o.stop(t + 0.3);
    });
  }

  // ---------- drawing hearts ----------
  const HEART = ['.kk.kk.', 'kRrkrrk', 'krrrrrk', 'krrrrrk', '.krrrk.', '..krk..', '...k...'];
  const heartImg = full => G.sprite('heart7' + (full ? 'f' : 'e'), HEART, full ? { k: '#401020', r: '#f04878', R: '#ffc0d8' } : { k: '#2a2040', r: '#5a5078', R: '#6a6088' });
  H.heart = (ctx, x, y, full, s = 1) => { ctx.imageSmoothingEnabled = false; ctx.drawImage(heartImg(full), Math.round(x), Math.round(y), 7 * s, 7 * s); };
  const pops = {}; // npc -> {from, to, f0}: the last rise, for the map row and the portrait row's pulse
  // five hearts, left to right from x, y; a heart that just rose pops and sparkles
  H.row = function (ctx, npc, x, y, s = 1, n) {
    const h = n == null ? H.get(npc) : n, p = pops[npc], age = p ? G.frame - p.f0 : 1e9;
    for (let i = 0; i < H.MAX; i++) {
      const fresh = p && i >= p.from && i < p.to && age < 90, k = fresh ? Math.min(1, age / 10) : 1;
      const sc = fresh && age < 20 ? 1 + 0.6 * Math.sin(k * Math.PI) : 1, hx = x + i * 8 * s, w = 7 * s * sc;
      if (fresh && age < 6) { H.heart(ctx, hx, y, false, s); continue; }
      ctx.imageSmoothingEnabled = false; ctx.drawImage(heartImg(i < h), Math.round(hx + 3.5 * s - w / 2), Math.round(y + 3.5 * s - w / 2), Math.round(w), Math.round(w));
    }
  };
  H.rowW = (s = 1) => (H.MAX * 8 - 1) * s;
  // hearts over a person on the map when they rise (field.js -> drawTop)
  H.show = function (npc, from, to) {
    pops[npc] = { from, to, f0: G.frame };
    chime();
    const f = G.field, n = f && who(f, npc);
    if (n) { const [sx, sy] = head(f, n); for (let i = 0; i < 4; i++) G.fx.twinkle(sx + (Math.random() - 0.5) * 30, sy - 4 + (Math.random() - 0.5) * 10); }
  };
  const who = (f, npc) => f.npcs.find(n => n.id === npc && !n.hidden) || f.npcs.find(n => n.npc === npc && !n.hidden && n.talk);
  const head = (f, n) => [Math.round(n.x * T + (n.ox || 0) + 12 - f.cam.x), Math.round(n.y * T + (n.oy || 0) - f.cam.y - (n.id === 'canelo' ? 0 : 8))];
  H.drawTop = function (f, ctx) {
    for (const npc in pops) {
      const p = pops[npc], age = G.frame - p.f0; if (age > 170) continue;
      const n = who(f, npc); if (!n) continue;
      let [sx, sy] = head(f, n); const w = H.rowW() + 6;
      try { if (n.alert && n.alert()) sy -= 26; } catch (e) { } // above their thought bubble
      const a = age > 150 ? (170 - age) / 20 : 1, rise = Math.round(Math.min(1, age / 12) * 6);
      ctx.globalAlpha = a;
      ctx.fillStyle = '#10102a'; ctx.fillRect(sx - w / 2, sy - 10 - rise, w, 11); ctx.fillStyle = '#fff4f8'; ctx.fillRect(sx - w / 2 + 1, sy - 9 - rise, w - 2, 9);
      H.row(ctx, npc, sx - w / 2 + 3, sy - 8 - rise);
      ctx.globalAlpha = 1;
    }
  };
  H.pulse = npc => { const p = pops[npc]; return !!p && G.frame - p.f0 < 120; };
  // ui.js TextBox: a row of hearts above the portrait of someone who has hearts
  const greets = () => !!G.chapters && G.chapters.done('c3'); // greetings begin after chapter 3 (CURRICULUM.md 2.2)
  H.shows = npc => H.WHO.includes(npc) && !!G.state && (H.get(npc) > 0 || greets());

  // ---------- 1 heart: they call you by name as you pass ----------
  const waved = {};
  H.update = function (f) {
    if (f.locked || G.top() !== f || !f.amb || !G.state) return;
    const p = f.player;
    for (const n of f.npcs) {
      const id = n.id === 'canelo' ? null : H.WHO.includes(n.id) ? n.id : null;
      if (!id || n.hidden || !n.spec || n.moving || H.get(id) < 1) continue;
      const d = Math.abs(n.x - p.x) + Math.abs(n.y - p.y);
      if (d > 2 || d === 0 || (waved[id] != null && G.frame - waved[id] < 3600)) continue;
      if (waved[id] == null && G.frame < 240) { waved[id] = G.frame - 3000; continue; } // not the moment a map opens
      waved[id] = G.frame;
      if (n.amb) n.amb.hop = 24;
      f.amb.fx.push({ kind: 'say', s: G.fill(H.best(id) ? '¡Mi amig{o/a}!' : '¡Hola, {name}!'), o: n, dx: 0, t: 0, life: 110 });
    }
  };

  // ---------- the voice greeting (once a day per person, from chapter 3 on) ----------
  // The person waves under a sun (the morning: the first minutes of a session), a moon (the evening, once buenas noches
  // is met) or neither, and you answer: [buenos días / buenas noches / hola] when both time-of-day greetings are met,
  // else the right greeting among known words that aren't greetings (hola is never a card beside buenos días before
  // buenas noches exists: it would be right too). Then one word that is due from their pool (POOLS: what their trade
  // shows), asked for its stage (G.review.ask). Once a day each; a heart.
  H.POOLS = {
    mama: ['buenosdias', 'buenasnoches', 'perro', 'ven', 'sientate', 'hueso', 'agua', 'cama', 'pelota', 'galleta', 'casa', 'comoestas', 'bien', 'feliz', 'cansado'],
    pepe: ['hola', 'buenosdias', 'manzana', 'platano', 'naranja', 'queso', 'porfavor', 'gracias', 'si', 'no', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'rojo', 'amarillo', 'verde'],
    marta: ['hola', 'buenosdias', 'pan', 'galleta', 'leche', 'panaderia', 'porfavor', 'gracias', 'uno', 'dos', 'tres', 'cuatro', 'cinco'],
    rosa: ['hola', 'buenosdias', 'gallina', 'huevo', 'casa', 'flor', 'blanco', 'rosa', 'manzana', 'uno', 'dos', 'tres', 'gracias'],
    sofia: ['hola', 'pelota', 'rojo', 'azul', 'amarillo', 'blanco', 'pata', 'salta', 'galleta', 'feliz', 'parque'],
    nico: ['hola', 'gato', 'pato', 'cabra', 'caballo', 'conejo', 'rana', 'pajaro', 'pez', 'mariposa', 'guau', 'miau', 'cuac', 'croac', 'gira', 'verde'],
    lucia: ['hola', 'flor', 'rosa', 'amarillo', 'rojo', 'blanco', 'azul', 'mariposa', 'fuente', 'triste', 'feliz', 'bien', 'cansado'],
    tomas: ['hola', 'adios', 'carta', 'casa', 'escuela', 'parque', 'panaderia', 'biblioteca', 'granja', 'fuente', 'cansado', 'agua'],
    gomez: ['hola', 'buenosdias', 'parque', 'banco', 'arbol', 'conejo', 'pajaro', 'busca', 'perro'],
    luna: ['hola', 'buenosdias', 'escuela', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'comoestas', 'bien'],
    ines: ['hola', 'biblioteca', 'adios', 'gracias'],
  };
  const GREET = ['hola', 'buenosdias', 'buenasnoches', 'adios', 'comoestas'];
  H.greetKind = function () {
    const met = id => G.st.seen(id);
    if (G.day && G.day.over() && met('buenasnoches')) return 'noches';
    if (G.sessionTime < 300 && met('buenosdias')) return 'dias';
    return 'hola';
  };
  H.greet = function* (npc) {
    if (!G.state || !greets() || npc === 'canelo' || !H.WHO.includes(npc) || H.did(npc, 'greet')) return false;
    const nm = G.nameOf(npc) || '', kind = H.best(npc) ? 'best' : H.greetKind(), met = id => G.st.seen(id);
    const ans = kind === 'noches' ? 'buenasnoches' : kind === 'dias' ? 'buenosdias' : 'hola';
    const both = met('buenosdias') && met('buenasnoches') && met('hola');
    const plain = G.words.list(2).concat(G.words.list(1)).filter((id, i, a) => a.indexOf(id) === i && !GREET.includes(id) && G.data.words[id].topic !== 'saludos' && G.iconDrawn(id));
    let others = both ? ['buenosdias', 'buenasnoches', 'hola'].filter(k => k !== ans) : plain.sort(() => G.rand() - 0.5).slice(0, 2);
    if (others.length < 2) others = others.concat(G.words.list(1).filter(k => k !== ans && !others.includes(k) && !(ans === 'buenosdias' && k === 'hola'))).slice(0, 2);
    const show = kind === 'noches' ? { icon: 'noche' } : kind === 'dias' ? { icon: 'sol' } : { icon: 'hola' };
    const Q = {
      best: ['¡Mi amig{o/a} {name}!', 'My friend {name}! (wave back: say hi)'],
      dias: ['¡...!', 'The sun is up: ' + nm + ' says good morning. Say it back!'],
      noches: ['¡...!', 'The moon is out: ' + nm + ' says good night. Say it back!'],
      hola: ['¡...!', nm + ' waves at you. Say hi back!'],
    }[kind];
    if (G.vocabLog) G.vlog.greet = npc; // (the dev-only log, vocablog.js: tags the greeting's words)
    try { yield* G.chapters.ask(npc, nm + ': ' + Q[0], Q[1], ans, others, { show: kind === 'best' ? null : show }); } finally { if (G.vlog) G.vlog.greet = null; }
    H.add(npc, 1, 'greet'); // (marks today's greeting even when no heart is left to give)
    yield 20;
    // one word that's due, from what they know about
    const pool = H.POOLS[npc] || [];
    const due = G.review.next({ filter: id => pool.includes(id) && !GREET.includes(id) });
    if (due) { if (G.vocabLog) G.vlog.greet = npc; try { yield* G.review.ask(due, { who: npc }); } finally { if (G.vlog) G.vlog.greet = null; } }
    yield* H.milestones(npc);
    return true;
  };

  // ---------- 3 hearts: a secret and a sticker; 5 hearts: a photo together ----------
  const PAGE_PLACE = { saludos: 'fuente', numeros: 'fuente', comida: 'casa', colores: 'parque', pueblo: 'biblioteca', animales: 'parque', granja: 'granja', sonidos: 'granja', cosas: 'banco', sentir: 'escuela', mascota: 'casa' };
  const T_ = (t, en) => ({ t, en });
  const say = (npc, ...pages) => G.say(pages, { portrait: G.portraitOf(npc), name: G.nameOf(npc) || (npc === 'canelo' ? 'Canelo' : null), who: npc });
  function* secret(npc) {
    if (npc === 'canelo') { yield say(npc, T_('¡Guau, guau!', 'Woof, woof! (he wags his tail)')); return; }
    const pg = G.data.pageOrder.find(p => G.pages.ready(p) && PAGE_PLACE[p] && p !== 'saludos'); // a page puzzle waiting (intro.js)
    if (!pg) { yield say(npc, T_('¡Eres muy simpátic{o/a}, {name}!', 'You\'re very nice, {name}!')); return; }
    yield say(npc, T_('¡Un secreto! Una página... ¡[' + PAGE_PLACE[pg] + ']!', 'A secret! A notebook page... near the ' + G.data.words[PAGE_PLACE[pg]].en.replace('the ', '') + '!'));
  }
  H.milestones = function* (npc) {
    if (!G.state || !H.WHO.includes(npc)) return;
    const fr = friends(npc), h = H.get(npc);
    if (h >= 3 && !fr.m3) {
      fr.m3 = 1; G.st.autosave();
      yield* (H.secrets[npc] || secret)(npc);
      yield say(npc, T_('¡Para ti!', 'For you! (a sticker for your album)'));
      yield H.card(npc, 'sticker');
    }
    if (h >= 5 && !fr.m5) {
      fr.m5 = 1; G.st.autosave();
      yield say(npc, T_(npc === 'canelo' ? '¡Guau! ¡Guau, guau!' : '¡{name}! ¡Mi amig{o/a}!', npc === 'canelo' ? 'Woof! (Canelo is your best friend)' : '{name}! My friend! (best friends)'));
      yield H.card(npc, 'photo');
    }
  };
  H.sticker = npc => !!(G.state && G.state.friends && G.state.friends[npc] && G.state.friends[npc].m3);
  H.photo = npc => !!(G.state && G.state.friends && G.state.friends[npc] && G.state.friends[npc].m5);

  // a face (portrait, or Canelo's sprite) in a w x w square
  H.face = function (ctx, npc, x, y, w, t) {
    const ps = npc === 'player' ? G.st.playerSpec().portrait : G.portraitOf(npc);
    if (ps) { ctx.save(); ctx.translate(x, y); ctx.scale(w / 52, w / 52); G.drawPortrait(ctx, ps, 0, 0, t || 0); ctx.restore(); return; }
    const sp = G.data.npcs[npc] && G.data.npcs[npc].map; if (!sp) return;
    ctx.fillStyle = '#5a8a40'; ctx.fillRect(x, y, w, w);
    ctx.imageSmoothingEnabled = false; ctx.drawImage(G.unitSprite(sp, 'down', ((t || 0) >> 5) & 1), x + w * 0.1, y + w * 0.08, w * 0.8, w * 0.8);
  };

  // ---------- the sticker / photo card ----------
  class FriendCard {
    constructor(npc, kind, w) { G.toastT = 0; this.transparent = true; this.npc = npc; this.kind = kind; this.w = w; this.t = 0; }
    onEnter() { G.audio.jingle('item'); }
    update() {
      this.t++;
      if (this.t === 1) { G.fx.confetti(G.W / 2 - 80, 150, -1, 20); G.fx.confetti(G.W / 2 + 80, 150, 1, 20); }
      if (this.t > 30 && (G.input.p('A') || G.input.p('B') || G.input.tap())) { G.audio.sfx('ok'); G.pop(); this.w.resolve(); }
    }
    draw(ctx) {
      const u = Math.min(1, this.t / 14), s = 0.3 + 0.7 * G.fx.easeBack(u), cx = G.W / 2, cy = 100;
      ctx.globalAlpha = 0.5 * u; ctx.fillStyle = '#080c28'; ctx.fillRect(0, 0, G.W, G.H); ctx.globalAlpha = 1;
      ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
      if (this.kind === 'sticker') { // a round sticker with a scalloped gold edge
        for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2 + this.t / 60; ctx.fillStyle = '#f8c820'; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * 44, cy + Math.sin(a) * 44, 8, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(cx, cy, 44, 0, Math.PI * 2); ctx.fill();
        ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, 40, 0, Math.PI * 2); ctx.clip(); H.face(ctx, this.npc, cx - 40, cy - 40, 80, this.t); ctx.restore();
      } else { // a photo: you and your friend, in a white frame, a little tilted
        ctx.translate(cx, cy); ctx.rotate(-0.05); ctx.translate(-cx, -cy);
        ctx.fillStyle = '#10102a'; ctx.fillRect(cx - 66, cy - 44, 132, 96); ctx.fillStyle = '#fffaf0'; ctx.fillRect(cx - 65, cy - 43, 130, 94);
        ctx.fillStyle = '#88c8f8'; ctx.fillRect(cx - 58, cy - 36, 116, 64);
        H.face(ctx, 'player', cx - 56, cy - 34, 56, this.t); H.face(ctx, this.npc, cx, cy - 34, 56, this.t);
        G.text(ctx, '\u0003', cx - 3, cy - 40 + 2, '#f04878', null);
        G.textC(ctx, G.fill('¡Mejores amigos!'), cx, cy + 34, '#a05020', null);
      }
      ctx.restore();
      const nm = G.nameOf(this.npc) || 'Canelo';
      if (u >= 1) { G.bigText(ctx, nm, cx, cy + 62, 2, '#f8e060'); H.row(ctx, this.npc, cx - H.rowW(2) / 2, cy + 84, 2); }
      if (this.t > 30 && (this.t >> 4) % 2 === 0) G.text(ctx, '\u0001', G.W - 22, G.H - 16, '#f8e060');
    }
  }
  H.card = function (npc, kind) { const w = new G.Wait(); G.push(new FriendCard(npc, kind, w)); return w; };
})();

</script>
<script>/* src/pet.js */
// ===== Round B: Canelo is your dog. Tricks learned by voice, care, his bed at home =====
// Mamá gives you Canelo (after the Saludos errand; her "!" shows): "¡Canelo es tu perro!", the Mi perro notebook page,
// and his first trick. Each trick is taught by someone (who says it, Canelo does it for them, then you try once):
//   ¡Siéntate! Mamá (sits) -> ¡Ven! Mamá (runs off, then back to you) -> ¡Dame la pata! Sofía (lifts a paw)
//   -> ¡Salta! Sofía (jumps) -> ¡Gira! Nico (spins). One at a time, in this order; a teacher's thought bubble shows the
//   trick's picture when it's their turn.
// Tap Canelo (or A facing him): the pet menu, big picture cards over the map. Top row: his tricks (known ones gold, the
// one he's learning with its paw prints 1-2-3, the next one with its teacher's face, the rest "?"); bottom row: care
// (el hueso, la galleta, el agua, la pelota, a pat, la cama). The mic sits beside the tricks: SAY a command and he does
// it (a speaking star, once per word per day; a care word works too: "¡la pelota!" throws the ball). Tapping works too.
// Learning a trick takes 3 good tries: tapping its card asks "¡Dile a Canelo!" (G.ask with {word} cards, so the mic is
// built in); saying it straight at the menu counts too. Try 1: he tilts his head and half does it; try 2: nearly;
// try 3: he does it, confetti and a heart (and the gold card for the command once the word model says it's remembered).
// Care: food (crunch crunch, el hueso is his favourite: a gift heart), water (lap lap), the ball (thrown; he fetches
// it), a pat (hearts float up), la cama (at home he goes to his bed and sleeps, z z z; he sleeps there at night too).
// Every action shows Canelo's own hearts (G.hearts 'canelo': care +1 up to the daily cap, +1 per trick learned).
// A best-friend Canelo (5 hearts) does a little happy spin when you open the menu.
//
// API (errands, tests): G.pet.TRICKS [{id, by, anim}], G.pet.mine() (he's your dog: flags.petStart),
//   G.pet.knows(id) (3 good tries), G.pet.tries(id), G.pet.learning() (the trick being learned, or null),
//   G.pet.known() (ids), G.pet.canTeach(who) (the trick id `who` would teach now, or null),
//   G.pet.teach(id, who) generator (the teaching scene), G.pet.practice(id) generator (one good try: the question, then
//   Canelo's attempt), G.pet.command(id, o) generator (a G.ask "¡Dile a Canelo!" for any trick, then he does it: for
//   shows; o.prompt, o.pool), G.pet.trick(id) generator (he just does it), G.pet.play(kind, o) generator (any animation:
//   sit come paw jump spin huh eat drink fetch pet dance wake), G.pet.menu() generator (the pet menu),
//   G.pet.npc(f) (Canelo on this map), G.pet.sleeping(f).
// Saved: G.state.pet = {tricks: {id: good tries 0..3}, learning: id | null, sleep: bool}, flags.petStart.
'use strict';
(function () {
  const P = G.pet = {}, T = G.TILE;
  const F = () => G.state.flags, S = G.st;
  const TT = (t, en) => ({ t, en });
  // ven and siéntate are learned in the story (chapters 1 and 3); the others are taught by Sofía and Nico (canTeach) for
  // the older errands after chapter 10, until chapters 14 and 17 teach them
  P.TRICKS = [{ id: 'ven', by: 'mama', anim: 'come', story: true }, { id: 'sientate', by: 'mama', anim: 'sit', story: true }, { id: 'pata', by: 'sofia', anim: 'paw' },
    { id: 'salta', by: 'sofia', anim: 'jump' }, { id: 'gira', by: 'nico', anim: 'spin' }];
  P.CARE = ['hueso', 'galleta', 'agua', 'pelota', 'mimo', 'cama'];
  P.NEED = 3;
  P.BED = [7, 5]; P.BOWL = [1, 4]; // at home (casa): his cushion and his bowl
  const trick = id => P.TRICKS.find(t => t.id === id);
  const st = () => {
    const s = G.state; if (!s.pet || typeof s.pet !== 'object' || Array.isArray(s.pet)) s.pet = {};
    if (!s.pet.tricks || typeof s.pet.tricks !== 'object') s.pet.tricks = {};
    return s.pet;
  };
  P.state = st;
  P.mine = () => !!(G.state && G.state.flags.petStart);
  P.tries = id => Math.min(P.NEED, st().tricks[id] | 0);
  P.knows = id => P.tries(id) >= P.NEED;
  P.learning = () => { const l = G.state && st().learning; return l && trick(l) && !P.knows(l) ? l : null; };
  P.known = () => P.TRICKS.filter(t => P.knows(t.id)).map(t => t.id);
  P.next = () => P.TRICKS.find(t => !P.knows(t.id)) || null;
  P.canTeach = who => {
    if (!G.state || !P.mine() || P.learning() || !(G.chapters && G.chapters.allWrittenDone())) return null;
    const n = P.TRICKS.find(t => !P.knows(t.id) && !t.story); return n && n.by === who ? n.id : null;
  };
  P.startReady = () => false; // (Canelo becomes yours in chapter 1 now: content/es/story-c01-c10.js)
  P.npc = (f = G.field) => (f && f.npcs.find(n => n.id === 'canelo' && !n.hidden)) || null;
  P.sleeping = (f = G.field) => !!(f && G.state && f.mapId === 'casa' && P.mine() && (st().sleep || (G.day && G.day.over())) && !f.petAwake);

  // ---------- little sounds ----------

    for (const e of fx) {
      const k = e.t / e.life, x = Math.round(e.x - cx), y = Math.round(e.y - cy);
      ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
      if (e.k === 'heart') G.text(ctx, '\u0003', x - 2, y, '#f04878', '#401020');
      else if (e.k === 'dust') { ctx.fillStyle = '#e8dcc0'; const r = 1 + Math.round(k * 2); ctx.fillRect(x - r, y - r, r * 2, r * 2); }
      else if (e.k === 'crumb') { ctx.fillStyle = '#c89048'; ctx.fillRect(x, y, 2, 2); }
      else if (e.k === 'drop') { ctx.fillStyle = '#88c8f8'; ctx.fillRect(x, y, 1, 2); }
      else if (e.k === 'spark') { ctx.fillStyle = '#fff8b0'; ctx.fillRect(x - 2, y, 5, 1); ctx.fillRect(x, y - 2, 1, 5); }
      else if (e.k === 'q' || e.k === 'ex' || e.k === 'txt') {
        const s = e.k === 'q' ? '?' : e.k === 'ex' ? '!' : e.s, w = G.textWidth(s) + 8, bob = Math.round(Math.sin(e.t / 5) * 1.5);
        G.win(ctx, x - w / 2, y - 16 + bob, w, 13, { fill1: '#ffffff', fill2: '#e8e8f0', alpha: 1 });
        G.text(ctx, s, x - w / 2 + 4, y - 13 + bob, e.k === 'txt' ? '#2860a8' : '#c02020', null);
      }
      ctx.globalAlpha = 1;
    }
    // learning a trick: a thought bubble over him with its picture and its paw prints (1-2-3)
    const n = P.npc(f), l = P.learning();
    if (n && l && !n.pa && !P.sleeping(f) && G.top() === f && !f.locked) {
      const x = Math.round(n.x * T + n.ox - cx) + 12, y = Math.round(n.y * T + n.oy - cy) - 30 + Math.round(Math.sin(f.t / 8) * 2);
      G.win(ctx, x - 13, y - 4, 26, 26, { fill1: '#ffffff', fill2: '#e8e8f0', alpha: 1 });
      G.drawIcon16(ctx, l, x - 8, y - 1);
      for (let i = 0; i < P.NEED; i++) { ctx.fillStyle = i < P.tries(l) ? '#e85078' : '#c8c0d8'; ctx.fillRect(x - 8 + i * 6, y + 16, 5, 3); }
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 1, y + 22, 3, 3); ctx.fillRect(x, y + 26, 2, 2);
    }
  };

  // ---------- playing animations from a script ----------
  P.play = function* (k, o = {}) {
    const f = G.field, n = P.npc(f); if (!n) { yield 10; return; }
    while (n.moving || n.slide) yield 1;
    const a = start(f, n, k, o);
    while (n.pa === a && G.frame - a.f0 < a.len) yield 1;
    if (n.pa === a) n.pa = null;
  };
  const ANIM = id => (trick(id) || {}).anim;
  P.trick = function* (id, o = {}) { yield* P.play(ANIM(id), o); };
  const dogXY = () => { const f = G.field, n = P.npc(f); return n ? [Math.round(n.x * T + n.ox + 12 - f.cam.x), Math.round(n.y * T + n.oy - f.cam.y)] : [G.W / 2, G.H / 2]; };
  // a speaking star for saying a command or a care word to Canelo (once per word per day, like say-it-back)
  function spokeStar(id) {
    const sb = G.state.sayback || (G.state.sayback = {}), today = G.world.today();
    if (sb[id] === today) { if (G.vocabLog) G.vlog('said', id, { via: 'PetMenu', star: false }); return false; } // (the dev-only log, vocablog.js: said, no star today)
    sb[id] = today;
    const [x, y] = dogXY(); G.mic.award(id, x, y - 8); G.fx.say('¡Bien dicho!', x, y - 26, '#a8f0ff', true);
    return true;
  }
  P.spokeStar = spokeStar;
  // the other cards of a "¡Dile a Canelo!" question: commands and care words he knows of, sounding different
  function others(id, pool) {
    const all = (pool || P.TRICKS.map(t => t.id).concat(['hueso', 'pelota', 'agua', 'cama'])).filter(k => k !== id && G.data.words[k]);
    return all.filter(k => !(id === 'ven' && k === 'bien'));
  }
  // one question: "¡Dile a Canelo!" (picture cards; say it or tap it) -> true if right on the first try
  P.ask = function* (id, o = {}) {
    const c = G.wordChoices(id, [id].concat(others(id, o.pool)), 3, { label: k => LABEL[k] || null });
    // (the trick's picture over the question only while it's new: once met, the child has to remember it)
    return yield* G.ask({ prompt: o.prompt || '¡Dile a Canelo!', en: o.en || 'Tell Canelo! (say the trick, or tap it)', show: o.show === false || S.seen(id) ? null : id, choices: c.choices, answer: c.answer, layout: 'cards', who: 'canelo' });
  };
  // for errands (a show): ask for any trick, then he does it
  P.command = function* (id, o = {}) { const first = yield* P.ask(id, o); yield* P.trick(id, { amp: P.knows(id) ? 1 : 0.7 }); return first; };
  // one good try at the trick he's learning; spoken: it was said straight at the menu (no question)
  P.practice = function* (id, spoken) {
    id = id || P.learning(); if (!id) return;
    if (!spoken) yield* P.ask(id); // (G.ask credits the word, words.js)
    else G.words.answerRight(id, { said: true, mode: 'both', noStar: true }); // said at the menu, where its card is written
    const p = st(); p.learning = id; p.tricks[id] = Math.min(P.NEED, (p.tricks[id] | 0) + 1);
    const k = p.tricks[id], [x, y] = dogXY();
    S.autosave();
    if (k === 1) { yield* P.play('huh'); yield* P.trick(id, { amp: 0.35 }); }
    else if (k === 2) yield* P.trick(id, { amp: 0.7 });
    else yield* P.trick(id, { amp: 1 });
    if (k < P.NEED) { puff('txt', x + G.field.cam.x, y + G.field.cam.y - 6, { s: k + '/' + P.NEED, life: 70 }); G.audio.sfx('select'); yield 30; return; }
    // learned!
    p.learning = null; S.autosave();
    P.sound('tada'); G.fx.confetti(x - 30, y + 10, -1, 16); G.fx.confetti(x + 30, y + 10, 1, 16);
    G.fx.say('¡' + G.baseForm(id).replace(/^¡|!$/g, '') + '!', x, y - 30, '#f8e060', true);
    if (G.hearts) G.hearts.add('canelo', 1, 'trick');
    yield 50;
    yield G.learnWords([id]);
    if (G.hearts) yield* G.hearts.milestones('canelo');
  };
  // the teaching scene: the teacher says it, Canelo does it for them, then your first try
  const tsay = (who, ...pages) => G.say(pages, { portrait: G.portraitOf(who), name: G.nameOf(who), who });
  P.teach = function* (id, who) {
    const f = G.field, n = P.npc(f), p = st();
    p.learning = id; p.tricks[id] = p.tricks[id] | 0; if (G.vocabLog) G.vlog('shown', id, { via: 'pet-teach', who }); S.see(id); S.autosave();
    if (n) { while (n.moving) yield 1; P.place(f, n); }
    yield tsay(who, TT('¡Mira! Canelo... ¡[' + id + ']!', 'Look! Canelo... (watch what he does)'));
    yield* P.trick(id, { amp: 1 });
    yield tsay(who, TT('¡Muy bien, Canelo! ¡Ahora tú, {name}!', 'Good dog! Now you, {name}!'));
    yield* P.practice(id, false);
    yield tsay(who, TT('¡Otra vez! Toca a Canelo. ¡[' + id + ']!', 'Again! Tap Canelo and practice: three times.'));
  };
  // Mamá gives you Canelo (her "!" after the Saludos errand), the Mi perro page and his first trick
  P.start = function* (f) {
    f = f || G.field;
    F().canelo = true; F().petStart = true; S.autosave();
    let n = P.npc(f);
    if (!n) {
      const def = (G.maps[f.mapId].npcs || []).find(d => d.id === 'canelo') || { id: 'canelo', npc: 'canelo', x: 4, y: 5, dir: 'up' };
      n = f.addNpc(Object.assign({}, def, { x: 4, y: 5 })); n.ghost = true;
    }
    yield tsay('mama', TT('¡{name}! ¡Mira!', '{name}! Look!'));
    P.place(f, n); yield 16; yield* P.play('dance');
    yield tsay('mama', TT('¡Canelo es tu [perro]!', 'Canelo is your dog!'));
    if (G.animals) G.animals.meet('perro');
    yield* P.play('pet');
    yield tsay('mama', TT('¡Para ti!', 'For you! (a page about Canelo)'));
    if (!S.hasPage('mascota')) yield* G.findPage('mascota');
    yield* P.teach('sientate', 'mama');
  };

  // ---------- the pet menu ----------
  const LABEL = { pata: 'la pata' };
  const W = id => G.data.words[id];
  class PetMenu {
    constructor(w) {
      G.toastT = 0; this.transparent = true; this.w = w; this.t = 0; this.won = null;
      const C = this.cards(), k = C.findIndex(c => c.st === 'learn');
      this.sel = k >= 0 ? k : Math.max(0, C.findIndex(c => c.st === 'known'));
      if (this.sel < 0 || C[this.sel].st === 'lock') this.sel = 5;
      this.mic = G.mic && G.mic.on() ? new G.MicBtn(this, { rect: () => this.micRect(), ready: () => this.t > 10 && !this.won, heard: a => this.heard(a) }) : null;
    }
    onEnter() { if (this.mic) this.mic.arm(); }
    onExit() { if (this.mic) this.mic.off(); }
    home() { return !!G.field && G.field.mapId === 'casa'; }
    cards() {
      const l = P.learning(), nx = P.TRICKS.find(t => !P.knows(t.id) && t.id !== l);
      return P.TRICKS.map(tr => ({ id: tr.id, row: 0, by: tr.by, st: P.knows(tr.id) ? 'known' : l === tr.id ? 'learn' : nx && nx.id === tr.id ? 'next' : 'lock' }))
        .concat(P.CARE.map(id => ({ id, row: 1, st: id === 'cama' && !this.home() ? 'away' : 'care' })));
    }
    rect(k) { return k < 5 ? { x: 9 + k * 54, y: 136, w: 52, h: 46 } : { x: 10 + (k - 5) * 44, y: 184, w: 40, h: 38 }; }
    micRect() { return { x: 279, y: 140, w: 36, h: 36 }; }
    closeXY() { return [G.W - 26, 6]; }
    hintXY() { const k = this.cards().findIndex(c => c.st === 'learn'); if (k < 0) return null; const r = this.rect(k); return [r.x + r.w / 2, r.y + r.h / 2]; }
    usable(c) { return c.st === 'known' || c.st === 'learn' || c.st === 'care' || c.st === 'away'; }
    heard(alts) {
      const C = this.cards(), targets = C.map(c => (c.st === 'known' || c.st === 'learn' || c.st === 'care') && W(c.id) && S.seen(c.id) ? G.mic.target({ word: c.id }) : null); // (a word not met yet waits for its chapter)
      const k = G.mic.best(targets, alts, C.findIndex(c => c.st === 'learn'));
      if (k < 0) { this.mic.miss(); return; }
      this.mic.win(); this.pick(k, true);
    }
    pick(k, spoken) {
      const c = this.cards()[k]; this.sel = k;
      if (!this.usable(c)) { G.audio.sfx('boop'); const r = this.rect(k); G.fx.say('?', r.x + r.w / 2, r.y - 6, '#ffd8a8'); return; }
      G.audio.sfx('ok');
      if (!spoken && c.st !== 'learn' && W(c.id)) G.speak((c.row === 0 ? '¡' + G.baseForm(c.id) + '!' : G.baseForm(c.id)));
      this.won = { k, t: 0, v: { id: c.id, spoken: !!spoken, st: c.st } };
    }
    update() {
      this.t++;
      if (this.won) { if (this.mic) { this.mic.t++; if (this.mic.pop) this.mic.pop--; } if (++this.won.t >= (this.won.v.spoken ? 24 : 10)) { G.pop(); this.w.resolve(this.won.v); } return; }
      if (this.mic && this.mic.update()) return;
      const C = this.cards(), d = G.input.repDir(14, 6);
      if (d === 'left' || d === 'right') { const row = this.sel < 5 ? [0, 5] : [5, 11], n = row[1] - row[0]; this.sel = row[0] + ((this.sel - row[0] + (d === 'left' ? -1 : 1) + n) % n); G.audio.sfx('cursor'); }
      if (d === 'up' || d === 'down') { // the card nearest above / below
        const r = this.rect(this.sel), cx = r.x + r.w / 2, want = d === 'up' ? [0, 5] : [5, 11];
        if ((d === 'up') === (this.sel >= 5)) { let b = want[0], bd = 1e9; for (let k = want[0]; k < want[1]; k++) { const q = this.rect(k), dd = Math.abs(q.x + q.w / 2 - cx); if (dd < bd) { bd = dd; b = k; } } this.sel = b; G.audio.sfx('cursor'); }
      }
      if (G.input.p('C') && W(C[this.sel].id)) G.speak(G.baseForm(C[this.sel].id));
      if (G.input.tap()) {
        if (G.closeHit(...this.closeXY())) { this.close(); return; }
        const k = C.findIndex((c, k) => G.tapIn(this.rect(k)));
        if (k >= 0) { this.pick(k); return; }
        const tp = G.input.tap(); if (tp.y < 128 && !G.tapIn(4, 4, 104, 28)) { this.close(); return; } // a tap on the map above closes it
        return;
      }
      if (G.input.p('A')) this.pick(this.sel);
      else if (G.input.p('B')) this.close();
    }
    close() { G.audio.sfx('cancel'); G.pop(); this.w.resolve(null); }
    draw(ctx) {
      const C = this.cards(), slide = Math.round(Math.max(0, 1 - this.t / 8) * 40);
      ctx.save(); ctx.translate(0, slide);
      G.win(ctx, 4, 130, G.W - 8, 92);
      C.forEach((c, k) => {
        const r = this.rect(k), sel = k === this.sel, mine = this.won && this.won.k === k, bob = sel && !this.won ? Math.round(Math.sin(this.t / 6) * 1.5) : 0;
        const y = r.y - bob, lock = c.st === 'lock' || c.st === 'next';
        if (mine) { ctx.fillStyle = (this.won.t >> 2) & 1 ? '#fff8c0' : (this.won.v.spoken ? '#70e0ff' : '#f8d040'); ctx.fillRect(r.x - 2, y - 2, r.w + 4, r.h + 4); }
        const fill = lock ? { fill1: '#3a3e58', fill2: '#24263a' } : c.st === 'learn' ? { fill1: '#c04880', fill2: '#802858' } : sel ? { fill1: '#3a56c8', fill2: '#1c2c8c' } : c.row ? { fill1: '#2c7a4a', fill2: '#14502a' } : {};
        G.win(ctx, r.x, y, r.w, r.h, Object.assign({ alpha: 1 }, fill));
        if (sel) { ctx.strokeStyle = '#f8e060'; ctx.lineWidth = 1; ctx.strokeRect(r.x + 0.5, y + 0.5, r.w - 1, r.h - 1); }
        if (c.row === 0) {
          if (c.st === 'lock') G.bigText(ctx, '?', r.x + r.w / 2, y + 12, 2, '#6a6e90', null);
          else if (c.st === 'next') { // who teaches it next: their little face, and the trick, faded
            ctx.globalAlpha = 0.35; G.drawIcon16(ctx, c.id, r.x + 9, y + 4, 2); ctx.globalAlpha = 1;
            ctx.drawImage(G.unitSprite(G.data.npcs[c.by].map, 'down', (this.t >> 5) & 1), r.x + r.w - 26, y + r.h - 28);
            G.text(ctx, '?', r.x + 6, y + r.h - 12, '#f8e060');
          } else {
            G.drawIcon16(ctx, c.id, r.x + 9, y + 2, 2);
            const lab = LABEL[c.id] || G.baseForm(c.id);
            G.textC(ctx, lab, r.x + r.w / 2, y + 35, c.st === 'known' ? '#f8d860' : '#ffffff');
            if (c.st === 'learn') for (let i = 0; i < P.NEED; i++) drawPaw(ctx, r.x + 6 + i * 14, y + 4, i < P.tries(c.id));
            if (c.st === 'known') G.text(ctx, '\u0005', r.x + r.w - 9, y + 3, '#f8d040');
          }
        } else {
          ctx.globalAlpha = c.st === 'away' ? 0.45 : 1;
          if (c.id === 'mimo') { G.drawIcon16(ctx, 'perro', r.x + 4, y + 3, 2); G.text(ctx, '\u0003', r.x + r.w - 12, y + 4, '#f04878', '#401020'); G.text(ctx, '\u0003', r.x + r.w - 16, y + 10, '#f87898', '#401020'); }
          else G.drawIcon16(ctx, c.id, r.x + 4, y + 3, 2);
          ctx.globalAlpha = 1;
          if (c.st === 'away') G.drawIcon16(ctx, 'casa', r.x + r.w - 15, y + r.h - 15);
        }
        if (sel && !this.won && (this.t >> 3) % 4 !== 3) G.textC(ctx, '\u0001', r.x + r.w / 2, y - 9, '#f8e060');
      });
      ctx.restore();
      // his name and hearts, top left
      G.win(ctx, 4, 4, 104, 28);
      G.drawIcon16(ctx, 'perro', 9, 10);
      G.text(ctx, 'Canelo', 28, 9, '#f8e060');
      if (G.hearts) G.hearts.row(ctx, 'canelo', 28, 19);
      G.closeBtn(ctx, ...this.closeXY());
      if (this.mic && slide === 0 && (!this.won || this.won.v.spoken)) this.mic.draw(ctx);
    }
  }
  function drawPaw(ctx, x, y, on) {
    const c = on ? '#ffe070' : 'rgba(255,255,255,0.35)';
    ctx.fillStyle = c; ctx.fillRect(x + 2, y + 4, 5, 4); ctx.fillRect(x + 1, y + 5, 7, 2);
    ctx.fillRect(x, y + 2, 2, 2); ctx.fillRect(x + 3, y, 2, 3); ctx.fillRect(x + 7, y + 2, 2, 2);
  }
  P.openMenu = function () { const w = new G.Wait(); G.push(new PetMenu(w)); return w; };

  // the whole thing, from Canelo's talk (field locked): the menu, what was picked, again, until closed
  P.menu = function* (f, n) {
    f = f || G.field; n = n || P.npc(f); if (!n) return;
    while (n.moving) yield 1;
    if (G.animals) G.animals.meet('perro');
    if (P.sleeping(f)) { f.petAwake = true; yield* P.play('wake'); }
    P.place(f, n); yield 10;
    lift(f, n);
    if (G.hearts && G.hearts.best('canelo') && !f.petDanced) { f.petDanced = true; yield* P.play('dance'); } else P.sound('bark');
    while (true) {
      const r = yield P.openMenu(); const v = r.result;
      if (!v) break;
      const end = yield* P.act(v);
      if (end) break;
      P.place(f, n); lift(f, n);
    }
    f.camShift = 0;
  };
  // the menu covers the bottom of the screen: lift the view so you and Canelo stay in sight above it
  function lift(f, n) {
    f.camShift = 0;
    const cam = f.camTarget(), bottom = Math.max(n.y, f.player.y) * T + T - cam.y;
    f.camShift = bottom > 118 ? Math.min(96, bottom - 116) : 0;
  }
  const careHeart = () => { if (G.hearts) G.hearts.add('canelo', 1, 'care'); };
  // one thing from the menu (or said to Canelo) -> true when the menu shouldn't come back (he went to sleep)
  P.act = function* (v) {
    const f = G.field, id = v.id, spoken = !!v.spoken;
    if (trick(id)) {
      if (P.knows(id)) { if (spoken) { spokeStar(id); G.words.answerRight(id, { said: true, mode: 'both', noStar: true }); } yield* P.trick(id); careHeart(); G.fx.say('¡Muy bien!', ...dogXY().map((q, i) => q - (i ? 26 : 0)), '#f8e060', true); yield 10; }
      else if (id === P.learning()) { if (spoken) spokeStar(id); yield* P.practice(id, spoken); }
      if (G.hearts) yield* G.hearts.milestones('canelo');
      return false;
    }
    if (W(id)) { if (G.vocabLog && !spoken) G.vlog('picked', id, { via: 'pet-menu' }); S.see(id); }
    let learnIt = false;
    // said from its picture (the care cards have no words): a retrieval that can make it gold (words.js)
    if (spoken) { spokeStar(id); learnIt = !!(W(id) && G.words.answerRight(id, { said: true, mode: 'say', noStar: true }).gold); }
    if (id === 'hueso' || id === 'galleta') { yield* P.play('eat', { item: id }); if (!(G.hearts && G.hearts.gift('canelo', id))) careHeart(); }
    else if (id === 'agua') { yield* P.play('drink'); careHeart(); }
    else if (id === 'pelota') { yield* P.play('fetch'); careHeart(); }
    else if (id === 'mimo') { yield* P.play('pet'); careHeart(); }
    else if (id === 'cama') {
      if (f.mapId !== 'casa') { yield* P.play('huh'); const [x, y] = dogXY(); puff('txt', x + f.cam.x, y + f.cam.y - 6, { s: 'la casa', life: 70 }); yield 30; }
      else {
        const n = P.npc(f); st().sleep = true; f.petAwake = false; S.autosave();
        if (n) { n.ox += (n.x - P.BED[0]) * T; n.oy += (n.y - P.BED[1]) * T; n.x = P.BED[0]; n.y = P.BED[1]; n.slide = true; }
        yield 24; P.sound('snore');
        if (learnIt) yield G.learnWords(['cama'], { noMic: true });
        return true;
      }
    }
    if (learnIt) yield G.learnWords([id], { noMic: true });
    if (G.hearts) yield* G.hearts.milestones('canelo');
    return false;
  };

  // ---------- the night (day.js): asleep on his cushion; up again in the morning ----------
  P.night = function (f) { if (!G.state || !P.mine()) return; st().sleep = true; const n = P.npc(f); if (n) { n.pa = null; n.x = P.BED[0]; n.y = P.BED[1]; n.ox = n.oy = 0; n.dir = 'left'; } };
  P.morning = function (f) { if (!G.state || !P.mine()) return; st().sleep = false; const n = P.npc(f); if (n) start(f, n, 'wake'); };
})();

</script>
<script>/* src/album.js */
// ===== Round B: the animal album (from the field menu's paw) and the Amigos page (everyone's hearts) =====
// One card per animal in G.animals.list() order. Not met yet: a dark silhouette and "? ? ?". Seen (tapped) but its word
// not met yet: its picture and "?". Met: its picture, its name ("el gato") and its sound ("¡Miau!"); a little mic once its name was said out loud (say-it-back), a gold star
// once it was counted (Luna's animal count: G.album.count(id)). Tap a met card (or A on it): it hops and you hear its
// name and its sound. "7/11" at the top, and a bar that fills; the day the last one is met the album throws a party
// (confetti, a fanfare) and its title becomes "¡Amig{o/a} de los animales!" with a gold ribbon.
// The twelfth card is "Amigos": a page with everyone's face, name and hearts (and a sticker / a gold photo frame for
// the 3- and 5-heart surprises, hearts.js). Back (or B) goes back to the animals; the close button (or B) closes.
// API: G.album(start?) -> Wait (start: 'amigos' opens the friends page), G.album.count(id) (a gold star, for the animal
// count errand), G.album.counted(id), G.album.full(), G.album.metCount().
'use strict';
(function () {
  const AN = () => G.animals, T = (t, en) => ({ t, en });
  const rec = id => (G.state && G.state.album && G.state.album[id]) || null;
  const cry = id => (AN().KINDS[id] || {}).cry;
  class Album {
    constructor(w, start) {
      G.toastT = 0; this.transparent = true; this.w = w; this.t = 0; this.sel = 0; this.hop = {}; this.page = start === 'amigos' ? 'amigos' : 'animales'; this.fi = 0;
      this.party = 0;
    }
    onEnter() {
      if (G.album.full() && !G.state.flags.albumFull) { // the last animal: a party, once
        G.state.flags.albumFull = true; G.st.autosave(); this.party = 1;
        G.audio.jingle('promote');
      }
    }
    ids() { return AN().list(); }
    cell(k) { return { x: 14 + (k % 4) * 74, y: 34 + Math.floor(k / 4) * 62, w: 70, h: 58 }; }
    friendRect(k) { return { x: 12 + (k % 2) * 150, y: 32 + Math.floor(k / 2) * 31, w: 146, h: 29 }; }
    closeXY() { return [G.W - 28, 6]; }

    tapCard(k) {
      this.sel = k;
      if (k === 11) { G.audio.sfx('ok'); this.page = 'amigos'; this.fi = 0; return; }
      const id = this.ids()[k], w = G.data.words[AN().KINDS[id].word];
      if (!rec(id)) { G.audio.sfx('boop'); this.hop[k] = { t: 0, no: true }; return; }
      this.hop[k] = { t: 0 }; AN().cry(id);
      if (G.st.seen(AN().KINDS[id].word)) G.speak(w.es.split(' / ')[0] + (cry(id) ? '. ' + cry(id) : '')); // (unnamed yet: only its cry)
      const r = this.cell(k); for (let i = 0; i < 3; i++) G.fx.twinkle(r.x + 10 + Math.random() * 50, r.y + 6 + Math.random() * 30);
    }
    update() {
      this.t++;
      for (const k in this.hop) if (++this.hop[k].t > 24) delete this.hop[k];
      if (this.party && this.party < 200) {
        this.party++;
        if (this.party % 30 === 2) { G.fx.confetti(30 + Math.random() * 40, 200, -1, 16); G.fx.confetti(G.W - 30 - Math.random() * 40, 200, 1, 16); }
        if (this.party === 2) G.speak(G.fill('¡Amig{o/a} de los animales!'));
      }
      const tap = G.input.tap(), d = G.input.repDir(14, 6);

        if ((tap && (G.btnHit(...this.backXY()) || G.closeHit(...this.closeXY()))) || G.input.p('B')) { G.audio.sfx('cancel'); this.page = 'animales'; return; }
        if (d) { this.fi = G.clamp(this.fi + (d === 'left' ? -1 : d === 'right' ? 1 : d === 'up' ? -2 : 2), 0, n - 1); G.audio.sfx('cursor'); }
        const k = tap ? Array.from({ length: n }, (_, i) => i).find(i => G.tapIn(this.friendRect(i))) : -1;
        if (k != null && k >= 0) this.fi = k;
        if ((k != null && k >= 0) || G.input.p('A') || G.input.p('C')) { const who = G.hearts.WHO[this.fi]; G.speak(who === 'canelo' ? 'Canelo' : (G.nameOf(who) || '')); G.audio.sfx('cursor'); }
        return;
      }
      if ((tap && G.closeHit(...this.closeXY())) || G.input.p('B')) { G.audio.sfx('cancel'); G.pop(); this.w.resolve(); return; }

    draw(ctx) {
      G.win(ctx, 6, 4, G.W - 12, G.H - 8, { fill1: '#f4ecd8', fill2: '#e0d4b8', alpha: 1 });

        G.text(ctx, 'Mis animales', 34, 10, '#a05020', null);
        G.text(ctx, met + '/' + ids.length, 110, 10, '#2860a8', null);
        const bw = 120; ctx.fillStyle = '#7a4a20'; ctx.fillRect(140, 11, bw + 2, 7); ctx.fillStyle = '#e8dcc0'; ctx.fillRect(141, 12, bw, 5);

        for (let i = 1; i < ids.length; i++) { ctx.fillStyle = 'rgba(122,74,32,0.35)'; ctx.fillRect(141 + Math.round(bw * i / ids.length), 12, 1, 5); }

      if (G.enVisible()) G.text(ctx, 'Animals met', 16, 26, '#a09070', null);
      for (let k = 0; k < 12; k++) {
        const r = this.cell(k), sel = k === this.sel, h = this.hop[k], hop = h && !h.no ? Math.round(Math.sin(h.t / 24 * Math.PI) * -5) : 0, wob = h && h.no ? Math.round(Math.sin(h.t * 1.5) * 2 * (1 - h.t / 24)) : 0;
        const x = r.x + wob, y = r.y;
        if (k === 11) { // Amigos: a heart and three little faces
          ctx.fillStyle = sel ? '#f8d080' : '#f8e4ec'; ctx.fillRect(x, y, r.w, r.h); ctx.strokeStyle = sel ? '#c06000' : '#d090a8'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, r.w - 1, r.h - 1);
          if (G.hearts) { G.hearts.heart(ctx, x + r.w / 2 - 10, y + 6, true, 3); }
          G.textC(ctx, 'Amigos', x + r.w / 2, y + 36, '#a03060', null);
          if (G.hearts) G.textC(ctx, String(G.hearts.WHO.reduce((s, n) => s + G.hearts.get(n), 0)) + ' \u0003', x + r.w / 2, y + 46, '#c04870', null);
          continue;
        }
        const id = this.ids()[k], R = rec(id), w = G.data.words[AN().KINDS[id].word];
        ctx.fillStyle = sel ? '#f8e0a0' : R ? '#fffaf0' : '#d8ccb0'; ctx.fillRect(x, y, r.w, r.h);
        ctx.strokeStyle = sel ? '#c06000' : '#b09068'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, r.w - 1, r.h - 1);
        if (R) {
          G.drawIcon16(ctx, w, x + r.w / 2 - 16, y + 3 + hop, 2);
          const named = G.st.seen(AN().KINDS[id].word); // seen but its word not met yet: "?" (the story names it)
          G.textC(ctx, named ? w.es.split(' / ')[0] : '?', x + r.w / 2, y + 37, !named ? '#a08868' : G.st.knows(AN().KINDS[id].word) ? '#a06008' : '#2860a8', null);
          if (cry(id)) G.textC(ctx, cry(id), x + r.w / 2, y + 47, '#e06010', null);
          if (R.said) G.mic.glyph(ctx, x + r.w - 10, y + 3, '#2a8a9a');
          if (R.counted) G.text(ctx, '\u0005', x + 3, y + 3, '#e0a010', '#5a2c04');
        } else {

          G.textC(ctx, '? ? ?', x + r.w / 2, y + 40, '#a08868', null);
        }

    }
    drawFriends(ctx) {
      G.iconBtn(ctx, 'back', ...this.backXY());
      G.hearts.heart(ctx, G.W / 2 - 40, 10, true, 1);
      G.textC(ctx, 'Amigos', G.W / 2, 10, '#a03060', null);
      G.hearts.heart(ctx, G.W / 2 + 33, 10, true, 1);

        ctx.strokeStyle = best ? '#b07000' : sel ? '#c06000' : '#d0b898'; ctx.lineWidth = 1; ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);

        if (G.hearts.sticker(who)) { ctx.fillStyle = '#f8c820'; ctx.beginPath(); ctx.arc(r.x + r.w - 10, r.y + 10, 6, 0, Math.PI * 2); ctx.fill(); G.text(ctx, '\u0005', r.x + r.w - 13, r.y + 7, '#ffffff', '#a06000'); }
      });
    }
  }
  G.album = function (start) { const w = new G.Wait(); G.push(new Album(w, start)); return w; };
  G.album.metCount = () => AN().list().filter(id => rec(id)).length;
  G.album.full = () => G.album.metCount() === AN().list().length;
  G.album.counted = id => !!(rec(id) && rec(id).counted);
  G.album.count = function (id) { if (!AN().KINDS[id]) return false; if (!rec(id)) AN().meet(id); const r = rec(id); if (r.counted) return false; r.counted = true; G.st.autosave(); return true; };
  void T;
})();
